code: ADIANOETA
translations:
  zh: 雙關隱義法
description: 'AMBIGUITAS in which there is one obvious meaning and another hidden intended meaning.


  An expression that has an obvious superficial meaning and another unsuspected and underlying secret meaning.


  Greek: adianoeeton'
notes: 'EX, Lanham: So one says to a good friend who is also a poor novelist: ''I will lose no time in reading your new book.''


  Ancient Chinese: Common, but not easily diagnosed. Needs specialised study. Always hard to distinguish from straight AMBIGUITAS'
