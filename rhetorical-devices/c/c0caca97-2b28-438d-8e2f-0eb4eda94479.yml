code: KYKLOS-WITHIN-ONE-CLAUSE
description: '同端末法 /x...x/. A clause or colon which begins and ends with the same word.


  Also called, more analytically, EPANADIPLOSIS.'
notes: 'DEF: EPANADIPLOSIS: Repetition at the end of a clause of what the clause began with. /x...x/


  EX: "I might, unhappy word, O me, I might."


  REF: Lausberg 625-627


  Greek/Latin: Aquila 33, Mart. Cap. 41


  Ancient Chinese: Many examples in poetry.'
