description: '編輯說明 METALINGUISTIC COMMENT: Metatextual remark explaining the composition of the text one is currently composing.'
notes: Ubiquitous in Aristotle, and in many Graeco-Roman authors since. Common in Shiji. Their history in Chinese literature needs to be written up. Mozi does have early examples, but they need to be carefully analysed and do not necessarily fall into this group!
