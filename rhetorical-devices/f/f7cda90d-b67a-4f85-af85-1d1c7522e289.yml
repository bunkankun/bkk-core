code: CONGERIES
description: '堆砌同義詞法 ACCUMULATIO: Indiscriminate piling up of synonymous expressions merely for emphasis.'
notes: 'EX: Cic. pro Lig. 3.9 ...qui sensus erat armorum tuorum? quae tua mens, oculi, manus, ardor animi? quid cupiebas? quid optabas?


  REF: Lausberg 406


  Greek/Latin: Current, and commonly discussed in the rhetorical literature. Quint. 8.4.26 potest ascribi amplificationi congeries quoque verborum ac sententiarum idem significantium.


  Ancient Chinese: Quite rare.'
