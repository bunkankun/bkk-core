type: rhetorical-device
code: CONCESSIO
description: 承認法 ADDRESS in the form of a concession that there are valid arguments that speak against one's arguments.
notes: 'Lausberg 856. Miriam 216: Concessio is a figure whereby the speaker grants a point which hurts the adversary to whom it is granted, as in the reply of the Lord Chief Justice to Falstaff whom he has sent for


  Fallstaff: Boy, tell him I am deaf.


  Page: You must speak louder. My master is deaf.


  Justice: I am sure he is, to the hearing of anything good. Shak 2H4, 1.2.77


  Greek/Latin: The practice was very common. The concept was discussed rather late. Rutil. 1.19


  Ancient Chinese: Surprisingly rare. Needs close investigation regarding the types of points that are conceded to the other party.'
