uuid: 211b946e-631a-4a60-aff5-a41d6bef5d27
type: rhetorical-device
code: TRADUCTIO
translations:
  zh: 同音詞法
description: Use of two words sounding exactly the same but meaning something entirely different for rhetorical effect.
notes: 'EX: cur eam rem tam studiose curas, quae tibi multas dabit curas? (ad Herennium 4.14.21).


  REF: Ernesti, Latin, 400; Lausberg 658.


  Greek/Latin: Quintilian 9.3.69. This form of word-play is common in the literature and is fondly discussed by the theorists.


  Ancient Chinese: The phenomenon appears to be common, and probably is more common that we are able to recognise with the sparsity of sources we have.'
