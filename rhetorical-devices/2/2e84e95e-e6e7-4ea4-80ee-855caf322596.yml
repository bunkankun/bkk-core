description: 多次對偶法 One might want to assign, pedantically, REPETITIO and PARISON seperately. The longer I have looked at these cases, the more they appear to me to be cases in which structural parallelism and repetition of elements make one rhetorical unit for effect. But these will probably turn out to be inconsequential intuitions that will evaporate with time.
