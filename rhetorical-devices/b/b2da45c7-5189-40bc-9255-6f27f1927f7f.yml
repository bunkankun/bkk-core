code: PALINDROME-HUIWEN
description: 回文法 A piece of text that also makes sense when read in the reverse order from back to front.
notes: 'Here is an anonymous Qing dynasty example which can be read forward and backward starting from any character, thus yielding forty reasonably well-formed rhyming poems:


  落花艷舞風


  流霧香迷月


  薄霞淡雨紅


  幽樹芳飛雪'
