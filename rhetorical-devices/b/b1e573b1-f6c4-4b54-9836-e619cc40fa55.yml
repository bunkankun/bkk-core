type: rhetorical-device
code: STIPULATIO
translations:
  zh: 規定法
description: 'DEFINITIO which explains how a word is to be used in future towards a given intended audience and in a given context.


  A statement of definition which is declared to be true by virtue of being made. This is a kind of DEFINITIO.'
notes: 'E.g. "Children, in the sense of this law, include senile adults".


  STIPULATIO should be easy to find in administrative legal texts.'
