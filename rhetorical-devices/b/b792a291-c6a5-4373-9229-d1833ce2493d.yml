code: CACOZELIA
translations:
  zh: 准大雅法
description: RHETORICAL STYLE of pretentious learnedness and floweriness of diction.
notes: 'Miriam 72 "Affected diction, especially the coining of fine words out of Latin, is a form of the vice cacozeelia." This refers generally to the exaggerated use of rhetorical means.


  Greek/Latin: A current accusation, and a current practice.


  Ancient Chinese: It will be interesting to track this phenomenon down to Chinese parodies.'
