code: DIFFERENTIA
description: 'DEFINITIO delimiting the nuances of an expression as compared to other expressions.


  辨詞義法 The explicit focussing on differences in semantic nuances between semantically related words (sometimes called parasynonyms in the modern literature).'
notes: 'The origin of this metalinguistic focus on meaning contrast is traditionally ascribed to the pre-Socratic philosopher Prodikos.


  Ancient China: Mohist logic as well as the DAOSHU chapter of the XINSHU (see Svarverud)'
