type: rhetorical-device
code: PALINDROME
translations:
  zh: 反字母回文法
description: 'WORD-PLAY in which a text may be read from beginning to end but also from the end to the beginning.


  A word, verse, or sentence that reads the same when the letters composing it are taken in the reverse order. (OED)'
notes: 'There being no letters in the Chinese writing system, there is no palindrome in the traditional Latin sense of the word. See, however the Chinese pendant to the palindrome, the Huiwen, in our system - for mnemonic reasons - the PALINDROME-HUIWEN.


  Complex traditional example involves traditional names for Aritotelian syllogisms:


  Is it Datisi?


  No, sire, Ferison.


  This has a long tradition in China and became particularly popular from Song times onwards.


  EX: "Able was I ere I saw Elba."'
