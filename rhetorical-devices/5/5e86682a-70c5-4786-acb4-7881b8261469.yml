type: rhetorical-device
code: ANTONOMASIA
translations:
  zh: 避專名法
description: 'PERIPHRASIS in which an indirectly periphrastic expression is substituted for a proper name.


  Periphrastic avoidance of a proper name.'
notes: 'Miriam 124 "Antonomasia is of two forms. The first substitutes a descriptive phrase for a proper name, as when Rosalind, without naming Cupid, speaks of "that same wicked bastard of Venus that was begot of thought, conceiv''d of spleen, and born of madness, that blind rascally boy that abuses every one''s eyes because his own are out" (Shak. As You Like It 4.1.216)... The second form, on the other hand, substitutes a proper name for a quality associated with it." (Ex. see below.) Susenbrotus 8 distinguishes six subtypes: 1. patronymics for promper names (Pelides for Achilles, Priamides for Hector); 2. possessives indicating place of origin for person (Saturnian for Jupiter); 3. through absolute use of an epithet (Virgil Aen. 4.496 "The arms taht heartless one left hanging in my bower." where "heratless one" refers to Aenaeas.) 4. "the Philosopher" for "Aristotle", "the Poet" for "Virgil", "the Apostle" for "St. Paul", "the Saviour" for "Christ"; 5. "Croesus" for "a rich man", "Crassus" for "a man who never laughs"; 6. Phoenician" for "perfidious person", Scythian" for "harsh and inhuman individual", "Cretan" for "vain and mendacious person, "Sybarite" for a haughty person or one dedicated to luxury, a Gaul for someone libidinous.


  REF: Lausberg 580.


  EX: Varro rust. 1, 2, 2 Romanus (=i.e. Q. Fabius Maximus) sedendo vincit.


  You would be another Penelope" Shak. Cor. 1.3.92


  Greek/Latin: Ubiquitous.


  Ancient Chinese: The use of 魯人 instead of Confucius would sound odd indeed. This form needs to be investigated. Titles, on the other hand, are freely used everywhere to refer to their holders. ( 王曰 ) On the other hand descriptive terms like "the villain" are rarely used referentially. There is much that remains to be explored here.'
