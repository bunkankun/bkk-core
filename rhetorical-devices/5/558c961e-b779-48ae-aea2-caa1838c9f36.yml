translations:
  zh: 引眾證人法
description: 'RATIOCINATIO in which popular consensus is adduces as evidence for the truth of what one is saying.


  Appeal to the judgment or experience of many or of general consensus.


  Traditionally called APODIXIS!'
notes: 'Miriam 97 "Human testimony may be that of many or of one. The figure apodixis experience of many. ... The figure martyria, on the other hand, confirms a question by one''s own experience."


  REF: Not in Lausberg. Renaissance technical term.


  Greek/Latin: Current.


  Ancient Chinese: Surprisingly rare. One needs to explain why.'
