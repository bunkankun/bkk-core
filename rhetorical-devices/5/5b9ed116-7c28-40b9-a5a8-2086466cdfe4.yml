type: rhetorical-device
code: ABNUENTIA
translations:
  zh: 拒絕否定法
description: 'ADDRESS in the form of an abrupt and abrasive refusal to do something or to accept a truth claim that has been made.


  This is very common in Greek and Latin conversational rhetoric.


  Impolite demonstrative and insulting ABNUENTIA is hard to find in pre-Buddhist texts. Mild ABNUENTIA is common.'
notes: '"Absolutely not, you idiot!"'
