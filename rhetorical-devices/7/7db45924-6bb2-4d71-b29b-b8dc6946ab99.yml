code: SYMPLOCE
translations:
  zh: 端末反復法
description: 'REPETITIO of the form "x...y; x...y of one word or phrase at the beginning, and of another at the end, of successive clauses, sentences, or passages, i.e. combination of ANAPHORA and EPIPHORA.


  /x...y/x...y/'
notes: 'Lanham: Repetition of one word or phrase at the beginning, and of another at the end, of successive clauses, sentences, or passages; a combination of ANAPHORA and ANTISTROPHE (1). The following verses illustrate it with paradigmatic rigor:


  Most true that I must fair Fidessa love,


  Most true that fair Fidessa cannot love.


  Most true that I do feel the pains of love,


  Most true that I am captive unto love.


  Most true that I deluded am with love,


  Most true that I do find the sleights of love.


  Most true that nothing can procure her love,


  Most true that I must perish in my love.


  Most true that she contemns the god of love,


  Most true that he is snared with her love.'
location: '10'
