code: EKPHRASIS-CHRONOGRAPHIA
description: 詳寫時期法 Detailed (ekphrastic!) description of a time of day, or a time of the year.
notes: 'Miriam 129 "Chronographia is the description of times, as of dawn by Romeo.


  Look, love, what envious streaks


  Do lace the severing clouds in yonder East.


  Night''s out, and jocund day


  Stands tiptoe on the misty mountain tops. 3.5.7


  REF: Not in Lausberg. Renaissance technical term.


  Greek/Latin: Current.


  Ancient Chinese: Rare.'
