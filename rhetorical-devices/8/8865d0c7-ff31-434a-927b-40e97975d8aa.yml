code: ACCESSUS AD AUCTORES
description: 'Introductory remark in PREFACE


  This mode in which the author presents himself to his audience, typically in an introduction, is late to become common in China and very obviously needs careful study in connection with Chinese notions of authorship and the choreography of the "posing" in authorship, as manifested in traditional texts.'
