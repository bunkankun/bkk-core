type: rhetorical-device
code: HYPOZEUGMA
description: 先省略法 Ellipsis of a word or expression which is mentioned once and understood/omitted afterwards in the same clause, sentence, or sometimes even wider context.
notes: 'Miriam 296 "Zeugma is the use of a word, usually a verb, to serve two or more others. If the verb is expressed in the first clause and undertstood in the others, the firgure is called prozeugma


  Her beautie pierst mine eye, her speach mine wofull hart:


  Her presence all the powers of my discourse.


  If it is expressed in the middle clause it is called mesozeugma; if in the last clause hypozeugma."'
