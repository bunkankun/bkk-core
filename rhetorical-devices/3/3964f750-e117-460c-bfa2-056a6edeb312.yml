code: POSTPOSED RELATIVE CLAUSE UNMARKED
description: '詞後加修飾句法 INVERSIO in the form of a postposed modification.


  釋名 : 人始生曰嬰兒 "A human who has just been born is called a baby" is a characteristic example. Note that what is said to be a baby is not the birth, or the fact of having just been born.'
notes: This is not a rhetorical device, of course, but while we still have no place to record syntactic phenomena that do not attach to a given Chinese word, we have no other place to record this. Thus this is just a stop-gap category allowing us to assemble evidence on an important syntactic phenomenon.
