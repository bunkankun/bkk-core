code: ASYNDETON
translations:
  zh: 直接並列法
description: 'ELLIPSIS of a connective like "and" or "or" between words, expressions or clauses even linked sentences.


  Unmarked juxtaposition of coordinate elements.'
notes: 'GREEK: quite rare, in fact. See for example CUNY 2007: 81 who notes en passant: en grecque ancien, les asynde4tes sont rares et doivent etre analyse2es comme des phe2nome4nes stylistiques exceptionels.


  ANCIENT CHINESE: Ubiquitous, the default case.'
