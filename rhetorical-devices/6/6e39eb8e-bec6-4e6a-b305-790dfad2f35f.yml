type: rhetorical-device
code: ALLUSION
translations:
  zh: 隱引法
description: 'Intertextual METALINGUISTIC COMMENT in the form of referrring indirectly to another text.


  Allusion, veiled reference to a text presupposed to be known to the intended readership.


  This must be distinguished from QUOTATION-UNMARKED which involves not veiled reference but direct unacknowledged citation..'
notes: This is common in ancient Chinese literature and the explosive evolution of this form in later ages deserves a monograph in its own right.
