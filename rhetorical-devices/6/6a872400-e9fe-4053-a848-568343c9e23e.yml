code: OPTATIO
translations:
  zh: 稱歎情願法
description: 'EXCLAMATIO expressing an intense typically unfulfillable or even contrafactual desire.


  Invocation of what one is hoping for or wishing for.'
notes: 'Miriam 249 "Optatio is an ardent wish or prayer."


  REF: Lanham, not in Lausberg.


  EX: "A horse, a kingdom for a horse!"


  Greek/Latin: Current.


  Ancient Chinese: Unlikely in ancient Chinese.'
