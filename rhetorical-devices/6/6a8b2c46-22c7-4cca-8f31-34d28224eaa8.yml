code: VOCATIVUS-PREPOSED
translations:
  zh: 先呼叫法
description: Address by name of a person in the vocative mode, typically followed by the use of the second person pronoun.
notes: 'NB: Vocatives in classical Chinese seem always to involve informal names, i.e. You 由 and not Zilu 子路 for the disciple of Confucius.


  The question is what parts of oral practice is carried over into writing.


  From Song times onwards we have things like 辛棄疾：杯，汝前來'
