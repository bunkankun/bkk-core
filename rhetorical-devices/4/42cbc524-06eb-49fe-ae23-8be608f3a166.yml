description: 'ELLIPSIS of the last part of a word.


  省尾法 Omission of the last syllable in word.'
notes: 'REF: Lausberg 462, discussed in Miriam 52f as apocope: "Apocope is the omission of the last syllable of a word, as bet for better."


  Greek/Latin: Practised in poetry.


  Ancient Chinese: Hard to detect if it ever occurs, given the Chinese writing system.'
