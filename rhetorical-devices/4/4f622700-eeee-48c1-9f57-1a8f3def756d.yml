type: rhetorical-device
code: GNOME
description: 'SPEECH ACT making a decontextualised general statement that purports to remain true beyond the context in which it is uttered.


  抽象命題法 The decontextualisation of discourse so as to create generalising gnomic abstract propositions or maxims, typically in narrative contexts, but also in isolated enunciations. The relation between GENERALISATION and PROVERB is by no means always clear.'
notes: 'Ubiquitous in Greek poetry and prose. The phenomenon has been extensively studied under the heading GNOME in Greek, and the role of GNOME in Greek tragedy and comedy is manifest. Jacqueline de Romilly has studied the immense importance of generalisation in the construction of historical truth in Thucydides. CUNY 2007 provides an intensely readable model example of how this matter ought to be studied in detail for a given author, with special emphasis on the problems of definition of the phenomenon.


  There is a dire need to examine the evolution of GENERALISATION in Chinese historiography, but also in poetry.'
