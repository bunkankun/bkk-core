code: BINOME-TONAL-CACOPHONY
translations:
  zh: 聯合詞－聲調不順耳
description: Binome with tonal cacophony.
notes: The general principle of euphony is that IN REVERSIBLE BINOMES all MC tones precede Middle Chinese entering tone, and that all Middle Chinese level tones precede MC falling tone. Whatever corresponds to Middle Chinese tones in Old Chinese reconstructions clearly tended to affect preferred word order in reversible binomes in Old Chinese, as demonstrated in detail by Ulrich Unger in his 8 volume grammar of classical Chinese. The attempted subclassification of binomes tries to systematise the evidence for and against Unger's generalisations.
