code: SORITES
translations:
  zh: 演續法
description: 'CLIMAX where the members are conditional clauses: if x then y; if y then z; ... ...


  An ANADIPLOSIS-MULTIPLE or CLIMAX consisting of a series of conditionals in which the apodosis of the preceding conditional regularly is repeated as the protasis of the succeeding conditional.'
notes: This should probably be rebaptised as ANADIPLOSIS-MULTIPLE-SORITES to show its place in the system. But the term SORITES is perhaps too current and commonly used for this to be advisable.
