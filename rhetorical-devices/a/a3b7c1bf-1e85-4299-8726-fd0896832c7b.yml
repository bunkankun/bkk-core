code: GALANTERIE
description: SPEECH ACT in which one playfully displays a playful erotic interest in a person of the opposite sex.
notes: One may or may not wish to distinguish flirtation as a separate rhetorical device in which the subject need not be male and the purpose may be properly erotic and need not be purely playful.
