code: BINOME-DISJUNCTIVE-EUPH
translations:
  zh: 選擇性聯合詞法－好聽
description: 選擇並列詞法 順耳 Euphonic disjunctive BINOME.
notes: The general principle of euphony is that IN REVERSIBLE BINOMES all MC tones precede Middle Chinese entering tone, and that all Middle Chinese level tones precede MC falling tone. Whatever corresponds to Middle Chinese tones in Old Chinese reconstructions clearly tended to affect preferred word order in reversible binomes in Old Chinese, as demonstrated in detail by Ulrich Unger in his 8 volume grammar of classical Chinese. The attempted subclassification of binomes tries to systematise the evidence for this.
