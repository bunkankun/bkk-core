code: ENJAMBEMENT+SYNCOPE
description: 幾個四字格連接法﹣分行不整 ENJAMBEMENT in which the line-break is not at a main caesura (syntactic/prosodic break).
notes: The decision whether a given case must be taken to involve SYNCOPE is by no means always easy to make. What in syntactic terms is SYNCOPE can involve a line break where in terms of natural reading practice there may well be a major caesura/break in the line. Prosody and syntax can yield different analyses. The matter is complicated by the fact that - obviously - we have no direct evidence on ancient Chinese prodody and breath-group structure.
