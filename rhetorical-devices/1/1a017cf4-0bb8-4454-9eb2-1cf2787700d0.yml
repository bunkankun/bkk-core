code: BINOME-ANTITHETIC-EUPHONIC
translations:
  zh: 反義聯合詞法好聽
description: 反義並列法﹣好聽 . The general principle of euphony is that IN REVERSIBLE BINOMES all MC tones precede Middle Chinese entering tone, and that all Middle Chinese level tones precede MC falling tone. Whatever corresponds to Middle Chinese tones in Old Chinese reconstructions clearly tended to affect preferred word order in reversible binomes in Old Chinese, as demonstrated in detail by Ulrich Unger in his 8 volume grammar of classical Chinese. The attempted subclassification of binomes tries to systematise the evidence for this.
