type: rhetorical-device
code: ISOCOLON
description: 'REPETITIO of the same number of syllables in successive cola.


  節奏對偶法 Rhythmic parallelism.


  This is so ubiquitous that it would be pedantic to list all cases. A list of striking instances must suffice.'
notes: 'Prevalence of ISOCOLON is obligatory in in ancient Chinese prose style to the point where it becomes practically imperative to mark it only in cases where it seems especially significant for the rhetorical effect of a passage.


  On the other hand, ISOCOLON+PARISON is strict structural parallelism which seems always to deserve close analytic attention, since it defines frames in which semantic contrasts become virulent.'
