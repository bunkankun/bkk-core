definition: Wèi shǔi 渭水, Wèi hé 渭河is the most important tributary of the Huanghe. Its spring is located in the Niǎoshǔ 鳥鼠mountains [Weiyuan county, Gansu province]. The river flows to the east, into the Huanghe. Its overall length is 787 km.
