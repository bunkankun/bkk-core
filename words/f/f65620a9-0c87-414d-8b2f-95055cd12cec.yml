definition: Shòu 綬 was the most current word for the shēn 紳 from Han times onwards. At this time the colour of the belt began to be used as an indication of the status of the wearer. From Sui times onwards, the use of shòu 綬 was discontinued. [OFFICIAL], [PROSAIC]
