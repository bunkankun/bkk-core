definition: Zūn 遵 refers primarily to the kind of deliberate following of a path, behaviour that is motivated by respect for what one follows, but sometimes the word is also used in a more generalised way referring to a person following a certain physical guideline without any suggestion of respect for this guideline, as in MENG 遵海而南"head south along the shore of the sea".
