definition: 'NB: Hé 河 is normally a proper name of Yellow River and its tributaries. [The term Huanghe was in use since the Han times. The river flows through the following provinces Qinghai, Sichuan, Gansu, Ningxia, Inner Mongolia, Shaanxi, Shanxi, Henan, Shandong. In the northeastern part of the Shandong province, it flows into the Bohai gulf.'
