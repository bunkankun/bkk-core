definition: 'Ǒu 偶 refers to a concrete partner or to more abstractly, like Modern Chinese duìxiàng 對象 to refer to the notion of someone who will fill the role of partner of the other sex. NB: one may qiú ǒu 求偶 and xuǎn ǒu 選偶, but it appears pǐ 匹 is not used in such contexts.'
