definition: 'Huáng 黃 (CHEN PAN 1969, 431-435) Clan: Yíng 嬴 (according to the Chǔ shìjiā zhēngyì and Du''s commentary to the ZUO. The surname also appears in the inscriptions on the bronzes, where it is sometimes written as 盈 or Yǎn 偃). Rank: Uncertain. In the inscription on the Cì dǐng 刺鼎, the ruler of Huáng is referred to as gōng 公. Founded: Unknown. Destroyed: In 648 B.C. (Xi 12) by Chǔ 楚. Location: According to the Du''s commentary to the ZUO, the state of Huáng was located in the modern Huángchuān 潢川 district, southern Henan province. Two tombs belonging to the lord of Huáng and his consort were also uncovered in this area (see History). History: Huáng was a small and unimportant state. However, it is remarkable for two tombs dating from the mid-seventh century B.C., which were uncovered in Shàngguāngāng 上官岡, Guāngshān 光山. The tombs belonged to Mèng, the lord of Huáng 黃君孟, and to his consort Mèng Jī 孟姬 (see Falkenhausen 1999, 505).'
