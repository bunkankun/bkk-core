definition: 'Yú 虞 (also called Xī Yú 西虞, Xī Wú 西吳, Běi Yú 北虞, Běi Wú 北吳, Yú 于, Gàn 干) (CHEN PAN 1969, 459-464) Clan: Jī 姬. Rank: Gōng 公 (common in the CQ and the ZUO). Founded: The state of Yú was probably established very early in the Western Zhōu period (or even prior to it); its first ruler Zhòng Yōng 仲雍 (or Yú Zhòng 虞仲) was probably the son of the pre-dynastic Zhōu king Tài wáng 太王 and brother of his successor Wáng Jì 王季 (or Jìlì 季歷), the father of the Zhōu king Wén 周文王; in the sources, there is some confusion about the founder of Yú and his relationship with the Zhōu kings, but perhaps the most authoritative is the record in the ZUO, Xi 5 (大伯, 虞仲, 大王之昭也; for a detailed discussion on the issue see Chen Pan 1969, 461-464). Destroyed: In 655 B.C. (Xi 5) by Jìn 晉. Location: In the modern Pínglù 平陸, southwestern Shānxī province. History: Yú was a small, but not completely unimportant state, which was located within a royal domain. Its rulers probably had a close relationship with the Zhōu royal court, as can be deduced from their high title gōng.'
