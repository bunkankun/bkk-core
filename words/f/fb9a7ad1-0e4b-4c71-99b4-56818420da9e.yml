definition: Yīn 音 is much narrower in application, and more elevated in style, and the word typically applies to sound shaped into music or the like and often viewed as an aesthetic object. 聲成文謂之音。"When sound makes a pattern it becomes yīn", true enough, but it does remain shēng 聲 also.
