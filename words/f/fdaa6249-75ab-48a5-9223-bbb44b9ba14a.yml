definition: The general word for punishment is wú xíng 五刑 , traditionally in SHU, LYUXING listed as "dà bì 大辟 "decapitation", yuè 刖 "mutilation of foot", yì 劓, gōng 宮 "castration", mò 墨 "branding". The list varied through time and is different in different sources.
