definition: 'Rén 任 (probably identical with Réng 仍) (CHEN PAN 1969, 635) Clan: Fēng 風. Rank: Unknown. Founded: According to the tradition, the rulers of Rèn were descendants of mytical Tài Hào 太嗥. Destroyed: In 639 BC. (Xi 21). Location: Located in the modern Jíníng 濟寧, Shandong province.'
