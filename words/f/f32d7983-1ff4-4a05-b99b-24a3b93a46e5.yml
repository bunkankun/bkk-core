definition: Yú 俞 refers in SHUOWEN and HUAINANZI to the boat made of one piece of wood, the monoxylon. Whether the term referred to this type of boat in general already since early times is not certain. Note that one monoxylon (3,9 m long) dating from Shang times was found in Shandong province.
