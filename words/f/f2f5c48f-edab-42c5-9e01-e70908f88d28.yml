definition: Hé 劾 refers to formal impeachment and the starting of formal criminal proceedings against a culprit, and the accuser in this case tends to be a person of some social standing, normally of high bureaucratic status; in Han times hé 劾 refers to the passing judgment after such a formal procedure. [DESCENDING], [INTENSE], [NEUTRAL], [OFFICIAL]
