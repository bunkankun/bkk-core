definition: 'Téng 滕 (CHEN PAN 1969, 63-67) Clan: Jī姬. Rank: Hóu 侯 (usual in the CQ and ZUO). Founded: In the early Western Zhou period by Shūxiù 叔繡, the son of King Wén of Zhōu 周文王 (according to the Shì běn; also ZUO mentions that the founder of Téng was the son of King Wén). Location: In the modern Téng 滕 district, Shandong province. One of the small walled cities excavated in the area and dating from the end of Shāng to Eastern Zhōu times was probably the capital of Téng (see Li Xueqin, DONG ZHOU QIN WENMING). Destroyed: Uncertain. The state was still in existence by the end of the period recorded in CQ. It was preserved till the end of the 4th century, when its ruler is mentioned in the Mèngzǐ. Later, it was probably conquered by Qí 齊 (according to the Shì běn and Hàn zhì). Other sources state that Téng was destroyed either by Yuè 越 (Gǔ běn Zhúshū jìnián) or by Sòng 宋 (Zhàn guó cè). Sòng was in 286 B.C. conquered by Qí, and it is possible that Téng was actually destroyed by Sòng and the area later came under the control of Qí. History: Téng was a small petty state dependant mainly on Qí. In the CQ, it appears for the first time in 716 B.C. (Yin 7). The state is remarkable for the stay of Mencius in the court of the Duke Wén of Téng 滕文公.'
