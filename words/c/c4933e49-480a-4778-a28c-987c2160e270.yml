definition: The current general word for a plough of any kind is sì 耜, but the word can refer specifically to the hand pullen plough with a cross-bar to step on. [Sì 耜 resembles a spade with a broader head made of wood, bone, stone, since the Warring States also iron, and it could be also used to dig earth. Originally, the word referred specifically to the just described kind of implement, but since the Han period when real oxen-pulled plough came to common use (see below), the term became the general word for a plough of any kind.
