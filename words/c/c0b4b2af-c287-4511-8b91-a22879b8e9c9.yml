definition: Liǎng 兩 is common when the reference is to a natural pair, but there are also many cases where the definite reference is merely to an aforementioned couple of items, and there are even a good number of cases where the reference is to any indefinite number of two things. Also the word regularly means "both the objects" when it precedes a transitive verb, and the word is never used as an ordinal number. Moreover, in complex numbers the word is not used.
