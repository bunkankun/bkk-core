definition: Wǔ zhū 五 銖 refers to a round coin with a square hole weighting five zhū 銖 which was for the first time cast under Emperor Wudi in 118 B.C. and was then in use during the whole Han dynasty (with a short break about the time of Wang Mang's reign).
