definition: Probably the most general word for the rope is shéng 繩. The term originally referred to the finer rope made of silk or hemp (which was used for instance to make a fishing net), but in Han times it became to be used for all kinds of ropes. Note that ropes in ancient China were like our modern ropes usually twisted of two strips.
