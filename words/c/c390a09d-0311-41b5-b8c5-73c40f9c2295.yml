definition: Yīn 殷 According to the traditional accounts, the late period of the Shāng dynasty, covering the reign of its last twelve kings, when the capital is said to be located in Yīn. However, the term does not appear in the oracle bone inscriptions and it was perhaps originally the Zhōu designation for the Shāng. See Shāng.
