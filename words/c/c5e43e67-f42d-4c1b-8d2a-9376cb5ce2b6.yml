definition: The general old word for a region is zhōu 州 as in jiǔ zhōu 九州 "the Nine Regions of the World". Especially from Three Kingdom times onwards this word came to regularly replace the term jùn 郡 as the designation of a province. In Han times, under emperor Wǔdì, the leader of a zhōu 州 is called cì shǐ 刺史.
