definition: Féng 逢 seems to be a dialect word for encountering something, but in early times this word has a much more limited range of syntactic functions, while from Han times it tended to replace yù 遇 as the standard word for encountering, later to be replaced in colloquial Chinese by its cognate pèng 碰.
