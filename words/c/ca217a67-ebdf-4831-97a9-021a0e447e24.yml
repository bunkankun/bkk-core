definition: 'Chén 陳 (CHEN PAN 1969, 253-261) Clan: Guī 媯. Rank: Hóu 侯 (usual designation of the rulers of Chén in the CQ and ZUO). Founded: Founded by Hú gōng 胡公, who is said to be the descendant of the mythical emperor Shùn 舜, in the early Western Zhōu period (according to the ZUO, Xiang 25 - 548 B.C. - and to the Chén shìjiā chapter of the Shǐ jì). Destroyed: According to the ZUO, in 478 B.C. (Ai 17) by Chǔ 楚. According to the Shǐ jì (Chén shìjiā), it was destroyed one year earlier. Location: Yuànqiū 宛丘, the capital of Chén, was located in the modern Huáiyáng 淮陽 district, Henan province. History: In the beginning of the Chunqiu period, Chén was a quite powerful state. During the 7th century B.C., it was exposed to the rising pressure from the side of Chǔ, against which Chén usually allied with northern states (for instance, the armies of Chén participated in a famous military campaign against Chǔ led by Lord Huán of Qí 齊桓公 in 656 B.C.). Later, it gradually became a vassal of Chǔ (in 632 B.C. armies of Chén were on the side of Chǔ in the battle of Chéngpú 城濮), and was even destroyed and changed into a district of Chǔ in 531 B.C. (Zhao 11). However, it was reestablished in 529 B.C., and later eventually destroyed by Chǔ in 478 B.C.'
