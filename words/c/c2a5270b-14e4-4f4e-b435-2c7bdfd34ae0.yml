definition: Fàn 泛, fàn 氾, and fàn 汎 seem to be dialect variants of a word for drifting on water, typically aimlessly. (It is to be noted that the three words, though close in pronunciation, are by no means homophonous in ancient pronunciation. One should think they must be etymologically related.)
