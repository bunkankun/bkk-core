definition: General word for the seal was originally xǐ 璽, and this could refer to the seals used both by officials and commoners, particularly traders. Originally, seals perhaps served mainly to the exchange of goods in Warring States times, but in the same period they came to be used by officials as a symbol of administrative authority. Official documents had to be all sealed with a piece of mud adhered on the cord tying up the document and impressed with an official seal. In the Han period, the word xǐ 璽 came to refer to the seals used by an Emperor and members of his family; these were usually made of jade.
