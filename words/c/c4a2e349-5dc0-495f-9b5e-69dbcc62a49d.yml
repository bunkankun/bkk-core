  notes:
  - 其千人者花光佛為首。下至毘舍。於莊嚴劫得成佛道。過去千佛是也。此中千佛者拘留孫佛為首。下至樓至如來。於賢劫中次第成佛。後千佛者日光如來為首。下至須彌相。於星宿劫中當得成佛。現在十方諸佛善德如來等。亦得聞是五十三佛名故。於十方世界各得成佛。過去五十三佛名。在藥王藥上觀經。三千佛名在諸佛集功德花經。千佛名號國土種姓。父母弟子眷屬眾會年歲在賢劫經。釋迦在賢劫中千佛第四成佛祐仰惟。
