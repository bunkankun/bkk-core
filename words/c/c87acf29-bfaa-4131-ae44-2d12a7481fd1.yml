definition: 'Sè 色 (ant. xīn 心 "real inner feelings") is external appearance, particular facial expression, expressive of or productive of feeling. Thus hǎo sè 好色 is the kind of appearance which, being attractive, causes men to feel attracted. Hào sè 好色 "love beautiful women" involves a different meaning of the word: "female beauty; sex". [SIGNIFICANT+], [VOLUNTARY!]'
