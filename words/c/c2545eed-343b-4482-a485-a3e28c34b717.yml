definition: Jué 玦 refers to the unclosed jade ring. Artefacts of this type are known already since the Neolithic and their finds cover large territory. These objects could be used in different ways (in many areas probably like earrings, but they were used mainly like pendants cloth pendants by aristocrats in Central China from the Western Zhou till Han times.
