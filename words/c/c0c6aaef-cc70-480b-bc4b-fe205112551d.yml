definition: The most general word for any kind of passing fear is probably jù 懼 and this word naturally links with yōu 憂 "worry", and this word refers to a momentary historical moment where that fear manifested itself (文王乃懼 "then King Wén got scared"). Jù sǐ 懼死 is momentary fear for one's life, whereas wèi sǐ 畏死 refers to a general state where one is too frightened to sacrifice one's life.
