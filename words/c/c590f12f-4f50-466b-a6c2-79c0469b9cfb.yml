definition: 'Shū 舒 (also written as Xú 徐, Chá 茶, or Yú 余) (CHEN PAN 1969, 578-581) Ruling clan: According to the Du''s and Zheng Xuan''s commentaries (the latter quoting Shì běn) to the ZUO (Wen 12), the rulers of Shū belonged to the Yǎn 偃 clan. Shì běn Xìng shì states that they had the surname of Rèn 任. In Shì běn (and also in Lù shǐ) are thus mentioned two states of Shū: one ruled by the Yǎn lineage and another one with the rulers belonging to the Rèn clan. Rank: Zǐ 子 (according to the ZUO, Wen 12). Founded: Unknown. Destroyed: In 657 B.C. (Xi 3), the state was conquered by Xú 徐. Later, it again appears in the ZUO (Wen 12; 615 B.C.). After that date it was perhaps conquered by Chǔ 楚. Location: Perhaps in the modern Shūchéng 舒城 district in Anhui province.'
