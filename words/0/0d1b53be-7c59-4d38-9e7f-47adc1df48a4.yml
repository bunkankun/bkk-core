definition: 'Yuán 原 (CHEN PAN 1969, 519-521) Clan: Jī 姬. Rank: Bó 伯 (common in the CQ and ZUO). Founded: The state of Yuán was founded in the early Western Zhōu period by one of the sons of the Zhōu King Wén 周文王 (according to the Shū jīng Jūn Shì zhēngyì and to the Xìng xī). Destroyed: The state is mentioned in the ZUO in the entry for 676 B.C. (Zhuang 18). In 635 B.C. (Xi 25), the state already was not in existence, as in that year the Zhōu 周 king gave the city of Yuán to Jìn 晉. Thereafter, Yuán was shifted by Jìn to Yì 翼 in Shānxī province. Location: According to the Hàn zhì and Dì míng kǎo lyè, Yuán was located in the modern Jǐyuán 濟源, Henan province. On the contrary, Du''s commentary to the ZUO and also Tōng zhì suggest that it was located in the modern Qìnshuǐ 沁水, Shānxī province. According to CHEN PAN, Henan Yuán was in fact another Yuán, which is mentioned in the ZUO for 711 B.C. as one of the cities given by the Zhōu 周 King to Zhèng 鄭.'
