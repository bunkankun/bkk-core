definition: Mǎ tí 馬蹄, lù tí 鹿蹄, huán tí 圜蹄, and lín zhǐ 麟 趾 are various terms referring to the pieces of gold formed into the shape of horse's, deer's, or qí lín's 麒 麟 hoof. This kind of currency was in use under the Han dynasty.
