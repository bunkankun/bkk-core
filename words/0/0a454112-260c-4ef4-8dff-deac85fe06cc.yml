definition: Àn 案refers to the low table with oblong desk which was used to put on either dishes or other things, such as books which one reads etc. The table used to the former purpose has the higher rim around the desk. The term came to be used in Han times, but tables of this type are known already from the Warring States period. It is not sometimes easy to distinguish àn 案 from jǐ 几 and there is certain confusion in using both terms.
