definition: Cāng 倉 refers to the large granary of rectangular shape for storing grain with a husk. The word occurs already in SHIJING, but the actual shape and size of cāng 倉 in this period is unknown; it could be only general word for a granary of any size. In Han times, cāng 倉 was usually large and built on a platform of rammed earth.
