definition: Nù 怒 (ant. xǐ 喜 "be delighted") is the general word for anger, and the word tends to imply overt manifestation of feelings of anger, typically in terms of altered breathing patterns. (cf. nù 怒 "to puff oneself up") [OVERT], [PERSONAL]
