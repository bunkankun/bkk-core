definition: Fāng chuán 方 船, fǎng 舫 (the latter word first appeared in the Warring States period and became more current in Han times) refer to the double ship, ship consisting of two joined boats. This kind of ship could be used for various purposes (for transportation of goods or soldiers, as a warship, or to cross a river), and was in use at least from the Warring States period till Tang; the period during it most flourished was neverthless Jin dynasty.
