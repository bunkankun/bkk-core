definition: 'Liáng 梁 (CHEN PAN 1969, 450-453) Clan: Yíng 嬴 (appears in the inscriptions on the bronzes; also written as 盈 or Yǎn 偃). Rank: Bó 伯 (common in the ZUO). Founded: Unknown. According to the Lù shǐ Hòu jì, Guǎng yùn, and to the Tōng zhì Shì zú lyè, the state of Liáng was founded during the reign of the Zhōu king Píng 周平王 (770-720 B.C.) by his son Kāng 康 (what is in contradiction with the supposed Yíng surname of the Liáng rulers). On the other hand, Hòu Hàn shū (quoting Dōng guàn jì), Hàn zhì, and Fēngsú tōng state that the rulers of Liáng were of the same lineage as the ruling house of Qín 秦. Destroyed: In 641 B.C. (Xi 19) by Qín 秦. Location: Modern Shǎo Liáng 少梁 in the Hánchéng 韓城 district, eastern Shǎnxī province (according to the Du''s commentary to the ZUO, to the Hàn zhì, and to the Xù Hàn Jùn guó zhì). History: Liáng was a small and unimportant state, destroyed by Qín, which thereafter established there the city of Shǎo Liáng 少梁. In 617 B.C. (Wen 10), the area was conquered by Jìn 晉.'
