definition: 'Qǐ 杞 (CHEN PAN 1969, 242-252) Ruling clan: Sì 似. Rank: In both CQ and ZUO, the rulers of Qǐ are basically referred to as bó 伯, but sometimes also as hóu 侯, and one time (CQ Xi 22; 638 B.C.) as zǐ 子. In the inscriptions on the bronze vessels, the rulers of Qǐ usually referred to themselves as bó. Location: There are many uncertainties concerning precise locations of the Qǐ capitals. According to the commentary to the Hàn zhì Chénliu jùn, the first capital of the state was Yōngqiū 雍丘, probably located in the modern Kāifēng 開封 district, Henan province. Later (prior to the period recorded in the CQ), the capital was shifted to the northeast of the state of Lǔ 魯 in modern Shandong. Exact location of the centre of Qǐ there is uncertain, but with regard to the fact that some bronze vessels made by Qǐ were found in the area of modern Xīn Tài 新泰 district, it is probable that the capital was in that area. ZUO records that later, in 646 B.C. (Xi 14), the capital of Qǐ was shifed by other feudal lords to Yuánlíng 緣陵. Founded: According to the Shǐ jì, Xià běnjì, the first ruler of Qǐ was the Duke of Dōnglóu 東樓公, the descendant of the Xià 夏 dynasty, who received Qǐ as his fief from King Wǔ of Zhōu 周武王. Destroyed: Conquered by Chǔ 楚 in 445 B.C. History: Rulers of Qǐ were supposed to be the descendants of the ruling clan of the Xià 夏 dynasty, and enjoyed special position in the Zhōu ritual system. The state for the first time appears in the CQ in the entry for 719 B.C. (Yin 4).'
