definition: Bèi 貝 originally referred to the cauri shells which were in Shang and Western Zhou times used like primitive money or like a gift. For this purpose, they were joined to péng 朋, consisting of two strings of shells, five pieces each. In the Warring States period, the word also referred to the bronze coins in the shape of cauri which were in use in the state of Chu.
