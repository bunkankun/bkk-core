definition: 'Jiàn 箭 came to mean bamboo shaft arrow from Qin times onwards, and the word originally refers specifically to the bamboo shaft of an arrow, from Warring States onwards. Even in Tang times, the word often retains its primary reference to the shaft rather than the arrow as a whole. From Eastern Han and especially Three Kingdom times onwards, the word comes to be used as a colloquial equivalent of shǐ 矢. Note that since all arrows appear to have been made of bamboo, the word jiàn 箭 does not mark out bamboo arrows from others. [Warring States and Han arrows ill.: LIU 1999: 72] [SPECIALISED]'
