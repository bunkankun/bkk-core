definition: Méng 盟 refers to a momentous formal (typically written) contract or oath of allegiance betwen feudal lords confirmed by ritual blood sacrifice, although such oaths could occasionally be taken by humble individuals (bī rén 卑人 "persons of low status") in which case the day of the ritual was not recorded.
