definition: 'Ruī 芮 (also written as 汭; in the bronze inscriptions, it appears as Nèi 內) (CHEN PAN 1969, 399-407) Clan: Jī 姬 (according to the Shì běn; in the inscription on the Ly wáng hú is mentioned the woman called Nèi Jī內姬). Rank: Bó 伯 (usual in the ZUO). Founded: The state was obviously established quite early in the Western Zhōu period, as in the Gùmìng chapter of the Shū jīng the Earl of Rùi 芮伯 is listed among the persons which attended the Zhōu King Chéng 周成王 in his deathbed. Destroyed: In 640 B.C. (Xi 20) by Qín 秦 (according to the Shǐ jì, Shíèr zhūhóu niánbiǎo and Qín běnjì chapters). Location: According to the Hàn zhì, the state of Ruī was located in the modern Dàlì 大荔 district, Shǎnxī province. Dì míng kǎolyè locates it into the modern Cháoyì 朝邑 district, neighboring with Dàlì district.'
