  notes:
  - 前嵩嶽慧安國師法嗣：
  - 洛京福先寺仁儉禪師。自嵩山罷問放曠郊？。時謂之騰騰和尚。唐天冊萬歲中。天后詔入殿前。仰視天后良久曰。會麼。后曰不會。師曰。老僧持不語戒。言訖而出。翌日進短歌一十九首。天后覽而嘉之厚加賜賚。師皆不受。又令寫歌辭傳布天下。其辭並敷演真理。以警時俗唯了元歌一首盛行於世
