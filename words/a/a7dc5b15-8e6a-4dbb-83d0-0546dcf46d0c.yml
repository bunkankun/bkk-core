definition: 'Yáng 陽 (also written as Táng 唐) (CHEN PAN 1969, 567-570) Ruling clan: Jī 姬 (according to the Lǐ jì, Fāng jì chapter); among bronze vessels there is a dǐng 鼎 cauldron made for Shūjī 叔姬, the daughter of the Earl of Yáng (Yáng bó 陽伯). Rank: Hóu 侯 (according to the Lǐ jì, Fāng jì chapter). In the inscription on the above mentioned dǐng 鼎 cauldron, the ruler of Yáng is referred to as bó 伯. Founded: According to the Lù shǐ Hòu jì, the state was founded in the Western Zhōu period by the branch lineage of the rulers of Běi Yàn 北燕. Destroyed: CQ (Min 2; 660 B.C.) mentions the shift of Yáng by Qí 齊. Whether the state was destroyed in that time is not certain. According to the ZUO, in 530 B.C. (Zhao 12), the area already belonged to Qí. Location: In the area on the borders between Qí and Běi Yàn. According to the Lù shǐ Guó míng jì, the state was located in the modern Táng 唐 district, Hebei province. Other sources (on the basis of local names) suggested other locations: in the modern Yìdū district 益都, Shandong province (Hàn shū Dì lǐ zhì), and in the Yíshuǐ 沂水 district, Shandong province. It is possible that the latter are the areas to which Yáng was shifted by Qí. History: A small state mentioned only one time in CQ.'
