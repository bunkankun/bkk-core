definition: The general word is wèn 問 "open a dialogue by consulting someone with a question" (ant. duì 對 "reply to a superior") which typically refers to the consultation of a person who is supposed to know something, and typically the person to whom a question is addressed is regarded in the context as an authority though not necessarily a person of superior status. Thus the word, while extremely common, is not really a general word for "to ask". [SPECIFIC]; [[COMMOM+]]
