definition: 'Some words specify the range of objects murdered: Thus shì 弒 refers to the killing of a reigning ruler, zhū 誅 and yí 夷 refer to the killing of a convicted criminal; zǎi 宰 and tú3 屠 refer primarily to the slaughtering of animals for the purpose of food production.'
