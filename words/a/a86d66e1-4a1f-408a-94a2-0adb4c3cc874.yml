definition: Qīn 衾 is probably the most common general word for a blanket, but the word also has specific uses where it emphasises the large size of a blanket. Ancient Chinese blankets were generally made with "silk-cotton, silk floss" miǎn 綿 (not identical with modern miánhuā 棉花) or hemp fillings. This type of blanket was important in funeral rites.
