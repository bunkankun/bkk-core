definition: 'The current general word for psychological hesitation happens to be bisyllabic: yóuyù 猶豫(compare the rare but synonymous yíyóu 夷猶) (ant. guǒ 果 "resolute"), but the word primarily refers to the mental state which brings about hesitation in action, but the diffident behaviour is also included in the meaning of the word.'
