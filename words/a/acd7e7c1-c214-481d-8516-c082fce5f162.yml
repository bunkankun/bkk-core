definition: 'General term for a saw is jù 鋸. It can be made of bronze, and since the Warring States period of iron. Saw was used not only like a working implement, but also for mutilating punishments (the oldest evidence dates the Shang period: REFERENCES TO BE FOUND. Besides this, in the Warring States period, the word was in the state of Yan used for a kind of weapon otherwise known as jǐ 戟 (combination of the gē 戈 halberd with a spearhead:).'
