definition: 'Jiāng 江 (CHEN PAN 1969, 571-575) Ruling clan: Yíng 嬴 (according to the Qín běnjì chapter of the Shǐ jì, and to the Shǔi jīng zhù). Rank: Unknown. Founded: According to the Shǐ jì (Qín běnjì chapter), the rulers of Jiāng belonged to the branch lineage of the ruling clan of Qín 秦. Destroyed: In 623 B.C. (Wen 4) by Chǔ 楚. Location: Uncertain. According to the Du Yu''s commentary, Xù jùn guó zhì zhù etc., the state was located in the modern Xī 息 district (Taiwanese Zhèngyáng 正陽 district), Henan province. History: The state for the first time appears in CQ and ZUO in the entry for Xi 2 (658 B.C.).'
