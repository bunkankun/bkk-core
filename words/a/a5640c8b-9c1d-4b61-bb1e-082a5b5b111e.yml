definition: Duàn 鍛 refers to the forging, and also to some kind of implement used in forging metal; probably mentioned already in SHIJING. According to some opinions, it can also refer to an anvil or to a whetstone. It should be note that evidence for both duàn 鍛 and duàn 段 is rather slight, and it is quite difficult to establish to what kind of implement these words actually refer. From the fact that the implement could be used to forger metal we can deduce that its head was made of some kind of hard material; perhaps stone in archaic times. Duàn 段is another, probably more archaic, term for duàn 鍛; according to the KAOGONGJI chapter of the ZHOULI, it was used in forging metal.
