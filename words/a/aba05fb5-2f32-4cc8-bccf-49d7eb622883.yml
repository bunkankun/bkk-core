definition: Màn 慢 (ant. jìng 敬 "pay proper and respectful attention to") and jiǎn 簡 (ant. xì 細 "pay detailed attention to") refer to a typically deliberate and defiant, often a deliberately outrageous, failure to pay proper attention to what is expected to be heeded.
