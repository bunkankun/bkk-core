definition: 'Fán 凡 (also written as Fàn 汎) (CHEN PAN 1969, 379-382) Clan: Jī 姬. Rank: Bó 伯 (appears in the both CQ and ZUO). Founded: In the Early Western Zhōu period by one of the sons of the Duke of Zhōu 周公 (according to the ZUO, Xi 24; 636 B.C.). Destroyed: Unknown. Location: According to the Du''s commentary and Xù Hàn Jùn guó zhì, Fán was located in the modern Huī 輝 district, Henan province. History: The state for the first time appears in the ZUO under Yin 7 (716 B.C.).'
