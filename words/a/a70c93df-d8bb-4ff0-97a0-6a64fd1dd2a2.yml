definition: Chuán 船／舡 is a colloquial general term for a ship which emerged in Warring States times and became current under the Han. The word can refer specifically to larger ships. The word is still unknown in LUNYU and ZUOZHUAN, where the only general term for a ship is still zhōu 舟.
