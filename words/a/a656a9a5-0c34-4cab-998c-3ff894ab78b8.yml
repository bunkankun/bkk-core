definition: Yá 牙 can occasionally generally refer to teeth, even the exquisite teeth of a woman, but the word typically refers to the large side teeth or fangs of an animal with which it bites, and which are seen as a threat. The threatening teeth of an animal, the teeth with which a rat attacks one's home, are yá 牙. Thus one speaks of the zhuǎ yá 爪牙"the claws and fangs" as metaphors for weapons. Theses are sharp like fangs, and as such they lend themselves to metaphorical use to indicated dented patterns in ornaments.
