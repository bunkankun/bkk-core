definition: Huì 賄 refers to customary gifts on formal occasions which are often hard to distinguish from bribes, and characteristically the word regularly refers to passive bribery. See also PROPERTY and GIFT. Commentators wish us to believe that the word refers specifically to "bribe with gifts of silk", but there is no clear early evidence of this.
