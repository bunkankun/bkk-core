definition: Bì 璧 refers to the jade ring which is similar to huán 環, but its breadth is according to SHUOWEN greater than the radius of its central hole. It was used mainly like a pendant in the same way like huán 環. It was also very precious artefact and could be given like a gift. Moreover, and other jade pendants expressed status of its holder in the official hierarchy; but it is highly doubtful whether there was such strict system of sumptuary rules regulating the use of jades as is described in LIJI (according to this text, to each rank in the hierarchy belonged special type of jade). According to LIJI, bì 璧 was also one of the six ritual jades, and was used to worship Heaven; but this is probably only late Warring States or Han speculation. In the end, it should be noted that the circle jade objects with a hole in their centre the were widely used over a huge territory of China already since the 4the and 3rd millenium B.C. till the Han period. Their functions and meanings obviously changed in the course of time, and it is very problematic to divide them into the categories defined mainly in the late Eastern Zhou and Han texts, and interpreted the functions and the meaning of the artefacts on the basis of these texts.
