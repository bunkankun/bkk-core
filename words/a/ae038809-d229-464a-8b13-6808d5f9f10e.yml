  - “我向你道莫出家。”
  - wo3 xia4ng ni3 da4o mo4 chu1-jia1
  - NPRO1SG/COV.OBJ.SPEECH/NPRO2SG/speak/NEG.IMP/leave-home
  - '"I tell you: Do not become a monk!"'
  - 'Occasionally the coverbal object is deleted:'
