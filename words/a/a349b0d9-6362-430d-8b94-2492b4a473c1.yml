definition: 'The most current general word for an elevated building erected for pleasure is tái 臺, and the word refers originally to a raised platform with stairs leading up to it, and with balustrades. In ancient China, most of important building were raised on platforms built of rammed earth. This custom spread already in the third millenium B.C. Since these times, large platforms without substantial buildings on it were also known, and they probably served to important public purposes. In the Chunqiu period, tái 臺 were often part of palaces. The period during which raised platforms - built for pleasure - most flourished was nevertheless the Warring States and Han. [HUANG 1995: 1116 - 1117]'
