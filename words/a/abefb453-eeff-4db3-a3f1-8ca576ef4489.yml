definition: Cuī dié 衰絰 refers in a general way to all the gear that makes up mourning dress, and quite frequently to the wearing of such gear, and I suspect that these terms would also refer to mourning dresses that are stored and not currently used in ritual contexts, but this needs to be investigated..
