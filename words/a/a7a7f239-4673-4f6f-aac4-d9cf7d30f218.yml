definition: This refers to the personal initiation of a disciple in the Buddhist teaching by a teacher; shòuyè yuàn 受業院 refers to the temple in which a disciple receives his introduction to the Buddhist practice and shòuyè shī 受業師 (or běnshī 本師) to the initial master of a monk.
