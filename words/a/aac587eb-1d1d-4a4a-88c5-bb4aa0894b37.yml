definition: Quán 權 refers to the weight. Weights known from the Warring States period are usually made of bronze. According to the late Warring States and Han texts, they were divided into five categories - zhū 銖, liǎng 兩, jīn 斤, jūn鈞, and shí 石 - but it should be noted that situation was more complicated, and in Warring States times weights differred from state to state.
