definition: Jì 既 (ant. wèi 未"not yet") is limited to subordinate clauses, yǐ 已 has no such limitations of distribution in this respect. Jì 既 can only be used in front of VPs expressing a clearly concluded development which the word declares to have been completed; yǐ 已 can also mark that something has already STARTED. See also AFTERWARDS [SPECIALISED]
