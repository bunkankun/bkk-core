definition: 'Jǐ 紀 (also written - mainly on the bronzes - as 己) (CHEN PAN 1969, 328-332) Clan: Jiāng 姜. Rank: Hóu 侯 (used in the CQ and ZUO). In the inscriptions on the bronze artifacts, the rulers of Jǐ are sometimes referred to as bó 伯. Founded: Unknown. Destroyed: In 690 B.C. (Zhuang 4) by Qí 齊. Location: In the modern Shòuguāng 壽光 district, Shandong province (according to the Shuǐ jīng zhù, Kuò dì zhì, Dì míng kǎolyè, etc.). Note that some bronzes found in that area and dating from the Late Shāng period were inscribed with Jǐ character. History: The state of Jǐ was rather small and weak. During the reign of the Zhōu King Yí 周夷王, the ruler of Jǐ slandered Duke Āi of Qí 齊哀公 to the King, who in turn had the Duke boiled alive. This incident (recorded in the Zhúshū jìnián) was later used by Qí as an excuse for its attacks on Jǐ. Jǐ allied against Qí with the states of Zhèng 鄭 and Lǔ 魯, and in 699 B.C. (Huan 13) this alliance managed to defeat the alliance led by Qí (and consisting of Sòng 宋, Wèi 衛, and Nán Yàn 南燕); however, Jǐ was eventually conquered by Qí in 690 B.C.'
