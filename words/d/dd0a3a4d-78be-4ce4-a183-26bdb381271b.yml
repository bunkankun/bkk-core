definition: Zhè shǔi 浙水, Zhè jiāng 浙江is an ancient name of the modern Qiántángjiāng 錢塘江. It is the greatest river of the modern Zhejiang province. It flows into the Hangzhou bay south of the city of Hangzhou. Overall length 450 km.
