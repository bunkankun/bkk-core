definition: The general word for a name for a person of any kind is míng 名. In particular, 名 refers to the name given to a person at the age of 3 months, and this name is informally chosen and often not chosen with great care. There are fixed rules for exactly when the mí2ng 名 of a person is to be used and when one must use the zì 字. (LIJI)
