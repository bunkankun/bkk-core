definition: Hào 號 refers to an informal style or given name which is first given to a person as an adult for various social purposes. Among the typical hào 號 there came to be bié hào 別號, shǐ hào 諡號, miào hào 廟號 "temple name", post-Buddhist zūn hào 尊號, huī hào 徽號 and so on. The purpose of hào 號 was to express the way of thinking and the special character of a person.
