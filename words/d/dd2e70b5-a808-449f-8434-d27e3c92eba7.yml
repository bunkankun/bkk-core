definition: The current word for sitting is not properly zuò 坐 (see KNEEL) but probably jū 居 "sit down", which is a decorous thing to do, although it is not clear in which position, exactly, one ends up, and the suspicion is that one ends up, in fact, kneeling politely in the zuò 坐 fashion.
