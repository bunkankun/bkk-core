definition: Fán 凡 characterises a topic adnominally as forming the general subject or topic in a non-narrative statement of principle. The current gloss "in general" is misleading because it wrongly suggests that there are exceptions, and because it does not specify the non-narrative "theoretical" nature of the statements introduced by the word. "In principle" is much to be preferred. [SPECIFIC]; [vadN[TOPIC]]
