definition: Luó 羅 , wǎng 罔／網, bì 畢, fú 罘, and jū 罝 (small) are current words for bird nets which can also be used to catch small animals like hares. [Bì 畢 was probably of Y-like shape, and consisted of small net and long handle. The word wǎng 罔／網 is probably only archaic variant of wǎng 网. In SHIJING, the word is used also for a fish net. Fú 罘 can be also used to catch large animals like deers.
