definition: 'Shēn 申 (CHEN PAN 1969, 302-309) Clan: Jiāng 姜. Rank: Hóu 侯 (according to the Shǐ jì, Qín běnjì, and to the Current Zhúshū jìnián). Founded: According to the tradition, rulers of Shēn were descendants of Bóyí 伯夷. Kong Yida mentions that the state of Shēn was established in the reign of King Xuān of Zhōu 周宣王 (828-782 B.C.). Establishing of the state of Shēn is described in the Shī jīng. Destroyed: According to the ZUO (Zhuang 6), Shēn was conquered by Chǔ 楚 in 688 B.C. Location: Xiè 謝 (also called Xù 序), the capital of Shēn, was according to the widespread opinion located in the area of the modern Nányáng 南陽, southern Henan province. Other locations are unreliable. History: As we can suppose on the basis of the Shī jīng, Shēn was established during the reign of King Xuān of Zhōu as a barrier against southern states, and it seems that in the beginning it was a quite powerful state. Duke of Shēn played a crucial role in the downfall of the Western Zhōu in 771 B.C., as he together with Western barbarians attacked and conquered Zhōu western royal capital (because his daughter was displaced from the position of the main wife by King Yōu of Zhōu 周幽王 [781-771 B.C.]). Later, Shēn was attacked by Chǔ, and it was conquered by that state in 688 B.C. Chǔ then established in the area one of the first districts (xiàn 縣), which became its power basis in the southern part of modern Henan. The title of Duke of Shēn 申公, which appears later in the ZUO and in other texts does not refer to the rulers of the state, but to the Chǔ officials put in charge of control over the former area of Shēn.'
