definition: Wèi 磑 refers to the round grindstone revolving on an axle. It is not completely clear whether the implement to which the word refers was used to grind the grain or to remove the husk. It is also not known when round revolving grindstones actually began to be used. The oldest finds dates from the Warrring States period, and in Han times they were already common.
