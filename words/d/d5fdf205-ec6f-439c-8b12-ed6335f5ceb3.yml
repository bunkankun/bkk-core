definition: 'Wèi 衛 (also written as Wéi 韋) (CHEN PAN 1969, 58-62) Clan: Ruled by the Jī 姬 clan. Rank: Hóu (common in CQ and ZUO). In some of the inscriptions on the bronzes, rulers of Wèi are referred to as gōng. Founded: The fief of Wèi was given to >Kāngshū 康叔, the son of the king Wén of Zhōu (>Zhōu Wén wáng 周文王). In the inscription on the Kāng hóu Fēng dǐng 康侯丰鼎, this person is called Fēng 丰. Destroyed: In 254 it was eliminated by >Wèi 魏. Location: Wèi was located in northeastern Henan. 2. Established in the second half of the eleventh century during the reign of the king Chéng of Zhōu (>Zhōu Chéng wáng 周成王), and eliminated by Wèi 魏 in 254 BC. 3. Ruled by the Jī 姬 clan. 4. The capital was Chǎogē 朝歌 (in modern Qí 淇county, Henan Province). History: The fief of Wèi was supposed to be one of the main strongholds of the Zhōu power, controlling original Shāng 商territory. In the second half of the eight century, Wèi was one of the most important states in northern China. Thereafter, due to the internal struggles, it declined in power, and in 660 it was almost eliminated by the >Dí 狄 barbarians, being only rescued by the >duke Huán of Qí齊桓公. Since the thirties of the seventh century, Wèi was a vassal state of >Jìn晉, and in 254 it was eliminated by >Wèi 魏.'
