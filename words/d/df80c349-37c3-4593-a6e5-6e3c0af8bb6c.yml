definition: 'Current general term for a pillar is zhù 柱. Pillars were in ancient China basic elements of a building, and they supported the roof. They were ussually made of wood, and could be painted (there is evidence for pillars paint in red in ZUO: ZHUANG 23) or curved. From pictorial evidence are best known pillars of the Han period, which can be divided into several types according to the shape in section: most usual are pillars with a round section, but there are also pillars with rectangular section, with eight-edged section, pillars resembling the bound bamboo, and pillars with cannelures.'
