definition: Bù 布 refers to the bronze coins cast in the shape of bù 布 (spade-like implement in ancient China). The earliest exemplars (of remarkably large size and with hollow handle) are known from the states of Jin and Zhou and dates from the end of the sixth century B.C.. During the following Warring States period, this type of coin (usually with a flat handle) was in use particularly in the states of Wei, Han and Zhao, but also in Chu. The coins were usually inscribed with the name of a state or city where they were cast. After Qin unification, bù 布 came out of use, but they were revived for a short time during the reign of the Wang Mang's Xin dynasty.
