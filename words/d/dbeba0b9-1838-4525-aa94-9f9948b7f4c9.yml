definition: Fú zhāng 服章 refers to a ceremonial dress embroidered with pictures of son, moon, and stars, which expressed status of its owner. One picture was called zhāng 章; an emperor had twelve zhangs, and the number of zhangs was then decreasing with a lower status of the officers.
