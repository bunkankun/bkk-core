definition: The case of qǐn 寢 is historically very complex. Four uses of the word must be distinguished. A. Qǐn 寢 referred in Spring and Autumn times to a part of the miào 廟 attached to it at as a back-room qǐn 寢 which was a luxuriously appointed bedroom for the use of the ancestors, where these could sleep and where they were also served as if alive (although these concrete practices are first mentioned in Han sources). B. In Warring States times the qǐn 寢 was moved to the vicinity of royal tombs to serve as a place of worship. See TOMB. C. Also, the term referred to the back room behind the formal main hall in which the spirits were venerated (in private homes in the north-western corner).
