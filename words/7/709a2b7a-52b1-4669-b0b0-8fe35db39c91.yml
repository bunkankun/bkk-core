definition: Huán 還 (ant. wǎng 往 "set out for") typically refers to turning round and preparing to retrace one's steps or one's route, very often after a military or civil engagement, successful or unseccessful, and the focus is on wherefrom one returns. 還 as a subordinate sentence is "when he was on his way back". See TURN ROUND
