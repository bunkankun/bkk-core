definition: Táo 逃 refers to an attempted or successful escape to a place, or from any difficult predicament (for which see AVOID), occasionally also from a person or group of persons. Thus to 逃 a state is to flee TO a state, to 逃 a predicament is to flee FROM a predicament, and to 逃 a person is to flee FROM that person.
