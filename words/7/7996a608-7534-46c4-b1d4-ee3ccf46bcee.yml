definition: The most common word for an ancestral temple in ancient China was miào 廟, and this word refers to the royal ancestral temple as well as to the ancestral temples of feudal lords and senior officials and even ordinary shì 士 "gentlemen, freemen". The Son of Heaven had seven of these, feudal lords had five, dàfū 大夫 had three and ordinary freemen had one. Ordinary people sacrificed in the qǐn 寢 "back room (also used as bedroom)" where the altar would traditionally occupy the north-western corner.
