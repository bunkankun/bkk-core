definition: Zhuī 追 refers to the attempt of catching up with anything, characteristically a kòu 寇 "enemy" or thief (who may not know he is being pursued) but without any attending notion that what is being caught up with is NECESSARILY trying to escape or to make great speed, and the word is regularly used in figurative derived meanings "to seek", as in zhuī lì 追利 "chasing after profit".
