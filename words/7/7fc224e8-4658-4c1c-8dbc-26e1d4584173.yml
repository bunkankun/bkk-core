definition: The current general word for training, instructing, and disciplining others is jiào 教 (ant. xué 學 "study") and the standard main aim of jiào 教 is unquestioning obedience, professional skill, and intellectual conformity to the standard set by the teacher, and the word connotes use of authority and sometimes even coercion. The primary aim of jiào 教 is action conforming to a standard, and the word is commonly nominalised.
