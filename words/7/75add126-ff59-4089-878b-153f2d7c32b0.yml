definition: Huì 誨 (ant. xí 習 "study persistently") refers to systematic and persistent efforts to teach and inculcate intellectual or practical skills (誨之琴 "taught him to play the zither") and moral understanding of students (誨女知之 "I will teach you so you understand"), and the word never implies coercion or any threat of force. Huì 誨 can be mutual, or refer to equals teaching equals, even subordinates teaching superiors 諫誨 "remonstrate with and instruct". The word is not commonly nominalised. The primary aim of huì 誨 is understanding.
