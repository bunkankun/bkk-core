  orth: 翂翂
definition: Áo xiáng 翱翔, yǐ nǐ 旖旎, fān 翻, fēn fēn 翂翂, zhì zhì 翐翐, and the rare nǐ 旎 are poetic words referring to the fluttering back and forth of birds, the latter mostly to the fluttering of a flag.
