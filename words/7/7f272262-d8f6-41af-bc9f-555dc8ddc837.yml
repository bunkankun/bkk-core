definition: 'Nán Yān 南燕 (usually called only Yān 燕; distinguish from the Běi Yān , which was originally written as 郾) (CHEN PAN 1969, 375-378) Clan: Jí 姞 (according to the Jìn yǔ section of the Guó yǔ; Yān Jí 燕姞, the wife of Duke Wén of Zhèng 鄭文公, is mentioned in the ZUO, Xuan 3). Rank: Bó 伯 (occurs in the ZUO). Founded: According to the legendary tradition (recorded in the Jìn yǔ chapter of the Guó yǔ and in the Hàn shū Dì lǐ zhì), the lineages with Jí surname were descendants of the mythical Yellow Emperor 黃帝. In the ZUO (Xuan 3; 606 B.C.), the legendary ancestor of Nán Yàn is called Bóyōu 伯 (or Bóshū 伯儵). Destroyed: Unknown. The state is mentioned in the ZUO in 674 B.C. (Zhuang 20) and in 500 B.C. (Ding 10). By that period, it was still in existence. Location: In the northeastern part of the modern Yánjīn 延津 area, Henan province (CHEN PAN locates it into the Henan province, Wèihuī fǔ 衛輝府, Zuòchéng 胙城 district; is it identical????). History: Nán Yàn was a small and weak state, which relied mainly on alliances with its more powerful neighbors. In the beginning of the period recorded in the CQ, we find Nán Yàn participating in the struggles among the eastern and central states, which resulted into a defeat of the armies of Qí 齊, Sòng 宋, Wèi 衛, and Nán Yàn by the coalition of Zhèng 鄭, Lǔ 魯, and Jǐ 紀 in 699 B.C. (Huan 13). Later, Nán Yàn several times appears in the ZUO; for instance, in 675 B.C. (Zhuang 19), it intervened into the struggle in the Zhōu 周 royal court.'
