definition: 'Dào 道 (CHEN PAN 1969, 584) Ruling clan: Unknown. According to the Xìng kǎo quoted in Tōng zhì Shìzú lyè, the rulers of Dào belonged to the Jī 姬 clan. Rank: Unknown. Founded: Unknown. Destroyed: The state was shifted to Chǔ 楚 by King Líng of Chǔ 楚靈王(540-529 B.C.); later, it was reestablished by King Píng of Chǔ 楚平王 (ZUO, Zhao 13, 528 B.C.). Location: Uncertain. Either modern Queshān 確山 district in Henan province (according to the Huán yǔ jì), or Xī 息 district in the same province. History: Mentioned for the first time in the ZUO in the entry for 655 B.C. (Xi 5).'
