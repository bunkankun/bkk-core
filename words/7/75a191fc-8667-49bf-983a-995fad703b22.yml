definition: Other general terms for subjectively construed general moral commendation include měi 美"point of moral distinction" (ant. è 惡 "point of moral decrepitude"), and occasionally gāo 高"elevated points, elevated spirit" (ant. jiàn 賤 "point of vulgar decrepitude"). NB that shàn 善 "excellent" is not used as a general term of positive moral appreciation in pre-Buddhist texts.
