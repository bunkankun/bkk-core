definition: Wén 聞 (ant. wèi zhī wén 未之聞 "have never heard/learnt about any such thing") is sometimes used as a resultative verb meaning "come to understand something because one has been informed of it". But this usage is limited to the idiom wén dào 聞道 "hear about the Way".
