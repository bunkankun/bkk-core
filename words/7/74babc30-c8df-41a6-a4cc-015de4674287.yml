definition: 'Shēn yí 深衣 refers to the cloth made in one piece, and not divided into the jacket and the skirt. This kind of cloth became popular in Warring States times, and was particularly common in the Han period. [HUANG 1995: 744 - 745, SUN 1991: 241; ill.: ZGYI 1996: tab. 49; SUN 1991: 60-1 - 60-5]'
