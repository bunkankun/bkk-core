definition: 'Xǔ 許 (in the bronze inscriptions written as 鄦) (CHEN PAN 1969, 285-290) Clan: Jiāng 姜. Rank: Nán 男 (common in the CQ). In the bronze inscriptions, the rulers of Xǔ are referred to as zǐ 子. Founded: According to the tradition (mentioned in the Zhèng yǔ section of the Guó yǔ and in the ZUO under Yin 11), the founder of Xǔ was Bóyí 伯夷, the descendant of the mythical Tài Yuè 太岳 (or Sì Yùe 四岳). Destroyed: Xǔ was still in existence by the end of the period recorded in CQ, and was destroyed during Zhanguo period probably by Chǔ 楚 (according to the Hàn shū Dì lǐ zhì). However, HFZ mentions that Xǔ was conquered by Wèi 魏. Location: According to the ZUO, the capital of Xǔ shifted several times during the Chunqiu period. The first capital called Xǔ 許 was (according to the Dìmíng kǎolyè) located in the modern Xǔchāng 許昌, Henan province. In 576 B.C. (Cheng 15), during the reign of the duke Líng of Xǔ 許靈公, it shifted to Yè 葉 (modern Yè 葉 district, Henan province), then (during the reign of Duke Dào 許悼公), in 533 B.C. (Zhao 9) to Yí 夷, in 524 (Zhao 18) to Báiyǔ 白羽 in the area of the Xiāng 鄉 district in Nányáng 南陽, and in 506 B.C. (Ding 4) to Róngchéng 容城 (location highly uncertain). History: Xǔ was a small state, which is mentioned for the first time in the CQ and ZUO in the record for 712 B.C. (Yin 11). Since the beginning, it was exposed to the attacks of its more powerful neighbors, and in the same year, it was even conquered by Zhèng 鄭. However, the state was re-established later, and it is mentioned again in CQ for 702 B.C. In 531 B.C., Xǔ was annexed by Chǔ, but was again re-established two years later.'
