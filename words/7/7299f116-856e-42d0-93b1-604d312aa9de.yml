definition: Zhēn 珍 (ant. yōng 庸 "perfectly ordinary") is always concrete when nominal and refers to preciousness with strong overtones of exquisite and exlusive distinction of the object concerned, and there often is a touch of the subjective. Hence the common combination zhēn guài 珍怪 "precious and exotic things", and the derived meaning of "culinary delicacies".
