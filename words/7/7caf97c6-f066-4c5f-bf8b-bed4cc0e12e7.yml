definition: 'Lǔ 魯 (CHEN PAN 1969, 39-46) Clan: Ruled by the Jī 姬 clan. Rank: Hóu 侯 (common in CQ and ZUO). In some of the inscriptions on the bronzes, the rulers of Lǔ are referred to as gōng 公. Founded: The fief of Lǔ was given by king Chéng of Zhōu 周成王 to >Bóqín 伯禽, the son of duke of Zhōu (>Zhōu gōng 周公). Destroyed: In 256 BC, Lǔ was eliminated by the state of >Chǔ 楚 (according to the Lǔ shìjiā chapter of SHI). Location: The state was located in modern Shandong Province. The capital was Qūfù 曲阜 (to the north of modern Qūfù 曲阜 in Shandong). History: Lǔ was established in the early Western Zhōu period as the basis of the Zhōu power in the East. By the eight century, Lǔ was still relatively strong state, but thereafter it declined in importance, and since the thirties of the seventh century, it became a vassal state of >Jìn 晉. Since the beginning of the sixth century, power in the state in fact fell to the hands of families of Shūsūn 叔孫, Jìsūn 季孫 and Mèngsūn 孟孫. In 256 BC, Lǔ was eliminated by the state of >Chǔ 楚. The state of Lǔ was known as one of the most cultural states in China, where the rites of Zhōu 周 were fully preserved.'
