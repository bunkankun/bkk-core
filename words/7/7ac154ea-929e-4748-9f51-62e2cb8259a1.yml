definition: Fēng 豐 (ant.*qiàn 歉 "poor natural harvest") refers primarily to the natural abundance of some feature or resource, but in elevated archaic discourse the word may also refer to abundance of sacrifice and the like. The rare fēng 丰 was not homophonous in ancient times, and the meaning emphasises beauty as well as abundance. [NATURAL!]
