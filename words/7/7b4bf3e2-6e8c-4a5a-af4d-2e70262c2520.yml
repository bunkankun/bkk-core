definition: 'Guàn 觀 in the Chunqiu and Warring States referred to the building raised on a platform in front of the gate of the palace. In the Han, guàn 觀 was used as another term for què 闕; besides this, it also referred to other buildings raised on a terrace: HUANG 1995: 986 - 988]'
