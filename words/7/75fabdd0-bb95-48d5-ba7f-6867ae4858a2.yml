definition: 'Zhào 趙 Clan: Ruled by the Yíng 贏 clan (according to the Zhào shìjiā chapter of SHI). Rank: In the secong half of the fifth century B.C., rulers of Zhào were still of dàfū 大夫 rank. In 403 B.C. they were raised to the rank of zhūhóu 諸侯, and were then usually referred to as hóu 侯. In 323 B.C., the rulers of Zhào adopted the title of wáng 王. Founded: Established in 453 BC after the split of Jìn, and in 403 BC recognized by the Zhōu king. Destroyed: In 228 BC destroyed by >Qín. Location: Located in modern Shanxi and in southwestern part of Hebei. The first capital was Jìnyáng 晉陽 (modern Tàiyuán 太原 in Shanxi), in 424 it was moved to Zhōngmóu 中牟(in modern Zhōngmóu 中牟 district in northeastern Henan), and definitely, in 386 to Hándān 邯鄲 (modern Hándān 邯鄲 in southwestern Hebei). History: Zhào was established in 453 BC when three families divided the state of >Jìn , and in 403 it was recognized by the Zhou king. In 323 the ruler of Zhào accepted the title of wáng 王. After the military reforms of >king Wǔlíng (趙武靈王 325 - 299 BC) when the cavalry in a fashion of nomad tribes was introduced, Zhào grew in power and became one of the most powerful states in China. However, in 260 B.C. the Zhào army was completely destroyed by >Qín 秦 at Chángpíng 長平, and in 228 BC the state was eliminated by Qín.'
