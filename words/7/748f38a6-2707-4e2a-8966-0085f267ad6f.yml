definition: 'Xià 夏 Clan: In the traditional accounts, the rulers of Xià are said to have Si 姒 surname. Rank: Wáng 王 (in the traditional accounts also referred to as hòu 后). Founded: According to the legendary tradition, the founder of the Xià dynasty was the mythical emperor Great Yù 大禹 who is said to rule in the end of the third millenium BC. Destroyed: According to the tradition, the last ruler of the Xià, Jié 桀, who is in the texts depicted as a prototype of the despotic ruler, was defeated by the founder of the Shāng 商 dynasty, Chéng Tāng 成湯. According to the traditional chronologies, it appened in 1766 BC or about 1550 BC. Location: The rulers of Xià are said to rule from several capitals. There have been the large discussion about their location in traditional Chinese historiography, but they are bassically located by tradition to the southwestern Shānxī and to central Henan. History: Xià is a legendary dynasty which is for the first times mentioned in Zhōu texts (the name does not appear in the Shāng oracle bone inscriptions). Some stories about its seventeen rulers are mythological. The question of the historicity of Xià dynasty is seen from different points of view by Chinese and western scholars. Most of the Chinese scholars do not doubt the existence of Xià, and often associated with the large archaeological site excavated at Èrlǐtóu 二里頭 in the modern Yǎnshī 偃師 district, central Henan, and dated to the 21th-16th century BC. On the other hand, western scholars consider the Xià dynasty rather legendary. Since the Zhōu period, the term Zhū Xià 諸夏 (or Huá Xià 華夏) referred to the states of the realm recognizing the authoritu of the Zhōu kings.'
