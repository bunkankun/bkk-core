definition: Hàn shǔi 漢水, Hàn jiāng漢江is one of the most important rivers of ancient China. It springs from the Panzhong mountains in the modern Shaanxi province, then flows through the southern part of the Shaanxi, northwestern and central Hubei, and in the Hanyang city [Wuhan] it flows into the Changjiang. Overall length of the river is 1532 km.
