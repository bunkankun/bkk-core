definition: Shēn 紳 is always broad, and made of silk. It hangs prominently visible from behind, and typically has suspended from it by a leather strap an official seal. This belt was a sign of status until Sui times, when it gradually came to be used more generally by everyone. [OFFICIAL], [PROSAIC]
