definition: Lù 賂 standardly refers to substantial active bribery of any kind, including the offer of singing girls, music masters, and quite frequently territory as well as imortant ritual objects like tripods and bells, but also in this case the word is used for presents one cannot plausibly construe as straightforward bribes. See GIFT and GIVE.
