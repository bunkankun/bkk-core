definition: Qiè 怯 "chicken-livered and unlikely to undertake risky tasks" and nuò 懦 (ant. yǒng 勇 "courage, boldness") as well as dàn 憚 "unduly prone to feelings of fear" refer to being pusilanimousness or the lack or courage where courage is required.
