definition: The most common current and general word for insufficiency of food supplies is probably jī 飢 (ant. bǎo 飽 "have eaten enough"), and this word refers to any such insufficiency, temporary or lasting, serious or minor. Presumably, the word can also refer to insufficiency of food among animals.
