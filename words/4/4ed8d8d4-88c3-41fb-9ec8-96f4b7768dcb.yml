definition: Jiàn 賤 (ant. shàn 善 "good" and also, along different lines guì 貴 "noble") refers 1. to noble status and 2. very negatively to a person or a piece of behaviour as not conforming to any demands set by nobility of purpose or status. Lòu 陋 (ant. huá 華 "elaborate and cultivated") refers to vulgarity as a negative feature of places (streets) or behaviour.
