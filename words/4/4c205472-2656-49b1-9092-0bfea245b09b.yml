definition: Hū 乎 typically invites a commonality of intensely held emphatic attitude between speaker and listener and is thus semantically related to final fú 夫 meaning n'est ce pas in that these particles, although express quite different nuances of meaning, do contain the same element of communicative appeal to audience rather than straight expressiveness as such.
