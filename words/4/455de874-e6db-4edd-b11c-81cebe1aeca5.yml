form:
  orth: 窌
definition: Jiào 窌 refers to an artificial cave used for storing grain. This was probably the earliest method of storing, but still in use by Han period. Note that many oracle bones of the Shang dynasty were found in pits which could serve to store them. Presumably, these were jiào 窖／窌.
