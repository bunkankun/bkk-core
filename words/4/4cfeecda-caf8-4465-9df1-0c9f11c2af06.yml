definition: The most general word for making sacrificial offerings of wine and food to spirits of Heaven, of Earth and to the ancestors (perhaps primarily to the spirits of Earth and of the ancestors) is jì 祭 which has become the most common word in Warring States times, replacing sì 祀, which was more common in SHU and SHI.
