definition: Mì luó shǔi 汩羅水is the river in the northeastern part of the modern Hunan province. It springs from the Xiang mountains near the city of Ningzhou [the modern Jiangxi province]. The overall length 250 km. The poet Qu Yuan is said to commit suicide by throwing himself into this river.
