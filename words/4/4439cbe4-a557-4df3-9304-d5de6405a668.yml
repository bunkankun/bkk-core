definition: Xiān 仙 refers to ethereal divinised creatures of any kind, typically to those who have attained an eternal life on earth, and it is striking that the word gained currency first in Eastern Han times, and that the word is very common in the verbal meaning "become an immortal", whereas guǐ 鬼 is very rarely so used.
