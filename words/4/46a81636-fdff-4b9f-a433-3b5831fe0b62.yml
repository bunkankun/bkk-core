definition: Pì 譬 is close in meaning to bǐ 比, but the word always refers to comparisons that are made linguistically explicit, and there is always one thing (typically something hard to understand) which is illustrated by something else that is much easier to understand. Syntactically, pì 譬 is special in that it standardly takes the object pronoun zhī 之.
