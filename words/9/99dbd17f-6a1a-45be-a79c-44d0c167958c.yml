definition: Yǔ 敔 is a rare word referring to a bell in the shape of a crouching tiger which is beaten using a bamboo stick. Apparently, this bell was only struck towards the end of a musical piece. [Mentioned in the YIJI chapter of the SHANGSHU. Description of the shape dates from the SONG. For a Chinese antiquity, I have not found any archaeological or pictorial evidence.]
