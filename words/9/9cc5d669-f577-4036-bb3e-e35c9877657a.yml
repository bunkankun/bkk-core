definition: 'Huò 霍 (CHEN PAN 1969, 563-566) Ruling clan: Jī 姬. Rank: Hóu 侯 (according to the Mù Tiānzǐ zhuàn). Shǐ jì (Zhào shìjiā) refers to the ruler of Huò as gōng 公, Shuǐ jīng zhù, Lù shǐ Guó míng jì, and Wèi shìjiā zhēngyì as bó 伯. Founded: In the early Western Zhōu period by Shūchù 叔處, the son of the Zhōu king Wén 周文王 (according to Shì běn and Shǐ jì [Guǎn Cài shìjiā]) . Destroyed: 661 B.C. by Jìn (ZUO Min 1). Location: In the south-west of the modern Huò 霍 district, Shānxī province.'
