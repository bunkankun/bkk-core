definition: 'Some words specify modes of killing: cì 刺 is to murder by stabbing with a pointed object, typically a dagger; liè 裂 and jiě 解 refer to dismembering by a wide variety of methods; zhèn 鴆 refers to poisoning; jǐng 剄 refers to cutting the throat; xī 腊 refers to killing followed by making a person into minced meat; rèn 刃 is to kill with a sword; jiǎo 絞 and yì 縊 refer to strangulation, è4 mèi 扼昧 and refer to strangulation; è 餓 can refer to starving someone to death. For a more detailed account of the varieties of death penalties in ancient China see PUNISHMENT.'
