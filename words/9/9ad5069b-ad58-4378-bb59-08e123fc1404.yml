definition: 'Paó 袍 is a kind of shén yí 深衣 which is long and consists of three layers of textile. From the Western Zhou till the Han, the term ussually referred to the undercloth, in Han times it began to be worn outside. [HUANG 1995: 745; SUN 1991: 243; ill.: SUN 60-6; ZGYI 1996: tab. 52; HAYASHI 1976: pp. 3, tab.1-3]'
