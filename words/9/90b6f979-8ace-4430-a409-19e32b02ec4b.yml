definition: The most current general word for arrogance of attitude and in behaviour is probably jiāo 驕 (ant.* bēi 卑 "humble in attitude") which refers to an overbearing exaggerated self-confidence and does not essentially involve a negative attitude towards others. [DISPOSITION], [GENERAL], [IMPERSONAL]
