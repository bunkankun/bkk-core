definition: The general word for the period around the middle of the day is rì zhōng 日中, and this construction hovers interestingly between the sentential original meaning "the sun reaches the highest point" and the idiomatic nominal meaning "noon", "at noon", thus jí rì zhōng 及日中 can be read as "when the sun reached the highest point" or "when it got to the point in time of noon"
