definition: 'Qí 齊 (CHEN PAN 1969, 167-177) Clan: Ruled by the Jiāng 姜 clan. Since 481 B.C. (Ai 9) was real power in the state grasped by the Tián 田 (or Chén 陳) lineage, and in 386 B.C. its members oficially became marquises of Qí. The state was since that time sometimes called Tián Qí 田齊. Rank: Hóu 侯 (common in CQ and ZUO). In 334 B.C. rulers of Qí (or Tián Qí) adopted the title of wáng 王. Founded: The fief of Qí was in the second half of the 11th century given by the king Chéng of Zhōu (>Zhōu Chéng wáng 周成王) to the Great Duke (Tài gōng 太公) >Lǚ Shàngfǔ 尚父. Destroyed: In 221 B.C. by Qín. Location: Located in modern Shandong province. 4. According to SHI, the first capital of the state was Yíngqīu 營丘. Several possible locations for this place were offered by traditional Chinese historiography, but the most probable seems the opinion of Shìjiā zhēngyì (quoting Kuò dì zhì), Hàn shū Dì lǐ zhì, and Tōng diǎn that it was located in the area of modern Lìnzī 臨淄 in the eastern part Zīfù 淄傅 in Shandong Province. In the beginning of the ninth century BC, the capital was shifted by lord Hú 齊胡公 to Bùgu 簿姑, which is located by the Xù Hàn shū Jùn guó zhì, Kuò dì zhì, and Dì míng kǎo lyè into the area of the modern Fùxìng 傅興 in Shandong. Eventually, Lord Xiàn 齊獻公 ruling in the ninth century established its capital in Línzī 臨淄 (modern Línzī 臨淄 in Shandong, where the city and necropolis dating from the Chunqiu and Zhanguo periods were excavated). History: By the eight century BC, Qí was one of the most powerful states in northern China. It reached the first peak of its power under duke Huán (>Qí Huán gōng 齊桓公, 685 - 643 BC) who was enfeoffed the leader of feudal lords (bà ) by the Zhōu king in 679 BC. After the death of duke Huán Qí lost its leading position due to the internal struggles, but it still remained a powerful state, and was recognized to be one of the four main powers in China in the conference in 546 BC. In the fifth century, Qí went through an internal crisis when the power in the state was in fact usurped by the >Tián 田 (or >Chén 陳) clan in 481, and officially in 386 BC. Under king Wei (>Qí Wēi wáng 齊威王) Qí grew in power and by the end of the fourth century it became together with the state of >Qín 秦the main power in China. However, in 284 BC Qí was almost eliminated by allied armies of other states, and although in 279 regained its lost territories, it remained the secondary power until its elimination by Qín in 221 BC.'
