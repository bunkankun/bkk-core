  notes:
  - T22n1428_p0591a16(03)。阿那律言。
  - T22n1428_p0591a17(03)一月極遠我不堪忍人命無常。跋提子言。
  - T22n1428_p0591a18(03)若不能一月者可七日之中共相娛樂耶。
  - T22n1428_p0591a19(03)阿那律報言。七日不遠。若七日竟能出家者善。
  - T22n1428_p0591a20(01)若不出家我當出家。
