definition: Bā 巴 is a name of an ancient ethnic group and polity in the area of modern Chongqing. According to the historical texts, the leader of Bā was enfeooffed by the king Wu of Zhōu (>Zhōu Wǔ wáng 周武王) when this had defeated the >Shāng 商. When >Qín 秦 conquered this area, it established there the commandery of Bā 巴君.
