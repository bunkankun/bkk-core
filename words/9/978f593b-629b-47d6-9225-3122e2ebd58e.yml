definition: The current general term for a lamp is dēng 燈, and it refers to the vessel (which itself is also written dēng 鐙) containing oil, fat, or even melted wax, usually made of metal. Most common were lamps resembling a bowl on a high foot. The bowl was filled with fat or oil which was either burnt itself, or in the centre there was fixed a torch, made ussually of hemp stalks or reed, which was burnt. The lamp came to use in the early Warring States period, and became very common in Han times.
