definition: Duì 對 "respond" (opp. wèn 問 "ask") refers to responses to superiors (See REPLY) whereas wèi 謂 often addresses inferiors. Yán 言 is neutral in this respect. Duì 對 is typically in response to a question, whereas wèi 謂 and yán 言 never are. >>FORMAL, ASCENDING, PRESCRIBED
