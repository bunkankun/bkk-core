definition: Luò shǔi 洛水is the river in the modern Henan province. The name was originally writen like 雒, in the period of the Three kingdoms it has been changed to 洛. Its spring is located in the Luonan county in the Shaanxi province, then it flows to the East through the cities Luoning, Yiyang, and Luoyang. In the modern Gong county, it flows into the Huanghe.
