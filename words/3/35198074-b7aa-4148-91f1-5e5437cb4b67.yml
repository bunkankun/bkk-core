definition: Jūn 軍 is a complete army as a unit, from Spring and Autumn times onwards, normally attached to an army camp. Complete parts of an army are always jūn 軍, rarely shī 師. Hence the expressions sān jūn 三軍, zhōng jūn 中軍, shàng jūn 上軍, xià jūn 下軍. An army is counted by the number of jūn 軍 in it, where each jūn 軍 is said to be 10 000 men, at least in the Qi system. Systems have varied in different states. For detals of the early history see the monograph by KOLB. [IMPERSONAL], [LARGE], [OFFICIAL]
