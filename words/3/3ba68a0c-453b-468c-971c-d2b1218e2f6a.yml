  - T03n0190_p0707b21(00)其若在家定當得作轉輪聖王。
  - T03n0190_p0707b22(05)若捨出家必得成就於無上道。而我等今作何方便。
  - T03n0190_p0707b23(02)令此童子得不出家。諸釋親族即報王言。大王。
