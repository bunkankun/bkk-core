- bibliography_uuid: 8d17a8f3-d898-45e5-a63a-896350e61c19
  scope: 258b
  scope_unit: page
  notes:
  - 陸異日又謂師曰。弟子亦薄會佛法。師便問大夫十二時中作麼生。陸云。寸絲不掛。師云。猶是階下漢。
- bibliography_uuid: 8d17a8f3-d898-45e5-a63a-896350e61c19
  scope: 304c
  scope_unit: page
  notes:
  - 僧問。如何是和尚不欺人眼。師曰。看看冬到來。僧曰。究竟如何。師曰。即便春風至。問遠聞和尚6寸絲7不掛。及至到來為什麼有山可守。師曰。道什麼。僧喝。師亦喝。僧禮拜。
