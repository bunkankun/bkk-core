definition: The current general word for pursuing something or going after something in a hostile way, driving what is pursued before one, competing with it for speed, is zhú 逐 and the word can only very occasionally refer to abstract pursuits like that of wisdom, as in the venatio sapientiae of Nicolas Cusanus. It is significant that the word currently means "to expel", where expelling and chasing are not always easy to distinguish.
