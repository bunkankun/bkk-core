definition: The current general word for a mirror is jìng 鏡. [The word is known since the Warring States. Mirrors for the first time appeared in Central China in Shang times, but became no common prior to the Warring States period. Ancient Chinese mirrors were made of bronze, they were of round shape with a button in the centre to hang it up, and their one side was richly decorated.
