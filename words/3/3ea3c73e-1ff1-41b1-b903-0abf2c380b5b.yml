definition: Shǔn 盾 refers to the shield generally, and this word became common in the Warring States period (but it occurs already in the Western Zhou bronze inscriptions and in SHIJING. Shields dating from the Warring States and Han periods are usually made of lacquered leather or wood, and are decorated with abstract and pictorial musters. Most common are pieces with rounded upper edge, but there are also oval or oblong exemplars.
