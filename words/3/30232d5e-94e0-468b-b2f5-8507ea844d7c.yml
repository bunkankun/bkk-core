definition: 'Lì 厲 (probably identical wit Lài 賴) (CHEN PAN 1969, 611-620) Ruling clan: Uncertain. According to the Hàn 漢 tradition, the rulers of Lì were descendants of Lìshānshì 厲山氏, who (according to the Jìn 晉 tradition) was identical with Shén Nóng 神農. The descendants of Shén Nóng are said to possess Jiāng 姜 surname. However, these legends (mentioned in the late texts) are very unreliable. Rank: Uncertain. In the ZUO (Zhao 4, 538 B.C.), the ruler of Lì is one time referred to as zǐ 子. Founded: Unknown (see Ruling clan). Destroyed: In 538 B.C. (Zhao 4) by Chǔ 楚. Location: Uncertain. According to the one opinion (Gù Dōnggāo quoting Qián Hàn dì lǐ zhì), the state was located in the area of the modern Lìshāndiàn 厲山店, in the northern part of Suízhōu 隨州, Hubei province. According to the other (Bao Xin''s commentary to the Xù Hàn shū Jùn guó zhì), Lì was located in the modern Lìxiāng 厲鄉, to the east of Lùyì 鹿邑, Henan province.'
