definition: 'Chuí 椎 refers to the mallet which was used to beat something. According to WANG (1993: 230) it was originally the wooden stick with one very thick end; but it seems that at least in the Han period the word can refer to the mallet with metal head which was also used as a weapon at the time. NB: It is difficult to distinguish between chuí 椎, chuí 鎚, and chuí 錘. To the hammers with iron heads known from the Warring States and Han period can be attributed each of these terms; probably the former two, since the last one seems to be later.'
