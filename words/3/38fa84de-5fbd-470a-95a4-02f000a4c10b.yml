definition: 'Jí 極 (it was suggested that this Jí is Jù 遽 of the bronze inscriptions, but this identification remains uncertain) (CHEN PAN 1969, 357-359) Clan: Jī 姬. Rank: Dependent state. Founded: Unknown. Destroyed: In 720 B.C. (Yin 2) by Lǔ 魯. Location: In the southern part of the modern Jīnxiāng 金鄉, Shandong province.'
