definition: Zì 字 refers to the courtesy name given to a person at the age of 20 for boys, and 15 for girls, and the purpose of this was to give the person an appellation that would distinguish her or him from the other members of the family and give him an identity. The zì 字 or a person was therefore something that was taken great care with.
