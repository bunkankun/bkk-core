definition: 'Chān yú 襜褕 refers to the broad kind of shén yí 深衣, which came to use in Western Han times. Originally, it was a kind of unformal dress; since the Eastern Han, it could be used also on formal occassions. [SUN 1991: 243; ill.: SUN 1991: 60-7, 60-8]'
