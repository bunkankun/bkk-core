definition: Tuó 橐 refers to bag, often made of leather, but sometimes also made of cloth; one type of tuò 橐 is constructed as a combination of two sacks with their openings close together, worn over one's shoulder or placed across the back of a camel. See illustration. Often used as a travelling bag.
