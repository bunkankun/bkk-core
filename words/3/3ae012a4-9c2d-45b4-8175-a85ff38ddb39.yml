definition: Gū 觚 in the Eastern Zhou and Han texts refers to some kind of vessel with edges. Its identification is uncertain. In archeology, the term is used for the trumpet-like bronze cup which is known from the Shang and Western Zhou periods. There are also lacquered and pottery vessels of this type.
