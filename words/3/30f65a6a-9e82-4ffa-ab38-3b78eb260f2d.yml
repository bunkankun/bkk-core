definition: 'Mì 密 (CHEN PAN 1969, 629-634) Ruling clan: Jī 姬 (according to the Yan''s commentary to the Hàn shū Dì lǐ zhì quoting Shì běn). This suggestion is supported by the fact that - according to the ZUO (Xi 17) - Lord Huán of Qí 齊桓公 (685-643 B.C.) had the consort Mì Jī 密姬. Rank: Unknown. Founded: Unknown (see History). Destroyed: See History. Location: See History. History: The case of Mì is rather complicated. It seems that there were at least two states of this name. The first one was perhaps located in the modern Mì 密 district, Henan province, and its rulers had Zhōu royal surname Jī 姬. Mì Jī, the consort of the Duke Huán of Qí, mentioned in the ZUO (Xi 17), probably had something to do with this state. However, it is by no means certain that the state was still in existence by that time. The area of that state was perhaps identical with the city of Xīn Mì 新密, which in 654 B.C. (ZUO Xi 6) already belonged to Zhèng 鄭. On this basis, Gāo Shìqí has suggested that the state of Mì was prior to the period recorded by CQ conquered by the state of Kuài 鄶, which was in turn conquered by Zhèng. Mì Jī could come from the former ruling lineage of this Mì, which was preserved within a noble class (according to Chén Qīnhán). Another state of Mì was perhaps located in the area of the modern Língtái 靈臺, Gansu province. It is mentioned in the Shī jīng (poem Huáng yī), according to which it was destroyed by King Wén of Zhōu 周文王. It is also associated with Mì mentioned in the Guó yǔ (Zhōu yǔ), which was later conquered by King Gōng of Zhōu 周共王. According to the Wei''s commentary to the Guó yǔ, this Mì was of Jī 姬 origin. However, yet another Mì (also located by Wei to the area of Língtái) is mentioned in the Zhōu yǔ, which was of Jí 姞 surname. According to the Wei''s commentary, there were two states of Mì in the Língtái area; but more probable seems to be the view of Wu Zhuoxin, who supposes that the former state of Mì, the rulers of which bore Jí 姞 surname, was that conquered by King Wén, who then gave the area as a fief to the lineage of the Jī 姬 surname (which was later destroyed by King Gōng).'
