definition: Yán 筵 is specifically the larger carpet-like mat put on the floor on which the xí 席 is placed in turn, but this distinction came to be blurred. The word is very regularly associated with the jī 几 "low table" which one suspects were placed on the yán 筵 alongside with the xí 席 "sitting mat".
