definition: Huán 環 refers to the jade ring; according to SHUOWEN, radius of the hole in its centre is the same as the breadth of the ring. From Western Zhou to Han times, it was used mainly like a pendant hanged from the belt downward. It was very precious artefact, and could be given as a gift. Later, the term also refers to the circular adornments made of any material; from the Han, there is textual evidence for golden or silver huán 環, and from the same period are known finds of metal fingerrings.
