definition: The current general word for refusal to do what one is asked to do or invited to do is què 卻 (ant. yǔn 允 "agree gracefully", but only for the case when què 卻 has a subject of high status), verbalised refusal to do what one is invited to do is currently cí 辭 (ant. cóng 從 "follow, do as one is told").
