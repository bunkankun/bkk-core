definition: 'Jì 冀 (CHEN PAN 1969, 576-577) Ruling clan: Unknown. According to the Lù shǐ Hòu jì, the rulers of Jì belonged to the Jī 姬 clan. Rank: Unknown. In late sources (commentary to the Lù shǐ Hòu jì) is the ruler of Jì referred to as zǐ 子. Founded: Unknown. Destroyed: Destroyed by Jìn 晉 prior to 650 B.C. (Xi 10) when the area already belonged to Jìn. Location: Uncertain. According to the Du''s commentary, the state was located in the modern Héjīn 河津 district, Shānxī province.'
