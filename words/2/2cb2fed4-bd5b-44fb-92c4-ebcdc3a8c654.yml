definition: 'Quán 權 (CHEN PAN 1969, 522-524) Clan: Uncertain. According to the Chén Péng''s Chūngqiū guó dū jué xìng kǎo, the rulers of Quán belonged to the Yǎn 偃 clan; Táng zāixiàng biǎo suggests that they were of Zǐ 子 surname, and Tōng zhì Shìzú lyè attributes to them Mǐ 羋 surname. Rank: Unknown. Founded: Unknown. According to the Táng zǎixiàng biǎo, the rulers of Quán were descendants of the Shāng 商 king Wǔ Dīng 武丁. Destroyed: According to the ZUO, Zhuang 18 (676 B.C.), Quán was conquered by Chǔ 楚 during the reign of King Wǔ of Chǔ 楚武王 (740-690 B.C.). Location: According to the Du''s commentary to the ZUO, the state of Quán was located in the modern Dāngyáng 當陽 district in Hubei province. Shuǐ jīng zhù locates it into the modern Zhōngxiáng 鍾祥 in the same province, only 30 kilometers from Dāngyáng. It is possible that the latter location is the place to which Quán was shifted after its conquest by Chǔ.'
