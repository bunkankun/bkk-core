definition: Jiàn 鑒 originally referred to a sheet of copper placed under water to obtain a mirroring effect, but from Warring States times onwards the word came to be used as synonymous with jìng 鏡. [Note that the original character was jiān 監. I have not found evidence that it referred to a copper sheet, but the term refers also to the bronze water basin which could be used like a mirror. It is supported by the form of the character, which represents a man looking at the vessel. In ZUO the term already refers to a bronze mirror, and since the Warring States, the word came to be used together with jìng 鏡.
