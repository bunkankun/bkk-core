definition: Zūn 尊 (ant. bǐ 鄙 "consider as not worthy of any veneration or respect") refers to public respect for someone in a very exalted social, cultural, religious and/or political position, and the degree of public respect is much greater that that in jìng 敬 and reaches into the past to ancestors.
