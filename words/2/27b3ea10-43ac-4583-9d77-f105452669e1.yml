definition: The most common general word for disasters is huò 禍 (ant. fú 福 "good fortune") which has no connotations of any metaphysical kind. (In OBI the character currently transcribed as huò 禍 - and closely related to 占 - refers not only to disasters as such, but particularly to disastrous omens.)
