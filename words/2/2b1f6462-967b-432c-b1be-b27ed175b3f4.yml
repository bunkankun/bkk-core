definition: Jīng hé 涇河is the northern tributary of the Wèi shǔi 渭水. It has two springs - the northern, which is located in the Pingliang, and the southern, located in Huating [both counties belong to the modern Gansu province]. The river flows into the Wèi shǔi 渭水in the modern Gaoling county [Shaanxi province]. Its overall length is 451 km.
