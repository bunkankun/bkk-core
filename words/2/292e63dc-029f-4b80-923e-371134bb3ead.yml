definition: 'Yúyúqiū 於餘丘 (CHEN PAN 1969, 502-504) Clan: Unknown. Rank: Unknown. Founded: Unknown. Destroyed: Unknown. Location: Very uncertain. According to the Dì míng kǎo lyè, Yúyúqiū was located in the modern Línyí 臨沂 district, Shandong province. History: Yúyúqiū is mentioned only one time in the CQ (Zhuang 2; 692 B.C.). It is even not certain whether it was a state (as is suggested by the Du''s commentary) or only a dependent town (as is suggested by the GONGYANG and GULIANG).'
