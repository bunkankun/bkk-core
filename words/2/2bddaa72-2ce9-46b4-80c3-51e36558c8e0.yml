definition: 'Xián 弦 (CHEN PAN 1969, 582-583) Ruling clan: According to the Chūnqiū zhuàn shuō huì zuǎn, the rulers of Xián belonged to the Wěi clan. On the other hand, Lù shǐ Guó míng jǐ attributes to them Yíng 嬴 surname. Rank: Zǐ 子 (???, in CHEN PAN is not mentioned the source). Founded: Unknown. Destroyed: In 655 B.C. (Xi 5) by Chǔ 楚. Location: Uncertain. Either modern Huáng chuán 潢川 district in Henan province, or the area of Guāngshān 光山 in the same province.'
