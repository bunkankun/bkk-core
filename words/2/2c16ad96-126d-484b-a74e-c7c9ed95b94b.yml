definition: 'Sòng (also called Yīn 殷, Shāng 商) (CHEN PAN 1969, 232-241) Clan: Ruled by the Zǐ 子 clan. Rank: Gōng (common in CQ and ZUO). This high title was due to the special prestige which the rulers of Sòng enjoyed as the descendants of the Shāng dynasty. In the Zhanguo period, the rulers of Sòng were also sometimes referred to as hóu (for instance in SHI, Liù guó nián biǎo). The last ruler of Sòng, Yǎn, adopted the title of wáng in 318 BC. Founded: The first ruler of Sòng (enfeoffed by King Wǔof Zhōu (>Zhōu Wǔ wáng 周武王) was Wēizǐ 微子, the son of Shang king >Dì Yǐ 商王帝乙. This received his fief during the reign of >King Chéng 成王. Destroyed: Conquered by the >Qí 齊 in 286 B.C. Location: The state of Sòng was located in eastern part of Henan and western Shandong. The capital was Shāngqiū 商丘 (modern Shāngqiū 商丘 in Henan). History: In the eighth century B.C., Sòng belonged together with >Zhèng 鄭, >Wèi 衛, >Lǔ 魯and >Qí 齊 among the most important states of the early Chunqiu period. Then, during the second half of the seventh century the state of Sòng gradually declined in power, and became a vassal state of >Jìn 晉, shortly before the battle of Chéngpú in 632 B.C.. In 286 B.C., it was eliminated by Qí.'
