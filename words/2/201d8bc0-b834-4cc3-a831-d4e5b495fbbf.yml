definition: Prior to the Warring States period, common general word for the shield was gān 干. It is known already from oracle bone inscriptions. In Warring States times, the word was gradually replaced by shǔn 盾. In Han times, according to FANG YAN, the term was still in use from the Hangu pass to the east, and shǔn 盾 was common in the area from the pass to the West. Shields predating Warring States period are known bad; from the Shang period there is a shield made of the leather on wooden construction, of approximately oblong shape, and painted with a picture of the tiger.
