definition: Guó 國 is a current word for the capital from early Zhou times onwards, but in the course of time the capital came to stand as representative of the (city-) state, and the word came to be used for the state rather than the capital. (Note that even the names of ancient Chinese states currently refer not to the state as such but to the capital.).
