definition: Yōu 耰 is an agricultural tool used to cover seed with earth. [Wooden mallet used to break pieces of earth. This implement is relatively often referred to in texts of the Chunqiu and Warring States period. It is not known from archaeological finds (for being made of wood), but there are pictorial presentations in hand.
