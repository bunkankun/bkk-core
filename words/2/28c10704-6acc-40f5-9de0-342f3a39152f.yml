definition: Tiāo 祧 is a technical term for a shrine, sometimes specifically a non-permanent shrine for a distant ancestor, a shrine that could be removed and replaced by a mere altar. In the common combination zōng tiā1o 宗祧 it would appear that tiāo 祧 refers to a shrine within the larger temple complex.
