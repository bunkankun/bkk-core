definition: The current dominant word for the royal court with its courtyard as a building complex is tíng 廷/庭, although the same word can also be used to refer to the courtyard as opposed to the main court building, i.e. the yard in front of the táng 堂. According to ZHENGZITONG, tíng 廷/庭 were originally unroofed, later they were covered with a roof. See also COURTYARD.
