definition: 'Xī 息 (CHEN PAN 1969, 388-390) Clan: Jī 姬 (according to the ZUO, Yin 11 - 712 B.C. - and to the Du''s commentary to that passage, as well as to the Shì běn). Rank: Hóu 侯 (appears in the ZUO). Founded: Unknown. Destroyed: In 684 B.C. (Zhuang 10) by Chǔ 楚. Location: According to the Zuǒ zhuàn zhēngyì, Xī was located in the modern Xī 息 district, Henan province. History: Xī was a small and weak state, but it is quite remarkable for the curious and rather piquant story about its downfall. Both the rulers of Xī and Cài 蔡 married the daughters of the ruler of Chén 陳; but when Xī Guī 息媯, the wife of the ruler of Xī, passed through the state of Cài, the ruler of Cài detained her. The furious ruler of Xī thereafter proposed to the King Wén of Chǔ 楚文王 to pretend an attack on Xī, in order to enable the ruler of Xī to request a help from Cài, which then could be attacked by Chǔ. The king of Chǔ followed the proposal, defeated Cài, and captured its ruler. Immediately, Chǔ also destroyed Xī following the advice of Xī Guī persuaded by the captured ruler of Cài. Xi Gui eventually became a consort of the King Wén of Chǔ.'
