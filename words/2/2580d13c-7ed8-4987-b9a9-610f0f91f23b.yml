definition: Sān yì 三翼 refers to the battleships which were in use in the southern states of Wu and Yue in Chunqiu and Warring States times. It seems that they were divided to three categories according to their size. According to Han sources, the largest ones had a space for 91 men, those of middle size for 50 men, and minor for 26 men. Note that the earliest ship battle is mentioned in ZUOZHUAN to 549 B.C., and it took place on a river; the first sea battle is dated to 484 B.C. As can be seen on pictorial presentations dating from the late Chunqiu and early Warring States period, ship battles esentially resembled battles on the earth; the ships pulled with oars came close one to the other and warriors staying on the higher board attacked enemies with arrows, halberds, and spears.
