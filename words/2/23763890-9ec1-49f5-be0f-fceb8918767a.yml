definition: Kuān 寬 (ant. zhǎi 窄 "narrow") is recorded as meaning "broad" in SHUOWEN and is so used in HOUHANSHU, but the word was predominantly used in metaphorical senses like "broad-minded, forgiving, not strict", and related to huì 惠 "generous".
