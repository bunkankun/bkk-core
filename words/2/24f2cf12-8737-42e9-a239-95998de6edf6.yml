definition: 'HYCD: 佛教稱以香花、明燈、飲食等資養三寶(佛、法、僧)為供養，并分財供養、法供養兩種。香花、飲食等為財供養；修行、利益眾生叫法供養。供養就是禮佛，或施捨僧人、齋僧的意思。'
