definition: 'Què 闕 are the buildings on both sides of the gate. The oldest textual evidence comes from the Western Zhou (see XIANG 1997: 523), neverthless què 闕 were most common in the Han. Originally, què 闕 were wooden constructions raised on platforms of rammed earth; in the Han period, they were often stone buildings.'
