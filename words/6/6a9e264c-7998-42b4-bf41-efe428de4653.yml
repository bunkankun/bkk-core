  notes:
  - 乃往古昔過無量無邊不可思議
  - 阿僧祇劫。有佛名7威音王如來應供正遍知
  - 50c
  - 明行足善逝世間解無上士調御丈夫天人師
  - 佛世尊。劫名8離衰。國名9大成。其威音王
  - 佛。於彼世中。為天人阿修羅說法。為心
  - 聲聞者。說應四諦法。度生老病死究竟涅
  - 槃。為心辟支佛者。說應十二因緣法。為諸
  - 菩薩因阿耨多羅三藐三菩提。說應六波羅
  - 蜜法究竟佛慧。得大勢。是威音王佛。壽四
  - 十萬億那由他恆河沙劫。正法住世劫數。如
  - 一閻色提微塵。像法住世劫數。如四天下微
  - 塵。其佛饒益眾生已。然後滅度。正法像法
  - 滅盡之後。於此國土復有佛出。亦號威音
  - 王如來應供正遍知明行足善逝世間解無上
  - 士調御丈夫天人師佛世尊。如是次第有二
  - 萬億佛皆同一號。最初威音王如來。既已滅
  - 度。正法滅後於像法中。增上慢比丘有大勢
  - 力。爾時有一菩薩比丘。名常不輕。得大勢。
  - 以何因緣。名常不輕。是比丘凡有所10見。
  - 若比丘比丘尼優婆塞優婆夷。皆悉禮拜讚
  - 歎。而作是言。我深敬汝等不敢輕慢。所
  - 以者何。汝等皆行菩薩道當得作佛。而是
  - 比丘。不專讀誦經典。但行禮拜。乃至遠見
  - 四眾。亦復故往禮拜讚歎而作是言。我不敢
  - 輕於汝等。汝等皆當作佛。四眾之中。有生
  - 11瞋恚心不淨者。惡口罵詈言。是無智比丘。
  - 從何所來自言我不輕汝而與我等12授記
  - 當得作佛。我等不用13如是虛妄*授記如。
  - 此經歷多年常被罵詈。不生*瞋恚常作
  - 是言。汝當作佛。說是語時。眾人或以杖木
  - 瓦石而打擲之。避走遠住。猶高聲唱言。我
  - 51a
  - 不敢輕1於汝等。汝等皆當作佛。以其常
  - 作是語故。增上慢比丘比丘尼優婆塞優婆
  - 夷。號之為常不輕。是比丘臨欲終時。於虛
  - 空中。具聞威音王佛先所說法華經。二十千
  - 萬億偈悉能受持。即得如上眼根清淨耳鼻
  - 舌身意根清淨。得是六根清淨已。更增壽
  - 命二百萬億那由他歲。廣為人說是法華經。
  - 於時增上慢四眾。比丘比丘尼優婆塞優婆
  - 夷。輕賤是人。為作不輕名者。見其得大神
  - 通力樂說辯力大善寂力。聞其所說皆信伏
  - 隨從。是菩薩復化千萬億眾令住阿耨多
  - 羅三藐三菩提。命終之後得值二千億佛。
  - 皆號日月燈明。於其法中說是法華經。以
  - 是因緣復值二千億佛。同號雲自在燈王。
  - 於此諸佛法中受持讀誦。為諸四眾說此
  - 經典故。得是常眼清淨耳鼻舌身意諸根清
  - 淨。於四眾中說法心無所畏。得大勢。是
  - 常不輕菩薩摩訶薩供養如是若干諸佛。恭
  - 敬尊重讚歎種諸善根。於後復值千萬億
  - 佛。亦於諸佛法中說是經典。功德成就當
  - 得作佛。得大勢。於意云何。爾時常不輕菩
  - 薩豈異人乎。則我身是。若我於宿世。不受
  - 持讀誦此經。為他人說者不能疾得阿耨
  - 多羅三藐三菩提。我於先佛所。受持讀誦
  - 此經為人說故。疾得阿耨多羅三藐三菩
  - 提。得大勢。彼時四眾比丘比丘尼優婆塞優
  - 婆夷。以*瞋恚意輕賤我故。二百億劫常
  - 不值佛不聞法不見僧。千劫於阿鼻地
  - 獄受大苦惱。畢是罪已。復遇常不輕菩薩
  - 51b
  - 教化阿耨多羅三藐三菩提。得大勢。於汝
  - 意云何。爾時四眾常2輕是菩薩者。豈異人
  - 乎。今此會中跋陀婆羅等五百菩薩。師子月
  - 等五百比丘尼。思佛等五百優婆塞。皆於阿
  - 耨多羅三藐三菩提不退轉者是。得大勢
  - 當知是法華經。大饒益諸菩薩摩訶薩。能
  - 令至於阿耨多羅三藐三菩提。 是故諸菩薩
  - 摩訶薩於如來滅後常應受持讀誦解說
  - 書寫是經。爾時世尊。欲重宣此義。而說偈
  - 言
  - 過去有佛 號威音王 神智無量
  - 將導一切 天人龍神 所共供養
  - 是佛滅後 法欲盡時 有一菩薩
  - 名常不輕 時諸四眾 計著於法
  - 不輕菩薩 往到其所 而語之言
  - 我不輕汝 汝等行道 皆當作佛
  - 諸人聞已 輕毀罵詈 不輕菩薩
  - 能忍受之 其罪畢已 臨命終時
  - 得聞此經 六根清淨 神通力故
  - 增益3壽命 復為諸人 廣說是經
  - 諸著法眾 皆蒙菩薩 教化成就
  - 令住佛道 不輕命終 值無數佛
  - 說是經故 得無量福 漸具功德
  - 疾成佛道 彼時不輕 則我身是
  - 時四部眾 著法之者 聞不輕言
  - 汝當作佛 以是因緣 值無數佛
  - 此會菩薩 五百之眾 并及四部
  - 清4信士女 今於我前 聽法者是
  - 我於前世 勸是諸人 聽受斯經
