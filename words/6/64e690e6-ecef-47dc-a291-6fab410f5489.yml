definition: The general term for any ship, large or small, is zhōu 舟. [The word occurs already in the oracle bone inscriptions and in SHIJING. According to some opinions it originally referred to the boat made of one piece of wood, but it is not certain. The earliest forms of the character resemble the small ship made already from several planks. . Note that in Western Zhou times, ship also played certain role in some rituals performed by the king, which probably took place in the pool within royal palace.
