definition: Sú 俗 (and the rarer and much more personal xí 習) tend to refer to what is perceived as popular and sometimes even vulgar traditional practices. There is a current conception that the sú 俗 are quintessential in origin and essence, but in spite of this they are conceived of as changeable in principle.
