definition: 'Bó 柏 (CHEN PAN 1969, 585-586) Ruling clan: Unknown. Rank: Unknown. According to the Xìng kǎo Fēngsú tōng and Lù shǐ Guó míng jì, rulers of Bó were of zǐ 子 rank. Founded: Unknown. Destroyed: According to the Tōng zhì and Lù shǐ, the state was destroyed by Chǔ 楚. Location: Perhaps modern Wǔyáng 舞陽 district in the southeastern part of Henan province (Taiwanese Xīpíng 西平 district???; this is based on the Du''s commentary). History: Mentioned for the first time in the ZUO under 655 B.C. (Xi 5).'
