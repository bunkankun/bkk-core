definition: Dào 道, when used in its concrete meaning referring to a means of communication tends to refer to a larger line of communication, and the traditional claim is that the term refers to a road where two vehicles can pass each other. Thus the First Emperor called his Autobahns chí dào 馳道 and not chí lù 馳路.
