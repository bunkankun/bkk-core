definition: 'Zhú 燭refers to the hand-held torch made ussually of hemp stalks or reed. The word is also used for the torch put in a lamp. Some scholars suggest that the term refers to the candle. WANG 1993: 255; HUANG 1995: 1372; SUN 1991: 351.'
