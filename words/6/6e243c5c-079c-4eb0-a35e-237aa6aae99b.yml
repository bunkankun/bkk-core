definition: Míng 明 (ant. zuó 昨 "yester-" and zǎo 早 "earlier") refers specifically to the next member of a temporal series of days, months, or years, and míng rì 明日 does not mean "tomorrow" but can refer to tomorrow and must always be understood as "the next day, counting from the other contextually definite day". The other contextually definite day can be, but need not be, the "today" of the speech act in which the word occurs.
