definition: 'BUDDH: sit cross-legged (with both feet tugged up), sit in the Lotus-position (during meditation); skr. nyaṣīdat-paryaṅkam ābhujya (other tr. of the term include: 結加趺坐, 結跏跗坐, 跏趺正坐, 跏趺坐, 加趺坐, 跏坐結坐) (in Buddhist meditation this position is regarded as the most stable and supportive; if only one foot is tugged up then this is referred to as ''half-Lotus position'' (半跏趺坐); if both feet are tugged up it is also referred to as ''full-Lotus'' (全跏坐, 本跏坐, 全坐. 全跏, 大坐, 蓮華坐); since all Buddhas are supposed to sit in this position it is occasionally also referred to as 如來坐, 佛坐; there are two positions in the full-Lotus: (1) the left foot over the right foot, referred to as ''Demon-subduing position'' (降魔坐); (2) the right foot over the left foot, soemtimes referred to as ''Auspicious position'' (吉祥坐)) [CA]'
