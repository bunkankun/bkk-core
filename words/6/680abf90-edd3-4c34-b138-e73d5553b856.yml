definition: Xiàn 縣 referred to a military region under states already in Spring and Autumn times, and these regions were in the border regions. Later, especially in the state of Qin, annexed states were converted into 36 jùn 郡 "commanderies" (governed by a tài shǒu 太守 "governor") which in turn were subdivided into xiàn 縣 "districts" (governed by a lìng 令 "commander" or zhǎng 長 "official-in-charge").
