definition: 'Most general word for the table is jǐ 几. According to the character, its main characteristic was crooked legs. The word refers to two different pieces of furniture, both possessing this feature: 1) to the small and very narrow table made usually of wood or bamboo and used for relying one''s body on when sitting (or, more precisely, kneeling); this was put behind one''s left side or in front of him, 2) to the low table broader than previous, which was used to put something on. In relation to the latter meaning, the term can be also used as a general term for the different kinds of tables.'
