definition: Sè 瑟 refers to a larger instrument than the qín 琴, and the number of strings was standardly 25. The strings were longer and gave a deeper and more sentimental sound. This instrument is also played with both hands, but here both hands are plucking and are able to produce more polyphonic effects.
