definition: 'Huá 滑 (also called Bì [Fèi?] Huá 費滑) (CHEN PAN 1969, 516-518) Clan: Jī 姬 (according to the ZUO, Xiang 19). Rank: Bó 伯. Founded: Unknown. Destroyed: In 627 B.C. (Xi 33) by Qín 秦. Thereafter, the area came under the control of Jìn 晉; in 574 B.C. (Cheng 17), it was occupied by Zhèng 鄭, and then it came to Zhōu 周. Location: In the modern Yǎnshī 偃師 district, central Henan (according to the Du''s commentary to the ZUO).'
