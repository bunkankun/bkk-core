definition: Guǎ 寡 (ant. zhòng 眾 "numerous" and occasionally also duō 多 "large in quantity") typically refers specifically humans not being numerous as opposed to larger groups of humans, but the word comes to refer also to any quantity being relatively large (五穀多寡 "the relative abundance of grain") and I have not found a systematic difference in nuance with shǎo 少 when the word is so used, except for the generally subjective intuition that guǎ 寡 being the dominant word in early times, perhaps retained a somewhat more dignified stylistic value throughout.
