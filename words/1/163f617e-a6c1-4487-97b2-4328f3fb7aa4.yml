definition: General term for stairs is jiē 階. The word usually refers to the high stairs leading to an important building, such as the hall in a palace or temple, but it can be used also for the stairs of ordinary dwellings. That the word refers mainly to the stairs of important buildings can be easily understood, since in archaic China only these buildings were levelled on a higher platform. Already in the Warring States period, the word can also refer to a ladder.
