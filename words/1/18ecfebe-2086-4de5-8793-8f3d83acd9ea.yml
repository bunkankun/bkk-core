definition: 'Chǔ 楚 (also called Jīng 荊, Chǔ Jīng 楚荊, Mán Jīng 蠻荊, Jīng Yí 荊夷, Chǔ Mán 蠻楚) (CHEN PAN 1969, 197-231) Clan: Mì 羋 (attested also by the inscriptions on the bronzes). It is not very clear what mean the component Xióng 熊 which often occurs in the names of mainly early Chǔ rulers. Some scholars have suggested that it originally it could have been also a surname, or the local title of the Chǔ rulers. Rank: In the Zhōu hierarchy, the rulers of Chǔ were of zǐ 子 rank (the title is common in CQ). This fact is even for the early Western Zhōu period attested by one bone inscription found in the first Zhōu capital of Zhōuyuán 周原. According to the Du;s commentary to ZUO (Huan 2; 710 B.C.), since the reing of King Wǔ of Chǔ 楚武王 (740-690 B.C.) the rulers of Chǔ adopted the title of wáng 王 (this is also attested by the Chǔ shìjiā chapter of SHI). According to the Chǔ shìjiā chapter of SHI, the Chǔ ruler Xióng Qú 熊渠 adopted the title of wáng already during the reign of the Zhōu king Yí 周夷王 (ca 865-858 B.C.), but later rejected it. In the inscriptions on the bronze artifacts, rulers of Chǔ are sometimes referred to as gōng 公, hóu 侯, or bó 伯. Founded: According to ZUO and to SHI (Chǔ shìjiā), the first ruler of Chǔ who received the title of zǐ from the Zhōu king Chéng 周成王 was Xióng Yì 熊 in the second half of the eleventh century B.C. MOZI associates this story with Xióng Lì 熊麗 who was (according to SHI) the grandfather of Xióng Yì. Whatever the truth is, the state of Chǔ obviously existed (long?) prior to this event, as the quite reliable genealogy of the Chǔ rulers in SHI goes back to Yù Xióng 鬻熊 (the father of Xióng Lì), who is said to be contemporary with the Zhōu pre-conquest king Wén 周文王. Note that the fact that Chǔ had the some relationship with the Zhōu royal house already in the early Western Zhōu period is well-attested by the above-mentioned inscription from Zhōuyuán recording the visit of the viscount of Chǔ 楚子. How far the history of Chǔ goes prior the Western Zhōu period is not known. Note that the poem Yīn wǔ of the Shījīng mentions the attack of the Shāng king Wǔ Dīng 武丁 on Jīng Chǔ. SHI (Chǔ shìjiā) and XUNZI goes as far back as the period of Xià and the reign of the first Shāng king Chéng Tāng 成湯, but those records do no not seem to be reliable. Note in this context that the place name Chǔ appears already in the oracle bone inscriptions, but it is problematic whether there was any relationship between this Chǔ and the later state of Chǔ. According to the mythical tradition obviously kept in Chǔ and recorded in SHI (Chǔ shìjiā), the rulers of Chǔ were descendants of the mythical Zhù Róng 柷融. Destroyed: Eliminated in 223 BC by >Qín 秦. Location: Southern state located in the southern Henan, Hubei, part of Hunan, and later also controlling parts of Jiangxi, Jiangsu, Zhejiang and Shandong. The first capital was Dānyáng 丹陽. Its location is unknown, and quite many possibilities were offered by traditional Chinese historiography, ranging from modern Anhui province (Hàn shū Dì lǐ zhì) over the northern and central parts of Hubei province (Kuò dì zhì, Chūnqiū dì míng kǎo lyè) to the area of the Dān 丹 river in the southern Henan (Sòng Xiángfèng). The latter opinion seems to be the most probable one with regard to the fact that in the Warring states period there was really place called Dānyáng in that area, to the fact that the first Chǔ capital could not be located too far from the early Zhōu centers, and also with regard to the scope and area of the early Chǔ expansion. Note also the fact that the lavishly equiped tombs belonging to the members of the highest Chǔ aristocracy (and dating from the sixth century B.C.) were uncovered in Xichuan district in the southern part of Henan, approximately in this area. In 690 (Zhuang 4) the capital was moved to Yǐng 郢 (according to SHI Chǔ shìjiā). This is located by the Du''s commentary to ZUO and Shuǐ jīng zhù to modern Jìnán 紀南 in Hubei Province, and this opinion is accepted by the most of the modern Chinese scholars; it is supposed that this Yǐng is identical with the city excavated in that area. However, this identification is by no means certain. Archaeological Jìnán was with the all probability the capital of Chǔ (called Yǐng) in the Warring states period, but there is no evidence of a substantial settlement dating from the Chunqiu period. Not improbable is the opinion (see Blakeley 19..) that in the Chunqiu period Yǐng was located in southern Henan. However, what contradicts it is the record in ZUO for 617 B.C. (Wen 10) that when the duke of Shāng 商公 went to the visit to Yǐng, he sailed down the Hàn 漢 River and then against the stream of the Jiāng 江. It is also possible that the capital moved several times, but it still bore the same name. After 506 B.C. (Ding 4) when Yǐng was sacked by the armies of >Wú , King Zhāo moved to Rùo 鄀 (or Yān ) to the north in the area of the Hàn River valley (according to the Hàn zhì and Dì míng kǎo lyè). Then the capital again shifted to Yǐng, which is for the Warring states period with great probability identical with Jìnán. After 278 BC the capital was moved to Chén 陳(modern Huáiyáng 淮陽 in eastern Henan), in 253 BC to Jùyáng 巨陽 in Anhui, and, definitely, in 241 to modern Xúzhōu 徐州 which was also called Yǐng. History: The origins of Chǔ are not clear, as well as its original location. According to the Shiji, the ruler of Chǔ was given an investiture by the king Chéng of Zhōu (>Zhōu Chéng wáng 周成王). This fact is partly supported by the mention of the visit of the ruler of Chǔ in a Zhōu capital in Zhōu oracle bones uncovered in Zhōuyuán 周原. It seems that Chǔ was located not far from the Zhou centers, perhaps in southern Henan (see Location). Also the early artefacts which can be associated with Chǔ are not substantially different from the Zhou art, and it seems that a distinctive Chǔ culture was not developed prior middle Chunqiu period. In the 8th and 7th centuries Chǔ grew in power, destroyed many small states located mainly in southern Henan, and became one of the leading powers in China. Chǔ ambitions to challenge the power of the declining Zhōu dynasty were manifested in 704 BC, when the ruler of Chǔ declared himself a king. In 632 BC Chǔ was seriously defeated by >Jìn 晉at Chéngpú 城濮, but in 597 the >king Zhuāng 楚莊王 of Chǔ won a great victory over Jìn armies at Bì 邲 and for a time became a hegemon. The struggle for a hegemony between Chǔ and Jìn thereafter lasted till 546 BC when status quo was recognized in a conference held at >Sòng 宋. At the end of the sixth century Chǔ went through a serious crisis, and in 506 BC its capital was even occupied by the southeastern state of >Wú 吳. In the fifth century Chǔ regained its power and expanded to the East. In the end of the fourth and beginning of the third century it received several severe defeats from the state of >Qín 秦, and in 278 BC Qín occupied the capital of Chǔ. Chǔ thereafter moved its center to the East. This "Eastern Chu" was destroyed by Qín in 223 BC.'
