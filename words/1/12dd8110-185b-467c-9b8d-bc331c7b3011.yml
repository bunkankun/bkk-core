definition: Jué 爵 is the term for Shang and Western Zhou bronze tripod with long spout to drink wine from, which was used on ceremonial occasions. Shape of the character read now as jué 爵in the oracle bone and bronze inscriptions obviously refers to this kind of cup. There are also pottery vessels of this shape known from the Shang period. In late Western Zhou times, this type of vessel came out of use. Jué 爵mentioned in the Eastern Zhou and Han texts can refer to each type of wine cup; according to Han sources jué 爵 should have room for one shēng 升 of wine. [??? it seems to me that jué 爵 in the Eastern Zhou sometimes refers to the certain amount of wine drunk at once rather than to the concrete wine vessel???.
