definition: Wǎng 往 (ant. jū 居 "remain at home") refers to setting out for a destination by any means of transport or by foot, and the destination is not very often made explicit by an ordinary noun as object. Moreover wǎng 往 does not necessarily imply going somewhere by the most direct route.
