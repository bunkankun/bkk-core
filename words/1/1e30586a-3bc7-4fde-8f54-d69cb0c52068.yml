definition: The general word for headdress designed to indicate status is guān 冠, and the practical purpose of this hat is not only to indicate status but also to hold together the bun of hair on the top of the head. At the age of twenty all males acquired the right to wear a guān 冠. The hat was held in position by a cord called yīng 纓.
