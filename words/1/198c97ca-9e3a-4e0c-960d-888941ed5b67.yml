definition: The earliest general word for the roof is wū 屋, which occurs in this meaning in SHIJING, ZUOZHUAN, and CHUCI. The term can refer both to the roof of aristocratic buildings which was since the early Western Zhou period covered with tiles, or to the thatched roof of ordinary dwellings. Evidence for the shape of the roof in the Zhou period is of course scarce, we can recognize it only from several bronze vessels in the shape of the building and from pictorial presentations on late Chunqiu and early Warring States bronzes. Much better evidence is from the Han. It can be seen that by Han times basic types of Chinese roof had already developed; the most common among them was a saddle-like roof.
