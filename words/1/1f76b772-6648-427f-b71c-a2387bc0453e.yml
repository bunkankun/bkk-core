definition: Qióng 窮 (ant. fù 富 "rich") refers to an extreme state of destitution, which may, however, be transitory, and the word may also refer not so much to poverty as such as marked lack of expected success, professional failure (ant. dá 達); and the word may also refer to persons without regular means of support such as widows and orphans.
