definition: Tāng 湯 emphasises the use of warm water, and standardly co-occurs with mù 沐 "wash one's body including one's hair", probably because the use of hot water was largely restricted to the washing of hair. Perhaps one should often interpret tāng 湯 adverbially as "with hot water" in this idiomatic connection. [GENERAL-USE], [SPECIFIC]
