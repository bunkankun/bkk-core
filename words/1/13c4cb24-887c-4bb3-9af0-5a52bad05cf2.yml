definition: Xiǎnyǔn 玁狁 was a powerful group of barbarians located somewhere in the area to the north of a royal domain in the Western Zhōu period. In the reign of king Xuān of Zhōu 周宣王 (828-782 B.C.), they attacked the central area of the Zhōu state in Shǎnxī (in 816 B.C., according to Shaughnessy), but were eventually defeated. The event is described in inscriptions on bronze vessels, and also in several poems in SHIJING. [JM]
