definition: 'Yuè 越 (also called Dà Yuè 大越, Yú Yuè 於越, Yuè粵, or Dà Yuè 大粵) (CHEN PAN 1969, 787-803) Clan: According to the Yuè shìjiā chapter of SHI, Yuè was ruled by the Sì 姒 clan. Rank: According to the Zhōu hierarchy, the rulers of Yuè were of zǐ 子 rank, and this designation is used in ZUO. As the rulers of the other non-Zhōu states, the rulers of Yuè designated themselves as wáng 王, and this title also appears in ZUO and in other texts. Founded: According to the Yuè shìjiā chapter of SHi, the first (legendary) mythical ruler of Yuè was the son of the Xià 夏 ruler Shǎo Kāng 少康. Wú Yuè chūnqiū calls him Wǔyú 無余. However, this is obviously mythical tradition, which has nothing to do with the real origins of the state. Destroyed: In 333 B.C. Yuè iwas decisively defeated by its large and powerful neighbour >Chǔ 楚 and fragmented into small states which were in 306 B.C. conquered by Chǔ. Location: Southern state located in modern Zhejiang province, noted for its many lakes and its constant conflicts with surrounding states of Chǔ 楚 and Wú 吳. According to the Yuè shìjiā chapter of SHi, the capital of Yuè was Guìjī 會稽, probably located in modern Shàoxìng 紹興 in Zhejiang. History: The first reliable mention of the state is in Zuozhuan for 601 B.C. Since 544 Yuè was in constant wars with its northern neighbour, the powerful state of >Wú 吳. In 473 B.C., the famous Yuè king >Gōujiàn 勾踐conquered Wú , and two years later he was enfeoffed as a leader of the feudal lords by the Zhou king. Later Yuè is rarely mentioned, but by the 4th century B.C. it was still a powerful state. In 333 B.C. Yuè was defeated by >Chǔ 楚 and fragmented into many small states which were eliminated in 306 B.C. Inhabitants of Yuè were conceived as southern barbarians by other Chinese states. According to the descriptions in the texts, people of Yuè had short hair and were tatooed. However, Yuè created quite developed culture, which was influenced by other Chinese states, but was quite distinct. Famous are particularly Yuè bronze vessels and swords.'
