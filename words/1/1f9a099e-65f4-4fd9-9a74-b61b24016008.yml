definition: Shè jì 社稷 "altars of the land and grain" is also the standard Chinese term for what we might call "the Nation" in modern English, because the essence of a state was seen to be contained in the local sacrifices undertaken at these altars of the land and grain. There is characteristic semantic oscillation between the meaning ALTAR and the meaning NATION. See NATION. [+FIGURATIVE], [SPECIFIC]
