definition: The most general term for a net is probably wǎng 网 (originally specifically a fishing net) and gǔ 罟 , (originally also specifically a fishing net). It seems that both terms referred originally not only to the fishing net, but to a net in general; already in bone inscriptions and then in SHIJING wǎng 网 is mentioned like a net used to catch animals.
