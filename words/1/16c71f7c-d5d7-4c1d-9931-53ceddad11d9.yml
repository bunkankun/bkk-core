definition: 'Jiǎo 絞 (maybe identical with Jiāo 交 of the inscriptions on the bronzes; also written as Jiǎo 佼) (CHEN PAN 1969, 477-480) Clan: Unknown. According to the Xìng xī and Lù shǐ Hòu jì, the rulers of Jiǎo were of Yǎn 偃 surname. Rank: Unknown. Founded: Unknown. Destroyed: After its defeat by Chǔ 楚 in 700 B.C. (Huan 12), Jiǎo does not appear in the CQ and ZUO. In an unknown period, it was annexed by Chǔ. Location: According to the Dìlì kǎo shí and other sources, the state of Jiǎo was located in modern Yún 溳 district, northern Hubei province. A town of the same name (mentioned in the ZUO under Ai 2 - 493 B.C.) existed in modern Shandong and belonged to the state of Zhū 邾. Jiāo 交 of the bronze inscriptions, which are found on the artifacts cast in the eastern states, was perhaps this Shandong Jiǎo 絞.'
