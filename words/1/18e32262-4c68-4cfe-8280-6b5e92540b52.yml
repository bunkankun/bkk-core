definition: 'Tán 譚 (also written as 覃 or 郯) (CHEN PAN 1969, 505-507) Clan: Unknown. According to the Lù shǐ Guó míng jì and Hòu jì, the rulers of Tán belonged to the Yíng 嬴 clan; on the contrary, Gu''s Chūnqiū dà shì biǎo states that they were of Zǐ 子 surname. Rank: Zǐ 子 (appears in the both CQ and ZUO in the entry for Zhuang 10). Founded: Unknown. Destroyed: In 684 B.C. (Zhuang 10) by Qí 齊. Location: According to the Du''s commentary, Tán was located in the area of modern Jìnán 濟南, Shandong province.'
