definition: Rén 仁 (ant. cán 殘 "cruel" and perhaps ant.* rěn 忍 "be callous, unfeeling") which refers to kind-heartedness and deep human sensibility as a constitutive feature of man as a moral being, is the standard word since Confucius. [ETHICAL], [HIGH-DEGREE]
