definition: Jiǎo 角 occurs rarely in the Eastern Zhou and Han texts, and it should refer to some kind of cup made originally of an animal horn or resembling it in a shape. Identification of this vessel remains uncertain, although there are horn-like vessels known from the Shang down to the Han. In archaeology, jiǎo 角 is used for the bronze wine tripod similar in a shape to jué 爵 but with two identical spouts on the opposite sides of an opening; this vessel was in use from the Shang down to the Western Zhou period.
