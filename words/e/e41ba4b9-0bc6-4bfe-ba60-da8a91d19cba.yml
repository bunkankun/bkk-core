definition: The general word is měi 美 "handsome and admirable" (ant. è 惡 "ugly") which refers to anything concrete or abstract which is attractive or handsome in a dignified way, and the word often retains its primary culinary sense of "tasty". [GENERAL], [GRADED]; [[COMMON]]
