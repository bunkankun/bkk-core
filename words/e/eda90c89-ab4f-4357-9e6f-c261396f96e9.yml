definition: The clearly dominant word referring to love is ài 愛 (ant. hèn 恨 "dislike"; rarely zēng 憎 "dislike"; and wù 惡 "hate"), and this word refers both to the feelings of love and to the expression of love in loving care for another person as well as in sexual relations. (Occasionally, the word may refer to the emotional preference that a small child feels for its parents. For this meaning see PREFER.)
