definition: The current general word for a bell of any kind is zhōng 鐘/鍾. When hung up singly, it is called tè zhōng 特鐘, with round opening as in illustration SUN JI. Rhythmic instrument. Also, hung up in a series of tuned bells, in two rows of eight bells each. Note that these bells were already rare by Han times. [In use mainly from the Western Zhou till the Warring States.
