definition: 'Shāng 商 (also called Yīn 殷) Clan: Zǐ 子. Rank: Wáng 王. Founded: The mythical story about the origin of the Shāng is described in the Yīn běnjì chapter of SJ and in the poem Xuán niǎo of the Shī jīng. According to these accounts, the first ancestor of the Shāng was Xiè 契, whose mother conceived when she swallowed an egg dropped by a black bird. SJ then records the names of the fourteen predynastic ancestors, and then thirty dynastic kings starting with Chéng Tāng 成湯, who was supposed to defeat the legendary Xià 夏 dynasty (according to the traditional dates, it should happen either in 1766 BC or about 1550 BC). The list of kings in SJ bassically matches the list of Shāng ancestors in the oracle bone inscriptions. Destroyed: In 1045 BC (according to the most reliable chronology) the Shāng was defeated and conquered by the Zhōu 周. Zhōu king then gave the former area of Shāng to Wǔ Gēng 武庚, the son of the last Shāng ruler. This later revolted and was defeated and killed. Location: There are different opinions concerning the former homeland of the Shāng people, the locations of which range from the southwestern Hebei, over the eastern Henan to the western Shandong. This question can be hardly answered. According to the Yīn bějì chapter of SHI, the Shāng capital shifted five times. The first capital of Chéng Tāng was called Bó 亳, then it shifted to Ao, then to Xiāng 相 and Xíng 邢, and eventually (under the king Pán Gēng 盤庚) to the last capital, called Yīn 殷, fromwhere the last twelve Shāng kings ruled. In Chinese traditional historiography as well as in the modern hstoriography and archaeology, there has been large discussion about the location of these capitals. It is quite accepted that the last capital was in modern Ānyáng 安陽, northeastern Henan, where the large late Shāng center dating at least from the period of the reign of the last nine Shāng kings was excavated. However, the name Yīn does not appear in the oracle bone inscriptions where the capital of Shāng is referred to as the Great (or Heavenly) city Shāng, Dà yì Shāng 大邑商 (it is even not certain whether this capital was identical with th Shāng city in Ānyáng). Some of the previous capitals are often (mainly by Chinese archaeologists) identified with some of the major sites of the Bronze Age, but this identification is far from being certain. Thus the first capital of Bó is identified either with the huge city excavated in Zhèngzhōu 鄭州 or with the even earlier site of Èrlǐtóu 二里頭 in the modern Yǎnshī 偃師 district, central Henan. Zhèngzhōu is sometimes also identified with the second capital of Ao. Note that just recenty, another large walled city (called by the archaeologists the Shāng city of Huánběi) was excavated just to the north of the Late Shāng settlement in Ānyáng. The city is later than the occupation of Zhèngzhōu, but antedates the Late Shāng occupation in Ānyáng. History: Besides the traditional accounts in the later texts (mainly the Yīn běnjì chapter of SJ), Shāng history is mainly known from the oracle bone inscriptions uncovered in Ānyáng and dating from the reign of the last nine Shāng kings (beginning with Wǔ Dīng 武丁; the inscriptions cover approximately the period 1200-1045 BC). As have been mentioned above, the list of the Shāng predynastic rulers and kings given in SJ is considerably in accordance with the lists of Shāng ancestors in the oracle bone inscriptions. In the later accounts, the Shāng state is said to grow to power when the king Chéng Tāng (called Dà Yǐ 大乙 in the inscriptions) defeated the last ruler of the rather legendary Xià dynasty. However, this tradition is not attested in the inscriptions. The first period of the existence of the Shāng state is often identified with the period of existence of the so-called Èrlǐgǎng 二里崗 culture (ca 16th-14th century BC), when the main centre of northern China was the walled city in Zhèngzhōu. Many characteristic features of the later Shāng culture developed at that period, mainly the large-scale production of bronze ritual vessels and weapons. On the basis of the archaeological investigations it seems that Zhèngzhōu was a centre of a quite centralized state controlling large areas spanning over the most of the area of central China and as far to the south as the middle reaches of the Chángjiāng 長江 River. After the end of the Èrlǐgāng period, it seems that there was some crisis leading to the fragmentation of the centralized control and to the diminishion of the territory under the Shāng control. The Shāng kings ruling from Ānyáng (the period ca between 1200-1045 BC; the archaeological culture of the period is called Yīnxū 殷墟) controlled much smaller area (basically northeastern Henan) and relied heavily on the very unstable system of political, ritual and kin alliances with smaller polities. In the beginning of the period, there was quite a large expansion under the King Wǔ Dīng, but later the Shāng lost some allies mainly in the area of western Shānxī. During that time, the Zhōu state in Shǎnxī province grew to the power, and in 1045 BC Zhōu defeated the last Shāng king Dì Xīn 帝辛 (or Zhòu 紂, who is depicted as a wicked and cruel despot in the later texts) and put an end to the existance of the Shāng state. Shāng culture was extremely important in the formation of the Chinese culture, as any basic elements of the latter emerged in the Shāng period (including the writing system).'
