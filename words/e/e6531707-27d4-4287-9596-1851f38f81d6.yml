definition: 'Xiāng 香 (ant. chòu 臭 "stinking") is orginally the scent of grain, and the meaning of the word was generalised to refer to any pleasant smell, especially also that of foodstuffs. NB: chòu 臭 is often neutral in classical Chinese and can refer to pleasant as well as unpleasant smells. However, there are cases where the word clearly describes something as evil-smelling and not only refers to what actually happens to be an evil smell.'
