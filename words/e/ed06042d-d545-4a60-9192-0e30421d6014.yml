definition: Bàng 謗 "vilify a person" (ant. chēng 稱 "praise") refers to public serious criticism, sometimes coming close to public abuse; increasingly, the word tended to refer to unjustified such accusations, i.e. slander, but the word is also used for justified serious criticism in public.
