definition: Xiāng 鄉 as an administrative term refers to a fairly non-urban neighbourhood area which will normally include several lǐ 里. ZHOULI and Han commentators arbitrarily define this as containing 12 500 families; when used informally, the term refers to a person's home or the vicinity where he lives, as in xiāng rén 鄉人.
