definition: Cháng 常 and the especially emphatic héng 恆 "highly constant and permanent" (ant.* ǒu 偶 "contingency and consequent changeability") emphasise the constancy or constant recurrence of the attributes of what is lasting, and typically - though not always - the constancy is valued positively.
