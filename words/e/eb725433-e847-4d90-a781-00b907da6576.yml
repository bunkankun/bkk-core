definition: Shī 師 refers generally to troops a military force on a campaign, not necessarily a complete army. ZUO Ding 4.1.6 commentators quantify an armed force as consisting of 2500 men, in one exceptional context. One often speaks of 三軍之師, never of 三師之軍. One asks for troops 請／乞師, and not for jūn 軍 which would be asking for the whole army of a friendly state. The troops of another state one uses are always shī 師 (e.g. 衛人以燕師伐鄭), one's own troops can be described as jūn 軍 or shī 師 almost indifferently. One offers food to the enemy shī 師, not to their jūn 軍. (HF 23.27:01) There are ruì shī 銳師 "crack troops" but no ruì jūn 銳軍 "crack army". Similarly, 楚師之良. The shī 師 may be said to hear about something 師聞之, not the jūn 軍. [GENERAL], [MOBILE], [PERSONIFIED!]
