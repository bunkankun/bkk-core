definition: Gōng 公 has many related meanings, but when following after the name of a state the word refers specifically to the ruler of an enfeoffed kingdom under the Son of Heaven who belongs to the royal lineage. After personal names, or used absolutely, the word may generally refer to to rulers of any rank and might be fastidiously translated as "his lordship".
