definition: The general term for weapons and the military political realm which dominates this semantic field is wǔ 武 (ant. wén 文 "civil affairs") which refers to any military force or weaponry of any kind, defensive or offensive, and the word is very often abstract in meaning, referring to the abstract matters of military policy.
