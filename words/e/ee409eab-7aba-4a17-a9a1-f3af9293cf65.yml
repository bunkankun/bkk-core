definition: Zé 幘 is rare in pre-Han times and refers to a piece of thin silk with which to stabilise the hair-bun which parts of which might hang down over the shoulders and down to the eyebrows. Above the zé 幘 one might, occasionally, wear a guān 冠 "hat".
