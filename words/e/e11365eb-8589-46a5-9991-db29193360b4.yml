definition: Gōng 躬 refers to doing something oneself demonstratively, and the word emphasises the moral responsibility of the agent for what he or she does rather than (like jǐ 己 "he himself, rather than someone else") laying any contrastive stress on the fact that the agent and not someone else engages in the action concerned.
