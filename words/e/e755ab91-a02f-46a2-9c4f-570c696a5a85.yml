definition: The current general term for all sorts of troubled states of mind, as well as reasons for such states of mind, is yōu 憂 (ant. xǐ 喜 "be well pleased" and lè 樂 "feel deep joy"), and this word may freely refer to troublesome matters of the present or of the future, and the word typiccally refers to a termporary state of hightened awareness of what is troublesome and concern about what should be done about it.
