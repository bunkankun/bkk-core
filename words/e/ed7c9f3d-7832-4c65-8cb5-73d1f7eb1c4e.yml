definition: Jīu 糾 according to SHUOWEN refers to the rope twisted of three strips. In fact, this explanation is doubtful, and it seems that while the word refers to the ropes generally, it particularly points to the fact that they are twisted of strips. The word is usually used like a verb "to twist, to weave together", sometimes in meaning to collect together.
