definition: The very current general word for reins is pèi 轡, and these are usually made of silk. [The word occurs often in SHIJING and in ZUOZHUAN. The term refers to the reins used to drive a chariot. In Chunqiu times chariot was usually pulled by four horses, so when one excludes two nà 軜 which were not held in the hands (see below), the driver held six reins in the hands. Reins were usually held by both hands, three in each.
