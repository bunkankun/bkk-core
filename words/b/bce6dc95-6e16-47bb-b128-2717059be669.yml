definition: 'Bēi 杯 in Warring States and Han times referred to a shallow oval bowl with two ears used for wine, soup, broth, etc.; it was made of lacquered wood, bronze, earthenware, jade, silver, and even glass. After HUANG (1995: 951 - 952), the term was in that period also used for the deep beaker on a foot to drink wine from, which is known from archaeological finds; in textual evidence, there is no firm proof of it, but as regards the shape of the vessel which could only be used for drinking, it is highly probable.'
