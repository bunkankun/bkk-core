definition: Probably most current and most ancient word for a mould is xíng 型. The term refers to moulds made of earthenware, which were in ancient China used to cast bronze artefacts, particularly vessels and bells. To cast a vessel or a bell, it was necessary to use several moulds joined together. After having finished casting, the moulds had to be broken to obtain an artefact; each bronze artefact was hence a unique piece. Whole process required very good coordination, and its mastering enabled production of bronzes in a large scale. Many finds of broken earthen moulds are known from bronze foundries dating from the Shang to the Han period. This method of casting was very typical for ancient China; note that lost wax method came to use in China only in the sixth century B.C. and it was probably adopted from the West. In Han times, earthen moulds were also used to cast iron. In that period, iron cast moulds which had not to be broken and thus enabled really mass production, also came to use. (Note that in the West iron was not cast before the fourteenth century.)
