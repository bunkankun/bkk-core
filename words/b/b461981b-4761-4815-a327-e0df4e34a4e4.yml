definition: Wèi 畏 is typically a stable state of reasoned fear, typically relating those who are in authority (the etymologically related wēi 威 on which relation there is much word-play in texts like ZUO), or ghosts etc, but the word also has extended generalised uses, as in wèi sǐ 畏死 "be afraid to die".
