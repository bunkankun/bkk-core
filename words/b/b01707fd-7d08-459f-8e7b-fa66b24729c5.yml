definition: The standard term for a dynasty is dài 代, but this term is not used to a person's contemporary dynasty in pre-Han times, and as far as I can see, it is rarely so used in Han times, although there is a clear example of Hàn dài 漢代 in HANSHU. Zhōu dài 周代 is not in the texts I have surveyed so far.
