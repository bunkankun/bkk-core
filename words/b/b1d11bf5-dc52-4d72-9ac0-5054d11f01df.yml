definition: 'Fú 服 refers to robes or formal dress. See COURT DRESS. The word refers to the specialized dress worn for various opportunities; mainly then to the formal court and ritual dress. The term refers not only to the cloth itself, but also to the various adornments belonging to it: [HUANG 1995: 713 - 714, 716 - 717]'
