definition: The notion of hospitality to strangers in need and to travellers passing through which is so important in ancient Greece is not as prominent in China as it was in Greece. The closest one can come is hòu 厚 "meet with polite respect and generous hospitality" (ant. báo 薄 "fail to treat with generous hospitality and proper respect").
