definition: Probably the most current term for money is qián 錢, but the word became current only in Han times. The word originally referred to the agricultural implement similar to or identical with bù 布 (see below). In the Warring States period, the term was together with bù 布 used for spade-like coins. Later, it began to refer to round money casted by the Qin dynasty, and in Han times it became a current general word for money.
