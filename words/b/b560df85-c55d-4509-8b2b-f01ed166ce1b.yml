definition: 'Láo 牢 is perhaps the most general term for a stable for any animals. [The word occurs already in oracle bone inscriptions where it most probably refers to the oxen or sheep raised in pens and then used for sacrifices. The character shows a cow or a sheep within rectangular pen or stable with narrow exit which is similar in shape to the stable known from Han models. [WANG 1993: 195; SUN 1991: 212; JGJWZD 1993: 60 - 61; ill.: SUN 1991: 53-2]'
