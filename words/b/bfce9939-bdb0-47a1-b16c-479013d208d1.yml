definition: 'The title héshàng 和尚 is attached to nearly all names of Chinese monks appearing in the introductory passage of each biographic entry. The term is originally a translation of skr. updhāya which refers to Buddhist teachers entitled to bestow the precepts on practicioners. According to SOOTHILL it is a general term for ''monk'' and the word originally derived from Khotan. In Japan the word has several pronunciations depending of the Buddhist school (Zen: oshoo, Tendai: kashoo, Shingon: washoo; see MULLER); in ZTJ héshàng is attached to the Buddhist name bestowed during the oridination ritual [CA]'
