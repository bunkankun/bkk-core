definition: Shé 蛇 (snake) was worshipped in ancient times. The supernational creature of the north, xuánwǔ 玄武 is depicted as a turtle with a snake, and creators of humankind, Fúxī 伏羲 and Nǚwā 女媧 have both snake tails.
