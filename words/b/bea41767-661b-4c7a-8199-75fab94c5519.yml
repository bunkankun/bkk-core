definition: The general term for the day as the time of human activity is 日(ant. 夜"nighttime, when there is no activity", and perhaps sometimes xì 夕"the time of day when the sun is declining and including the time when the sun has gone down but one has not yet gone to bed"). It was unclear in ancient times exactly when during the night one day ends and the next begins.
