definition: Dāo 刀 refers to the bronze knife-like coins. They came into use slightly later than bù 布 coins, and were cast particularly in the eastern states of Yan, Qi, but also Zhao. Some exemplars survived till the early Han dynasty; later, shape-like coins were revived for two years (7 - 9 A.D.) by Wang Mang. These knife-like coins from the end of the Western Han dynasty were called cuò dāo 錯 刀.
