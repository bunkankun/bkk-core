definition: Gōng or guāng 觥 in SHIJING obviously refers to the drinking cup made of the rhinoceros horn or shaped like it. Later, it can be used for a large cup. In archaeology, the term traditionally refers to the large animal-like shaped bronze vessel known from the Shang and Western Zhou periods; but this attribution is probably mistaken.
