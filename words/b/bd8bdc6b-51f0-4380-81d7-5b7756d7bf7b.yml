definition: Qiáng 羌 (or western Qiáng, Xī Qiáng 西羌) lived in the area of modern Gansu, Qinghai, western Sichuan, and northern Yunnan). They lived in a nomadic way of life. Their tribes were originally dominated by Xiōngnǔ 匈奴, but thereafter they came under the Hàn 漢 rule.
