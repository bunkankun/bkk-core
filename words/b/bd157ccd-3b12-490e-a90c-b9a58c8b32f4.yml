definition: The most general current word for a friend is yǒu 友 (ant. dí 敵 "enemy"), and the specific nuance indicated by this word is that of a commonality of feelings and interests, although it must be noted that the etymological link of the word is with the notion of "help", and in pre-SHI times the word tended to refer to cooperating associates rather than friends.
