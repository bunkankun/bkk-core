definition: Originally, it is said, there were only 25 surnames xìng 姓 established by the Son of Heaven. With time, the members of one of the original xìng 姓 gave different names shì 氏 to their sub-lineages so that shì 氏 came to refer to sub-lineages under a given xìng 姓. From late Warring States times onwards, xìng 姓 and shì 氏 came to be confused.
