definition: Táng 堂 is sometimes used to refer specifically to the (typically elevated) main hall at court, but the word is more common as the general term for "main hall". It seems that táng 堂 served mainly ceremonial and since the Warring States also political purposes. From Han times táng 堂 in its original meaning was replaced by diàn 殿.
