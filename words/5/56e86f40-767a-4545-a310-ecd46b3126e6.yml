definition: 'Guǎn 管 (also written as 關) (CHEN PAN 1969, 642-643) Clan: Jī 姬. Rank: Unknown. Founded: In the early Western Zhōu period by Guǎnshū Xiǎn 管叔鮮, the son of the Zhōu king Wén 周文王. Destroyed: Prior to the period recorded in the CQ. The area then belonged to the state of Huì 檜, and when it was conquered by Zhèng 鄭 (also prior to the period recorded in the CQ), it came under the control of the latter. Location: In the area of modern Zhèngzhōu 鄭州, central Henan. History: Guǎn played not an unimportant role in the early Western Zhōu history, as its first ruler Guǎnshū Xiǎn was one of the leaders of the revolt after the death of King Wǔ of Zhōu 周武王, which was supressed by the Dukes of Zhōu 周公 and Shào 召公.'
