definition: Bàn liǎng 半兩 refers to the round coin with a central square hole which was for the first time cast by the state of Qin in the late Warring States period and which was then in use till the second half of the second century B.C.. The coin should weight half of liǎng 兩 (i.e. 12 zhū 銖), and this weight was recorded in an inscription on the coin; hence the name. In fact, coins of this type known from Qin and early Han times are of very various height; in early Han times, most current were coins weighting four zhu 銖.
