  notes:
  - 復作是念。不由欲不善法得樂法。復作是念。頗有習無欲捨不善法得樂法耶。然我不由此自苦身得樂法。我今寧可食少飯O得充氣力耶。爾時菩薩。於異時食少飯O 。得充氣力。時菩薩食少食時五人各各厭捨而去。自相謂言。此瞿曇沙門狂惑失道。豈有真實道耶。時菩薩氣力已充。復詣尼連禪水側入水洗浴身已出水上岸。
