definition: Chù 黜, biǎn 貶 and zhé 謫 "banish from office (and remove to lower office)" (ant. zhuó 擢 "appoint to a higher position") are perhaps marginal in this group, but these common bureaucratic term describing the demotion of a person from his position and often his banishment from the court. See DEMOTE. [OFFICIAL]
