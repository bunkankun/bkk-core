definition: 'Méng tóng 艨 童 (舟+童)refers to a smaller battleship used to clash into the battleships of enemies. It has two boards, the lower for oarmen and higher for warriors; moreover it was covered with fresh oxen skins to defend firearrows of the enemies. In use since the Three Kingdoms. [HUANG 1995: 1348; ill.: LIU 1999: pp. 112, tab. 5]'
