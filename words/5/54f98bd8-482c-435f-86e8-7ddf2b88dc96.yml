definition: 'Zhōng 中 (ant. e.g. pàn 畔 "the margins"(!), cf. 江中 versus 江畔) typically refers to the centre of a domain and contrasts with the margins or what lies just outside that domain. There are degrees of zhōng 中: some things may be more central, closer to the core, than others. Note that 中國 does not contrast with 外國 but with ZHOULI 遠國 or occasionally jué guó 絕國. Ancient China did not recognise foreign "states".'
