definition: 'Wēn 溫 (also called Sū 蘇) (CHEN PAN 1969, 587-593) Ruling clan: Jǐ 己. Inscription on the Sū gōng guǐ 蘇公簋 mentions Wáng Jǐ 王己, the daughter of the Duke of Sū (Wēn). Rank: Zǐ 子 (common title of the rulers of Wēn in the CQ and ZUO). In the inscriptions on bronze vessels, rulers of Sū (Wēn) sometimes referred to themselves as gōng 公; it could have been in association with their high position in the Zhōu royal court. Founded: According to the Lì zhèng chapter of the Zhōu shū, the duke of Sū 蘇公 (who held a high position of Sī kòu 司寇, the minister of justice, in the Zhōu royal court) received his fief from King Wǔ of Zhōu 周武王. However, the state perhaps existed for a long time before it (see History). Destroyed: In the early Chunqiu period, the state was not already in existence. In 712 B.C. (Yin 11), the king of Zhōu gave twelve fields of Sū Fèn Shēng 蘇忿生 (including the city of Wēn) to the state of Zhèng 鄭. Later, the area again came under the royal control and the Sū lineage was reestablished in Wēn. In 650 B.C. (Xi 10), the state was destroyed by Dí 狄 barbarians. In 635 B.C., the city of Wēn was given by the Zhōu king to the Marquis Wén of Jìn 晉文公. However, in 617 B.C. (Wén 10), the ruler of Sū is mentioned again as participating in the meeting of the states held in Nǚlì 女栗. Location: In the modern Wēn 溫 district, Henan province (according to the Du''s commentary). History: According to the Shì běn and Guó yǔ (Zhèng yǔ), the state was established very early by the descendants of the mythical emperor Zhū Róng 祝融 (bearing Jǐ 己 surname) and later it was destroyed by Xià 夏. The Current Zhūshū jìnián states that in the 33rd year of reign of the Xià ruler Dì Fēn 帝芬, the descendant of Kūn Wú 昆吾 (bearing Jǐ 己 surname) was established as a ruler of Yǒu Sū 有蘇. Guó yǔ (Jìn yǔ) mentions that the last king of Shāng 商, Dì Xīn 帝辛 or Zhòu 紂, attacked Yǒu Sū, and the ruler of that state gave him his daughter Dá Jǐ 妲己 (which was in later texts blamed for being one of the main reasons of the destruction of Shāng) as a consort. In the beginning of the Western Zhōu period, King Wǔ of Zhōu 周武王 established his high official Duke of Sū as a ruler in Sū (Wēn). The rulers of Sū sometimes (usually?) held high positions in the Zhōu royal court; according to the Shì běn (quoted by Guǎng yùn), Chéng, the Duke of Sū 蘇成公, served in the Zhōu royal court during the reign of King Píng 周平王 (770-720 B.C.). Duke of Sū is also mentioned in the inscription on the Sū gōng guǐ. However, in 712 B.C., the state already did not exist (see section Destroyed).'
