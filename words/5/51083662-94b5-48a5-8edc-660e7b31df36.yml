definition: '1. Zhōu 州 (also written as 舟; also called Chúnyú 淳于) (CHEN PAN 1969, 411-416) Clan: Uncertain. According to the Xúnzǐ and Shì běn, the rulers of Zhōu belonged to the Jiāng 姜 clan. Rank: Gōng 公 (according to the ZUO and CQ, Huan 5). Founded: Unknown. According to the Lù shǐ Hòu jì, the state of Zhōu was founded in the Early Western Zhōu period, during the reign of King Wǔ of Zhōu 周武王. Destroyed: Unknown. According to the CQ and the ZUO, in 707 B.C. (Huan 5), the ruler of Zhōu fled to Cáo 曹. Later, the area was occupied by the state of Qǐ 杞. Location: According to the Du''s commentary to the ZUO, the state of Zhōu was located in the area of modern Ānqiū 安丘, Shandong province. Lù shǐ Guó míng jì has suggested that the state was located in the modern Gāomì 高密, also in the Shandong province. According to some of the traditional Chinese scholars (Zhào Péngfēi; Yáo Nài), the state of Zhōu belonged to the eastern royal domain in central Henan (for 712 B.C. - Yin 11 - it is mentioned in the ZUO that the Zhōu 周 king gave the fields of Zhōu to the state of Zhèng). It cannot be excluded that the state of Zhōu was originally located within the royal domain (this can also explain why its rulers had the title of the Duke); however, by the beginning of the Chunqiu period, the state was obviously in the Shandong area. History: Zhōu was a small and unimportant state mentioned only one time (in 707 B.C.; Huan 5) in the CQ and ZUO. It is rather mysterious that on this occasion, its ruler is designated gōng in both texts. Maybe the state of Zhōu was originally located within the royal domain (see Location), and its rulers held some high positions in the Zhōu 周 royal court. 2. Zhōu 州 (also written as 舟; do not confuse with the state of the same name located in the Shandong province) (CHEN PAN 1969, 481-483) Clan: Unknown. According to the Xìng xī, Lù shǐ Guó míng jì and Hòu jì, the rulers of Zhōu had Yǎn 偃 surname. Tōngzhì Shìzú lyè suggested that they were of Jiāng 姜 surname (this suggestion is based on the supposed relationship between the southern Zhōu and Shandong Zhōu). According to the record in the Shuō yuàn, Zhōu rulers belonged to the Jī 姬 clan. Rank: Unknown. Zhànguó cè (Chǔ cè) mentions the ruler of Zhōu as hóu 侯. However, the record refers to the person of the 3rd century B.C. who was a favorite of the Chǔ king, and possibly had nothing to do with the former Zhōu rulers. Founded: Unknown. Destroyed: Mentioned in the ZUO in the record for 701 B.C. Later (in an unknown period), it was conquered by Chǔ 楚. Location: According to the Chinese traditional historiography, Zhōu was located either in the area of the modern Zhōulíngchéng 州陵城, Jiānlì 監利 district, Hubei province, or in the modern Hónghú 洪湖 in the same province.'
