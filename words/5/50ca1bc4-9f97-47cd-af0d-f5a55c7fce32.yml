definition: Bǎi xìng 百姓 (ant. jūn zhǔ 君主 "ruler") typically refers to the registered senior families in a state who are under the control of the ruler and contribute taxes as well as military service to him; but from earliest times this term was occasionally used to refer generally to the populace at large.
