definition: Yìn 印 refers to the seals used by officials as a symbol of authority and also status in the bureaucratic hierarchy. The word began to be used in the Warring States period. Seals were worn tied to the waist (perhaps in a small sack; but there are also sealing fingerrings known from the Han period), were mostly of square shape, and material of which they were made expressed status of their holders. According to Han texts, the highest officials and aristocracy had golden seals, the lower silver, and minor officials had seals made of bronze.
