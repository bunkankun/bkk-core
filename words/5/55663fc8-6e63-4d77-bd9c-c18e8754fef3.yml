definition: The most general current word for a building of any kind is gōng 宮. Any gōng 宮 must have an outer wall other than the wall of the house. Moreover gōng 宮 may contain shì 室 and constitute a kind of traditional "clan condominium". After Qin times the word came to refer especially to palaces. In the Western Zhou and Chunqiu period gōng 宮 referred apparently both to the temples and living mansions of aristocracy During the Warring States, the word was mainly used for palaces of aristocracy and the ruler. Reference to the outer wall of the gōng 宮 is in the HAOLING chapter of the MOZI.
