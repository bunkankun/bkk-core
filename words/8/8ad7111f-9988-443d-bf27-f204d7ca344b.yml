definition: Fèn 忿 (ant. yuè 說／悅 "feel not the slightest anger but on the contrary feel pleased") refers to momentary and intense anger, and it does not typically focus on an show of emotion. There is a difference of degree between nù 怒 "show (often great) anger (怒甚, 大怒) and fèn 忿 "be momentarily angry" (there is no dà fèn 大忿, fèn shèn 忿甚). Nù 怒 forms vtS, whereas fèn 忿 does not have that function. [INTENSE], [MOMENTARY], [PERSONAL]
