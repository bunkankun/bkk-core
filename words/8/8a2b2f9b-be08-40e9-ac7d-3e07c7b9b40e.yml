definition: 'Chū 出 (NB: rù 入cannot be used as an antonym for this meaning.) refers to something that pre-exists emerging or moving from an initial state of hiddenness or non-obviousness to a state of manifest visibility (in analogy with the basic meaning of the word "to come out"). [SPECIFIC]'
