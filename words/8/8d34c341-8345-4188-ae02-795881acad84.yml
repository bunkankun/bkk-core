definition: 'Wǒ 我 is contrastive and emphatic by Warring States times (in OBI it was not yet in opposition to wú 吾 and was the standard unmarked pronoun during earlier stages of the language). The word freely occurs in subject, mofifying, and object position and often has an idiomatic meaning like "I for my part" and the formal slightly depersonalised "our party". NB: The word also serves as an impersonal pronoun meaning "one", German man, French on.'
