definition: 'Fán 樊 (also called Yáng Fán 陽樊) (CHEN PAN 1969, 548-555) Clan: Unknown. Several opinions concerning the ruling clan of Fán were offered by traditional Chinese historiography. According to the inscription on the stone tablet dating from the Hàn dynasty, the rulers of Fán belonged to the royal Jī 姬 clan; this view is also supported by Tōng zhì and Xìng zuǎn. On the contrary, Hàn shū states that the rulers of Fán were of a different surname from that of the Zhōu royal house, and Qián fū lún attributes to them Fán 樊 surname (which is otherwise unknown from the Chinese Antiquity). In the other place of the latter text, the rulers of Fán are said to be of Jiāng 姜 surname. According to the Lù shǐ Guó míng jì, the rulers of Fán were descendants of the Shāng dynasty. The most probable seems to be the opinion attributing to Fán the royal Jī surname. This is also supported by the record in the Jìn yǔ chapter of the Guó yǔ mentioning that the rulers of Fán were relatives of the Zhōu kings. It should be noted that in the inscription on the Fán jūn lì 樊君鬲, there is mentioned the women from the ruling house of Fán, which is called Shūnéng Mǐ 叔能羋; it suggest that there was also another state of the same name, the rulers of which were relatives of the ruling house of Chǔ 楚. Rank: According to the Máo shī Dà yá Zhēng mín zhuàn and to the Tōng zhì Shìzú lyè, the rulers of Fán possessed the hóu 侯 rank. ZUO (Zhao 22) mentions Fán Qīngzǐ 樊慶子, but in this case it is not certain whether the title points to one of the Five ranks; it seems that this person had no relation with the ancient state which was destroyed earlier (see Destroyed). Founded: In the traditional Chinese historiography, there is a general consensus that the founder of Fán was called Zhòng Shānfǔ 仲山甫/父. However, there are different opinions concerning his origin. Tōng zhì Shìzú lyè states that he was the descendant of Yúzhòng 虞仲 (the son of the pre-conquest Zhōu king Tài wáng 周太王) and served as a minister (qīngshì 卿士) in the court of Zhōu King Xuān 周宣王 (827-782 B.C.), from which he received his fief. On the other hand, Quán dé Yú jí suggests that this person served in the Zhōu royal court, but that he actually was the son of Lord Xiàn of Lǔ 魯獻公. Hán shū agrees that Zhòng Shānfǔ was a royal minister, but denies that he would have any kin relationship to the Zhōu royal house (what seems less probable; see Clan). Destroyed: In 635 B.C. (Xi 25), Zhōu king gave Fán to Jìn 晉, which then annexed it. Fán Qīngzǐ 樊慶子 mentioned in the ZUO in the entry for 520 B.C. (Zhao 22) had perhaps nothing to do with the former line of the Fán rulers; according to the Guǎng yùn and to the Shuǐ jīng zhù, at that time Fán was a fief of the descendants of the Zhōu king Jǐng 周景王 (544-520 B.C.). Location: According to the Du''s commentary, Tōng zhì Shìzú lyè, and to the Lù shǐ Guó míng jǐ, Fán was located in the modern Jǐyuán district 濟源, Henan province.'
