definition: 'Hè 褐refers to a rough garment made of kudzo vine in early times, but later also of hemp. Hè 褐 refers to the humble cloth worn by ordinary people, which is usually made of hemp, but also of animal hairs. The term partly overlaps with shù 裋, but refers more to the material then to the shape. [HUANG 1995: 748 - 750]'
