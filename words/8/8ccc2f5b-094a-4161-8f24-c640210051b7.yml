definition: 'Cài 蔡 (CHEN PAN 1969, 47-53) Rank: Hóu 侯 (used both in CQ and the ZUO). Clan: Jī 姬. Founded: By Shūdù 叔度, the son of King Wén of Zhōu 周文王. Destroyed: According to the Shǐ jì, Cài shìjiā, Cài was destroyed in 449 B.C. by Chǔ 楚. Location: Cài was located in the area of southeastern Henan. The first capital of the state (called Cài) was in the area of the modern Shàng Cài 上蔡 district, Henan province (according to the Hàn shū Dì lǐ zhì). Marquis Píng 蔡平侯 (529-522 B.C.) shifted the capital to Xīn Cài 新蔡 (modern Xīn Cài 蔡 district, Henan province) and later Duke Zhāo 蔡昭公 (518-491 B.C.) shifted it to Xià Cài 下蔡 (Zhōulái 州來; according to the Zuǒ zhuàn Dù jiě and Shì lì). History: After the death of King Wǔ of Zhōu 周武王 (ca. 1044 B.C.), Cài participated in the revolt against the regent government of Dukes of Zhōu 周公 and Shào 召公, but was defeated. Then, it was given as a fief to Hú 胡, the son of Shūdú, by King Chéng of Zhōu 成王. In the beginning of the Chunqiu period, Cài was a quite powerful state, but since 684 B.C. (Zhuang 10), it was repeatedly attacked by Chǔ and by 656 B.C., it already became a vassal state of Chǔ. Armies of Cài also participated on the side of Chǔ in the famous battle of Chéngpú 城濮 in 632 B.C. (Xi 28). In 531 B.C. (Zhào 11), King Líng of Chǔ 楚靈王 (540-529 B.C.) had killed Marquis Líng of Cài 蔡靈侯 (542-531 B.C.) and changed Cài into a district of Chǔ. However, two years later (in 529 B.C.), Cài was reestablished by Chǔ.'
