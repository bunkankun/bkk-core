definition: Yuàn 遠 (ant. jìn 近 "move close to") is a specific strategy of avoidance which is well within one's control and consists in keeping what is undesirable at a long distance from one, and lí 離 differs from yuàn 遠 in the degree of distance implied in the word. [DELIBERATE], [HIGH-DEGREE]
