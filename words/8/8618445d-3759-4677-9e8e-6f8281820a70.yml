definition: Xiāo xiāng 瀟湘is another name for the Xiāng shǔi 湘水. The name sometimes refers to the middle part of the Xiāng shǔi, where it meets with the Xiāo shǔi 瀟水. Mentioned already in the Shanhaijing.
