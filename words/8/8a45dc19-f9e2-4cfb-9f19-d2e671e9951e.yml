definition: 'Zhuānyú 顓臾 (CHEN PAN 1969, 638-639) Clan: Fēng 風. Rank: According to the Lún yǔ (Jì shì chapter), Zhuānyú was a vassal state of Lǔ 魯. Lù shǐ Guó míng jì attributes to its rulers zǐ 子 rank, but the source of this statement is unknown. Founded: According to the tradition, the rulers of Zhuānyú were descendants of the mythical emperor Tài Hào 太皞. Destroyed: The state is mentioned in the ZUO in the entry for 639 B.C. (Xi 21). By the time of Confucius, it was obviously still in an existence. Location: In the modern Bì 費 district, Shandong province.'
