definition: 'The umarked current first person pronoun most current by Warring States times is wú 吾. This word does not normally occur in object position and is highly idiomatic in a possessive pre-nominal position. Significantly, this pronoun can never be used emphatically or contrastively. NB: The word also serves as an impersonal pronoun meaning "one", German man, French on.'
