notes:
- type: general
  text: 'WANG TONGWEI NOTES: 林良寫的《序》：“同義詞是指意義相同和意義相近的詞語。”作者自己的《前言》：“同樣一件事情，一種東西，因為地方的不同，時代的不同，宗教的說法，民間的傳說，故事的編造，歷史的事實，以及文人等為求變化的創思，於是出現了許多不同的名稱，這就是‘同義詞’。”這段很好，是對同義詞的另類的定義。有錯誤，比如347頁“犬部”：“狗，古代稱體形大的為犬，小的為狗，現在用作‘犬’的通稱。”'
