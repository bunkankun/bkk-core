notes:
- type: general
  text: 'WANG TONGWEI NOTES: 《凡例》“本書是辨析古漢語同義詞的准工具書。”“全書收常用動詞形容詞781個。按意義相同、相近的原則分200條。”384頁《後記》“同義詞的研究有兩方面的工作，一是求同，依一定的標準確定同義詞；二是析異，通過一定的途徑區分彼此間的差異。前者是基礎，後者是重點。”385頁《後記》“用什麼方法解釋辨析？是本書編寫中遇到的又一難題。傳統的做法是把同義詞從本義到引申義、從語法功能到感情色彩一一加以比較對照。這樣雖較全面，但其不足也是顯而易見的：一是淺顯，許多結論不言而喻；二是繁瑣。本書力圖抓住語音這個語言的本質要素，從同源系統和引申系統的交叉中考察詞義，集中揭示詞義的本質特徵。”'
