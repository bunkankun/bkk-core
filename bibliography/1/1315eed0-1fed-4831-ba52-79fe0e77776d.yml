notes:
- type: general
  text: 'WANG TONGWEI NOTES: 《凡例》：“二、本書選收漢語詞語約7500個，分別列出各自的同義詞、反義詞，不做辨析。三、本書收詞以現代使用的詞語為主，酌收部分習見的成語。”《前言》：“同義詞（包括同義固定短語），是意義相同或相近的詞語，反映著事物、現象之間的相同或相近關係。根據意義的相同程度，人們一般又把同義詞分為等義詞和近義詞兩類。比如‘天河≈銀河、朝陽≈旭日、眼力≈目力’等，一般是同一事物的不同說法，是等義詞。近義詞，如‘豐富≈豐盛、風俗≈習俗、趕緊≈急忙’等，所指稱的事物相近或類似，大同小異。同義詞中近義詞占絕大多數，而等義詞數量較少。同義詞並不完全相同，詞的概念意義、感情和風格色彩、語法功能等等總有不同之處，就是所謂的等義詞，也不是意義完全相等的，比如前面提到過的，‘銀河’是科學定名，‘天河’是通常的說法，‘旭日、目力’比起‘朝陽、眼力’來，書面語色彩就比較強一些。⋯⋯同義詞間有表示的意義範圍大小、程度深淺、適用對象不同，又有感情色彩、文體色彩、風格色彩以及語法功能、詞語搭配等方面的區別。⋯⋯正確選擇使用同義詞，就能使語義表達得更加準確、精密。而有些同義詞並列連用，如‘歡欣鼓舞、驕傲自滿、專橫跋扈、輕鬆愉快’等等，有語義大同方面的重複，又有語義小異方面的補充，使語義表達得更為豐富深厚。”'
