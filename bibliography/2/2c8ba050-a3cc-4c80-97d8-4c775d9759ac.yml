notes:
- type: general
  text: 'WANG TONGWEI NOTES: 主要收錄“漢語中一些音義兩近的詞，如：溶化/融化”等，從意義角度進行辨析。其實從收詞來看，許多並不是同義詞。如第一條“一班、一斑、一般”就是這樣，作者這樣辨析：“一班，指一個班級或一群人。一斑，則特指豹身上的一個斑點，比喻在相類似的許多事物之中很小的一部分。只用在‘管中窺豹，可見一斑’這個成語裡。‘一般’的意思較多，1一樣。2普通。3一種。”'
