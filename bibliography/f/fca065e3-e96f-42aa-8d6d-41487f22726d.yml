notes:
- type: general
  text: 'WANG TONGWEI NOTES: 《編寫說明》中指明讀者對象和編寫目的：“本詞典由同義詞例釋和反義詞例釋兩個部分合編而成。主要目的是幫助中小學生從同義、反義的角度正確地辨析詞義，以便在閱讀和寫作中精當地理解或運用。此外，也可供語文教師、語文自學者和研究者參考。”收詞：“本詞典共收同義詞1200餘組”，收詞原則“同義詞和反義詞部分所受都是現代漢語中單個的詞，即語言中‘最小的、可以自由運用的單位’；均以詞性一致、字數相同為原則；不收語素、詞組、熟語和現代漢語中不常用的文言詞。”'
