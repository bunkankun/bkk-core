notes:
- type: general
  text: 'WANG TONGWEI NOTES: 《說明》（p1）：“近義詞和反義詞在漢語中是極為豐富的，它對於準確地表達人們的思想感情，增強語言的的表現力有很大的幫助。”P2《凡例》：“本詞典分近義詞和反義詞兩大部分，收錄了近義詞1500餘組，反義詞約900組。近義詞是指詞義大同小異的詞，反義詞是指詞義相反或相對的詞。⋯⋯一個詞在不同意義上分別跟不同的詞構成近義詞或反義詞時，分排在兩組。⋯⋯本詞典的辨析解說部分，近義詞是先指出每個詞的用法，然後指出他們在詞義、色彩或用法等方面的主要特點；反義詞則著重指出它們在詞性、詞義和用法上的區別。”'
