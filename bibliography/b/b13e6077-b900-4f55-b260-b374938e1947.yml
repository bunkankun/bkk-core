notes:
- type: general
  text: 'WANG TONGWEI NOTES: 《前言》P3：“嚴格意義下的同義詞，即詞類相同，意思、用法大同小異的一組詞，因為這類詞最易‘似是而非’。”《凡例》p1：“一、本詞典以啟迪實用為宗旨，以中小學語文教師、中學生、一般文字工作者、語文愛好者為對象。二、本詞典選收形容詞、動詞、成語、熟語、固定組合等1240條，所收詞條以現代漢語常見多用的為主，酌收一部分同義的文言詞語或方言詞語。'
