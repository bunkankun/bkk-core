notes:
- type: general
  text: 'WANG TONGWEI NOTES: 例如，48－49頁“足、腳”條：首先分別列出“足、腳”的常用義。“足”本義是1人體膝蓋以下的部分。2轉指腳。3支撐器物的腿兒或植物接近地面的主幹。“腳”本義是1小腿。2轉指腳。3物體的下端。其次，講同。1它們都可以指膝蓋以下的部分。古代有臏刑，挖掉膝蓋骨使小腿和腳失去作用。2由於詞義的發展，它們都可以指支撐身體接觸地面的部分。再次，辨異。“‘足’本指膝蓋以下所有部分，‘腳’本指脛（小腿）及膝蓋以下至踝的部分，範圍有所不同。”許多辨析還沒有走出同外之異的辨析。如279頁“追、逐”條，辨異中說：“1於追趕義，二者有細微區別：‘逐’多用於追趕獸，也用於追趕軍隊或人；‘追’常用於追趕軍隊或人，極少用於追趕獸，⋯⋯‘追’用於追趕動物，是罕見的。2‘逐’的競爭義、驅逐義，是‘追’所沒有的；‘追’的追溯義、補救義，也是‘逐’所不具有的。”587頁《後記》：“所謂同義詞，指的是古漢語中那些詞類相同、意義同中有異的近義詞。”'
