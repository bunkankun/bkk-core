- type: general
  text: The approximately 300 poems attributed to Hánshān are an important source for Táng vernaculars; for translations see IRIYA 1958 (into Japanese) with many annotations on the usage of vernacular elements; RED PINE 1983; SNYDER 1966, STALBERG ROBERTA 1977; WALEY 1954; WATSON 1962; HENRICKS 1990; for a serious criticism of Hernrick's translation and an interesting general discussion on the translation of vernacular texts see MAIR 1992.
