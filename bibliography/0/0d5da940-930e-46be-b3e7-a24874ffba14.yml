notes:
- type: general
  text: 'WANG TONGWEI NOTES: 為了滿足寫作或翻譯時用詞的準確貼切而編寫，“收詞語約一萬七千餘條，其中包括成語、熟語、諺語、俗語、詞組及詩詞名句。以詞義為歸共劃分為一千多個同義近義或同類詞群。（p6凡例）”特點在於“為便於讀者加深對詞義的理解，避免數典忘祖，本書對所收詞語除釋義、解詞外，力求追本溯源，博採書證。（p6凡例）”沒有對同義詞進行界定。'
