notes:
- type: general
  text: 'WANG TONGWEI NOTES: 前言部分《同義詞辨析概述》“語言詞匯中意義相同或相近的一組詞叫同義詞。同義詞與反義詞相對，它又可分為等義詞和近義詞兩種類型。等義詞是指意義完全相同的詞；近義詞是指意義有細微差異的詞。”'
