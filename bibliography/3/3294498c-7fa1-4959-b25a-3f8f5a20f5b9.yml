notes:
- type: general
  text: 'WANG TONGWEI NOTES: 《前言》：“是一步寫作詞典，它按照同義類原則，將詞語分成類聚，並對詞語進行解釋和辨析，⋯⋯全書共收常用而且類聚內詞條較多的類聚四百四十個，詞語一萬四千餘條。”主要進行類聚詞義的工作，然後將類聚的詞分別解釋，各詞的辨析較少。'
