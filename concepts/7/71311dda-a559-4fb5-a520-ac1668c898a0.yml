type: concept
concept: BOOK
zh: 書
definition: BIG DOCUMENT CONTAINING MANY CHAPTERS.
criteria:
- type: old-chinese-criteria
  text: When exactly does [[書]] come to designate a book rather than any document. It is not obvious how one could determine this with any precision.
- type: huang-jingui
  text: 'HUANG JINGUI 2006


    EDUCATION 2.


    編，本指用繩串編起來的整部書籍；指其中一部分，側重在對已有目錄的重新編排，但數量無定。


    卷，本指卷曲起來的整部書籍，即帛書；指其中一部分，多表示書籍的冊和本。


    篇，本指寫在竹簡上的較短書籍，後世多用於完整的詩文；指其中一部分，是最小的一個獨立篇章。'
- type: modern-chinese-criteria
  text: '書籍


