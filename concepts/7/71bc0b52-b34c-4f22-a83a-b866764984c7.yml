zh: 角落
definition: PLACE where EDGES OR SIDES of something MEET.
criteria:
- type: old-chinese-criteria
  text: '1. The current general word for a corner in anything is yú [[隅]], but the word very often refers specifically to corners in buildings or man-made structures of any kind. The word often refers to the corner of the wall, usually raised above the level of the wall and with building on it. [SUN 1991: 196]


    2. Zōu [[陬]] primarily refers to corners that are naturally produced, but by extension also to man-made corners.'
- type: modern-chinese-criteria
  text: '角落


    角


    隅


    旮旯兒 (coll)


    背旮旯兒 (coll)


    陬


