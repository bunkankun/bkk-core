zh: 毒品
och: 毒
definition: SUBSTANCE which CAN INTENSELY HARM HUMANS OR ANIMALS.
criteria:
- type: old-chinese-criteria
  text: '1. The current general word for poison is dú [[毒]].


    2. Zhèn [[酖]] refers specifically to wine poisoned with poison won from the zhèn [[鴆]] bird.


    3. Yào [[藥]] "medicine" is sometimes used to refer to poison.'
