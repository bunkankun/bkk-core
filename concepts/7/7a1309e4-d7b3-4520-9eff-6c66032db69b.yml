definition: SECRET IN-RELATION-TO ALL OFFICIALS AND PERRSONAL.
criteria:
- type: old-chinese-criteria
  text: 1. The dominant current word for privacy is sī [[私]] (ant. gōng [[公]] "public"), and the word designates everything that falls outside the responsibility of public administration. Contrast SELFISH, which is a common related category of thought in ancient China, and the differentiation between the two is by no means always clear.
- type: modern-chinese-criteria
  text: '私人 is a current adjective referring to privacy.


    隱私


    陰私


    陰事


    私事


