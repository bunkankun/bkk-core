concept: DEAF
alt_labels:
- HEARING IMPAIRED
- HARD OF HEARING
- INFORMAL DEAF AS A POST
zh: 聾
definition: LACK the ABILITY to HEAR.
criteria:
- type: old-chinese-criteria
  text: '1. The general word for deafness of any kind, congenital or not, is lóng [[聾]] (ant. tīng [[聽]] "able to hear").


    2. Kuì [[聵]] refers to congenital deafness of any kind, but the word is very rare.'
- type: huang-jingui
  text: 'HUANG JINGUI 2006


    BODY 22.


    聾，通稱，凡耳朵聽不見或聽不清聲音都稱作聾。


    聵，耳重聽。


    聳，雙耳聾。


    ?? ，半聾。


    ?? ，全聾。


    背，近代口語用詞，表示聽覺不靈。


    耾，耳鳴。'
- type: modern-chinese-criteria
  text: '聾


