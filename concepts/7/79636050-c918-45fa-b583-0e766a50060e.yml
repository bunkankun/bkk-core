definition: PLACE CONTAINING MANY SHOPS that are MUTUALLY CLOSE.
criteria:
- type: old-chinese-criteria
  text: '1. The current general term for a market is shì [[市]].


    2. Chán [[廛]] refers to a small market town in the countryside, typically inhabited by humble people without the presence of a distinguished household dominating the place.'
- type: huang-jingui
  text: 'HUANG JINGUI 2006


    TRADE 1.


    市，市場。


    肆，攤點商店的通稱。


    列，漢代眾多的攤點店鋪的泛稱。


    廛，店鋪或城中市場的泛稱。店，中古以來出賣商品的設施，并漸成商店的通稱，口語詞。


    鋪，中古以來規模較小的商店。


    墟，唐代以來南方農村的臨時集市。集，唐代以來北方農村集市。


    壚，漢代以來酒店的專稱。'
- type: modern-chinese-criteria
  text: '市場


