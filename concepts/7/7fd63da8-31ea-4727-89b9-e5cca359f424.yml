type: concept
concept: WINDOW
zh: 窗戶
och: 牖
definition: HOLE IN a WALL, TYPICALLY with a TIMBER FRAME, COVERED USING GLASS, USED FOR LOOKING OUT OR LETTING IN LIGHT OR AIR.
criteria:
- type: old-chinese-criteria
  text: '1. The current general word for a window is yǒu [[牖]], but the word typically refers to a window in the side wall of a building.


    2. Chuāng [[窗]] refers to a window in the roof, but at later stages comes to replace yǒu [[牖]] as the standard general word for any window.


    3. Xiàng [[向]] / [[鄉]] is a rare word referring to small windows facing north.'
- type: huang-jingui
  text: 'HUANG JINGUI 2006


    ARCHITECTURE 16.


    窗，本指天窗，後泛指開在牆壁上用以透光通風的洞口，宋以前是直欞壁窗，後才有開合壁窗，是口語中各種窗的總稱。


    牖，內壁窗，開在內室之南牆、戶之西，後來亦泛指開在牆壁上的窗戶。


    向，專稱外牆朝北的窗戶，後泛指窗戶。'
- type: modern-chinese-criteria
