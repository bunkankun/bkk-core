concept: PRISON VEHICLE
zh: 囚車
och: 囚車
definition: A VEHICLE used to TRANSPORT PRISONERS.
criteria:
- type: old-chinese-criteria
  text: '1. The current general word for a prison cart is qiú chē [[囚車]].


    2. Jiàn [[轞]] / [[檻]] is the rare but specific word to use.


    3. Xiá [[柙]] refers to the cage in which the prisoner was placed for transport, the cage being placed, in turn, on a cart.'
- type: modern-chinese-criteria
  text: '檻車


