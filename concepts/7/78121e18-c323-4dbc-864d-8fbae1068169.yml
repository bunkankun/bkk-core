type: concept
concept: FOX
zh: 狐貍
definition: RED BEAST which EATS MEAT, HAS FOUR LEGS AND a SHARP MOUTH. [VULPES]
criteria:
- type: old-chinese-criteria
  text: '1. The general word for a fox is hú [[狐]].


    2. Lí [[狸]] refers to a wild-cat or badger of some sort but is often linked to the fox in ancient Chinese literature. See FELINE'
- type: huang-jingui
  text: 'HUANG JINGUI 2006


    ANIMALS 11.


    狸，早期之稱。


    貓狸，中古以後之稱。


    狸貓，近古之稱。


    貔狸，菲貓，指旱獺，嚙齒目的一種大型地棲松鼠。'
- type: modern-chinese-criteria
  text: '狐


    狐狸


