type: concept
concept: HAIRSTYLE
zh: 髮式
definition: METHOD of FIXING HAIR and HEADGEAR.
criteria:
- type: old-chinese-criteria
  text: '1. There is no general word for "hairstyle". What we list are therefore the most common hairstyles.


    2. Jié [[髻]]／[[結]]／[[紒]] refers to the traditional snail-shape hair-bun.


    3. Máo [[髦]] refers to an uncut tuft of hair, as typically worn by children.


    4. Huán [[鬟]] refers to a hairstyle where the hair forms a stable ring or rings on the head. See HUANG illustrations.


    5. Guàn [[丱]] refers to two tufts of hair as worn by children.'
- type: huang-jingui
  text: 'HUANG JINGUI 2006


    HUMAN BODY 31.


    髮，人頭髮的通稱。


    毛，主要指動物的毛；指人的頭髮，主要用於白髮、禿髮。


    鬢，臉旁靠近耳朵的頭髮。


    鬊，人梳髮時落下的亂髮，兼指頭上的亂髮。


    髾，髻後下垂的頭髮梢。


    HUMAN BODY 40.


    角，古代未成年人在頭頂兩側綰束成像牛角一樣的髮式。


    丱，從丱形而稱男孩角式髮型。


    羈，特指女童綰束頭髮的髮式。


    髦，本是古代未成年男女剪髮後留下的沒有綰束的自然下垂的頭髮，又指古代成年人頭髮下垂至眉的一種髮飾。


    鬌，特指小兒三個月時剪髮所留的頭髮。


    髫，漢代起表示兒童下垂的頭髮，不限樣式。'
- type: modern-chinese-criteria
