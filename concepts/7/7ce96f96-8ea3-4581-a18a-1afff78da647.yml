criteria:
- type: huang-jingui
  text: 'HUANG JINGUI 2006


    FOOD 50. 燒烤法。


    炙，將獸肉掛於支架離火熏烤。


    燔，將獸肉直接在火中燒烤。


    炮，將小動物裹泥帶毛在火中燒烤。


    灼，用火炭之類燒燙。


    煨，在熱灰中烘烤食物，行於中古後。


    FOOD 52. 乾煎法。


    煎，南北朝前指通過加熱將帶汁液的食物煮乾，也可以加油炸、煎食物；南北朝起指久煮使湯汁變稠，對象是茶、藥、羹、粥之類。


    熬，唐代前指通過文火長時間炒，對象是穀類；唐代起指文火煮食物，使汁液濃稠，即是今之熬。


    炒，將食物在鍋中加熱翻動使之乾熟。


    烙，將食物緊貼在熱的金屬器物上乾烤。


    焙，唐代後文火烘烤，用於茶、藥等。'
