uuid: 7b951f9a-7b82-42db-8a23-5bcfc0c2a94e
type: concept
concept: TEARS
zh: 淚
definition: BODY JUICE in the form of SALTY WATER TYPICALLY ISSUING from the EYES WHEN one FEELS INTENSE GRIEF OR SADNESS.
criteria:
- type: old-chinese-criteria
  text: '1. The current general word for tears is qì [[泣]].


    2. Lèi [[淚]] is a general word for tears, but probably not as common as qì [[泣]].


    3. Tì [[涕]] refers to tears (possibly mixed with snivel from the nose, the latter meaning becoming prominent at later stages of the language).


    4. Yí [[洟]] and sì [[泗]] are rare words referring to tears in early times, and to snivel or mucus from the nose in later times.'
- type: huang-jingui
  text: 'HUANG JINGUI 2006


    BODY 41.


    涕，眼淚，有文言色彩。


    淚，眼淚，後起口語詞。


    泣，偏重於很多的淚水。'
- type: modern-chinese-criteria
  text: '眼淚


    淚液


    淚水


    淚珠


    淚花


    淚


    涕


    rough draft to BEGIN TO identify synonym group members for analysis, based on CL etc. 18.11.2003. CH ／'
