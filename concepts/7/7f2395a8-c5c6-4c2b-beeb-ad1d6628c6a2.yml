type: concept
concept: CARRIAGE BOX
zh: 車箱
definition: The VEHICLE PART which serves as container for what is being transported in vehicles, and its constituent parts.
criteria:
- type: old-chinese-criteria
  text: '1. The general word for the compartment in which persons or goods are transported is yú [[輿]], but the word can also refer specifically to that part of the carriage in which persons are transported.


    2. Xiāng [[箱]] is the general word for the box in which goods are placed on a carriage.


    3. Shì [[軾]] refers specifically to the board at the front of a carriage box on which one may lean and across which one will bow politely.


    4. Zhěn [[軫]] refers to the back bord on carriage box in a carriage.'
- type: huang-jingui
  text: 'HUANG JINGUI 2006


    COMM 12.


    輿，供人乘坐的車箱，又可指整個車箱。


    輿下有一當兔、二伏兔，即 “ 轐 ” 、 “ 輹 ” ，使輿穩置於軸、轅之上。


    輿可代稱車。


    箱，大車箱，主要用來載物，後偶可指供人乘坐的較大的車輿。'
- type: modern-chinese-criteria
  text: '車箱


