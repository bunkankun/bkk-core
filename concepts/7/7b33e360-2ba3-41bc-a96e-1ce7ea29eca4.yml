zh: 並列
och: 耦
definition: PUT things TOGETHER so as to PRODUCE a ROW.
criteria:
- type: old-chinese-criteria
  text: '1. Liè [[列]] is to bring together and then bring in line objects or people that naturally belong together.


    2. Zǔ [[詛]] focusses on the intensity not of the commitment but of the swearing of the oath and the use of words.


    3. O ㄆ[[耦]] refers to alligned pairs.


    4. Bìng [[並]] (and occasionally bìng [[并]] ), refer to alligning or putting side by side any number of objects.'
- type: modern-chinese-criteria
  text: '排列 is the current modern word for juxtaposing or lining up things.


    平列 focusses on the evenness of the alignment.


    排


    列


    rough draft to BEGIN TO identify synonym group members for analysis, based on CL etc. 18.11.2003. CH ／'
