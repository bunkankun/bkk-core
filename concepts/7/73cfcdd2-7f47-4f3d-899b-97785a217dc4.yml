concept: EARTH BASKET
zh: 盛土具
och: 籠
definition: BASKET FOR CARRYING SOIL.
criteria:
- type: old-chinese-criteria
  text: '1. The most current word for a basket designed to transport soil is lóng [[籠]].


    2. Kuì [[簣]] refers to an uncovered round bamboo basket for carrying earth.


    3. Běn [[畚]] refers to a small straw basket for carrying earth.'
