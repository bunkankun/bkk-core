concept: WRITING TOOL
zh: 書寫具
och: 筆
definition: TOOL USED FOR WRITING.
criteria:
- type: old-chinese-criteria
  text: '1. The current general word is bǐ [[筆]]. This is often produced with wolves'' hair and with hare''s hair. See BRUSH.


    2. Háo [[毫]] is a late poetic word that can be used to refer to a brush.


    3. Xué [[削]] refers to a small knife used for erasing writing.


    4. Dāo'
- type: modern-chinese-criteria
  text: '毛筆


    鋼筆


    鋼筆


    自來水筆


    金筆


    水筆 refers to a stiff-haired writing brush.


    rough draft to BEGIN TO identify synonym group members for analysis, based on CL etc. 18.11.2003. CH ／'
