zh: 樹枝
och: 枝
definition: PART of TREE that GROWS on the TRUNK.
criteria:
- type: old-chinese-criteria
  text: '1. The standard word for any kind of branch, large or small, is zhī [[枝]] (ant. gàn [[幹]] "trunk"), a word etymologically related to zhī [[肢]] "limb".


    2. Méi [[枚]] and kē [[柯]] refer to non-main branches on a tree.


    3. Tiáo [[條]] refers to a small twig.'
