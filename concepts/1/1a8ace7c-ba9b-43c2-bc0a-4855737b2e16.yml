definition: VERTEBRATE WITH COLD BLOOD.
criteria:
- type: huang-jingui
  text: 'HUANG JINGUI 2006


    ANIMALS 13. SALAMANDER 蠑螈是兩棲動物，生活在水澤中。


    蜥蜴、蝘蜓、守宮都是陸生爬行動物，俗稱四腳蛇：


    蜥蜴，也生活在水澤間；


    守宮，壁虎，守在宮（房屋）內，捕食蚊蠅；


    蝘蜓是守宮別名, 又指比守宮大的野外蜥蜴。'
