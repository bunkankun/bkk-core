zh: 疼痛
och: 痛
definition: DISTRESS CAUSED by a BAD SITUATION in one's BODY.
criteria:
- type: old-chinese-criteria
  text: '1. The clearly dominant general word for physical pain is tòng [[痛]] (ant. shū [[舒]] "feel well" and wú yàng [[無恙]] "fail nothing").


    NB: Curiously, it is hard to think of other common words for pain. Téng [[疼]] is post-Buddhist.'
- type: modern-chinese-criteria
  text: '疼痛 is probably the most general and abstract modern word for any kind of pain.


    苦痛


    痛苦


    傷痛


    苦楚


    痛楚


    酸楚


    苦處


    痛處


    苦頭


    苦難


    苦水


    苦


    切膚之痛


    rough draft to BEGIN TO identify synonym group members for analysis, based on CL etc. 18.11.2003. CH ／'
