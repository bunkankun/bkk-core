zh: 便宜
definition: PRICE MORE SMALL THAN IMAGINED.
criteria:
- type: old-chinese-criteria
  text: '1. The dominant word is jiàn [[賤]] (ant. guì [[貴]] "expensive"), which describes something as low in quality and therefore also in price.


    2. Qīng [[輕]] (ant. zhòng [[重]] "expensive") is an economic technical term for something being low in price.'
- type: modern-chinese-criteria
  text: '便宜


    賤


    廉


    低廉


    廉價


    賤貿


    公道 can refer to a reasonable or fair price.


    惠而不費


    所費小小


    rough draft to BEGIN TO identify synonym group members for analysis, based on CL etc. 18.11.2003. CH ／'
