zh: 徭役
och: 役
definition: 'ADULT EMPLOYED by the GOVERNMENT OR by ENTREPRENEURS to WORK FOR them.


  [[ARBEITER]]'
criteria:
- type: old-chinese-criteria
  text: '1. The general term for a corvee labourer or a conscript soldier of any kind is yì [[役]].


    2. Yáo [[徭]] refers unambiguously to a corvee labourer and focusses prototypically on the fact that he is sent to a distant place.


    3. Shù [[戍]] refers specifically to a conscript soldier sent out to guard the borders.'
- type: modern-chinese-criteria
