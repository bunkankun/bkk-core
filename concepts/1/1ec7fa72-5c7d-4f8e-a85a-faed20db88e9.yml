zh: 見證人
och: 證
definition: 'HUMAN SUMMONED in LAW COURT TO EXPLAIN what s/he KNOWS that is IMPORTANT to LITIGATION.


  HUMAN WHO is BELIEVED TO KNOW IMPORTANT THINGS THAT are NEEDED in LITIGATION OR DISCUSSION.'
criteria:
- type: old-chinese-criteria
  text: '1. The current general word for bearing witness to something or against something is zhèng [[證]].


    2. Zuǒ [[左]] is occasionally used to refer to a witness for or against something.'
