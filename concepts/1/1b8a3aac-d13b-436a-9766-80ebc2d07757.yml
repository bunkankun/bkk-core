zh: 兒子
definition: MALE CHILD.
criteria:
- type: old-chinese-criteria
  text: 1. The current way of referring to a son is by the word zǐ [[子]] "child" which regularly denotes a son. See CHILD.
- type: huang-jingui
  text: 'HUANG JINGUI 2006


    HUMAN AFFAIRS 18.


    兒子。


    子，通稱，構詞能力強。


    兒，常用於稱呼年幼或自己的兒子。


    男，常用於敘稱。


    息，常用於謙稱自己的兒子。


    孫，兒子的兒子。


    ELDEST SON 19. 嫡長子。


    嫡，通稱。


    嗣，本義為繼承君位，代指承位的嫡長子。


    宗，本指宗廟，代指大宗的嫡長子。


    陰童，夭亡的大宗嫡長子。


    NON-HEIR SON 20. 庶子。


    庶，妾子，有時包括嫡長子以外的嫡子，通稱。


    孽，大宗嫡長子以外的嫡子及妾子。


    支（枝），大宗嫡長子以外的眾子，喻稱，少獨用。


    陽童，夭亡的大宗嫡長子之外的庶子。'
