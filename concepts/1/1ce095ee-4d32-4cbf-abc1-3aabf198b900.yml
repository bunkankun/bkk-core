concept: BUTTOCKS
alt_labels:
- ANUS
zh: 臀部
definition: LOWEST BACK PART of the TRUNK of HUMANS.
criteria:
- type: old-chinese-criteria
  text: '1. The general word for the rump is kāo [[尻]] which is said by DUAN YUCAI to refer to the anus gōu zǐ [[溝子]], but some examples clearly suggest otherwise.


    2. Tún [[臀]] is rare and archaic and the focus is on the buttocks, especially as an object of whipping (HANSHU).'
