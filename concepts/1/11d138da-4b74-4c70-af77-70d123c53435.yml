zh: 濃密
definition: CONTAINING MANY SUBSTANCES OR THINGS CLOSE TOGETHER.
criteria:
- type: old-chinese-criteria
  text: '1. Nóng [[濃]] (ant. xī [[稀]] "thin (as of broth)") refers generally to the thickness of liquids and of substances.


    2. Nóng [[醲]] (ant. báo [[薄]] "thin (as of wine)"), a writing variant of the preceding, is used specifically for the thickness and undiluted character of liquor or wine.'
