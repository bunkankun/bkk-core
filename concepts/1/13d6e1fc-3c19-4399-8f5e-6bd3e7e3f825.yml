type: concept
concept: MOON
zh: 月亮
och: 月
definition: STAR INTENSELY NEAR TO, AND MOVING ROUND, the EARTH.
criteria:
- type: old-chinese-criteria
  text: '1. The current word for the moon is yuè [[月]].


    2. Wàng [[望]] refers to the full moon.


    3. Xián [[弦]] refers to the half full moon.


    The early terminology of the phases of the moon are a highly controversial subject. See MONTH'
- type: huang-jingui
  text: 'HUANG JINGUI 2006


    ASTRONOMY 2.


    月，產生時代最早，從古至今最為常用，通稱。


    陰，受陰陽觀念影響而產生，與 “ 陽 ” 指 “ 太陽 ” 伴生，較少使用。


    娥、蟾、兔，指 “ 月亮 ” 都與古代神話傳說有關。


    魄，指 “ 月亮 ” 源於古人的 “ 魂魄 ” 觀念，書面色彩較濃。'
- type: modern-chinese-criteria
  text: '月亮


