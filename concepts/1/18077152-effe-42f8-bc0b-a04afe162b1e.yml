zh: 斑駁
definition: MIXED in COLOURS in DIFFERENT PARTS.
criteria:
- type: old-chinese-criteria
  text: '1. Bān [[斑]] can be used to describe anything as being of more than one colour.


    2. Bó [[駁]] (ant. chún [[純]] "pure") refers to distinct variety in colour as a positive feature. But see also MIXED.'
- type: modern-chinese-criteria
  text: '斑駁 is the currrent modern word for something motley or variegated.


