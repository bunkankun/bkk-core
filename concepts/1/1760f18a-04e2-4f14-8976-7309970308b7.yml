concept: VEGETABLES
zh: 綠菜
definition: PLANTS THE LEAVES of which are USED FOR FOOD.
criteria:
- type: old-chinese-criteria
  text: Huang
- type: huang-jingui
  text: 'HUANG JINGUI 2006


    FOOD 35.


    菜，本為可食野菜總稱，秦以後是蔬菜和可食野菜總稱。


    蔬，漢代起作人工培植的蔬菜總稱。


    蔌，熟的佐食蔬菜總稱。


    素，上古已可指蔬菜。南北朝前的 “ 素食 ” 用法多種，其一是喪制的食蔬菜，斷魚肉。南北朝起，形成後世的 “ 素食 ” ，並列為菜餚之一門。


    FOOD 36. 常食蔬菜有五種。


    葵，久食久種不衰。


    藿，豆嫩葉。 “ 葵藿 ” 常連用，示蔬菜、野菜等義。


    藜，又稱 “ 菜 ” ，野草。藿，與之連用表賤人、賤物、賤食。


    韭、薤、蔥，葷辛類的三種蔬菜：


    韭，葉細長而扁，一年可割三四次；


    薤，葉似韭，有劍脊，中空似細蔥，根如小蒜；


    蔥，葉中空，淺青色。'
