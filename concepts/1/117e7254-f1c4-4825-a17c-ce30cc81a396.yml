zh: 設防
definition: BUILD CITY WALLS FOR DEFENDING a PLACE.
criteria:
- type: old-chinese-criteria
  text: '1. The standard general word for fortifying a place by building a city wall is chéng [[城]].


    2. Zhù [[築]] refers to the building or reinforcing of city walls.'
- type: modern-chinese-criteria
  text: '設防


    布防


    鞏固


    固


    加強 refers to strengthening something, not necessarily for defensive purposes, and the word is marginal in the group.


    first rough draft to identify synonym group members for future analysis, based on CL. 18.11.2003. CH'
