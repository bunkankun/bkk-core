type: concept
concept: BLUE
zh: 藍
definition: 'COLOUR of the SKY AND the DEEP SEA.


  COLOUR of the CLEAR SKY AND the DEEP SEA.'
criteria:
- type: old-chinese-criteria
  text: 1. Qīng [[青]] "steely dark bluish" is perhaps the most current word for dark blue, but this word covers a wider spectrum including dark greenish and even dark greyish. The common feature is the steely shine. 2. Cāng [[蒼]] refers to the blue colour, prototypically to the bright blue colour like that of the sky. [GENERAL] 3. Lán [[藍]] is rarely used in pre-Buddhist times, and the word refers to a deep, rich blue colour. [SPECIFIC]; [[RARE]]
- type: huang-jingui
  text: 'HUANG JINGUI 2006


    ART 16.


    青，春日草木之色，又指礦物顏料青雘；青色通稱。


    藍，藍草，其葉或莖可制藍色染料；唐代始用為口語中藍色通稱。


    蒼，草之色；兼指深青色和淺青色。


    碧，青色玉石；喻指淺青色。


    綠，帛之青黃色；引申為青黃色。


    翠，青羽雀；喻指淺青色。


    蔥，可作菜或調味品的草本植物，喻指淺青色。'
