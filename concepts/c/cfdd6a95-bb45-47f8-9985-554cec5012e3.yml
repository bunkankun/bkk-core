- type: huang-jingui
  text: 'HUANG JINGUI 2006


    ART 5.


    方相，方形四目面具，多由領舞的巫師佩戴。


    倛，兩目面具。


    魌頭，死者所戴面具。


    鋪，飾於門戶的獸形面具。'
