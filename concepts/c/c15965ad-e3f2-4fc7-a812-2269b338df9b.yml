concept: EAVES
zh: 屋檐
definition: CORNER of ROOF WITH DRAIN.
criteria:
- type: old-chinese-criteria
  text: '1. The general word for the eaves of a roof is yán [[檐]].


    2. Yǔ [[宇]] is an early literary word for the eaves of a roof.'
- type: huang-jingui
  text: 'HUANG JINGUI 2006


    ARCHITECTURE 11. 屋檐。


    梠，側重指屋檐板連綿不斷圍繞屋蓋，六朝前為屋檐的通稱。


    檐，後世屋檐之通稱。 [U+3bb0] ，屋椽端橫木，代稱屋檐。


    楣，屋檐口椽端的橫板，代稱屋檐。


    櫋，屋檐板，代稱屋檐。


    樀，屋檐泛稱。


    宇，四圍的屋檐。


    霤，由屋檐流水代稱屋檐。


    甍，由屋脊而泛稱屋檐。'
- type: modern-chinese-criteria
