zh: 弦
definition: A THREAD WHICH one MOVES WHEN PLAYING a STRING INSTRUMENT.
criteria:
- type: old-chinese-criteria
  text: '1. The general word for a string of any kind, on any bow or any string instrument, is xián [[弦]].


    2. Xián [[絃]] tends to be specialised on strings used on musical instruments.'
