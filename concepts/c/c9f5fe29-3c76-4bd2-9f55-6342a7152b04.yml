- type: huang-jingui
  text: 'HUANG JINGUI 2006


    WARFARE 8. 矛屬兵器。


    矛，用於刺殺的長兵器通稱。


    [ 矛＋肖 ] ，長矛。


    ?? ，短矛。


    鏦, 小矛。


    鋋，鐵柄小矛。


    鎩，裝有長刃的矛。


    錟，大矛。


    WARFARE 9. 戟屬兵器。戈，用以橫擊和鉤殺，勾割或啄刺敵人。


    戟，將直刺的矛和橫刃的戈合成一體。匽，有小孑刺之戟。


    戣，頭部呈十字形之戟。


    ?? ，三面有刃之戟。'
