definition: The COLOUR of CHERRIES ETC.. []
criteria:
- type: old-chinese-criteria
  text: '1. The most general word for "red" is probably chì [[赤]].


    2. Zhū [[朱]] is deep red.


    3. Dān [[丹]] is mild cinnabar red.


    4. Jiàng [[絳]] is very deep shiny red.


    5. Hóng [[紅]] is whitish red or pink.


    1. SEE [[符淮青]]，[[詞義的分析和描寫]] 240ff'
- type: huang-jingui
  text: 'HUANG JINGUI 2006


    ART 12.


    絳，用茜草染成的各種深淺不同的紅色，紅色的總稱。


    縓，極淺的紅黃色，用茜草浸染一次而成。


    赬，淺紅黃色，用茜草浸染二次而成。纁，用茜草浸染三次而成，象徵地之色。


    朱，用茜草浸染四次而成。又可借指朱砂。


    紅，極淺的紅色，被視為間色。


    赤，略淺於朱，含明亮、顯盛之意。


    丹，丹色淺於赤。


    赭，赤土，即赭石，也是礦物原料，所成紅色不固定。'
