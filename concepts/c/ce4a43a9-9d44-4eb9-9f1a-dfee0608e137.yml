concept: NEIGHBOUR
zh: 鄰居
och: 鄰
definition: HUMAN who DWELLS INTENSELY NEAR to one.
criteria:
- type: old-chinese-criteria
  text: '1. The standard word for a neighbour is lín [[鄰]].


    2. Xiàng rén [[巷人]] refers to street neighbours.


    3. Xiāng rén [[鄉人]] refers to fellow villagers.


    4. Sì lín [[四鄰]] refers to all one''s neighbours on all sides.'
- type: modern-chinese-criteria
  text: '鄰居


    鄰人


    鄰舍


    鄰里


    近鄰


    街坊


    左鄰右舍


