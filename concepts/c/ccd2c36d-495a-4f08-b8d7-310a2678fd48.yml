concept: SON-IN-LAW
zh: 女婿
definition: DAUGHTER'S HUSBAND.
criteria:
- type: old-chinese-criteria
  text: 1. The standard term for a son-in-law is xù [[婿]], often written with the [[土]] radical..
- type: huang-jingui
  text: 'HUANG JINGUI 2006


    HUMAN AFFAIRS 22. 女婿。


    婿 [with 土 radical] ，通稱，構詞能力強。


    甥，因姑表婚制而稱。


    倩，方言詞，由男子美稱引申。'
