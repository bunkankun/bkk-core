zh: 老人家
definition: RELATIVE who has ENGENDERED OR BIRTH:given birth to a CHILD.
criteria:
- type: old-chinese-criteria
  text: 1. The current word for parents is qīn [[親]], and the word is always used to refer to both parents (a rare case of dualis), so that the father or mother separately are not referred to as a qīn [[親]].
- type: huang-jingui
  text: 'HUANG JINGUI 2006


    HUMAN AFFAIRS 5.


    親，父母。


    嚴君，對父母的尊稱。


    大人，本指尊貴者，引申為對父親或母親的尊稱。'
- type: modern-chinese-criteria
  text: '老人家


