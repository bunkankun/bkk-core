concept: IN VAIN
zh: 徒然
definition: FAILING to ACHIEVE any AIMS.
criteria:
- type: modern-chinese-criteria
  text: '白 is a current word for doing something in vain (also: at no cost)


    白白 is intensitive.


    徒 is a literary way of referring to something being in vain.


    乾 is colloquial for "to no purpose"


    無效 refers to an action being to no effect.


    虛 as in 不虛此行 "the trip has not been in vain".


    rough draft to BEGIN TO identify synonym group members for analysis, based on CL etc. 18.11.2003. CH ／'
