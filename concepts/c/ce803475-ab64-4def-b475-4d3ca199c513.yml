type: concept
concept: WINGS
zh: 翅膀
definition: BODY PART OF BIRDS USED FOR FLYING.
criteria:
- type: old-chinese-criteria
  text: '1. The current and general ancient word for the wings or any bird or insect is yì [[翼]], and typically the reference is to wings in movement.


    2. Chì [[翅]] is a later word referring to the wings as a general anatomic part of the animals in question with no reference to their being in movement or not.


    3. Hé [[翮]] refers specifically to the stem of the feathers on the wing (and the word also refers to the wing as such). See FEATHER


    NB: Chì [[翅]] is post-Han.'
- type: huang-jingui
  text: 'HUANG JINGUI 2006


    ANIMALS 14. 鳥蟲收閉之翅，專稱 “ 翅 ” ； “ 翅 ” 又作鳥蟲之翅通稱。


    張展之翅專稱 “ 翼 ” ；


    先秦時也或稱以 “ 羽 ” 。


    翮，可泛稱鳥翅，


    翎，可泛稱鳥蟲之翅。


    後三詞均為代稱用法。'
- type: modern-chinese-criteria
  text: '翼


    翅


    翅膀


    翅子


