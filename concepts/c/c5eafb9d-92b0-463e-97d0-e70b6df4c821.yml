concept: BOTH
zh: 倆
definition: ALL of TWO THINGS. [GRAMMAR]
criteria:
- type: old-chinese-criteria
  text: '1. The current binary universal quantifier is liǎng [[兩]], which can quantify both subjects and objects.


    2. Shuāng [[雙]] is much rarer, and the word never quantifies the object so that the word is marginal in the group.'
