definition: MALE ADULT MARRIED MATE.
criteria:
- type: old-chinese-criteria
  text: '1. The general current word for a husband is fū [[夫]].


    2. Liáng rén [[良人]] is a familiar idiom for a husband.


    3. Zhàng fū [[丈夫]] is an informal colloquial word for a husband, one suspects, but it is hard to see how one may prove this point.'
- type: huang-jingui
  text: 'HUANG JINGUI 2006


    HUMAN AFFAIRS 9. 丈夫。


    夫，通稱。


    良人，用於妻妾稱夫。


    家，敘稱；後轉移指妻。'
