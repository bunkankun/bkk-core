concept: MILK
zh: 牛奶
och: 乳
definition: LIQUID DEVELOPED IN the BREAST of FEMALES, which CAN NOURISH their CHILDREN.
criteria:
- type: old-chinese-criteria
  text: 1. The word for milk is rǔ [[乳]], but milk was not an important element of Chinese culture, and the earliest isolated occurrence of the word is in SHIJI.
- type: huang-jingui
  text: 'HUANG JINGUI 2006


    FOOD 44. 乳製品。


    乳，總稱。


    奶，後起口語詞，指乳汁。


    湩，馬奶酒。酪，酸漿、酸奶汁。


    酥, 酪的表皮部分，奶中提煉的脂肪。


    醍醐，酥酪中提煉出來的奶油。'
- type: modern-chinese-criteria
  text: '牛奶


    羊奶


    煉乳


    酸牛奶


