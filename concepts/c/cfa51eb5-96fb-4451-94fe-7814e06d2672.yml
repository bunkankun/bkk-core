type: concept
concept: HUNCHBACK
zh: 駝背
och: 傴
definition: A HUMAN who HAS the DEFECT of an INTENSELY CURVED BACK.
criteria:
- type: old-chinese-criteria
  text: '1. The general word for a hunchback is yǔ [[傴]].


    2. Lóu [[僂]] is a very dramatic rare word to use for an extremely deformed back.


    3. Jū [[痀]] is a medical term describing someone as hunchbacked.


    4. Wāng [[尪]] refers specifically to someone whose deformation consists in having a protruding chest and being bent backwards.


    5. Lōng [[癃]] refers more generally to deformity. See ILLNESS'
- type: huang-jingui
  text: 'HUANG JINGUI 2006


    HUMAN BODY 24.


    痀（佝），各種骨骼彎曲的通稱，即今佝僂病。


    耇，特指老年人脊背彎曲。


    傴，背脊骨往後往下的彎曲。


    僂，頸彎或頸胸彎，彎曲度小於傴。


    尪，胸背段脊柱向前向外突出，即今雞胸。


    俯，可表低頭、彎頸、曲身、伏身等動作，但非疾病或癥狀名。


    癃，泛指廢疾，不指腰曲而背隆高。'
- type: modern-chinese-criteria
  text: '駝背


