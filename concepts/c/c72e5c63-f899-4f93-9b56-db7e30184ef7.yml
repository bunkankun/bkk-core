type: concept
concept: COPY
alt_labels:
- REPRODUCE
- REPLICATE
zh: 抄寫
definition: IMITATE something so as to PRODUCE something BASICALLY RESEMBLING.
criteria:
- type: old-chinese-criteria
  text: '1. The general (but rare) word for producing a copy of something written or sculpted etc, is xiě [[寫]] (ant.* [[著]] "compose" and zuò [[作]] "make").


    2. Mó [[摹]] (ant.* shū [[書]] "produce calligraphy") refers to making a mechanical copy of a piece of calligraphy from Han times onwards.


    3. Xí [[襲]] (ant.* zuò [[作]] "create") refers to unauthorised or unacknowledged copying, but this usage is mostly post-Buddhist.


    NB: Lín [[臨]] "make a close copy of a painting" is post-Buddhist (TANG).'
- type: huang-jingui
  text: 'HUANG JINGUI 2006


    EDUCATION 14. 文獻複製。


    書，書寫的通稱。


    寫，抄寫、臨摹；宋代以後產生書寫義。


    錄，抄錄。


    鈔，專指謄寫。


    謄，照原稿抄寫，後起口語詞。


    用於字畫：臨，照原樣抄寫；


    摹，直接將紙覆在原本上照抄。


    描，依樣摹寫或繪畫，成都輕於摹。'
- type: modern-chinese-criteria
  text: '抄寫


