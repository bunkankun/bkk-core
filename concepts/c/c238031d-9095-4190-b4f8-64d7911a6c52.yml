concept: SNIVEL
zh: 鼻涕
definition: LIQUID IN the NOSE.
criteria:
- type: old-chinese-criteria
  text: Yí [[洟]] is a specific term for a mucus from the nose.
- type: huang-jingui
  text: 'HUANG JINGUI 2006


    HUMAN BODY 42.


    洟，上古時期鼻涕的專稱。


    泗，與 “ 涕 ” 連用時指鼻涕。


    涕，本專指眼淚；淚字產生後，醫籍中用指鼻涕，其他文獻則須 “ 鼻涕 ” 連用。'
- type: modern-chinese-criteria
