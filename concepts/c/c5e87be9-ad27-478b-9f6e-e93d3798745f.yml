zh: 殘酷
definition: VIOLENT AND WICKED so as to DELIGHT in INJURING OR DAMAGING OTHERS.
criteria:
- type: old-chinese-criteria
  text: "1. The current general word for psychological cruelty is rěn [[忍]] (ant. cí [[慈]] \"show kind loving concern\"), and the current general word for cruelty in action is cán [[殘]] (ant. rén [[仁]] \"kind-heartedness\").\n\n2. N\x9Fè [[虐]] (ant. fǔ [[撫]] \"take good care of, show proper concern for subordinates or subjects\") refers to wanton cruelty in the exercise of political authority.\n\n3. Lì [[戾]] typically refers to deliberate cruelty for its own sake, typically by those in political authority, viewed as a political mistake. See SEVERE\n\n4. Bào [[暴]] refers to a propensity towards public violence by those in authority, viewed as a character defect. See VIOLENT"
- type: modern-chinese-criteria
