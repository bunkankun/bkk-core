concept: RUINS
alt_labels:
- RUIN
zh: 廢墟
definition: BUILDING OR BUILDINGS that have been COMPLETELY DESTROYED.
criteria:
- type: old-chinese-criteria
  text: '1. The current standard word for ruins is xū [[墟]] / [[虛]].


    2. Qiū [[丘]] "mound" is sometimes used periphrastically to refer to ruins.'
- type: modern-chinese-criteria
  text: '廢墟


    遺跡


    芳躅


    雪泥鴻爪


    瓦礫 refers generally to rubble or debris and is perhaps marginal in the series.


    斷垣殘壁


    殘垣斷壁


    斷井頹垣


    rough draft to BEGIN TO identify synonym group members for analysis, based on CL etc. 18.11.2003. CH ／'
