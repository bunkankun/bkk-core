criteria:
- type: huang-jingui
  text: 'HUANG JINGUI 2006


    GEOGRAPHY 8. 丘，因地勢而自然形成的小土山。


    阜，有層級的大土山，比山丘大。


    陸，頂端比較平緩的土山，大小與阜相同。


    陵，中央高四周低的大土山，比阜大。


    阿，蜿蜒的大土山。


    墟，四方高、中央低的大土丘。'
