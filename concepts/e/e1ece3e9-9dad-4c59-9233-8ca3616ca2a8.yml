concept: PHENIX
zh: 鳳凰
definition: MYTHICAL INTENSELY BEAUTIFUL BIRD.
criteria:
- type: huang-jingui
  text: 'HUANG JINGUI 2006


    SACRIFICE 23.


    鳳，作為圖騰，由多種動物形象組合而成，但以孔雀形象為主，是一種象徵祥瑞的神鳥。


    鳳，通稱。


    鳳凰，對舉時二者有雌雄之別；合用有祥和、歡愛的色彩。


    鵬，顯示鳳鳥力大高飛的特點。


    鸞，強調此鳥長尾之形。'
- type: modern-chinese-criteria
