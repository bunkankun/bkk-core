type: concept
concept: ANIMAL SOUNDS
zh: 禽獸聲
definition: SOUND PRODUCED by ANIMALS.
criteria:
- type: huang-jingui
  text: 'HUANG JINGUI 2006


    ANIMALS 31.


    鳴，通稱。


    叫，有對象的大聲鳴叫。


    啼，中古前多指感覺延聲悲怨的大聲鳴叫。


    嗥，猛獸的號叫。


    吼，大的牲畜和野獸雄渾地鳴叫，有發怒意味。


    嘯，鳥獸高銳長聲鳴叫。


    嘶，馬的鳴叫。


    雊，雉的鳴叫。


    吠，狗叫。'
