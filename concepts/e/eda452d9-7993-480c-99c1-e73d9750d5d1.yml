zh: 院子
definition: PLACE BETWEEN HOUSES LACKING BUILDINGS.
criteria:
- type: old-chinese-criteria
  text: '1. The standard term for a courtyard is tíng [[廷]] / [[庭]]. In Western Zhou and Chunqiu times important public prosecutions usually take place in tíng [[廷]] / [[庭]] belonging to a palace or (possibly) to a temple. NB: The distinction between the meanings "courtyard" and "court" is often hard to make, although it is clear that in some cases the reference is definitely to the courtyard and not to the court as a whole.'
