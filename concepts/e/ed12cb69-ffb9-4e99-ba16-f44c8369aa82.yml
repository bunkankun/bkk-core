criteria:
- type: huang-jingui
  text: 'HUANG JINGUI 2006


    HUMAN BODY 43.


    便，屎尿的通稱。


    溲，單用時多指小便。


    尿，小便的專稱，延續至今，與 “ 溲 ” 有文白之別。


    屎，大便的通稱，沿用至今。


    糞，六朝時可指大便，為口語用法。


    惡，東漢以來指稱大便的方言詞。'
