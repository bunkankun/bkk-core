concept: DIGNITY
zh: 聖德
och: 德
definition: GOOD GENEROUS HUMAN QUALITY DESERVING AND CAUSING RESPECT TOWARDS ONE
criteria:
- type: old-chinese-criteria
  text: 1. The general word for awe-inspiring benign and generous autonomous personal dignity is dé [[德]].2. Wēi [[威]] is functional authoritative dignity based on political or military administrative power.3. Zūn [[尊]] is hierarchic dignity based on high formal social status.
