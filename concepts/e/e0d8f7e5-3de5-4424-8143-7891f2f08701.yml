definition: ISSUE DOWNWARD THROUGH a HOLE, as a LIQUID.
criteria:
- type: old-chinese-criteria
  text: '1. The current standard word for liquids leaking out of some place in which they are contained is lòu [[漏]], and the word is commonly used causatively.


    2. Xiè [[泄]] is also commonly used in figurative senses.'
