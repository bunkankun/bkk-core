  text: 'HUANG JINGUI 2006


    ANIMALS 21.


    蝗專食苗葉，戰國前稱 “ 螽 ” ，或稱 “ 螣 ” ；戰國以來，主要稱 “ 蝗 ” 。次於蝗災者是專食稻苗莖節的 “ 螟 ” 。


    旱田作物的大蟲害是 “[ 虫＋子 ][ 虫＋方 ]” ，又稱 “ 蜮 ” ，即粘蟲。'
