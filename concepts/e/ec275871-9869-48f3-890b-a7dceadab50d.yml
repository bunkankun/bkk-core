definition: KILL someone by BLOCKING BREATHING.
criteria:
- type: old-chinese-criteria
  text: '1. Jiǎo [[絞]] refers to the act of strangling someone else.


    2. Yì [[縊]] refers to strangling oneself. See SUICIDE.


    3. Jīng [[經]] refers to strangling oneself by hanging oneself.'
