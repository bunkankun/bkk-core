concept: SOCK
zh: 襪屬
definition: FOOTWEAR WORN INSIDE SHOES.
criteria:
- type: old-chinese-criteria
  text: '1. Wà [[襪]] is a rare ancient word referring to a simple thick and crude shoe-like "sock", probably more of an in-doors shoe than what we would call a sock. Illustration HYDCD 9.144


    2. Xié fú [[邪幅]] is a rare archaic word referring to a textile band wound round the foot and functioning as a sock.


    3. Guǒ tuǐ [[裹腿]] is a Han dynasty word for this kind of textile band wound round the foot and functioning as a sock.'
- type: modern-chinese-criteria
