concept: MONOPOLISE
zh: 壟斷
och: 專／主
definition: CONTROL AND NOT PERMIT OTHERS TO CONTROL.
criteria:
- type: old-chinese-criteria
  text: '1. The most general word for taking sovereign charge of something is probably zhǔ [[主]].


    2. Zhuān [[專]] emphasises that one takes exclusive control, by whatever means.


    3. Shàn [[擅]] emphasises the improper arrogation of monopolised control.


    4. Cuàn [[篡]] suggests the violent arrogation of monopolised power.'
