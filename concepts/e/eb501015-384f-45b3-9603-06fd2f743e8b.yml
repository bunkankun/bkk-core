concept: KING
zh: 國王
och: 王
definition: RULER of an INDEPENDENT STATE.
criteria:
- type: old-chinese-criteria
  text: '1. The general term for a king of any kind is wáng [[王]], and in Warring States times this term can refer to all sovereign rulers, even the Son of Heaven. This is one of those terms have neutral descriptive uses versus abstract idealised uses. The list of such concepts is long: [[王]]"king/true king =[[王者]]", [[君子]]"gentleman/true gentleman"，[[道]]"behaviour/ideal behaviour"，[[禮]] "custom/ideal ritual"，[[德]]“feature/ideal feature,virtue" 2. Tiān wáng [[天王]] is a highly formal ritual term for "the King by the Grace of Heaven" and refers regularly to the Zhou king. 3. Tiān zǐ [[天子]] refers to the Son of Heaven recognised as the ritual leader of all kings, and the word is currently used in a non-referential generic abstract sense. 4. Dì [[帝]], originally "highest ancestor", is an honorary title for a king of very special distinction. 5. Huáng [[皇]] is a very archaic way of referring to mythical rulers which in Qin times came to be used as part of the term for "emperor". 6. Huáng dì [[皇帝]] is the Qin standard term for the emperor.'
- type: modern-chinese-criteria
  text: '皇帝


