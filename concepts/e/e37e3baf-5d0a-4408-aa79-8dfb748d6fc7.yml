concept: MUSSEL
zh: 蚌
och: 蚌
definition: AQUATIC ANIMAL LIVING INSIDE A SHELL. []
criteria:
- type: old-chinese-criteria
  text: '1. Bàng [[蚌]] refers to the pearl-oyster. The word can be also used as a general term for mussels.


    2. Gé [[蛤]] to the clam of a round shape.


    3. Shèn [[蜃]] refers to a large clam.


    4. Pí [[蜱]] is one kind of clam.


    5. Hān [[蚶]] is a kind of clam living in a log on the bottom of shallow seas.'
