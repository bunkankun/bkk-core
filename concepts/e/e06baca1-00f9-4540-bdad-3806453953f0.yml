concept: CINNABAR
zh: 丹砂
definition: HEAVY REDDISH MINERAL SUBSTANCE the most important ore of mercury.
criteria:
- type: old-chinese-criteria
  text: 1. The standard word is dān [[丹]].
- type: huang-jingui
  text: 'HUANG JINGUI 2006


    GEOGRAPHY 27.


    丹，礦物名，朱砂、丹砂色深紅，通稱。可作顏料，用於唇妝，或用於繪畫、建築，或用於紡織。中醫入藥用，古代道教徒用以化汞煉丹。


    沙、朱、丹乾，都是 “ 丹 ” 的異名：


    沙，多用作修飾成分，先秦單用不廣，漢以後主要作 “ 丹沙 ” 的構詞語素；


    朱，產生於先秦，命名理據來自朱砂的顏色特徵，使用頻率較低；


    丹乾，僅見於先秦，用例最少。丹粟，特指細粒的丹砂。'
- type: modern-chinese-criteria
  text: '朱砂


