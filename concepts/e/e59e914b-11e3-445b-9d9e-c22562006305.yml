zh: 傀儡
definition: TOY in the form of a SMALL STATUE of a HUMAN.
criteria:
- type: old-chinese-criteria
  text: '1. O ㄆ[[偶]] refers to a small statue, typically of a person, buried with the dead, and the emphasis is on the likeness with a living person.


    2. Yǒng [[俑]] refers to the figurines put into tombs and buried with the dead, and the focus is on the fact that these figurines accompany a dead person into the ground.


    NB: Kuǐ lěi [[傀儡]] is post-Han.'
- type: modern-chinese-criteria
  text: '傀儡


