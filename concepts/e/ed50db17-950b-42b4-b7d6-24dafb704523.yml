zh: 謹慎
och: 慎
definition: DILIGENT IN-RELATION-TO AVOIDING DANGER.
criteria:
- type: old-chinese-criteria
  text: "1. The dominant general word referring to wariness and circumspect action is shèn [[慎]] (ant. hū [[忽]] \"slipshod\").\n\n2. Jǐng [[警]] (ant. shū [[疏]] \"fail to take seriously\") emphasises awareness of danger.\n\n3. Jiè [[戒]] (ant. l\x9Fè [[略]] \"fail to take heed\") emphasises awareness of previous warnings.\n\n4. Bì [[毖]] (ant. chéng [[懲]] \"take one's warning from, take (a matter of a past) as a warning\") is an archaic word for being on one's guard."
