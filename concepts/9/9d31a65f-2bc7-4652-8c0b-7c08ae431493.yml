- type: old-chinese-contrasts
  text: 'Cicero, de divinatione 2.128 distinguishes systematically between superstition and religion: [Nam ut vere loquamur, superstitio, fusa per genis, oppressit omnium fere animos atque hominum imbecillitatem occupavit....Multum enim et nobismet ipsis et nostris profuturi videbamur, si eam fundtus sustulissemus. Nec vero - in enim diligenter intellegi volo - superstitione tollenda religio tollitur. Nam et maiorum instituta tueri sacris cerimoniisque retinendis sapientis est, et esse praestantem aliquem aeternamque naturam, et eam suspiciendam admirandamque hominum generi pulchritudo mundi ordoque rerum caelestium cogit confiteri. Quam ob rem, ut religio propaganda etiam est, quae est iuncta cum cognitione naturae, sic sperstitionis stirpes omnes eiiciendae. "...And therefore just as religion, which is linked to an understanding of nature, must be promoted so the roots of superstition must be pulled up." tr. CH'
