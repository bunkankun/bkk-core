type: concept
concept: SUFFICIENT
zh: 足夠
och: 足
definition: ABUNDANT so as to PROVIDE what is NEEDED.
criteria:
- type: old-chinese-criteria
  text: '1. The current general word for sufficiency is zú [[足]] (ant. fá [[乏]] "be short of something").


    2. Jí [[給]] (ant.* quē [[缺]] "be short of") refers specifically to the supply of necessities for the sustenance of life.


    3. Shàn [[贍]] refers to an abundant sufficiency of what is needed for a contextually determined purpose.'
