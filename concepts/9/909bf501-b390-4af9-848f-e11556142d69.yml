zh: 霧
och: 霧
definition: INTENSELY LOW CLOUD on the SURFACE of the EARTH.
criteria:
- type: old-chinese-criteria
  text: '1. The current general word for billowing mist and fog, especially as the medium in which dragons and the like are roaming, is wù [[霧]].


    2. Xiá [[霞]] refers to misty, rosy diffuse clouds.


    Qì [[氣]] is sometimes used to refer to the misty substance that wù [[霧]] is made up of.'
- type: modern-chinese-criteria
  text: '煙霧


    雲煙


