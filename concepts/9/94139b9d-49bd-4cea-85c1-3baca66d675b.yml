    rough draft to BEGIN TO identify synonym group members for analysis, based on CL etc. 18.11.2003. CH ／'
- type: old-chinese-contrasts
  text: Note that neither pre-Christian Greek nor pre-Buddhist Chinese had a notion of an AUTONOMOUS organ of the will. 志 is "main content of one's intentions> aspiration" and very rarely the agency of the will.
