type: concept
concept: FIX
alt_labels:
- MAKE PERMANENT
- MAKE FAST
- SET
zh: 確定
och: 定
definition: CAUSE something TO be ENDURING OR NOT to MOVE from a PLACE.
criteria:
- type: old-chinese-criteria
  text: '1. The current general word for fixing something in any objective and interpersonal way, concrete or abstract is dìng [[定]].


    2. Cái [[裁]] refers specifically to the proper apportioning of things.


    3. Bì [[必]] refers to fixing and determining something with supreme assurance and definiteness.


    THIS IS A PRETTY MISERABLE GROUP: WHAT TO DO ABOUT IT?????'
- type: modern-chinese-criteria
  text: '確定 focusses on the fixedness of the result.


    決定 is the most current and general word for determining or fixing someting.


    規定 focusses on the rules involved.


    rough draft to BEGIN TO identify synonym group members for analysis, based on CL etc. 18.11.2003. CH ／'
