zh: 老師
definition: ADULT whose WORK is to TEACH.
criteria:
- type: old-chinese-criteria
  text: '1. The current general word for a (revered) teacher of one''s choice is shī [[師]].


    2. Zǐ [[子]] and fū zǐ [[夫子]] can be used to refer to the teacher within a given school by the adherents of that school.


    3. Fù [[傅]] refers to a hired or formally employed tutor.'
- type: huang-jingui
  text: 'HUANG JINGUI 2006


    EDUCATION 40.


    師，老師的通稱，構詞能力強。


    傅，帝王或諸侯子女、妻妾的老師。


    生，先生的省稱，指年長的老師，常位於姓氏後。


    姆，傳授女子婦道的女性老師。'
- type: modern-chinese-criteria
  text: '導師


