definition: COMMON METAL USED FOR MAKING TOOLS. []
criteria:
- type: huang-jingui
  text: 'HUANG JINGUI 2006


    GEOGRAPHY 30.


    鐵，從戰國起，已作鐵的通稱。


    鉅，堅硬的天然優質鐵，生西南瘴海中山石上，狀如紫石英。


    鍇，鐵，九江方言詞。


    鋼，鐵和碳的合金，鐵中之堅韌者。'
