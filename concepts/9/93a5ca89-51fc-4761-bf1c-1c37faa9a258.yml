type: concept
concept: ENVY
alt_labels:
- BE ENVIOUS OF
- BE JEALOUS OF
- BEGRUDGE
- BE RESENTFUL OF
zh: 羨慕
och: 羨
definition: 'SOCIAL EMOTION: HATE someone BECAUSE one LACKS something GOOD which that OTHER PERSON HAS.'
criteria:
- type: old-chinese-criteria
  text: '1. The most current general word for the positive aspects envy is probably xiàn [[羨]] (ant. dù [[妒]] "resentful envy"), but this word rarely has negative overtones of dissatisfaction and is often close in meaning to "admiration". See ADMIRE.


    2. The rare usage of the word lián [[憐]] which normally means "to pity", to mean "envy" has no strong overtones of objective admiration.


    NB: for dù [[妒]] etc. see HATE and JEALOUS. It is difficult to find a general word for envy as a negative attitude without that element of hatred and resentment in pre-Buddhist China.'
