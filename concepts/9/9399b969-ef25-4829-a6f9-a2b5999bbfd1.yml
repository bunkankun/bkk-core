concept: ANCHOR
zh: 船錨
definition: TOOL FOR FIXING THE PLACE:position of a SHIP AND BINDING it to the BOTTOM of the WATER.
criteria:
- type: old-chinese-criteria
  text: 1. The standard word for the metal anchor is máo [[錨]] and the first account of a metal anchor máo [[錨]] is in [[天工開物]].
- type: huang-jingui
  text: 'HUANG JINGUI 2006


    COMM 30. 碇，木帆船停泊時，拋於岸上或沉落水中以穩定船身的大石；是最早出現的靠泊工具。


    ?? ，一種木石結合的木爪石碇，出現時間最晚不下於西漢初年。


    錨，船不靠碼頭和不繫浮筒停泊時用以固定船位的器具，一般鐵製，一頭有鉤爪，另一頭用鐵鏈連在船上，拋到水底，可以使船停穩；五代之前已經出現。


    木椗，明清兩代的船用定泊工具一大類（另一類為鐵錨），選用優質木料，去石，以木為主體結構。'
- type: modern-chinese-criteria
