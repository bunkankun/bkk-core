type: concept
concept: RAINBOW
zh: 彩虹
och: 虹
definition: APPEARANCE OF ROW of COLOURS IN the SKY which APPEARS WHEN there is RAIN DURING SUNSHINE.
criteria:
- type: old-chinese-criteria
  text: '1. The general word for rainbow is hóng [[虹]], and the word refers specifically to the rainbow itself as opposed to the faded colours manifesting themselves around the rainbow.


    2. Ní [[霓]] refers to the faded colours around the rainbow.


    3. Dì dō4ng [[螮蝀]] is an archaic poetic way of referring to the rainbow.'
- type: huang-jingui
  text: 'HUANG JINGUI 2006


    ASTRONOMY 20.


    虹，現代所稱雄虹和色白而純的日傍氣總稱。


    霓，雌虹，為四時皆有的日月旁雲氣。


    螮蝀，見於東方的虹。隮，見於西方的虹。


    白虹為雌虹（ “ 霓 ” ）的一種，為日月中或旁白而直的雲氣。'
- type: modern-chinese-criteria
  text: '彩虹


