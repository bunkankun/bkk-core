concept: EXORCISE
alt_labels:
- DRIVE OUT
- CAST OUT
- EXPEL
- PURIFY
- CLEANSE
- PURGE
zh: 去邪氣
och: 禊
definition: PRAY so as to TRY to REMOVE WICKED SUPERNATURAL FORCES.
criteria:
- type: old-chinese-criteria
  text: '1. The most common word for exorcism is fú [[祓]], and the word refers specifically to shamanistic incantations designed to remove evil spirits, the shamans often being women.


    2. The rarer ráng [[禳]] which is current in ZUO, does not specify any particular method of exorcism.


    3. The fairly common xì [[禊]] refers specifically to the ritual exorcistic bath.


    4. Jué [[爝]] refers to exorcism by the use of a burning torch.'
- type: huang-jingui
  text: 'HUANG JINGUI 2006


    SACRIFICE 11.


    禳，卻變異之祭，泛指除邪消災之祭。


    禬，除災害之祭。


    祓，除災祭，強調除災之徹底性。


    禜，禳除自然災害之祭。


    祖，出行時祭祀路神，使不為阻，可特指設奠祭送死者。


    禓，道路上對無主之鬼的祭祀，亦指逐強鬼之祭。


    禊，於水濱洗濯、設祭以祓除不祥。


    禦，祭祀以求免災，僅用於卜辭。


    攻，攻擊驅逐災害之祭。


    說，宣讀災害罪狀之祭。'
- type: modern-chinese-criteria
  text: '去邪氣 is a colloquial word referring to removing evil influences through exorcism.


    軀鬼 focusses on the exorcising of ghosts.


    rough draft to BEGIN TO identify synonym group members for analysis, based on CL etc. 18.11.2003. CH ／'
