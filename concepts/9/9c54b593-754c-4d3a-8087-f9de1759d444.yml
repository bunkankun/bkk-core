zh: 真實的
definition: IMPORTANT AND NOT FAKED.
criteria:
- type: old-chinese-criteria
  text: 1. The general dominant word for something being not artificial or fake is zhēn [[真]] (ant. wěi [[偽]] "fake"), but I find is important that the word never seems to apply to negative concepts as in English "genuine hatred".
