zh: 姐妹
definition: FEMALE SIBLING.
criteria:
- type: huang-jingui
  text: 'HUANG JINGUI 2006


    HUMAN AFFAIRS 16. 姐姐。


    姊，男子、女子稱同胞中年長於己身的女性，通稱。


    姒， “ 姊 ” 的音轉詞，主要為同嫁妹對姊之稱。


    嬃，楚方言詞。


    HUMAN AFFAIRS 17. 妹妹。


    妹，男子稱年幼於己身的同胞女性，通稱。


    弟，男女稱其妹，敘稱。


    娣，姐姐稱妹妹。


    媦， “ 妹 ” 的音轉詞，方言詞。'
