type: concept
concept: GOVERN CONCURRENTLY
zh: 兼治
definition: GOVERN SOMETHING WHILE GOVERNING SOMETHING OTHER.
criteria:
- type: huang-jingui
  text: 'HUANG JINGUI 2006


    GOVERNMENT/LAW 17. 兼職。


    兼，所兼之職與本職無高下之別。


    領，職務高者兼低的職務。


    錄，總領職務，多為錄尚書事。


    行，暫時兼任，兩漢一般指低級官吏行使高一級官吏職務，也間有同官或者高官任卑職。'
