zh: 竊賊
definition: VILLAIN who STEALS.
criteria:
- type: old-chinese-criteria
  text: '1. The standard word for a professional or at least specialised thief is dào [[盜]]. Dà dào [[大盜]] is a notorious professional thief, jù dào [[巨盜]] is a professional large scale robber.


    2. Zéi [[賊]] refers to a bandit or a villain who can be hired to commit crimes, and his villainy often consists in hired murder. It may or may not consist in robbery. See VILLAIN.


    3. Qiè [[竊]] is occasionally used to refer to a petty thief.'
- type: huang-jingui
  text: 'HUANG JINGUI 2006


    HUMAN AFFAIRS 50.


    THIEF 偷盜者。


    竊，手段詭秘的小偷。


    偷，小偷，漢時出現的口語詞。


    盜，小偷或搶劫財物的人。


    賊，殺人越貨的強盜。


    寇，結伙搶劫的盜匪。


    暴客，攜帶兵器的外來強盜。'
