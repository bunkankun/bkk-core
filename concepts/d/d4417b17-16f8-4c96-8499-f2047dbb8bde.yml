concept: BEAK
zh: 鳥喙
definition: MOUTH of a BIRD.
criteria:
- type: old-chinese-criteria
  text: '[NOUN/PARTICLE/VERB]


    1. The current general word for a beak is zhòu [[咮]].


    [VERB]


    2. Zhuó [[啄]] is to peck with a beak and is probably derived from the preceding. See BITE


    [NOUN]'
- type: huang-jingui
  text: 'HUANG JINGUI 2006


    ANIMALS 29.


    咮，最早的鳥嘴專稱。


    喙，鳥嘴的通稱；，也指獸、魚、蟲的尖嘴。


    嘴，本作觜，中古以前指鳥嘴，有口語色彩；中古時候引申指其他動物的尖嘴


    。口，本指人嘴；泛指動物嘴時，側重指能發聲、吞吐、張大的嘴。'
- type: modern-chinese-criteria
  text: '鳥喙


