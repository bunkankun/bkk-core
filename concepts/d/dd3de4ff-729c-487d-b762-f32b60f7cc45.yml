zh: 否定
och: 非
definition: 'SPEAK:say that something that has been SAID is UNTRUE.


  SPEAK:say that SOMETHING is NOT TRUE.'
criteria:
- type: old-chinese-criteria
  text: 1. There are no common words for denial in pre-Buddhist Chinese. Fēi [[非]] has declarative transitive uses, I think, but I have not yet identified a clear relevant example.
- type: modern-chinese-criteria
  text: '否定 is the current modern word for denial.


    否決 is to make or pass a decision against something.


    rough draft to BEGIN TO identify synonym group members for analysis, based on CL etc. 18.11.2003. CH ／'
