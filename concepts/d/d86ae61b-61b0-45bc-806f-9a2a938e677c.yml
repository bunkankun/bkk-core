zh: 堡壘
definition: INTENSELY FORTIFIED BUILDING.
criteria:
- type: old-chinese-criteria
  text: '1. The general word for a fortified place smaller than a city is bǎo [[保]]／[[堡]].


    2. Lěi [[壘]] refers to a fortified military position, and this meaning is often difficult to distinguish from the usages discussed under RAMPART.


    NB: Zhài [[寨]] refers to an encampment with timber fortifications only in post-Han (TANG) times.'
- type: huang-jingui
  text: 'HUANG JINGUI 2006


    WARFARE 21.


    堡，方形小土城，建於交通要道處。


    城，漢代邊塞較大的方形軍營。


    障，漢時長城沿線或險要處的屯兵小城。


    亭，邊境上可防守瞭望的小障。


    壁，始於戰國，有陡高圍牆之營壘，行於中古前。


    壘，始於戰國的野戰簡易工事，行於後世。


    砦，軍隊臨時在野外用木柵欄築成的簡易圍牆，起於中古。


    塢，四面圍以土牆的環形軍事防禦設施，盛行於三國、兩晉、南北朝的西南少數民族地區。


    碉，用於防守、瞭望的小型建築物。


    相關者：


    塞，邊界上可以據險固守的要地，始於春秋；


    隘，有細狹通道的險要處；


    關，險要的出入門戶。'
- type: modern-chinese-criteria
  text: '堡壘


