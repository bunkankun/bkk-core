type: concept
concept: RALLY
alt_labels:
- BACK UP
- BECOME A SUPPORTER
zh: 歸向
och: 歸
definition: COME to in order to FOLLOW AND COLLABORATE WITH.
criteria:
- type: old-chinese-criteria
  text: '1.The general word for rallying around someone or turning to some place is guī [[歸]] (ant. lí [[離]] "distance oneself from") and refers to any group of persons feeling loyal towards and showing allegiance to someone through their action.


    2. Xiàng [[向]] (ant. bèi [[背]] "turn one''s back on") is allegiance in attitude which may or may not manifest itself in concrete action.


    3. Bì [[比]] and liú [[留]] are relatively rare words which refer to closing ranks behind someone and showing political support for him.'
- type: modern-chinese-criteria
  text: '歸向 is a current modern word for rallying to someone.


