definition: SKILL IMPORTANT FOR a PROFESSION.
criteria:
- type: old-chinese-criteria
  text: '1. The general word for any craft or professional skill is shù [[術]]. See also METHOD


    2. Gōng [[工]] is the general term for handicrafts.


    3. Jì [[技]] is a general term for highly developed skills of any kind, including the professional skills. See SKILL'
