type: concept
concept: GOD
zh: 上帝
definition: 'MOST IMPORTANT DEITY.


  EXTREMELY IMPORTANT DEITY.'
criteria:
- type: old-chinese-criteria
  text: '1. Tiān [[天]] refers to the - often personified or semi-personified - God of Heaven.


    2. Shàng dì [[上帝]] refers to the highest Sovereign, also identified with the the Highest Ancestor.'
- type: huang-jingui
  text: 'HUANG JINGUI 2006


    SACRIFICE 19.


    周代有 “ 天 ” 有 “ 帝 ” ，均為至上神，但周人更遵崇 “ 天 ” 。戰國中後期，天的至尊地位被削弱，漢代才又重新確定。


    殷人的 “ 帝 ” 始終未能發展成統轄眾神的萬能之主，周人繼承了殷人的 “ 帝 ” 并成為周人的信仰之一。


    西漢的天神觀比較混亂，在五帝與上帝之外還出現了一個新的天神 “ 太一 ” ，成為漢代統治者所實際尊奉的上帝神。'
- type: modern-chinese-criteria
  text: '上帝


