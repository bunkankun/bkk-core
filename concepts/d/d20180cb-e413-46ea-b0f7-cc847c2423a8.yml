zh: 坐
och: 居
definition: SUPPORT one's WEIGHT USING one's BUTTOCKS AND KEEPING ONE'S SPINE UPRIGHT.
criteria:
- type: old-chinese-criteria
  text: 1. The current word for sitting is not properly zuò [[坐]] (see KNEEL) but probably jū [[居]] "sit comfortably on the floor", which is a decorous thing to do. 2. Dūn [[蹲]] is to squat on the floor, sitting on one's behind, but keeping a certain decorous pose. <div>3. Jù [[踞]] refers to squatting informally with one's legs spread to both sides, which was regarded as a very informal and impolite thing to do in public. </div>4. Jí [[集]] refers to birds settling in a certain place, often but not always in a flock.
