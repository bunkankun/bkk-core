zh: 愛說話
och: 誻
definition: BASIC NATURE so as to TEND to SPEAK EXCESSIVELY OFTEN AND for an EXCESSIVELY LONG TIME.
criteria:
- type: old-chinese-criteria
  text: 1. There is no current word for this notion in pre-Buddhist Chinese. Tà [[誻]] "talkative" is the only word that comes to mind, and this is a very rare word.
- type: modern-chinese-criteria
  text: '愛說話 is current modern mild way of complaining of talkativeness.


    拉不斷扯不斷 makes a stronger complaint.


    囉唆 is a colloquial term for talkativeness.


    繁縟 complains of overelaborate detail in description.


    rough draft to BEGIN TO identify synonym group members for analysis, based on CL etc. 18.11.2003. CH ／'
