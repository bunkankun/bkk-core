zh: 拿來
definition: TAKE something so as to MOVE it to the PLACE where the SPEAKER IS-IN.
criteria:
- type: old-chinese-criteria
  text: '1. The current word for bringing something along with one is lái [[來]] and this focusses on the presence of the bearer.


    2. Zhì [[致]] is to convey or bring something to any place.'
- type: modern-chinese-criteria
  text: '拿來


    帶來


    捎 can mean both "to take" and "to bring".


    rough draft to BEGIN TO identify synonym group members for analysis, based on CL etc. 18.11.2003. CH ／'
