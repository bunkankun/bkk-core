zh: 降官
och: 黜
definition: DISMISS so as to COMMAND to BECOME of MORE HUMBLE RANK.
criteria:
- type: old-chinese-criteria
  text: '1. The standard technical word for demoting someone officially is chù [[黜]]／[[絀]].


    2. Tuì [[退]] is a slightly polite periphrastic way of referring to demotion.


    3. Qiān [[遷]] refers to transferral, but is often used euphemistically for demotion.'
- type: huang-jingui
  text: 'HUANG JINGUI 2006 GOVERNMENT/LAW 27.


    降，泛稱爵位、身份的降低。


    貶，表降職的專用職官術語，後來貶也可包括外放。


    謫，降職并外放；也可作貶的委婉用語。


    黜，降職并罷免。


    左遷，降職處罰較輕，降職後仍擔任其他職務。'
- type: modern-chinese-criteria
  text: '貶斥


    罷官


    罷黜


    黜免


    罷免


    黜退


    斥退


    貶謫


    貶黜


    謫 refers to demotion in the form of banishment.


    使降級


    使降職


    使降等


