zh: 藝術家
definition: HUMAN who CONCENTRATES ON PRODUCING ART.
criteria:
- type: huang-jingui
  text: 'HUANG JINGUI 2006


    ART 4.


    女樂，能歌善舞的藝人，宮中樂伎的古稱。


    伎，後漢時私家蓄養的女樂。


    倡，以歌唱為主的男女藝人，多有音樂伴奏。


    謳，以清唱為業的藝人。翟，教習樂舞的舞蹈藝人。


    工，在宮廷內以歌唱諷誦為業的藝人，一般為盲人。師，技藝和地位高於 “ 工 ” 的樂人之長。


    瞽，宮廷中的盲人樂師，地位高於工和師。


    伶，樂官的專稱。


    但，吹奏藝人。


    優，多為矮小、醜陋的男子，以口、面、體的戲謔活動博取主子歡心的藝人。


    俳，以表演雜戲、詼諧娛人為業的藝人，少獨用。


    象人，漢代宮廷中模仿各種形象或戴假面具裝扮的藝人。'
