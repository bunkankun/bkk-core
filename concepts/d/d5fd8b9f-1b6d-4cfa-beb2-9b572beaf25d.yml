concept: LACQUER
zh: 漆
och: 漆
definition: SUBSTANCE USED to CAUSE SURFACES TO BECOME INTENSELY SMOOTH AND TO RESEMBLE GLASS. []
criteria:
- type: old-chinese-criteria
  text: '1. The current general term for lacquer is qī [[漆]].


    2. Xiū [[髹]] refers either to the black and red lacquer, or to the lacquer in general.


    3. Yóu qī [[油漆]] can also refer to the lacquer, as it contains oil.'
