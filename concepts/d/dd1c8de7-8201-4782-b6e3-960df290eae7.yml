concept: NUMBER
zh: 數子
och: 數
definition: QUANTITY when COUNTED. [THE DEFINITIONS IN THIS FIELD REMAIN CIRCULAR ON MANY LEVELS AND NEED TO BE CAREFULLY REVISED IN COLLABORATION WITH KARINE CHEMLA.]
criteria:
- type: modern-chinese-criteria
  text: '數字 is the current modern word referring to a number.


    數目字 refers to a number word.


    數目 refers to German Anzahl, quantity of items, indicated by a number.


    數碼 refers to a digit.


    數量 refers to a digit.


    rough draft to BEGIN TO identify synonym group members for analysis, based on CL etc. 18.11.2003. CH ／'
