concept: QUESTION PARTICLES
zh: 問句表記
definition: GRAMMAR [][NOTE THAT THE GRAMMATICAL PARTICLES HAVE NOT BEEN FOCUSSED SO FAR IN THE SYSTEM AND NO SYSTEMATIC ANALYSIS HAS BEEN APPLIED SO FAR.]
criteria:
- type: old-chinese-criteria
  text: Basic sentence-final question particles:[[乎]] marks narrative or narratively descriptive verbal questions, and also indirect questions.[[耶]] marks judgmental questions.[[也]] can mark objective judgmental questions “[[何謂也]] "what does this mean" not "what are you trying to say?" [[哉]] can mark emotionally charged rhetorical questions.
