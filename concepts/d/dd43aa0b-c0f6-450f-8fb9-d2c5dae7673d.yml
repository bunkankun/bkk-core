type: concept
concept: COLOUR
alt_labels:
- HUE
zh: 顏色
definition: APPEARANCE of SURFACES which REFLECT OR ISSUE LIGHT, PERCEIVED USING the EYES.
criteria:
- type: old-chinese-criteria
  text: '1. The standard word for colour of any kind is sè [[色]].


    2. Cǎi [[采]] normally refers to colours coexisting with others on one object.


    3. Yán [[顏]] "face" is perhaps occasionally used to refer to colour but no early examples are very telling.'
- type: huang-jingui
  text: 'HUANG JINGUI 2006


    ART 11.


    采，特指尚未施用之五色顏料，泛指五色。


    色，施用顏料後所呈現出的五色。


    繡，兼指繪畫和刺繡的設色五彩俱備。


    絢，五色交織。'
- type: modern-chinese-criteria
  text: '顏色


    彩色


    色


    彩


    色彩


    色澤


    色調


    PAINT:


    顏料


    顏色


    水彩


    rough draft to BEGIN TO identify synonym group members for analysis, based on CL etc. 18.11.2003. CH ／'
