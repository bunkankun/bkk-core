zh: 倒
och: 灌
definition: DISPLACE a LIQUID to CAUSE it to FLOW DOWN FROM a VESSEL.
criteria:
- type: old-chinese-criteria
  text: '1. The current general word for the pouring of liquids is guàn [[灌]].


    2. Zhù [[注]] is to pour by a well-defined small stream of liquid into a well-defined place.


    3. Wò [[沃]] refers to pouring liquids in a fairly broad swathe of water.'
- type: huang-jingui
  text: 'HUANG JINGUI 2006


    FOOD 7.


    斟，舀取濃重的汁液，多為羹。


    酌，舀取水與酒，主要是酒。


    舀，用瓢勺等挹取舂好之米；唐代以後，指舀取水、酒等液體，有口語色彩。挹，以瓢舀取液體。'
- type: modern-chinese-criteria
  text: '斟


    倒


