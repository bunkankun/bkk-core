zh: 人質
och: 質／質子
definition: FOREIGNER GIVEN to someone FOR SUPPORTING a PROMISE OR CONTRACT with that person.
criteria:
- type: old-chinese-criteria
  text: 1. The technical term for a hostage is zhì [[質]], and there are no current competing near synonyms.
- type: huang-jingui
  text: 'HUANG JINGUI 2006


    TRADE 16.


    質，以人或物抵押借貸。


    贅，以人作抵押貸錢，起於秦漢。


    貼，中古以來以人或物作抵押無息借貸。


    當，中古以來指以小巧之物抵押借貸。


    典，中古以來指用小巧之物或固定資產甚至人作抵押借貸。'
- type: modern-chinese-criteria
  text: '人質


    質子


    質


    肉票 (lit, obs) refers in a very traditional way to a hostage.


    rough draft to BEGIN TO identify synonym group members for analysis, based on CL etc. 18.11.2003. CH ／'
