definition: SEED of cereal PLANTS. []
criteria:
- type: old-chinese-criteria
  text: '1. Gǔ [[谷]] / [[穀]] is general term for a food grain; in some local dialects, it can also refer to foxtail millet (Setaria italica).


    2. Mài [[麥]] is a general term for wheat, barley, etc.


    3. Suì [[穗]] refers to an ear of grain.


    4. Kāng [[糠]] refers to husks of grain.


    5. Suì [[穟]] refers to an awn.


    6. Jǐ [[穖]] refers to the branches of an awn.


    7. Miǎo [[秒]] refers to the beard of grain.


    8. Gǔ [[榖]] refers to Broussonetia papyrifera (Shi)'
- type: huang-jingui
  text: 'HUANG JINGUI 2006


    FOOD 30. 乾糧。


    糧，總稱，多指行糧或流通之糧。


    餱，上古至魏晉指乾飯、乾食。


    糒，乾飯，始於漢。


    糗，熬熟搗細的乾糧，未搗者，即是 “ 糒 ” 。諸物皆是外出所持乾糧。


    FOOD 24. 糧食作物粟。


    禾，最早的稱名，從植株形態而稱。


    穀; ，後世作為糧食作物總稱，有時也可縮指 “ 粟 ” ，是方言、地區性用法。


    粟，從粒實而稱，最通行稱名。


    稷，上古專稱，有崇穀、禮神色彩。


    粢，專指作宗廟祭祀的粟食。


    FOOD 25. 糧食作物黍類。


    黍，俗稱黃米，味美，珍貴於稷，有粘與不粘兩類；黍類總稱。


    不粘者稱 “ 穄 ” ，方言中或稱 “[U+2ǎad]” 。


    秬、秠，黑黍 —— 上古黍的兩個良種：


    “ 秬 ” 可與鬱金香草釀酒，作重要的禮儀之物；


    “ 秠 ” 是大名，其中一穀二米者。


    FOOD 26. 糧食作物稻。稻，我國最早的栽培糧食作物之一，總稱。


    稌、 ?? ，對稻的方言之稱，一般指粳稻。


    秈，不粘之稻，雖早有而不普遍，文獻遲見。


    粳，有粘性之稻，秦以後見其名。


    秫、糯，是先後表粘性的形容詞，可泛稱粘性強的稻米；大約南宋時才有糯稻并以 “ 糯 ” 稱。


    FOOD 27. 粟的優良品種。


    粱，具不耐肥、畏濕澇等生態特點，可作粉、釀酒。


    秫，粘粟。穈、芑，上古粱的兩個好品種。


    高粱，也是我國古老的栽培糧食作物，似粱而高，而其生態特點與粱大異，非貴食細糧，漢以後有 “ 蜀黍 ” 等名，而不稱 “ 高粱 ” 。'
