zh: 醉
och: 醉
definition: DRINK EXCESSIVELY MUCH LIQUOR so as to BECOME INTOXICATED.
criteria:
- type: old-chinese-criteria
  text: '1. The clearly dominant word referring to the process drinking a large amount of alcohol on a given occasion is zuì [[醉]] (ant. xǐng [[醒]] "become sober; be sober").


    2. Hān [[酣]] refers to tipsiness as the incipient stage of getting drunk.


    3. Chéng [[酲]] refers to the unpleasant state of a person who has got excessively drunk and feels ill.


    For dān [[酖]] and xù [[酗]] referring to a liking for alcohol, see ADDICTED'
- type: huang-jingui
  text: 'HUANG JINGUI 2006


    FOOD 9.


    酣，喝得歡暢。


    醉，喝酒過量。


    酗，酒後迷亂撒酒瘋。


    酖，長時間沉迷於酒。'
