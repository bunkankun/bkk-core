concept: MAST
zh: 桅竿
definition: LONG VERTICAL BEAM FOR HANGING SAILS on, IN the MIDDLE of a SHIP.
criteria:
- type: old-chinese-criteria
  text: 1. The only word for a mast, exceedingly rare, is wéi [[桅]]. Early China was not a great sailing nation.
- type: huang-jingui
  text: 'HUANG JINGUI 2006


    COMM 29. 船上掛帆的豎杆。二詞最早見於漢代。


    桅，通稱，口語性較強。


    檣，書面語色彩較濃。古漢語中 “ 桅 ” 的使用少於 “ 檣 ” ；一直到明代的口語語料中， “ 桅 ” 才在使用上占優勢。'
- type: modern-chinese-criteria
  text: '桅桿


