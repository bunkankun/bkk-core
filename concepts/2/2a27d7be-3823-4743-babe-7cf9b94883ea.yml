zh: 固執
definition: EXCESSIVELY STRONG of MIND, TEND to REFUSE to CHANGE one's ATTITUDE.
criteria:
- type: old-chinese-criteria
  text: '1. The current general word referring to stubbornness in a positive or in the positive sense of unswerving determination is gù [[固]].


    2. Bì [[愎]] refers to stubbornness as a deplorable feature involving lack of flexibility and obstinacy.


    3. Yì [[意]] refers to purely psychological or opinionated intellectual stubbornness.'
