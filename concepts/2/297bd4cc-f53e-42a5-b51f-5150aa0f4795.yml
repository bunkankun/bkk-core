definition: 'BELIEVE SOMETHING AND ASSUME:presuppose that it is TRUE.


  BELIEVE SOMETHING AND ASSUME:presuppose that it is GENERALLY BELIEVED TO BE TRUE.'
criteria:
- type: old-chinese-criteria
  text: '1. The general word for knowing something to be the case in any way or on any basis is zhī [[知]], but the word is more common in the meanings discussed under UNDERSTAND as in [[知人]] "understand men".


    2. Wén [[聞]] is to have learnt as given, so that one knows it as part of one''s intellectual tradition or education.


    3. Shí [[識]] is to be able to recognise and thus to have some idea of something through familiarity and experience, and what one is thus familiar with does not seem to be facts.'
- type: modern-chinese-criteria
  text: '知道


    曉得


    知聞 (lit) refers to knowledge of something by hearsay.


    rough draft to BEGIN TO identify synonym group members for analysis, based on CL etc. 18.11.2003. CH ／'
