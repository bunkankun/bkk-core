- type: huang-jingui
  text: 'HUANG JINGUI 2006


    GOVERNMENT/LAW 37.


    桎，施於足部的木製獄具。


    梏，施於手部的木製獄具。


    枷、鎖，施於勁部的獄具：枷，木製圓形，中有圓孔；


    鎖，鐵環勾連而成的獄具。


    械，獄具的泛稱。


    杻，中古時出現的木製手銬。


    鐐，金元時出現的足械，鐵鏈連接的兩鐵環套在囚犯的雙腳。


    銬，金屬製手銬，清代時始出現。


    COMM 19. FOR HORSES 縶，縛馬足；縛馬足的繩索。引申為拘縶，多實指。


    絆，縛馬後足之繩，泛指縛馬足的繩索，多與 “ 羈 ” 連用，作喻指性詞語；引申為拘縛，也用於喻指。'
