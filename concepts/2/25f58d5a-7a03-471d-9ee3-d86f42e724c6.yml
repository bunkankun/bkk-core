zh: 竹木筏
definition: INTENSELY SMALL AND SIMPLE SHIP in the form of a ROW of BEAMS.
criteria:
- type: huang-jingui
  text: 'HUANG JINGUI 2006


    COMM 32. 筏是最早的航運工具。


    最初稱 “ 方 ” ，但上古文獻只做動詞，指用筏濟渡。秦以後不用。


    常用 “ 桴 ” 、 “ 筏 ” ，分別是書面語與口語中竹木筏的通稱。


    “ 箄（ p[U+00ē]i ） ” ，專指筏船，主要用於漢代，作軍用簡易運輸船。


    “ 槎（ ch[U+00ē] ） ” ，道家入深遠仙境的竹木筏；也可作筏的泛稱。'
