zh: 打掃
definition: REMOVE DUST USING a BROOM.
criteria:
- type: old-chinese-criteria
  text: '1. The standard word for sweeping as a cleaning routine in the house is sǎo [[掃]]／[[埽]], and this process commonly involved the sprinkling of the area to be swept with water, a process called xǐ [[灑]]／[[洒]].


    2. Shuā [[刷]] refers to sweeping away something with a small brush.


    3. Fèn [[拚]] seems to have been a technical ritual term for the sweeping of the area around the sitting mat.'
