zh: 將軍
och: 將／將軍
definition: OFFICER who is the LEADER of an ARMY.
criteria:
- type: old-chinese-criteria
  text: '1. The general term for a senior military leader of any kind is jiāng [[將]], but this word normally refers to a person in charge of a given campaign, and the rank is not in Warring States times a bureaucratic permanent military to hold.


    2. Shuài [[帥]] is sometimes used to refer to any officer in charge of a given army.


    3. Jiāng jūn [[將軍]] is the officer in charge of a concrete army in the field.'
- type: huang-jingui
  text: 'HUANG JINGUI 2006


    WARFARE 1.


    將軍，軍中高級將領的泛稱，或對軍官之尊稱。


    都督，為皇帝授權的最高軍事統帥。行於後漢、三國至南北朝。


    元帥，皇帝授權的最高軍事統帥或軍事長官，正式作職官名的 “ 元帥 ” 是在隋代以後。'
- type: modern-chinese-criteria
  text: '將


