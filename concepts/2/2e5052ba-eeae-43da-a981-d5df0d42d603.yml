- type: old-chinese-contrasts
  text: 'KOKO TAKEZOE 2008 p. 12: 妃這配匹之名, 非有尊卑之異. 尊卑殊稱, 則曲禮所云 : 天子之妃曰后, 諸侯曰夫人, 大夫曰孺人, 士曰婦人, 庶人曰妻.'
