zh: 咒罵
definition: SPEAK so as to TRY to CAUSE DIVINE DISASTER FOR someone.
criteria:
- type: huang-jingui
  text: 'HUANG JINGUI 2006


    SACRIFICE 9.


    詛，求神加禍於人，強調加禍之義。


    [ 口＋兄 ] ，原與祝為一字，後分化出來，專指以言語向鬼神請求降禍於別人。'
- type: modern-chinese-criteria
  text: '咒罵 is the current modern word for cursing someone.


    詛咒 (lit) is a more formal and perhaps a little less aggressive way of referring to the same action.


    咒詛 (lit) is a more formal and perhaps a little less aggressive way of referring to the same action.


    rough draft to BEGIN TO identify synonym group members for analysis, based on CL etc. 18.11.2003. CH ／'
