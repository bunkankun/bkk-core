- type: huang-jingui
  text: 'HUANG JINGUI 2006


    FOOD 48.


    饅頭，包餡、渾圓、不開口。


    蒸餅，唐代以前同於饅頭；唐代起無餡，面、油為原料，疊而分層蒸熟，宋代因避諱又稱為 “ 炊餅 ” 。


    籠餅，唐人對籠蒸的帶餡麵食的渾稱。


    包子，始於宋代，與現代用法相同。'
