zh: 運輸
definition: DISPLACE THROUGH a BIG DISTANCE.
criteria:
- type: huang-jingui
  text: 'HUANG JINGUI 2006


    COMM 39. 運輸。


    運，通稱。輸，指大規模運送。


    漕，水道運糧，引申為泛指水道運送，不限於糧。


    轉，陸運，也是車運。


    輓，車運，有時泛指運輸，其用不廣。'
