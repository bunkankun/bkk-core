zh: 憂鬱
definition: DELIGHT in one's OWN SADNESS IN-RELATION-TO ALL THINGS, this SADNESS LACKING CONCRETE CAUSE, AND being CULTIVATED IN ORDER TO OBTAIN OR SHOW WISDOM:higher-sensitivity.
criteria:
- type: old-chinese-criteria
  text: In ancient China the corresponding emotion is cultivated unhappiness about the political/social state at court as cultivated by Qu Yuan and emulated by thousands of poets ever since. Qu Yuan indulges in his dolorous expatriot political and cultural desperation exactly as a kind of sweet unhappiness which provides him endless self-indulgent aesthetic flourishes and morally desperate posturings.
- type: modern-chinese-criteria
  text: '憂悶


    愁悶


    愁苦


    憂鬱


    抑鬱


    陰鬱


    悒鬱


    怫鬱


    郁結


    幽憂


    憂憤


    悒悒


    抑抑


    怏怏


    鬱鬱不樂


    悶悶不樂


    忽忽不樂


    怏怏不樂


    rough draft to BEGIN TO identify synonym group members for analysis, based on CL etc. 18.11.2003. CH ／'
