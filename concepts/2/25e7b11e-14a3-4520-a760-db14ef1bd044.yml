zh: 持齋
och: 齊
definition: AVOID EATING SOME THINGS, CONFORMING to RITUAL FORBID:prohibitions.
criteria:
- type: old-chinese-criteria
  text: '1. The standard word for the ritually purifying act of fasting is zhāi [[齋]].


    2. Jiè [[戒]] can refer to the ritual observance of prohibitions against eating or drinking at certain times.'
- type: huang-jingui
  text: 'HUANG JINGUI 2006


    SACRIFICE 17.


    齋，齊心之意，即祭祀之前或其他重要活動前沐浴別居，清心寡欲，去除雜念，保持心境純一，以示虔誠。


    戒，強調的是戒除不當的言行。'
- type: modern-chinese-criteria
  text: '持齋


