type: concept
concept: GRUEL
zh: 粥
och: 粥
definition: SOUP PRODUCED USING GRAIN AND WATER.
criteria:
- type: old-chinese-criteria
  text: '1. The general term for a gruel of rice boiled in water is zhōu [[粥]].


    2. Yí [[飴]] refers to strong gruel.


    3. Mí [[糜]] refers to fermented gruel.


    4. Yǐ [[酏]] refers to a light gruel used to make wine.


    5. Hú [[餬]] can also refer to a gruel.


    6. Mò [[粖]] refers to a light gruel.'
- type: huang-jingui
  text: 'HUANG JINGUI 2006


    FOOD 31.


    粥，通稱。


    饘，厚粥。


    糜，爛粥。


    餬，糊粘義，引申可渾指粥，一般不單用。


    酏，薄粥，可釀酒。


    FOOD 32.


    粢，宗廟祭祖的稷飯；穀類總稱。


    盛，宗廟祭祀已置於器的稷飯和他物。


    糈，祀神求福用的精米；泛指精米。


    粺，次於糈的精米。'
- type: modern-chinese-criteria
  text: '粥


    稀飯


    米湯


    糜


    大米粥


    臘八粥


    魚生粥


    雞粥


    糖粥


