concept: GREEN
zh: 綠
definition: COLOUR TYPICALLY RESEMBLING that of LEAVES IN SPRING.
criteria:
- type: huang-jingui
  text: 'HUANG JINGUI 2006


    ART 16.


    青，春日草木之色，又指礦物顏料青雘；青色通稱。


    藍，藍草，其葉或莖可制藍色染料；唐代始用為口語中藍色通稱。


    蒼，草之色；兼指深青色和淺青色。


    碧，青色玉石；喻指淺青色。


    綠，帛之青黃色；引申為青黃色。


    翠，青羽雀；喻指淺青色。


    蔥，可作菜或調味品的草本植物，喻指淺青色。'
