concept: BROOM
alt_labels:
- BESOM
- PUSH BROOM
- CORN BROOM
- WHISK BROOM
zh: 掃帚
definition: INTENSELY BIG BRUSH USED FOR:in order to CAUSE ROOMS TO BECOME CLEAN.
criteria:
- type: old-chinese-criteria
  text: '1. The current word for the broom, which standardly cooccurs with jī1 [[箕]] "dustpan", is zhǒu [[帚]].


    2. Liè [[鬣]] refers specifically to a broom made of the mane of a horse.


    3. Sáo [[埽]] refers to the process of sweeping something clean, and this process is standardly accompanied by xǐ [[灑]] / [[洒]] "sprinkling with water". See SWEEP


    4. Shuā [[刷]] refers to a broom-like brush, but the word is rare in pre-Han texts. See BRUSH'
- type: modern-chinese-criteria
  text: '掃帚 is the current modern word for using a broom to clean an area.


    掃


    帚 is the standard modern word for a broom.


    笤帚 refers to a whisk broom.


    彗


    炊帚


    筅帚


    rough draft to BEGIN TO identify synonym group members for analysis, based on CL etc. 18.11.2003. CH ／'
