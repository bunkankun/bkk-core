concept: TIN
zh: 錫
definition: COMMON METALS, USED FOR MAKING PLATES ETC. [CHEMISTRY] nearly approaching silver in whiteness and lustre, highly malleable and taking a high polish; used in the manufacture of articles of block tin, in the formation of alloys, as bronze, pewter, etc., and, on account of its resistance to oxidation, for making tin-plate and lining culinary and other iron vessels.
