zh: 圈套
definition: TOOL USED FOR CATCHING ANIMALS OR HUMANS.
criteria:
- type: huang-jingui
  text: 'HUANG JINGUI 2006


    ANIMALS 36. 罧，積柴水中誘聚魚而捕取之法。


    荃，誘聚魚的香草。筌，漢以後魚笱別稱，有古雅色彩。


    罩，以細竹編成、放入水中自上而下捕魚的器具。


    梁，截流而有缺口的捕魚堤堰或竹木葦箔。


    笱，設在缺口攔捕魚的竹簍。


    梁、笱必須配合使用。


    罶，無笱配合的捕魚曲梁。


    扈，江南海邊的捕魚竹籪、竹箔。


    篊，晉代出現的竹編大魚梁，用於江、湖、海邊。'
