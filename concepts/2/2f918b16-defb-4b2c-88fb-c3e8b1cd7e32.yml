zh: 溺死
och: 溺
definition: DIE BECAUSE of SINKING into WATER.
criteria:
- type: old-chinese-criteria
  text: '1.The current general word for seeking death by drowning or dying through drowning is nì [[溺]].


    2. A very common term for drowning oneself is zì tóu [[自投]].


    3. Chén [[沉]]／[[沈]] refers to submerging either oneself or things, sometimes in order to drown them. See SINK'
