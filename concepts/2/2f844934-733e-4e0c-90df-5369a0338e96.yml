zh: 勞動
definition: 'FORCED WORK that CAUSES one to BECOME TIRED.


  [[ARBEIT]]'
criteria:
- type: old-chinese-criteria
  text: '1. The standard current word for hard work, often commendable assiduous effort, is láo [[勞]].


    2. Kùn [[困]] refers to work which is so hard as to be a substantial threat to well-being.


    3. Jìng [[競]] can occasionally refer to exceedingly hard work, particularly in a competitive spirit.'
- type: modern-chinese-criteria
  text: '勞動 refers to hard work.


    勞


    打工 refers to menial work.


    做工 refers to manual work.


    做工


    做活兒


    幹活兒


    做長工


    打長工


    扛長工


    扛長活


    扛大活


    扛活


    攬工


    做短工


    打短工


    打短兒


    打零工


    打零活


