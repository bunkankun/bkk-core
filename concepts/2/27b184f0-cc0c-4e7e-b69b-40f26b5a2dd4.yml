definition: FLAVOUR RESEMBLING that of SUGAR.
criteria:
- type: old-chinese-criteria
  text: '1. The current standard word for sweetness is gān [[甘]], and the word strongly connotes pleasantness of taste rather than just sugary flavour.


    2. Tián [[甜]] is rare and denotes sugary sweet flavour as such.'
