criteria:
- type: old-chinese-criteria
  text: '1. The current noun for taste is wèi [[味]]. (The current verb for tasting something is cháng [[嘗]]. See also TASTE).


    2. Chòu [[臭]] is the flavour of something as primarily perceived through the nose. For this see SMELL'
