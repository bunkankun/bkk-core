type: concept
concept: LEG
zh: 腳
och: 足1
definition: LIMB ABOVE and INCLUDING the FOOT
criteria:
- type: old-chinese-criteria
  text: '1. The current general word for the leg as a whole is the same as that for the foot, zú [[足]], but the word can also be used in a broader meaning including the shin.


    2. Jiǎo [[腳]] is an exceedingly rare colloquial word for the foot but can occasionally be used to refer also to the shin.


    NB: Tuǐ [[腿]] is late colloquial (MING).'
- type: huang-jingui
  text: 'HUANG JINGUI 2006


    HUMAN BODY 39.


    足，人體下肢的總稱。


    股，大腿。


    脛，小腿。


    腳，本是小腿，口語中也指整條腿；專指腳掌。


    腿，大腿和小腿的總稱。趾（止），腳掌最早的稱呼。'
