  text: 'HUANG JINGUI 2006


    HUMAN BODY 11. 腹疾。


    疝，氣聚腹中攻痛又高凸於外有形可診的腹痛，北宋以來轉指陰囊睾丸或腫或痛之病。


    ?? ，相當於今腹水病。


    ?? ，腸蠕動過甚，痙攣而引起的劇烈疼痛，即腸絞結痛，甚於疝痛。


    痳，非腹疾，而是淋病。'
