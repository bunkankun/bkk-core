concept: DUCK
zh: 鴨子
definition: DOMESTIC ANIMAL in the form of a SMALL WATER BIRD.
criteria:
- type: old-chinese-criteria
  text: '1. Wù [[鶩]] is the domestic duck.


    2. Fú [[鳧]] is the wild duck.


    3. Yuān yāng [[鴛鴦]] refers to mandarin ducks, often a pair.


    NB Yā [[鴨]] is post-Buddhist and refers to the domestic duck.'
