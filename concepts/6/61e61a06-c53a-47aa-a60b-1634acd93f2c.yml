concept: GOLD
zh: 黃金
definition: MOST EXPENSIVE SOFT METAL. []
criteria:
- type: old-chinese-criteria
  text: '1. The specific term for gold is huáng jīn [[黃金]].


    2. Jīn [[金]] "metal" is sometimes used as short for huáng jīn [[黃金]].'
- type: huang-jingui
  text: 'HUANG JINGUI 2006


    GEOGRAPHY 29. 銅是一種淡紫紅色或藍綠色的礦石，冶煉後可成青銅。


    金，古代最早表示銅的名稱，先秦時既可作單音詞，也可作修飾語；而到漢朝僅作修飾語。


    銅，約從春秋末年產生。秦漢之際， “ 銅 ” 作單音詞使用。漢代， “ 銅 ” 又出現了作詞組修飾語的新用法。漢世， “ 銅 ” 成為常用詞，使用頻率遠遠超過 “ 金 ” 。'
- type: modern-chinese-criteria
