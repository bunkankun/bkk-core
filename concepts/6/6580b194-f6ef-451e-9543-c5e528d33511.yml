criteria:
- type: old-chinese-criteria
  text: '1. There is only one term for a chimney, tū [[突]], and archeological evidence suggests that the chimney took the form of a hole in the roof.


    NB: Words like cōng [[囪]] and yān cōng [[煙囪]] are all late.'
- type: modern-chinese-criteria
  text: '煙囪 yāncong is the current modern word for a chimney.


