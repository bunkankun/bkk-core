zh: 盜賊
och: 賊
definition: ADULT who is WICKED AND HAS ACTED:committed CRIMES.
criteria:
- type: old-chinese-criteria
  text: '1. The most general and comprehensive term for a villain is zéi [[賊]], and the basic association is with the damage he does. There is no special association with murder or thievery.


    2. Kòu [[寇]] refers to thugs and robbers, particularly enemies of the state.


    3. Dào [[盜]] refers to thieves or the more ordinary kind, and burglars, and the basic association is with the property he romoves. Note that Dào Zhí [[盜跖]] is something of a euphemism, since this gentleman was an arch-villain of great dimension.


    4. Yì [[役]] is occasionally used for a scoundrel.'
- type: huang-jingui
  text: 'HUANG JINGUI 2006


    50. THIEF 偷盜者。


    竊，手段詭秘的小偷。


    偷，小偷，漢時出現的口語詞。


    盜，小偷或搶劫財物的人。


    賊，殺人越貨的強盜。


    寇，結伙搶劫的盜匪。


    暴客，攜帶兵器的外來強盜。'
