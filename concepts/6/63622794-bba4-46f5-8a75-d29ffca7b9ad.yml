- type: huang-jingui
  text: 'HUANG JINGUI 2006


    TRADE 19.


    量，測量的通稱。


    度，測量長度。


    絜，測量圓形物體的周長。


    測，測量深度。


    揣，測量高度。


    權，測量重量，書面語。


    稱，測量重量，口語詞。


    TRADE 20. 度，測量長度的標準。


    量，用容器測量多少的標準。


    衡，測量重量的標準。'
