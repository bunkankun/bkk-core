zh: 街
definition: WAY INSIDE a CITY OR VILLAGE.
criteria:
- type: old-chinese-criteria
  text: '1. The general term for the streets of a compact settlement of any kind is xiàng [[巷]].


    2. Jiē [[街]] refers to main roads in settlements, but the word is rare.'
- type: huang-jingui
  text: 'HUANG JINGUI 2006


    COMM 3.


    巷，閭里中通路，又可稱宮廷中小路。


    曲，通於巷的彎曲小路。


    阡，田間南北向小路，又泛指田間小路。


    陌，田間東西向小路，又泛指道路，甚至可指城市中街道。


    畛，隔開田地田間道路。


    蹊，由人踐踏而成，即走出來的小路。


    徑，分隔百畝方田可供人畜來往但不能通車的小路，後可泛指道路。'
- type: modern-chinese-criteria
  text: '街道


