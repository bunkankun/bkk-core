type: concept
concept: CUT HAIR
zh: 剃頭
och: 薙
definition: CUT HAIR.
criteria:
- type: old-chinese-criteria
  text: '1. Tì [[薙]]／[[鬄]]／[[剃]]／[[剔]] originally referred to the shaving off of children''s hair, but the word came to refer quite generally to all manner of shaving or cutting of hair.


    2. Kūn [[髡]] refers specifically to the shaving off of adult''s hair.'
- type: modern-chinese-criteria
  text: '理髮 is the standard modern term for cutting hair.


    剃頭 is the standard modern term for shaving the head.


    推頭 (coll) refers to taking a hair-cut (as opposed to giving someone a hair-cut)


    開光 (informal) refers teasingly to taking a haircut.


    整容 (lit) is a dignified way of referring to taking a hair-cut.


    rough draft to BEGIN TO identify synonym group members for analysis, based on CL etc. 18.11.2003. CH ／'
