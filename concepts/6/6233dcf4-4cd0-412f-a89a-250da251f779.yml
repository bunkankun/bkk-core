definition: 'DEVELOP OR CHANGE so as to BECOME MORE EXCELLENT.


  [[FORTSCHRITT]]'
criteria:
- type: old-chinese-criteria
  text: '1. The current general word denoting progress of any kind is yì [[益]].


    2. Jìn [[進]] is very occasionally used to denote progress.'
- type: modern-chinese-criteria
  text: '進步


