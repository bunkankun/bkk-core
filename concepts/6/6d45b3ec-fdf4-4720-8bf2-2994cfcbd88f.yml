zh: 奧妙
och: 玄
definition: DARK so as to be DIFFICULT to SEE, DIFFICULT to UNDERSTAND OR STRANGE to THINK of.
criteria:
- type: old-chinese-criteria
  text: '1. The current general word for mysteriousness is xuán [[玄]].


    2. Miào [[妙]] adds to the notion of mysteriousness that of intricacy and felicity of structure.


    3. Ào [[奧]] emphasises the recondite obscurity and supernatural links of the mysterious.'
