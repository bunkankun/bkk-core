criteria:
- type: old-chinese-criteria
  text: '<div>1. The current general word for handed-down typically written law, a legal system or any provision with legal authority of any kind is fǎ [[法]], and this word can also refer more generally and abstractly to a normative tradition.</div>2. Lǜ [[律]] is far more specialised referring to written or oral concrete administrative legal measures rather than any body of laws, and lǜ [[律]] is also syntactically much less flexible than fǎ [[法]]. We have [[先王之法]] and hardly ever [[先王之律]]. The complexities of legal terminology can be preliminarily summarised as follows: A. The rule may be explicit (chéng [[程]], diǎn [[典]], fǎ [[法]], hào [[號]], lǜ [[律]] ); or it may be primarily conventional (cháng [[常]], jì [[紀]], jīng [[經]], zhì [[制]] ). B. The rule may be conceived as temporary (lìng [[令]], dù [[度]], chéng [[程]], hào [[號]] ); or it may be conceived as permanent and unchangeable (cháng [[常]], diǎn [[典]], jì [[紀]], jīng [[經]] ); or it may be conceived as long-term but clearly changeable (fǎ [[法]], lǜ [[律]], xiàn [[憲]], zhāng [[章]], zhì [[制]] ). C. The rules may concern legal and economic administration (chéng [[程]], diǎn [[典]], dù [[度]], lǜ [[律]], xiàn [[憲]], zhāng [[章]], zhì [[制]], and occasionally fǎ [[法]] ); or they may concern prohibitions of criminal conduct (fǎ [[法]], pì [[辟]], xíng [[刑]] ); or they may be general moral guidelines on conduct (cháng [[常]], hào [[號]], lìng [[令]], jì [[紀]] ). D. The focus may be on the written documents containing the rules as such (diǎn [[典]], xiàn [[憲]], zhāng [[章]], fǎ [[法]] ); or the focus may be on the content of the rules (cháng [[常]], chéng [[程]], dù [[度]], lìng [[令]], zhì [[制]] ); or the primary focus may be on oral promulgation of the rule (hào [[號]] ). E. The rules may be regarded as a collective system (cháng [[常]], jì [[紀]], jīng [[經]], zhì [[制]] ); or they may be conceived as individual legal prescriptions (all others).'
- type: huang-jingui
  text: 'HUANG JINGUI 2006


    GOVERNMENT/LAW 34.


    刑，先秦早期指對肉體處罰的條文，側重在肉體處罰。


    法，春秋以後形成的對犯罪者處罰的制度，側重在制度化；後世為刑法的通稱。


    “ 律 ” ，後世指能作為處罰標準的刑法，側重在標準性。


    GOVERNMENT/LAW 35. 法度。


    法，總稱。


    典，側重於示範性、長久性。


    則，表現為司法中可以參照的代表性案例。


    儀，側重於禮儀性。'
- type: old-chinese-contrasts
  text: '1. The basic contrast is between statutes or legal provisions governing the practice of the law itself (xiàn 憲, lu �律 ), and the legal provisions governing directly the behaviour of those for whom the law is valid (fǎ 法 ).


    2. Next there is an important contrast between criminal law (xíng 刑 ) on the one hand, and economic regulations (chéng 程, dù 度 ) on the other.


    3. Third there is the contrast between traditional and conventional law (jì 紀, jīng 經 ) and positive law (fǎ 法 ).


    A. The current general word for a law, a legal system or any legal provision of any kind is fǎ 法.


    B. Lu �律 is far more specialised as a specific term referring to concrete and detailed regulations rather than a legal system as a whole, and the word is also syntactically much less flexible. Thus we have 先王之法 and not 先王之律.


    The complexities of legal terminology can be preliminarily summarised as follows:


    1. The rule may be explicit (chéng 程, diǎn 典, fǎ 法, hào 號, lu �律 ); or it may be primarily conventional (cháng 常, jì 紀, jīng 經, zhì 制 ).


    2. The rule may be conceived as temporary (lìng 令, dù 度, chéng 程, hào 號 ); or it may be conceived as permanent and unchangeable (cháng 常, diǎn 典, jì 紀, jīng 經 ); or it may be conceived as long-term but clearly changeable (fǎ 法, lu �律, xiàn 憲, zhāng 章, zhì 制 ).


    3. The rules may concern legal and economic administration (diǎn 典, dù 度, lu �律, xiàn 憲, zhāng 章, zhì 制 ); or they may concern prohibitions of criminal conduct (fǎ 法, pì 辟, xíng 刑 ); or they may be general moral guidelines on conduct (cháng 常, hào 號, lìng 令, jì 紀 ).


    4. The focus may be on the written documents containing the rules as such (diǎn 典, xiàn 憲, zhāng 章 ); or the focus may be on the content of the rules (cháng 常, chéng 程, dù 度, lìng 令, zhì 制 ); or the primary focus may be on oral promulgation of the rule (hào 號 ).


    5. The rules may be regarded'
