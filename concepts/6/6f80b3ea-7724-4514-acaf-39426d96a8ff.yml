zh: 羊
och: 羊
definition: SMALL FURRY DOMESTIC ANIMAL USED FOR PRODUCING WOOL OR MILK. []
criteria:
- type: old-chinese-criteria
  text: '1. Yáng [[羊]] is the general word referring indifferently to what in English is a sheep, a goat, or a ram.


    2. Gāo [[羔]] refers to a young goat or sheep.


    3. Zāng [[牂]] refers to a female goat or sheep.


    4. Yú [[妤羭]] is a colloquialism for a goat or a sheep.


    5. Jié [[羯]] castrated sheep.


    NB: According to ERYA fán [[羳]] refers to a goat/sheep with yellow belly, and goats/sheep with curved horns are called guǐ [[觤]] (ERYA). Fèn [[羒]] refers to a male goat or sheep.


    ERYA （[[三]]）[[羊屬]]。


    19·28 [[羊]]，[[牡羒]]，[[牝牂]]。


    19·29 [[夏羊]]，[[牡羭]]，[[牝羖]]。


    19·30 [[角不齊]]，[[觤]]；[[角三觠]]，[[羷]]。


    19·31 [[羳羊]]，[[黃腹]]。


    19·32 [[未成羊]]，[[羜]]。'
- type: modern-chinese-criteria
