type: concept
concept: METAL
zh: 金屬
och: 金
definition: HARD INTENSELY HEAVY SUBSTANCE OFTEN USED FOR PRODUCING ARTEFACTS, TOOLS, AND WEAPONS. []
criteria:
- type: old-chinese-criteria
  text: '1. Jīn [[金]] in antiquity usually refers to metal, concretely to bronze or copper.


    2. Shuǐ yín [[水銀]] refers to mercury.


    3. Cí shí [[慈石]] refers to a magnet.


    4. Yè [[鍱]] also refers to an ore.


    5. Xiǎn [[銑]] refers to any shiny metal.


    6. Gāng [[鋼]] refers to steel.


    7. Xī [[錫]] refers to tin.


    8. [[鏤]] is another term for a steel.


    9. Zhù [[鉒]] refers to an ore.'
- type: modern-chinese-criteria
  text: '五金


    金屬


    金銀銅鐵錫


