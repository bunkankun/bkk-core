concept: CHIN
alt_labels:
- JAW
zh: 下巴
och: 頤
definition: MOST LOW PART of the FACE BELOW the MOUTH.
criteria:
- type: old-chinese-criteria
  text: '1. The most current and the most general word for the lower part of the face is yí [[頤]], but the word does include the cheeks. See CHEEK.


    2. Hàn [[頷]] is used to refer to the jaw of a dragon, but the word is rare in ancient texts and hard to fix semantically with any precision.


    3. Hǎi [[頦]] is post-Buddhist (TANG) colloquial.'
- type: huang-jingui
  text: 'HUANG JINGUI 2006


    HUMAN BODY 38. 下巴。


    頷，兼骨頭和肌肉組織而言，通稱。


    頦，有口語色彩。


    頤，連口周圍的組織，包括兩腮和下巴，偏重於頰腮。'
- type: modern-chinese-criteria
  text: '頦


    下巴


    下頜


    下巴頦兒


    頷


    頤


    rough draft to BEGIN TO identify synonym group members for analysis, based on CL etc. 18.11.2003. CH ／'
