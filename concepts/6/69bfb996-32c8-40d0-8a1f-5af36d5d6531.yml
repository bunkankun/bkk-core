concept: BIRDS OF PREY
zh: 猛禽
definition: BIRDS that ATTACK AND EAT BIG LIVING ANIMALS.
criteria:
- type: huang-jingui
  text: 'HUANG JINGUI 2006


    ANIMALS 15.


    鷹，中型猛禽，中古前只指放獵的蒼鷹和某些鷂類。中古前大型猛禽稱雕，別稱鷲，實指皂雕。


    鷲，唐宋起偏指大雕。


    雕，中古後成類稱，包括各種顏色的雕和鷲，成為今生物學上的雕屬，足上被毛直到趾間，喙上葉的齒突與鷹類不同。


    鷻，古今均指皂雕，中古以後名團雕。


    ANIMALS 16.


    鴟，可指鷂鷹，俗稱老鷹；又指貓頭鷹，又稱角鴟、鴟梟。後世 “ 鴟 ” 多用於 “ 鴟梟 ” ，少指老鷹。


    鳶，指黑耳鳶等，所指範圍窄於鷂鷹，但文獻常用。


    鵟，非鴞形目鳥，而是隼形目鳥。


    ANIMALS 17.


    鷂，指鷹科的雀鷹。


    隼，指隼科的鳥，最小的鷹類。


    鶻，隼的北方別稱，中古才出現。


    鸇，又名晨風，今白尾鷂。'
