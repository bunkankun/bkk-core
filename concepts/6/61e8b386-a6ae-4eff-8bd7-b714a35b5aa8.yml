- ADJUDICATE
- DECIDE
- GIVE A RULING ON
- GIVE A VERDICT ON
zh: 判罪
och: 論
definition: 'DECIDE, as HAVING AUTHORITY, whether someone is GUILTY OR INNOCENT, OR whether an ACCUSATION OR SENTENCE:statement is TRUE OR FALSE.


  DECIDE IN-RELATION-TO the FACTS'
criteria:
- type: old-chinese-criteria
  text: '1. The general legal term for passing judgement is lùn [[論]].


    2. Dāng [[當]] is to sit in judgment of a matter and determine guilt.


    3. Duàn [[斷]] is the conclusion of the process of legal investigation.


    4. Bào [[報]] refers to the announcement of the judgment passed.


    5. Lǐ [[理]] refers to the office of the person who is professionally in charge of passing judgment, the judge.'
- type: huang-jingui
  text: 'HUANG JINGUI 2006


    GOVERNMENT/LAW 39.


    論，漢代斷獄定罪定刑的通稱；若定極刑，示立行無赦。


    當，一般用於定罪，也可用於定刑；若定極刑，可贖、減或赦。


    報，判後上報。'
- type: modern-chinese-criteria
  text: '判斷


    斷定


    判定


    論斷


    判明


    判


    蓋棺論定


    評理'
