criteria:
- type: old-chinese-criteria
  text: 1. The standard word for a mother is mǔ [[母]].
- type: huang-jingui
  text: 'HUANG JINGUI 2006


    HUMAN AFFAIRS 7. 母親。母，通稱。


    嫗，俗稱，常位於丈夫姓氏後。


    媼，尊稱。


    姐，方言詞。


    妣，漢時指亡母。母之兄弟為舅，母之姐妹為姨。'
