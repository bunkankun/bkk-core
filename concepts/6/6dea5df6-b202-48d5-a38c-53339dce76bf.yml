definition: THICK BECAUSE CONTAIING THICK PARTS.
criteria:
- type: old-chinese-criteria
  text: '1. The dominant word for anything physically or otherwise coarsE and not fine or subtle is cū [[粗]] / [[麤]] (ant. xì [[細]] "fine" and jīng [[精]] "subtle and exquisite"). See also ORDINARY


    2. Shū [[疏]] (ant. liáng [[粱]] "exquisite (of food)") refers typically to poor quality coarse food.'
