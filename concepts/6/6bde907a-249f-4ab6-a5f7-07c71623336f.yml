  text: 1. The one word that comes close to the meaning of deserve is dāng [[當]].
- type: modern-chinese-criteria
  text: '應得 is a current modern word for something being deserved.


    值得 refers to something deserving an action regarding it.


    值當


    犯得著


    犯得上


