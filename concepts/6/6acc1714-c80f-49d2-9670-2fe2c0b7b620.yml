concept: WINE VESSEL
zh: 盛酒器
definition: VESSEL USED FOR PUTTING WINE in it.
criteria:
- type: huang-jingui
  text: 'HUANG JINGUI 2006


    FOOD 22. 青銅飲酒器。


    一升曰 “ 爵 ” ， “ 爵 ” 也可作通稱；


    二升曰 “ 觚 ” ；


    三升曰 “ 觶 ” ，


    四升曰 “ 角 ” ；


    五升曰 “ 斝 ” ，


    六七升曰 “ 觥 ” ，


    “ 觥 ” 又作大飲酒器泛稱。


    FOOD 23. 杯，分二類：大口深腹飲酒器；橢圓淺腹盛羹器，盛於戰國至唐。


    盞，小酒杯，口語詞。


    卮，圓筒形大於杯的飲酒器。


    觴，盛了酒的飲酒器通稱。'
