concept: CAMP
zh: 營區
och: 軍／營
definition: PLACE where an ARMY DWELLS.
criteria:
- type: old-chinese-criteria
  text: '1. The current general word for a temporary army camp is jūn [[軍]], and for an army to encamp is to jùn [[軍]].


    2. Yíng [[營]] refers to a more permanent military camp with defenses.


    3. Tún [[屯]] refers to a defended military settlement of a permanent or semi-permanent kind, a garrison, often on the borders.'
