definition: FEATURE which CAUSES THINGS TO BECOME VISIBLE AND LACKING which they are NOT VISIBLE.
criteria:
- type: old-chinese-criteria
  text: '1. The dominant general word for light of any kind is guāng [[光]].


    [GENERAL]; [[COMMON]]


    2. Huǒ [[火]] refers primarily to artificial light from burning lamps etc..


    [ARTIFICIAL]


    3. Xī [[曦]] refers to the nascent sunlight of the rising sun.


    4. Yào [[耀]] and huī [[輝]] refer to bright sunlight.'
- type: modern-chinese-criteria
  text: '光線


    光


    亮光 refers to a flash of light.


    IT IS CURIOUS THAT I CANNOT SEEM TO FIND MORE SYNONYMS!


    rough draft to BEGIN TO identify synonym group members for analysis, based on CL etc. 18.11.2003. CH ／'
