concept: TRIBUTE
zh: 貢稅
definition: RITUAL TAXES PAID REGULARLY to a RULER by his DISTANT SUBJECTS.
criteria:
- type: old-chinese-criteria
  text: '1. The current general word for tribute, typically paid by a senior subordinate, to a ruler is gòng [[貢]].


    2. Zhí [[職]] refers to tributary offerings from anyone of any status.


    3. The general term for all sorts of such tribute are gòng zhí [[貢職]] and zhí gòng [[職貢]].'
- type: modern-chinese-criteria
