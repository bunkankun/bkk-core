criteria:
- type: old-chinese-criteria
  text: '1. The current word for descending is jiàng [[降]] (ant. shēng [[升]] "ascend", dēng [[登]] "ascend").


    2. Xià [[下]] (ant. shàng [[上]] "ascend") sometimes refers colourlessly to something moving downwards.'
