zh: 碑
definition: STONE PUT on a TOMB.
criteria:
- type: old-chinese-criteria
  text: '1. The current word for an inscribed tombstone or stele is bēi [[碑]], and specifically this was of square form.


    2. Jié [[碣]] refers to the round inscribed tombstone.'
- type: huang-jingui
  text: 'HUANG JINGUI 2006


    HUMAN AFFAIRS 60.


    碑，記載死者的功德的長方形墓碑。


    碣，記載死者功德、圓形、上小下大的墓前標志物。


    楬，置於身份低下的死者墓前，標識其姓名以便家屬辨認的小木樁。'
- type: modern-chinese-criteria
