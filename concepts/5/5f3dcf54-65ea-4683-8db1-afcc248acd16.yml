definition: ABSTRACT PICTURE of TERRITORY.
criteria:
- type: huang-jingui
  text: 'HUANG JINGUI 2006


    GEOGRAPHY 24.


    圖，各種各類圖的總稱。


    “ 地圖 ” ，各種地圖的通稱。


    版圖，本是古代宮中小吏及其子弟的名籍和宮室方位圖的合稱，後指戶籍疆域地圖，相當於當今政區地圖。


    輿地圖，即 “ 地圖 ” ，以 “ 輿 ” 修飾 “ 地圖 ” ，表示地圖上盡量包羅當時的田賦、戶口等內容，漢代始用。'
