zh: 掠奪
och: 奪
definition: STEAL, USING VIOLENCE.
criteria:
- type: old-chinese-criteria
  text: "1. The current word for appropriating something that is not one's own by right is duó [[奪]].\n\n2. Jíé [[劫]] adds to the notion of misapropriation that violence or threat of violence.\n\n3. L\x9Fè [[掠]] typically refers to misapropriation by military force.\n\n4. L\x9Fè [[略]] refers specifically to the misappropriation of territory or a population.\n\nNB: Qiǎng [[搶]] is post-Han, possibly as late as Ming."
