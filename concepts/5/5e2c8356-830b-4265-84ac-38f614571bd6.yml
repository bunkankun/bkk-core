criteria:
- type: old-chinese-criteria
  text: '1. The standard word for the toe is in fact that same as that for a finger, zhǐ [[指]].


    2. Gāi [[胲]] is occasionally mentioned as the big toe as a delicacy.


    3. Mǔ [[拇]] refers to the big toe.'
