zh: 交換
och: 易
definition: GIVE something to someone so as to RECEIVE something OTHER from him.
criteria:
- type: old-chinese-criteria
  text: '1. The current general word for exchanging things in any way is yì [[易]].


    2. Liú [[流]] refers to the flow and circulation of goods.


    3. Tōng [[通]] focusses on the unimpeded freeness of the exchange.'
