zh: 次序
och: 次
definition: JUXTAPOSITION of THINGS OR EVENTS BEFORE OR AFTER EACH OTHER.
criteria:
- type: old-chinese-criteria
  text: '1. The current general term for the orderly sequential arrangement of things is cì [[次]].


    2. Xù [[序]] refers to the proper (often hierarchical) sequence of things.


    3. Zhì [[秩]] simply refers abstractly to the absence of arbitrariness in a sequence.'
