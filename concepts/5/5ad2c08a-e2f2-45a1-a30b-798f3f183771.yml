zh: 報仇
och: 報
definition: DAMAGE someone who one BELIEVES has ACTED:committed WICKED ACTS AGAINST one OR AGAINST one's FRIENDS.
criteria:
- type: old-chinese-criteria
  text: '1. The standard word for revenge is bào [[報]] (ant.* shè [[赦]] "let off").


    2. Fù [[復]] (ant. miǎn [[免]] "let off") is occasionally used to refer to revenge in limited idiomatic contexts like fù chóu [[復仇]].'
- type: modern-chinese-criteria
  text: '報仇 is the current modern word for revenge.


    復仇 is a more literary current word for revenge.


    冤結 (rare) is a literary word for revenge.


    鞭尸 refers to symbolic revenge for something one is unable to avenge properly.


    鞭尸三百


    報仇雪恨


    rough draft to BEGIN TO identify synonym group members for analysis, based on CL etc. 18.11.2003. CH ／'
