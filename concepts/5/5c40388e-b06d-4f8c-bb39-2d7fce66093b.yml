type: concept
concept: CROSSROADS
zh: 岐路
definition: PLACE WHERE TWO OR MORE WAYS are LINKED.
criteria:
- type: old-chinese-criteria
  text: '1. Qú [[衢]] refers generally to an intersection of roads, either in a city or in the countryside, from which one can move in four or more directions, once in CC even nine directions.


    2. Chōng [[衝]] refers to such an intersection especially as a centre of communications.


    3. Jiē [[街]] is sometimes used to refer to a cross-road within a city.


    ERYA [[一達謂之道路]]；[[二達謂之歧旁]]；[[三達謂之劇旁]]；[[四達謂之衢]]；[[五達謂之康]]；[[六達謂之莊]]；[[七達謂之劇驂]]；[[八達謂之崇期]]；[[九達謂之逵]]。 is a wonderful example of rationalisation in lexicography.'
- type: modern-chinese-criteria
  text: '路口


    街口


    街頭


    十字路口


    十字街頭


