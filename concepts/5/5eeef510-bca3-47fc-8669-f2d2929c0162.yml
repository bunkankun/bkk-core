type: concept
concept: CULTIVATE
zh: 修養
definition: Be DILIGENT TRYING to BASICALLY IMPROVE ONESELF.
criteria:
- type: old-chinese-criteria
  text: '1. The current general term for cultivating something or refining it is xiū [[修]] (from Han times onwards sometimes also miswritten as xiū [[脩]], ant.* màn [[慢]] "neglect the cultivation of").


    2. Yǎng [[養]] refers specifically to the systematic cultivation of higher psychosomatic competence.


    3. Lǐ [[理]] refers, occasionally, to a rather abstract way of cultivating a certain skill or technique.'
