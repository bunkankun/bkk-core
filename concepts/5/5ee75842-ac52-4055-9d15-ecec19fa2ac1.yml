zh: 車蓋
och: 蓋
definition: VEHICLE PART in the form of a ROOF OVER a VEHICLE, ON a POLE, TYPICALLY RESEMBLING AN UMBRELLA.
criteria:
- type: huang-jingui
  text: 'HUANG JINGUI 2006


    COMM 14.


    蓋，建於車箱中的一把傘形物，可靈活裝上取下；漢代盛行。


    轓, ，坐車兩側輪上用竹席或皮革製成、向外翻出的車耳。


    屏泥，在車前軾下擋泥的構件。


    更多的坐車是施用帷幔。


    幨，垂掛輿四周者。


    帷，垂掛輿兩旁者，也可作帷幔泛稱。


    幔，合頂部與四旁者之稱。幰 (xi[U+01ce]n) ，軒車之張掛輿前者。其中有些障礙物的用色、質料往往按乘者官職大小區別，有封建禮儀色彩。'
