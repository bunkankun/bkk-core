zh: 打官司
och: 訟
definition: COMPETE with OTHERS USING the LAW.
criteria:
- type: old-chinese-criteria
  text: '1. The general word for any lawsuit one person takes out against another is sòng [[訟]].


    2. Yù [[獄]] typically refers specifically to a criminal lawsuit.'
- type: huang-jingui
  text: 'HUANG JINGUI 2006


    GOVERNMENT AND LAW 36. 訴訟。


    訴，將自己所受的不平之事告訴司法部門，最早出現於漢代。


    訟，對仲裁人告訴并爭辯彼此的是非曲直。


    告，主動告訴他人的犯罪言行，春秋戰國時已見。


    發，將他人隱蔽的犯罪言行告訴有關部門。'
- type: modern-chinese-criteria
  text: '訴訟


    詞訟


