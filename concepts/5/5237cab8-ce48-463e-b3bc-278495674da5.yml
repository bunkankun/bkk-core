zh: 晚上
och: 夕
definition: PERIOD of DAY BEFORE one SLEEPS AND LATER:after one STOPS WORKING.
criteria:
- type: old-chinese-criteria
  text: '1. The current general word for the evening is xì [[夕]] (ant. zhāo [[朝]] "morning"), and the term refers to the period when the sun is declining and including the time when the sun has just gone down.


    2. Huì [[晦]] (ant. míng [[明]] "full morning, morning immediately after daybreak") and mù [[暮]] (ant. dàn [[旦]] "morning") refer to time when it is beginning to get dark. The focus is on reduced light conditions.


    3. Wǎn [[晚]] can refer to the evening from Han times onwards.'
- type: huang-jingui
  text: 'HUANG JINGUI 2006


    ASTRONOMY 29.


    夕，太陽西斜時。夕後是 “ 暮 ” 。


    暮後是 “ 昏 ” ，即黃昏。


    夜，狹義只指由人定（晚八、九點）至翌日雞鳴前五、六小時。


    晚，本遲緩義，漢代起可渾稱夜晚。'
