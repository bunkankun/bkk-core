zh: 投降
definition: ADMIT PUBLICLY that one is DEFEATED.
criteria:
- type: old-chinese-criteria
  text: '1. The current general word for any form of submitting to someone or surrendering to the enemy is fú [[服]].


    2. Xiáng [[降]] refers specifically to forced, non-voluntary surrender to an enemy.


    3. Xià [[下]] is a neutral technical term for giving up fighting in a military context.


    4. Chéng [[成]] and jiǎng [[講]] refer to a formal process of sueing for peace.'
- type: modern-chinese-criteria
  text: '投降


