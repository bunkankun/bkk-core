definition: PRODUCE a DOCUMENT.
criteria:
- type: old-chinese-criteria
  text: '1. The standard current word for writing something down or noting it down is shū [[書]], and this word can never refer to an act of literary creation.


    2. Zhù [[著]] and zhuàn [[撰]] are late words referring to the act of writing of a text.


    3. Xiě [[寫]] refers to copying and transcribing rather than writing as such.


    4. Lù [[錄]], zhì [[志]], and jì [[記]] refer to the act of recording, formally or informally.


    5. Biān [[編]], lí [[離]], and zhǔ [[屬]] refer to the compilation of texts.'
- type: huang-jingui
  text: 'HUANG JINGUI 2006


    EDUCATION 14. 文獻複製。


    書，書寫的通稱。


    寫，抄寫、臨摹；宋代以後產生書寫義。


    錄，抄錄。


    鈔，專指謄寫。


    謄，照原稿抄寫，後起口語詞。


    用於字畫：臨，照原樣抄寫；


    摹，直接將紙覆在原本上照抄。


    描，依樣摹寫或繪畫，成都輕於摹。'
