criteria:
- type: old-chinese-criteria
  text: '1. Shéng [[繩]] is the abstract term for a line is the word for the thread/rope, used figuratively, often expanded to shéng mò [[繩墨]] "the inkline".


    2. Háng [[行]] refers specificallty to a line of text. MOVE THIS TO LINE-OF-WRITING


    3. Jìng [[徑]] refers specifically to the line constituted by a diameter of a circle.'
