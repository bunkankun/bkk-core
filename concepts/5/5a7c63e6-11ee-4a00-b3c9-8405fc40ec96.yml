concept: OLD LADY
zh: 老太婆
och: 媼
definition: OLD WOMAN.
criteria:
- type: huang-jingui
  text: 'HUANG JINGUI 2006


    HUMAN AFFAIRS 28. 老婦。


    母，通稱；用於面稱時，可作尊稱。


    嫗，俗稱或蔑稱，常位於本人姓氏或表示特徵的詞語後。


    媼，尊稱，用於敘稱、面稱皆可，方言詞。


    負，俗稱，用於姓氏後。'
