uuid: 51f3e644-6a3d-484b-b92e-db27d286e973
type: concept
concept: SCALES
zh: 秤
definition: TOOL USED FOR WEIGHING THINGS.
criteria:
- type: old-chinese-criteria
  text: '1. General word for scales is chèng [[秤]] / [[稱]], which occurs already in LSCQ. It refers to the whole implement, i.e. both to the weighing rod and the weight. Today, typical Chinese lever scales consists of the weighing rod and the weight suspended from it. The thing to be weighed is put on the bowl hanged down from the one end of the weighing beam, and its weight is determined by moving the weight till balance between the weight and weighed thing is reached. It seems that this type of scales came to be used only in Tang times. Scales known from the Warring States period consists of the wooden stick with two small bronze bowls suspended from its both sides; the things to be weighed were put on one bowl and weights on the other.


    2. Héng [[衡]] refers to the whole of the weighing contraption, the scales, but the term does not include a weight.


    3. Quán [[權]] refers to the weight. Weights known from the Warring States period are usually made of bronze. According to the late Warring States and Han texts, they were divided into five categories - zhū [[銖]], liǎng [[兩]], jīn [[斤]], jūn [[鈞]], and shí [[石]] - but it should be noted that situation was more complicated, and in Warring States times weights differred from state to state.


    4. Chuí [[錘]] refers to the weight. According to FANG YAN, in Han times the word was used in the area of ancient states of Lu and Song; later it came to be used as general word for the weight.


    5. Quán [[銓]], when used in the meaning "scales" is synonymous with chèng [[秤]], but the word is rare.'
- type: huang-jingui
  text: 'HUANG JINGUI 2006


    TRADE 21.


    衡，天平，特指天平的衡杆；後泛指桿秤的秤桿。


    稱，桿秤，東漢末出現。


    權，上古秦漢指天平稱的砝碼；桿秤出現後，也指秤砣。


    錘，桿秤的秤砣。


    銓，上古時衡器總稱，泛指用來稱物重量的器具，多用於書面語。'
- type: modern-chinese-criteria
  text: '秤


