zh: 脂肪
och: 脂
definition: SUBSTANCE which is not MUSCLE AND CAUSES one to be FAT OR RESEMBLING SUBSTANCE PRODUCED USING ANIMALS OR PLANTS.
criteria:
- type: old-chinese-criteria
  text: Huang
- type: huang-jingui
  text: 'HUANG JINGUI 2006


    HUMAN BODY 29.


    脂、膏，都是組織結構。


    脂，間於皮膚和瘦肉之間的腠理固密的白色部分。


    膏，間於肌肉之間的白色部分。肪，腰背部的油脂。


    膋，腸間的脂肪。


    臅，胸腔內的脂膏，文獻僅用於狼。'
