concept: CAT
zh: 貓
definition: COMMON SMALL FELINE OFTEN REARED IN HOMES.
criteria:
- type: huang-jingui
  text: 'HUANG JINGUI 2006


    ANIMALS 10. 貓科為主的小猛獸。


    貓，貓科動物總稱。


    狸，可指家貓、靈貓科的靈貓、豹貓、犬科的貉。


    貓狸，指金貓、豹貓。


    狸貓，指家貓、豹貓、叢林貓。


    九節狸，大小靈貓，今多指大靈貓。'
