zh: 負擔
definition: What is HEAVY AND SHOULD:must be ENDURINGLY CARRIED.
criteria:
- type: old-chinese-criteria
  text: '1. The standard word for a burden is rèn [[任]]. The word is often used figuratively to refer to burdens of duty. See DUTY.


    2. Hè [[荷]] is a rarer word for whatever is borne on one''s shoulders, and this word is also occasionally used in figurative senses.


    3. Zhòng [[重]] can come to refer to something heavy one carries.'
