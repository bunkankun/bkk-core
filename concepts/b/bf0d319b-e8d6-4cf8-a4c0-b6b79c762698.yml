zh: 瘦
och: 瘠
definition: THIN AND NOT FAT, of HUMANS AND ANIMALS.
criteria:
- type: old-chinese-criteria
  text: '1. The most current general word for skinniness is probably jí [[瘠]] / [[膌]] (ant. féi [[肥]] "fat").


    2. Qú [[臞]] (ant. rǎng [[壤]] [ [[肉字旁]] ]) refers to skinniness in humans.


    3. Léi [[羸]] refers to skinniness as a result of famine or of disease.


    4. Shòu [[瘦]] is rare in pre-Buddhist times, and refers generally to emaciation.'
- type: huang-jingui
  text: 'HUANG JINGUI 2006


    HUMAN BODY 46.


    瘠，上古時期的通語，是程度最嚴重的瘦，是瘦至露骨。


    [ 病 FOR 月 IN THE ALTERNATIVE CHARACTER] （臞），由於心情憂鬱而導致肌肉不豐。


    瘦，東漢後期以來的表示人體消瘦的通稱。


    羸，瘦弱，兼氣力而言，多用於年老體病者。'
- type: modern-chinese-criteria
  text: '瘦


    纖細


    輕盈 refers to something being slim and graceful.


    亭亭玉立


    纖弱


    玉立


    瘦子


    瘦猴


