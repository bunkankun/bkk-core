type: concept
concept: LIQUID
zh: 液汁
definition: SUBSTANCE which CAN FLOW.
criteria:
- type: old-chinese-criteria
  text: '1. The current general word for any liquid of any kind, drinkable or not, is yè [[液]], and the term is of prime importance in medical texts.


    2. Zhī [[汁]] "liquid" refers to anything where water has an admixture of something else, or which is the result of squeezing liquid out of something.'
- type: modern-chinese-criteria
  text: '液汁


