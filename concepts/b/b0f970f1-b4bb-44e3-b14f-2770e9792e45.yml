zh: 小船
definition: SMALL SHIP.
criteria:
- type: huang-jingui
  text: "HUANG JINGUI 2006\n\nCOMM 25.\n\n舲，先秦吳越一帶有窗� \x91 和屋面的華麗小客船。\n\n舠，體型短寬、穩性較好的小運輸船。\n\n艒（ m[U+00e0]o ）舟宿、艖，都是細長、狹底的輕薄小船。\n\n艇，小於 “ 艒舟宿 ” 的船。\n\n舟符，身短腹深的小船。\n\n舼（ qi[U+00f3]ng ），浙越一帶深腹的小船。\n\n欐，小船泛稱。\n\n艓，輕便小船泛稱。\n\n舴艋，蚱蜢形小船。\n\n鵃舟了，細長而快的小船。"
