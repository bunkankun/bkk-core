type: concept
concept: HISTORY
zh: 歷史
definition: The DEVELOPMENT of EVENTS in the PAST, PRESENT, AND FUTURE.
criteria:
- type: old-chinese-criteria
  text: '[[史]] refers to officials in charge of historical records on the one hand, and on compilations like those they compile on the other. The development of a standard current term for historia ipsa, the historical developments themselves, was late and still needs to be explored. In the Guodian Luncong 1 we find [[春秋]] for historiography contrasting with [[古今之事]].'
- type: modern-chinese-criteria
  text: '歷史


    陳跡


    史跡


    老黃曆


    來歷 refers to the historical background of something and does not focus on history as such.


    rough draft to BEGIN TO identify synonym group members for analysis, based on CL etc. 18.11.2003. CH ／'
