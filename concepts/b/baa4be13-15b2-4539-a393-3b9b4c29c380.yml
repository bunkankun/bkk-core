zh: 器械
definition: COMPLEX TOOL which HAS MANY PARTS.
criteria:
- type: old-chinese-criteria
  text: '1. The general term for any mechanical device, especially any such device used in weaponry, is xiè [[械]].


    2. Jī [[機]] refers specifically to a triggering device on weapons, but also more generally to any complex mechanical device.


    3. Yǐn [[檃]] refers to a mechanical device for straightening timber.'
- type: modern-chinese-criteria
  text: '器械


    機器


