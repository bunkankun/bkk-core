zh: 商人
och: 商/賈
definition: ADULT whose WORK is to BUY AND SELL THINGS so as to PRODUCE a SALARY:income.
criteria:
- type: old-chinese-criteria
  text: '1. The general term for an itinerant trader is shāng [[商]]; the general term for a sedatory trader or merchant is gǔ [[賈]].


    2. Fàn [[販]] refers to a small scale merchant, typically of the intinerant sort.'
- type: huang-jingui
  text: 'HUANG JINGUI 2006


    TRADE 5.


    商，往來販運促進各地商品流通的商人；也作商人的通稱。


    賈，在固定市肆做買賣的大商人；也作商人的通稱，中古前主要的通稱是 “ 賈 ” ，以後是 “ 商 ” 。


    販，低價買進轉手高價賣出的小商人。


    商旅，出行在外的商人。'
