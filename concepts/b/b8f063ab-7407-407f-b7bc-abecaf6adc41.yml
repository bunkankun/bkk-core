zh: 繪畫
definition: 'PRODUCE a PICTURE of something.


  [CHANGE THE LABEL? "PAINT" IS ALREADY TAKEN!]'
criteria:
- type: huang-jingui
  text: 'HUANG JINGUI 2006


    ART 10.


    圖，先秦時期，主要指畫土地山川之形貌，至兩漢時期，也常用來指描摹人物及其他物象。


    畫，偏重於以線條來勾勒、描摹物象，泛指敷陳五彩之繪畫。


    繪，用敷設五彩的方式來描繪。


    寫，依照實物進行摹畫。'
