zh: 載物車
och: 輜
definition: VEHICLE USED to TRANSPORT THINGS.
criteria:
- type: old-chinese-criteria
  text: '1. The current general word for means of transportation of goods is zī [[輜]]. The word also refers specifically to the means of transportation of goods used in military campaigns. These carts had roofs and railings covered with sheeting on all sides.


    2. Jú [[輂]] refers to a large horse-drawn carriage for the lugging of goods.'
