zh: 星星
och: 辰
definition: VISIBLE THING IN the NIGHT SKY LACKING CLOUDS.
criteria:
- type: old-chinese-criteria
  text: '1. The most general word for stars is the not very common chén [[辰]], but the word can also be used to refer to specific stars. (Note however, that in early times chén [[辰]] currently referred to specific stars such as the North Pole Star.)


    2. The common use word for a star is xīng [[星]] and this term does not incluce sun and moon.


    3. Xiù [[宿]] refers specifically to a constellation of stars.'
- type: huang-jingui
  text: 'HUANG JINGUI 2006


    ASTRONOMY 3.


    星，可用來指四象、二十八宿及其他部分星座。


    垣，主要用來指三垣及左右垣。


    宿，主要用來指二十八宿，偶爾也指稱部分其他星座。宮，可用來指 “ 中 ” 、 “ 東 ” 、 “ 南 ” 、 “ 西 ” 、 “ 北 ” 五宮，也用來指 “ 紫微 ” 、 “ 太微 ” 、 “ 文昌 ” 三宮。'
- type: modern-chinese-criteria
  text: '星辰


