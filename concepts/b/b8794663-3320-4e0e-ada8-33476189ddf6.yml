zh: 手
och: 手
definition: LOWEST MAJOR PART of the ARM.
criteria:
- type: old-chinese-criteria
  text: '1. The standard word is shǒu [[手]] "hand", which can refer to the arm as a whole.


    2. Quán [[拳]] "fist" refers to the clenched fist.


    3. Zuǒ [[左]] and yòu [[右]] are words used for the left and right hand respectively.


    4. Wàn [[腕]]／[[掔]] refers to the wrist.'
