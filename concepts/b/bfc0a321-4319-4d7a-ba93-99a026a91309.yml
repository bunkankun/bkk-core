zh: 侮辱
och: 侮
definition: Be IMPOLITE to someone so as to CAUSE that person to FEEL SHAME.
criteria:
- type: old-chinese-criteria
  text: '1. The general word for personally and demonstratively humiliating and insulting a person is wǔ [[侮]] (ant. lǐ [[禮]] "treat politely, show proper politeness towards").


    2. Rǔ [[辱]] stresses in the notion of humiliating insult that of demonstratively inflicting a lasting public disgrace.


    3. Xiū [[羞]] is occasionally used to refer to reducing someone to personal and intimate feelings of personal shame.'
