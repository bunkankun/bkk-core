concept: SUGAR
zh: 糖
definition: INTENSELY COMMON SWEET SUBSTANCE OFTEN USED IN COOKING. [CHEMISTRY]
criteria:
- type: huang-jingui
  text: 'HUANG JINGUI 2006


    FOOD 45. 本土食糖。


    飴，用黍米、稻米或小麥大麥熬製出來的甜食，我國最早的人工製糖；特指稀薄，呈漿狀的一種。


    餳，較厚、乾的飴糖。


    糖，最早指麥芽糖，後來指蔗糖；大約唐代起，成為糖類食品的總稱。


    FOOD 46.


    蔗糖，三國至唐代以前已產生。最初的蔗糖稱 “ 蔗餳 ” ，是呈膠狀的蜜糖。南北朝時已有晶粒狀的 “ 沙糖 ” 。


    石蜜，在沙糖的基礎上進一步提取的結晶糖塊。糖霜，冰糖。'
