definition: SITUATION APPROPRIATE FOR ACHIEVING something.
criteria:
- type: old-chinese-criteria
  text: '1. The current word for an opportunity presenting itself is shí [[時]].


    2. Huì [[會]] refers to a coincidental opportunity.'
