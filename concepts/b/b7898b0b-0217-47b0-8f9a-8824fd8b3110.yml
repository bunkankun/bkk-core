zh: 嘔吐
och: 吐
definition: ISSUE FOOD FROM the MOUTH.
criteria:
- type: old-chinese-criteria
  text: '1. The most current general term for emitting anything from the mouth is tù [[吐]]. See also SPIT


    2. O ㄆ[[嘔]] refers specifically to throwing up.


    NB: Qìn [[唚]] "(of cats and dogs) to vomit" is post-Han.'
- type: huang-jingui
  text: 'HUANG JINGUI 2006


    HUMAN BODY 12. 嘔吐。


    吐，通稱。嘔，不能自制地涌吐。


    [ 口＋見 ] ，不作嘔而吐，專指小兒吐乳。


    唾，特意吐唾沫；也可無意中唾出水、涕、痰、血，多隨咳嗽而吐出。


    歍，惡心而嘔狀，無物吐出。


    噦，本指呃逆，唐以來指乾嘔。'
