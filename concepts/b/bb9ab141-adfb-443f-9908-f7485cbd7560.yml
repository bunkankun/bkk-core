definition: INVESTIGATE the TRUTH of a SENTENCE:statement.
criteria:
- type: old-chinese-criteria
  text: '1. The current standard word for cross-checking and veryfying a statement is cān [[參]] which refers to the cross-checking of a public statement against the realities it claims to refer to.


    2. Yàn [[驗]] and zhēng [[徵]] refer to an attempt to find specific good evidence (often historical evidence) for something.


    3. Hé [[覈]] refers to checking out the real facts of a case someone is making.'
