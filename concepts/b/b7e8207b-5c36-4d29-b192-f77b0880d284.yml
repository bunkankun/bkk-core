type: concept
concept: FLESH
zh: 肌肉
och: 肉１
definition: MUSCLES AND SINEWS of a ANIMAL OR HUMAN.
criteria:
- type: old-chinese-criteria
  text: '1. The general term for animal flesh or or any flesh viewed as possible food is ròu [[肉]]. See MEAT.


    2. Jī [[肌]] refers to living human flesh and muscle, but the word has extended uses like "flesh" in "the flesh of an orange".'
- type: huang-jingui
  text: 'HUANG JINGUI 2006


    BODY 27. 肉，秦漢後用於人，泛指人肉。


    肌，附著在人體骨頭上的肉。


    腴，人或動物腹下的肥肉。


    胂，腰 [ 月＋氐 ] 骨兩旁的肌肉。


    脢，背上的肉。'
- type: modern-chinese-criteria
  text: '肌肉


    肌


    筋肉


    rough draft to BEGIN TO identify synonym group members for analysis, based on CL etc. 18.11.2003. CH ／'
