zh: 不禮貌
och: 無禮
definition: INTERACT so as to be UNRESTRAINED AND NOT POLITE to OTHERS.
criteria:
- type: old-chinese-criteria
  text: '1. The standard word for public impoliteness is wǔ [[侮]] which enters surprisingly often into descriptive and perhaps intensitive binomes.


    2. The current philosophically explicit phrase is wú lǐ [[無禮]]'
- type: modern-chinese-criteria
  text: '不禮貌


    不客氣


    簡慢


    怠慢


    輕慢


    少禮


    非禮


    失禮


    不周 refers to inconsiderate and thoughtless rather than deliberate politeness.


    元龍高臥


    rough draft to BEGIN TO identify synonym group members for analysis, based on CL etc. 18.11.2003. CH ／'
