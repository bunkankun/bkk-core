zh: 塵土
definition: INTENSELY DRY SOIL in INTENSELY SMALL PIECES which CAN BE BLOWN at AND MOVED by WIND.
criteria:
- type: old-chinese-criteria
  text: '1. Chén [[塵]] is the general word for dry dust.


    2. Āi [[埃]] refers primarily to to light dry quality of dust, and then generally dust, but the word is rarely used by itself.


    3. Gòu [[垢]] is the general word for dust when it regarded as dirty. See DIRT'
- type: huang-jingui
  text: 'HUANG JINGUI 2006


    GEOGRAPHY 19. 塵埃。


    塵，通稱。


    埃，飛揚的塵土，多與與他詞連用。


    堁，楚方言詞。


    堨，漢代詞。'
