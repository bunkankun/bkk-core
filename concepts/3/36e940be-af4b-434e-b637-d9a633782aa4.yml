type: concept
concept: SUBSTANCE
zh: 物質
och: 質
definition: THING NOT SEPARATED into SEPARATE PARTS.
criteria:
- type: old-chinese-criteria
  text: '1. The general term for substance as opposed to form or appearance is zhì [[質]], and this troubling term desperately need systematic investigation.


    2. Tǐ [[體]] is occasionally used to refer to the physical mass of something.


    3. Shí [[實]] sometimes refers to the real substance of a matter as opposed to insubstantial thinking about it, or attitudes.'
- type: modern-chinese-criteria
  text: '物質


    質


    素


    rough draft to BEGIN TO identify synonym group members for analysis, based on CL etc. 18.11.2003. CH ／'
