concept: HAIRPIN
zh: 釵
och: 釵
definition: METAL ORNAMENT USED to FIX HAIR.
criteria:
- type: old-chinese-criteria
  text: '1. Standard term for a hairpin which holds headgear or a hat is jī1 [[笄]]. The implement was used both by men and women, and could be made of bone, ivory, jade, since the Han also of silver and gold. Finds are known already from the Neolithic.


    2. Zān [[簪]] is a term for a hairpin which came to use during the Warring States period.'
