zh: 問
och: 問
definition: REQUEST an ANSWER.
criteria:
- type: old-chinese-criteria
  text: '<div>&amp;lt;div&amp;gt;[ASCENDING/DESCENDING][[COMMON/RARE]][GENERAL/SPECIFIC][INFORMAL/OFFICIAL]1. The general word is wèn [[問]] "open a dialogue by consulting someone with a question, modern Chinese [[請教]]" (ant. duì [[對]] "reply (to a superior questioner)" which typically refers to the consultation of a person who is supposed to know something. When the adressee is explicit, the questioner is typically of higher status than the addressee, and the reply is correspondingly often phrased politely as duì yuē [[對曰]]. When there is no explicit addressee (X asked about Y), the addressee often is of higher status (e.g. a teacher).[SPECIFIC]; [[COMMOM+]] Note that [[問]] can apparently not be used abstractly to men "raise a (philosophical) question or issue" without opening a dialogue with someone assumed to be in the know. 2. Qǐng [[請]] is occasionally used to refer to polite requests for information.[[RARE]]3. Nàn [[難]] is to ask intellectually hostile questions regarding something which the person questioned has said or maintains as true, to make objections. See DISAGREE and REFUTE which are difficult to distinguish from each other and from this.[SPECIFIC], [HORIZONTAL]4. Fǎng [[訪]] typically refers to questioning addressed to superiors.[ASCENDING]5. Xún [[詢]] typically refers to rather formal questions addressed to inferiors.[DESCENDING], [OFFICIAL]6. Zī [[諮]]／[[咨]] refers to questions addressed to a specialist.[SPECIFIC]7. Zōu [[諏]] all refer to some kind of official soliciting of formal opinions.[OFFICIAL]; [[RARE]]8. Yuē [[曰]] is regularly used to introduce related questions as reactions within an ongoing dialogue. 9. Wèi [[謂]] may introduce what are in fact questions rather than statements. 10. Wèn yuē [[問曰]] introduces a a question that opens a new dialogue or a discrete new phase in a dialogue. NB: 1. ASKing in Chinese us always dialogic: one cannot ask oneself any question [[問己]], and one cannot abstractly just raise an abstract question as an intellectual issue worthy of discussion. There seems to be no word in classical Chinese for "asking a question" without addressing this question to an audience.&amp;lt;/div&amp;gt; 2. It seems that it is impossible in pre-Buddhist Chinese to answer a question by asking another question.</div><div><br></div>'
- type: modern-chinese-criteria
  text: '問 is the general word referring to the asking of questions.


    發問 focusses specifically on the initiative of the questioner posing a question.


    提問 focusses specifically on the nature of the question asked.


    訊問 focusses specifically on the process of eliicting answers to a question from someone.


    問訊 is a rather formal or literary word referring to making polite inquiries.


    叩問 is a polite literary way of referring to the posing of a question.


    叩 is an obsolescent highly literary and obscure word for asking questions.


    first rough draft to identify synonym group members for future analysis 18.11.2003. CH ／'
