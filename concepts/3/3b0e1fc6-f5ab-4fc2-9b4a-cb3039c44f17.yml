- type: old-chinese-contrasts
  text: 'CHANGDUANJING:


    樂書曰：


    知聲而不知音者，


    禽獸是也。


    知音而不知樂者，


    眾庶是也。


    唯君子為能知樂。


    是故審聲以知音，


    審音以知樂，


    審樂以知正，


    而理道備矣。


    此又音聲之異也。）'
