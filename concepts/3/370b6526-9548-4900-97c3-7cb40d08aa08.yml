concept: KITSCH
zh: 媚俗
definition: SENTIMENTALLY BEAUTIFUL AND VULGAR.
criteria:
- type: modern-chinese-criteria
  text: 'We need to investigate when and how Chinese notions along these lines have emerged.


    Lin Yutang has no word which he translates by "kitsch".


    Even the translation of the Oxford English Dictionary, the 英語辭海, only a discursive paraphrase is offered for "kitsch", no current word is suggested.


    However, we do have:


    媚俗


    粗俗作品


    rough draft to BEGIN TO identify synonym group members for analysis, based on CL etc. 18.11.2003. CH ／'
