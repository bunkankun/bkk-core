zh: 神聖
definition: OBSCURE, NOT ORDINARY, AND BELIEVED TO HAVE BIG POWER, AND which one CAN NOT PERCEIVE.
criteria:
- type: old-chinese-criteria
  text: '1. The general and very common term referring to whatever is supernatural or divine in any way, and thus superior to what is ordinarily human or natural, is shén [[神]].


    2. Líng [[靈]] tends to refer specifically to the supernatural efficiency and divine dynamics inherent in something or someone, and insofar as these interfere in human affairs.'
