zh: 冒
definition: ACT so as to DELIBERATELY CAUSE ONESELF or one's PROPERTY to be in DANGER.
criteria:
- type: modern-chinese-criteria
  text: '冒險 is the standard word for taking a risk.


    保險額 refers to the quantified risk.


    作賭注 is to risk money in gambling.


    冒危險去做 is to take a risk and go ahead with an action.


    風險 refers to a hazard or risk involved in an action.


    rough draft to BEGIN TO identify synonym group members for analysis, based on CL etc. 18.11.2003. CH ／'
