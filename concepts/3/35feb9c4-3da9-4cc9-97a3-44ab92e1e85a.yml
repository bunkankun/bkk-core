  text: 'HUANG JINGUI 2006


    COMM 9.


    輈，戰國前馬車車杠之稱，都是單杠上曲。


    轅，戰國以來各種車輛車杠的通稱，大多雙杠，也有單杠。


    輈交於軸，上壓車輿。'
