concept: IN-LAWS
zh: 外宗
och: 外宗
definition: RELATIVES BECAUSE of MARRIAGE.
criteria:
- type: old-chinese-criteria
  text: '1. The general term for in-laws is wài zōng [[外宗]].


    2. Hòu jī [[后姬]] refers to royal or imperial in-laws.'
- type: huang-jingui
  text: 'HUANG JINGUI 2006


    SISTERS-IN-LAW 15. 妯娌。


    姒，兄弟妻中的幼者稱長者。


    娣，兄弟妻中的長者稱幼者。


    先後，姒娣的合稱，泛指妯娌。


    築娌，方言詞。


    嫂，弟或弟妻稱兄妻。'
