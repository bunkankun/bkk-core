zh: 愚笨
och: 愚
definition: LACK APPROPRIATE INTELLIGENCE.
criteria:
- type: old-chinese-criteria
  text: '<div>1. The dominant word is yú [[愚]] (ant. zhì [[智]] "clever; wise"), and the word refers to moral as well as intellectual obtuseness as well as moral irresponsibility and practical ineptitude. </div>2. Zhuó [[拙]] (ant. jié [[捷]] "nimble") refers to practical manifest ineptitude. 3. Chī [[癡]] (ant. yǐ4ng [[穎]] "very clever") refers to moronic congenital intellectual ineptitude. 4. Lǔ [[魯]] and dùn [[鈍]] (ant. huì [[慧]] "clever") tends to refer to boorish and rustic bluntness of and moral sensibility. 5. Bì [[蔽]] and měng [[蒙]] (all ant. cōng [[聰]] "clever"), refer to an intellectual obfuscation due to limited access to information, a state of stupidity that may be remediable. 6. Mèi [[昧]] and àn [[暗]] (ant. míng [[明]] "clear-minded") refer primarily to temporal benightedness of mind and lack of an enlightened attitude, often cause by lack of information. 7. Wán [[頑]] and lòu [[陋]] (both ant.* bó [[博]] "broadly civilised") add the nuance of stubbornness to that of benighted stupidity as such. NB: Bèn [[笨]], āi [[呆]], shǎ3 [[傻]], and chūn [[蠢]] are post-Han words for stupidity and silliness. For a comprehensive conceptual analysis of early evidence see Christian Schwermann, "Dummheit" in altchinesischen Texten: eine Begriffsgeschichte, (Veröffentlichungen des Ostasien-Instituts der Rhhr Universität, Bochum, vol. 62, 2011)'
- type: modern-chinese-criteria
  text: '蠢笨 is a current standard word referring to stupidity.


    愚笨 is a current literary word referring to stupidity.


    笨 is a current colloquial word referring to stupidity.


    愚蠢 is a slightly literary current word referring to stupidity.


    笨拙 focusses on practical ineptness.


    拙笨 focusses strongly and primarily on practical ineptness or clumsiness.


    迂拙 is a very literary word referring to practical ineptness.


    笨手笨腳 refers to extreme clumsiness.


    笨口笨舌 focusses on inarticulateness.


    笨頭笨腦 focusses on intellectual obtuseness.


    呆 focusses on slow wit.


    傻 focusses on plain silliness.


    愚拙 is a rather literary word focussing on clumsiness.


    愚魯 focusses on boorishness.


    愚昧 focusses on obfuscation of mind.


    痴呆 focusses on besotted silliness.


    呆痴 focusses on besotted silliness.


    呆笨 focusses on slow wit.


    粗笨 focusses on lack of subtlety of mind.


    缺根弦兒 is a colloquial way of calling someone intellectually deficient.


