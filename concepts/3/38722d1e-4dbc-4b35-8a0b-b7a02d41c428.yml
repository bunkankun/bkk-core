concept: CHALLENGE
alt_labels:
- DARE
- SUMMON
- THROW DOWN THE GAUNTLET TO
zh: 挑戰
definition: ADDRESS someone so as DEMAND to FIGHT WITH him, OR so as to DEMAND another COURAGEOUS REACTION.
criteria:
- type: old-chinese-criteria
  text: 1. There is no obvious, common word for the concept of a challenge in classical Chinese. The only word I have found is zhì [[致]] when it refers to challenging an army to battle.
- type: modern-chinese-criteria
  text: '挑戰 is the current word for a challenge of any kind, often also of a figurative kind.


    叫陣 refers in a literary way to a literal challenge to battle directed at a military enemy.


    求戰 refers in a literary and old-fashioned way to an effort at joining battle.


    搦戰 nuòzhàn refers in a general way to a challenge to fight.


    rough draft to BEGIN TO identify synonym group members for analysis, based on CL etc. 18.11.2003. CH ／'
