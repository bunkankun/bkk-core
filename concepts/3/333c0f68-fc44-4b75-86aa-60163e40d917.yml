definition: REACH AFTER PURSUING.
criteria:
- type: old-chinese-criteria
  text: '1. Jí [[及]] emphasises the result of the successful pursuit, the reaching itself.


    2. Zhuī [[追]] emphasises the process of the pursuit which has resulted in catching up.'
- type: modern-chinese-criteria
  text: '追到 is current modern Chinese for catching up with someone.


