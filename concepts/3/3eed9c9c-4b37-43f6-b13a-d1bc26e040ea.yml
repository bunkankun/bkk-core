concept: COUNTERFACTUAL
alt_labels:
- CONTRARY TO FACT
zh: 反事實
definition: IF-RELATION BETWEEN A SENTENCE S1 PRESUPPOSED to be NOT TRUE AND A SENTENCE S2 SPEAK:said TO BE TRUE IF S1 IS:were TRUE.
criteria:
- type: old-chinese-criteria
  text: '1. The most current particle indicating counterfactual or occasionally remotely hypothetical conditional clauses is shǐ [[使]].


    2. Shè [[設]] is remotely hypothetical in its primary use, and only occasionally used to make counterfactual conditionals.


    3. Jiǎ [[假]] is used to make counterfactual conditionals or remotely hypothetical conditionals indifferently.'
- type: modern-chinese-criteria
  text: '反事實


    假使


    設使


