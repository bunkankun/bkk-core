- type: old-chinese-criteria
  text: '[[也]] is often used in direct speech and marks the topical use of a familiar subject as in [[回也]] "German: der Hui".[[者]] in postnominal position is to be construed as npro.post-N "the X that is identical with N" and may then be read as a topic marker.[[也者]] after a topic marks a concept for abstract discursive focus [[仁也者]] "As for benevolence..."'
