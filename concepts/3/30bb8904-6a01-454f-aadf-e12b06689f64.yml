criteria:
- type: old-chinese-criteria
  text: "1. The current general word for detail is xiáng [[詳]] (ant. l\x9Fè [[略]] \"without proper detail\" and yào [[要]] \"only in main outline\").\n\n2. Xì [[細]] (ant. hūn [[涽]] \"in a muddled generalising way\") refers to petty detail.\n\n3. Xī [[悉]] refers to completeness of detail."
