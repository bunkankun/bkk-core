concept: THREE
zh: 三
definition: The NUMBER which is the successor of TWO.
criteria:
- type: old-chinese-criteria
  text: '1. The general word for "three"is sān [[三]] and this word has great syntactic flexibility, and only in a small minority of such usages can the graph be replaced by [[參]].


    2. Sān [[參]] is to form a triad, and the graph is not replaceable by sān [[三]].'
