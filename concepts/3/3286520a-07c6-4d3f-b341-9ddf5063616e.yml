zh: 射
definition: To ISSUE or send forth, esp. swiftly or by sudden impulse.
criteria:
- type: old-chinese-criteria
  text: '1. Shè [[射]] is the current general term for the whole process of shooting.


    2. Zhòng [[中]] refers to hitting the mark by shooting.


    3. Fā [[發]] is to let off a shot.


    4. Tán [[彈]] refers to shooting off a bullet.'
- type: huang-jingui
  text: 'HUANG JINGUI 2006


    ANIMALS 34. STRINGED ARROW


    弋，弋射之稱。


    繳，弋射繫於箭桿的細生絲線或細麻線。


    矰，繫著繳線射鳥的短箭。


    弋射流行於西周至唐代；鳥群掠空，驚鳥或被命中，或兜纏繳線而墜。'
