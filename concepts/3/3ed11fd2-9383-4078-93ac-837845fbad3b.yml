definition: EATING TOGETHER, OR FOOD EATEN at ONE TIME.
criteria:
- type: old-chinese-criteria
  text: ??? It is difficult to find a general term for a meal. See EAT.
- type: huang-jingui
  text: 'HUANG JINGUI 2006


    FOOD 2.


    餐，通稱。


    饔，早餐。飧，晚餐。


    餔，漢代指申時的晚餐。


    商代至南北朝，都是兩餐制；唐代起出現 “ 中飯 ” 等中餐詞語，標志三餐制開始產生；唐宋是兩餐、三餐交替時期；元代出現了 “ 一日三餐 ” 的觀念與詞語，標志三餐制正式形成。


    SEE ALSO ASTRONOMY 27. 今一般誤將 “ 晏食 ” 作為與 “ 餔時 ” 相同或相近的時段。其實，晏食是古時段名，在 ‘ 蚤食 ’ 後、 ‘ 隅中 ’ 前，猶如稍晚的早餐時，屬於上午的時段名。 “ 餔時 ” 則為屬下午的時段名。'
