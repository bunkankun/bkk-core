zh: 防禦
och: 禦/御
definition: HINDER someone who ATTACKS so as to CAUSE him TO LEAVE.
criteria:
- type: old-chinese-criteria
  text: '1. The current general word for keeping someone or something at a distance or hindering an advance against one is yù [[禦]] / [[御]].


    2. Jù [[拒]] concentrates on the maintenance of physical distance by some superior force.


    3. Dǐ [[抵]] refers to a defensive way of preventing something from getting close to one.


    4. Kàng [[抗]] refers to keeping something at a distance by force.'
