concept: SAW
zh: 鋸子
definition: TOOL which has METAL TEETH AND is USED FOR CUTTING TIMBER.
criteria:
- type: old-chinese-criteria
  text: '1. General term for a saw is jù4 [[鋸]]. It can be made of bronze, and since the Warring States period of iron. Saw was used not only like a working implement, but also for mutilating punishments (the oldest evidence dates the Shang period: REFERENCES TO BE FOUND). Besides this, in the Warring States period, the word was in the state of Yan used for a kind of weapon otherwise known as jǐ [[戟]] (combination of the gē [[戈]] halberd with a spearhead).'
