type: concept
concept: GENTLEMAN
zh: 君子
och: 士
definition: ADULT who is EDUCATED AND ABLE to BECOME an OFFICIAL.
criteria:
- type: old-chinese-criteria
  text: '1. The current general term for a person of a certain social standing is shì [[士]] and this word often connotes specifically a certain level of education, particularly literacy. See INTELLECTUAL. Jūn zǐ [[君子]] literally "son of a ruler" can focus either on nobility of birth and social status or, by derivation, on (inherited&gt;acquired) personal moral moral worth. See also under GOOD the meaning "man of excellent character". This is one of those terms have neutral descriptive uses versus abstract idealised uses. The list of such concepts is long: [[王]]"king/true king =[[王者]]", [[君子]]"gentleman/true gentleman"，[[道]]"behaviour/ideal behaviour"，[[禮]] "custom/ideal ritual"，[[德]]“feature/ideal feature,virtue" 3. Rú [[儒]] (opp. [[墨]] "Mohist"), literally "weakling", typically referred Late Warring States times scholars from broadly Confucian conventional circles. 4. Xián [[賢]] (ant. [[不肖]] "person of inferior worth and talent") adds to the notion of an intellectual of some education that of special talent, and sometimes also of moral worth. See TALENT. 5. Zhé [[哲]] emphasises advanced intellectual talents. 6. Jiā [[家]] focusses on basic professionalism or expertise, but the term is rare in pre-Han times. 7. Shēng [[生]] simply refers to literates.'
