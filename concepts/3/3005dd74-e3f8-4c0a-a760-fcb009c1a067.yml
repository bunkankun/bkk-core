zh: 鬼
och: 鬼
definition: VISIBLE SOUL AFTER DIE:death.
criteria:
- type: old-chinese-criteria
  text: '1. The current general word for all manner of ghosts is guǐ [[鬼]].


    2. Bù ruò [[不若]] are ghosts of the wicked kind.'
- type: huang-jingui
  text: 'HUANG JINGUI 2006


    SACRIFICE 20.


    鬼，暗中害人的鬼怪，通稱。


    精，指年深歲久植物及無生命之物所化之動物或人，動物所化之人。


    妖，古稱一切反常怪異的事物或現象；漢魏六朝之後可特指動物或植物變成的精怪，或能害人；明清多見，多為能害人的怪物。


    怪，指奇異的事物，同時可特指怪物，側重不常見或從未見過的。


    靈，晉代、唐宋以來可指鬼怪。魅，物老變成的精怪。'
