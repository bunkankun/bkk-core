zh: 馴服
och: 馴
definition: OBEY ENDURINGLY AND NOT OFFEND one's OWNER, as an ANIMAL, so as NOT to be WILD.
criteria:
- type: old-chinese-criteria
  text: '1. The current word for tameness is xún [[馴]] (ant. jué [[倔]] "stubbornly insubordinate").


    2. Fú [[服]] "submit" (ant. jiàng [[強]] "headstrong") is sometimes used referring to animals becoming or being tame.'
