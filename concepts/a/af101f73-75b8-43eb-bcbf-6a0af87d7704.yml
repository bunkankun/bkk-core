zh: 經典
definition: DOCUMENT of INTENSELY BIG AUTHORITY, TYPICALLY USED in EDUCATION.
criteria:
- type: old-chinese-criteria
  text: '1. The pre-Han general term which became culturally crucial in Han times is jīng [[經]] (opp. zhuàn [[傳]] "commentary, tradition attached to classic") which can refer to any canonised codified "classical" text.


    2. Diǎn [[典]] is highly archaic and begins to be obsolete by Warring States times though the word did survive as a deliberate archaism.


    See also DECREE and LAW'
- type: huang-jingui
  text: 'HUANG JINGUI 2006


    EDUCATION 5.


    經，對儒家和宗教和其他具有永久指導作用的典範著作的尊稱。


    典, 典範重要的文獻和典籍。


    墳，取義於大、高、古，讓人仰視、最古老的重要典籍。'
- type: modern-chinese-criteria
  text: '經書


    經籍


    經


    經典


    典籍


    first rough draft to identify synonym group members for future analysis, based on CL. 18.11.2003. CH'
