concept: RELIGION
zh: 宗教
definition: CUSTOMARY METHOD of ACTING BASED a STANDARD of SHOULD:obligatory SACRED BELIEFS OR FAITH.
criteria:
- type: old-chinese-criteria
  text: '000'
- type: modern-chinese-criteria
  text: '宗教 is the modern loan translation of the Western concept.


    教 is a traditional name for a teaching tradition.


    道門 refers to an institutionalised intellectual tradition.


    會門 refers to a socially organised intellectual tradition.


    道


    壇


    rough draft to BEGIN TO identify synonym group members for analysis, based on CL etc. 18.11.2003. CH ／'
