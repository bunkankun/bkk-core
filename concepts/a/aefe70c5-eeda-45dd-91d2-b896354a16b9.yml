type: concept
concept: ARMOUR
zh: 甲冑
definition: DEFENSIVE WEAPONS to SAFEGUARD one's BODY IN-RELATION-TO ATTACK.
criteria:
- type: old-chinese-criteria
  text: '[GENERAL/SPECIFIC]


    1. The dominant general term is jiǎ [[甲]] and this armour is typically made of rhinoceros leather.


    [GENERAL]


    2. Jiè [[介]] is another common, and syntactically flexible, word for armour.


    3. Kǎi [[鎧]] refers to metal plate armour.


    [SPECIFIC]


    4. Xuán jiǎ [[玄甲]] refers to iron plate armour.


    [SPECIFIC]'
- type: huang-jingui
  text: 'HUANG JINGUI 2006 WARFARE 20.


    甲，皮甲；護衛衣總稱。


    鎧，鐵甲，鐵護身衣通稱。


    胄，甲士戴的護頭衣，即頭盔。


    兜鍪，專稱鐵護頭衣。'
- type: modern-chinese-criteria
  text: '裝甲


    盔甲


    first rough draft to identify synonym group members for future analysis, based on CL. 18.11.2003. CH/'
