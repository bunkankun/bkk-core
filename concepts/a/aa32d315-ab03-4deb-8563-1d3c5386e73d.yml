concept: DUEL
definition: RITUALISED FIGHT USING WEAPONS BETWEEN TWO HUMANS BECAUSE of the SHAME CAUSED BY ONE having OFFENED the OTHER, BECAUSE of HONOUR.
criteria:
- type: old-chinese-contrasts
  text: 'Schopenhauer, Nachlass vol. 3. p. 59: An die Stelle der mit Eintritt des Christenthums aufgehobenen Gladiatorspiele ist in der Chrstlichen Zeit und christlichen Ländern das Duell getreten. Jene ein grausames Opfer der allgemeinen Belustigung gebracht; dieses ein grausames opfer dem allgemeinen Vorurtheil gebracht. Jene von Sklaven und Fefangenen; dieses von Freuen und Edlen.'
