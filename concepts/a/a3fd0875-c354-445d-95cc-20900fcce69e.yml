type: concept
concept: YOKE
zh: 牛軛
definition: TIMBER TOOL PLACED ON the NECK of BOVINES AND USED TO CAUSE the BOVINES to PULL something.
criteria:
- type: old-chinese-criteria
  text: HUANG
- type: huang-jingui
  text: 'HUANG JINGUI 2006


    COMM 10. 輈交於軸，上壓車輿。有尾飾踵；從輿前伸出，經一段平直之軓，逐漸上翹，頂部細平。輈端稱車烏。後橫交衡。


    衡，車轅頭上的橫木，衡上設鑾。


    軛，鑾兩邊所置人字型鉤狀物。軥（ q[U+00fa] ），軛末端鉤曲部分，即軛頭，渾言又可泛指整個軛。'
- type: modern-chinese-criteria
  text: '軛


