type: concept
concept: TAX
zh: 賦稅
definition: MONEY CONFISCATED FROM CITIZENS by the OFFICIALS of the GOVERNMENT, CONFORMING to a LAW.
criteria:
- type: old-chinese-criteria
  text: 'jijiupian: [[斂財曰賦]]；[[斂穀曰稅]]；[[田稅曰租]]。 Cambridge Hist. of China vol. 1, p. 595f'
- type: huang-jingui
  text: 'HUANG JINGUI 2006


    TRADE 11.


    貢，傳說中夏代的定額賦稅。


    助，商代的勞役賦稅，從助耕公田得名。


    籍，助的異稱，從簿籍戶口得名。


    徹，西周貢、助並用的按率實物田賦。


    賦，從民間征得的供軍需的人力、物力、財力。


    稅，政府從各行各業勞動者按規定證收的錢財。


    租，也是稅，從國家儲存而稱。征，工商稅。


    斂，國家聚斂收藏的財物。


    [ 貝＋宗 ] ，漢魏時期邊郡夷人的賦稅。'
- type: modern-chinese-criteria
  text: '稅


    賦稅


    稅捐


    房捐


    屋稅


    繳稅


    交稅


    納稅


    上稅


    完稅


