concept: JADE
zh: 玉屬
och: 玉
definition: HARD BRIGHT STONE USED FOR PRODUCING ORNAMENTS. []
criteria:
- type: old-chinese-criteria
  text: "XUN 27:8, Knoblock 3:209\n\n[[聘人以珪]]， Men on official visits use the gu\x95 (which is square at the bottom and round on top),\n\n[[問士以璧]]， freemen asking advice use the b\x93 (ring-jade);\n\n[[召人以瑗]]， someone summoning other will use the yuàn;\n\n[[絕人以玦]]， someone breaking off relations with someone will use the jué;\n\n[[反絕以環]]。 someone who is making good again broken-off relations will use the huán."
