  text: 'HUANG JINGUI 2006


    HUMAN AFFAIRS 12. 公公。


    舅，因姑舅表婚制而成公公，為通稱。


    公，妻隨夫尊稱夫之父公，漢時始有此用，用於敘稱或對稱。


    嫜，俗稱。


    姻，本指夫家，特指女婿之父，用於敘稱。'
