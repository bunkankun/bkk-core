zh: 玩
och: 戲
definition: ACT NOT SERIOUSLY so as to CAUSE ONESELF to BECOME DELIGHTED.
criteria:
- type: old-chinese-criteria
  text: '1. Wán [[玩]] "play" refers to the act of amusing oneself.


    2. Xì [[戲]] refers to playful pleasantry, the playing of linguistic games.


    3. Yóu xí [[遊戲]] refers to playful fun-seeking which involves physical movement.'
