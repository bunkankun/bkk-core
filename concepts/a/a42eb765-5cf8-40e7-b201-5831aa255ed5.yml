type: concept
concept: VARIABLE
zh: 變數的符號
definition: IMAGE:symbol NOT REFERRING to ONE OBJECT BUT SHOWING RELATIONS of SAME REFERENCE.
criteria:
- type: old-chinese-criteria
  text: '[[甲乙丙]] are currently used as variables ranging over persons in legal texts, and also in mathematical texts like JIUZHANG. The analysis of the use of variables in mathematical texts is obviously of great importance. An abstract term for a variable does not exist in Chinese, and neither does it in Greek, where Aristotle made extensive and highly systematic use of variables which stand for predicates.'
- type: modern-chinese-criteria
