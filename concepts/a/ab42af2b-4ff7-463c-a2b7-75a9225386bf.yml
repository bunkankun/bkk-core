zh: 理智
definition: ORGAN of INTELLIGENCE, JUDGEMENT,2 AND ARGUMENTATION.
criteria:
- type: old-chinese-criteria
  text: 1. The closest one can come in classical Chinese to the notion of reason seems to be the general word zhì [[智]] "intelligence; wisdom", which is sometimes used to refer to the capacity for knowledge and analysis as such. FIND GOOD EXAMPLES! CONSIDER SUCH DISTINCTIONS AS THAT IN GERMAN BETWEEN VERSTAND AND VERNUNFT. SEE WHEN, IN CHINESE HISTORY, THE NOTION OF REASON VERSUS INTELLIGENCE BECAME FOCUSSED.
- type: modern-chinese-criteria
