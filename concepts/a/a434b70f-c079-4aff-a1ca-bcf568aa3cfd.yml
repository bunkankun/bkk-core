type: concept
concept: FOREHEAD
zh: 額頭
och: 額
definition: FRONT TOP PART of FACE ABOVE the EYES.
criteria:
- type: old-chinese-criteria
  text: '1. The current general word for the forehead in Han times became é [[額]].


    2. Yán [[顏]] is the most current ancient word and refers specifically to the area between the eyebrows, more generally to the upper part of the face.


    3. Sǎng [[顙]] refers to the forehead as a whole, especially the upper part.


    4. Tí [[題]] and diān [[顛]] refers to the forehead but may include the top of the head.'
- type: huang-jingui
  text: 'HUANG JINGUI 2006


    HUMAN BODY 32. 額頭。


    額，總稱，秦後始見。


    顏，指額的中間區域，秦後多指面。


    顙，指全額，常有悲哀色彩。


    角，指兩旁之額。


    題，渾稱頭額。'
- type: modern-chinese-criteria
  text: '額


    前額


    額頭


    腦門子


    頂門兒


    顙


    天庭


    天門


