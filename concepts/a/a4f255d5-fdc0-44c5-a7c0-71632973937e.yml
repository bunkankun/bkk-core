type: concept
concept: MONTH
zh: 月
definition: PERIOD of APPROXIMATELY 30 DAYS into which the YEAR is DIVIDED.
criteria:
- type: old-chinese-criteria
  text: '1. The general term for a month is yuè [[月]], and this word is current already in OBI where it is translatable as "moon" referring literally to a lunar period.


    One might mention here:


    2. Huì [[晦]] refers to the last day of a month.


    3. Shuò [[朔]] refers to the first day of every month.


    4. Wàng [[望]] refers to the full moon, the sixteenth or seventeenth day of a lunar month.


    5. Xián [[弦]] refers to the half full moon, period around 7th/8th and 22nd/23rd day of a lunar month.'
- type: modern-chinese-criteria
