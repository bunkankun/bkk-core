type: concept
concept: SEASON
zh: 時節
definition: ONE of FOUR PERIODS into which the YEAR is DIVIDED.
criteria:
- type: old-chinese-criteria
  text: '1. The general term for a season is shí [[時]], and the primary seasons are chūn [[春]] and qiū [[秋]], in Warring States times the names of the Four Seasons became current.


    2. Jì [[季]] refers to the last month of each season.'
- type: huang-jingui
  text: 'HUANG JINGUI 2006


    ASTRONOMY 25. 一年內的時節、時段。


    時，三月為一時，一年分作四時。


    氣，緣於古人把 “ 氣 ” 作為宇宙本源，分中氣和節氣，一年二十四氣。節，一年分二十四節，每節約十五天；也有分為四節、五節、八節等。


    候，因觀察動物、植物或其他自然現象變化的徵候作節氣變化的依據，故也已稱時節，每候五日，一年分作七十二候。'
- type: modern-chinese-criteria
  text: '季節


    季度


    季


    時令


    時節


    時


    四季


    四時


    四序


    四節


    rough draft to BEGIN TO identify synonym group members for analysis, based on CL etc. 18.11.2003. CH ／'
- type: old-chinese-contrasts
  text: 'ZZ 13.479


    春夏先， Spring and summer precede,


    秋冬後， autumn and winter come after--


    四時之序也。 such is the sequence of the four seasons.'
