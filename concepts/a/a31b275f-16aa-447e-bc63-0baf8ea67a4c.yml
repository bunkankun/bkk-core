definition: CONTROL CRUELLY.
criteria:
- type: old-chinese-criteria
  text: "1. The most common general word for oppression is probably n\x9Fè [[虐]] (ant. cí [[慈]] \"show loving care for\").\n\n2. Bào [[暴]] (ant. fǔ [[撫]] \"care well for\") emphasises the aspect of violence.\n\n3. Líng [[陵]] (ant. yù [[育]] \"take loving care of\", and the rare jí [[藉]], and chéng [[乘]] emphasise the abuse of supremacy of social or political position."
