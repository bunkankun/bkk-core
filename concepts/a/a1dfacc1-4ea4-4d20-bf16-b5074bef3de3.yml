zh: 跛腳
och: 蹇
definition: WALK USING ONLY ONE LEG APPROPRIATELY BECAUSE of a DEFECT in the OTHER LEG.
criteria:
- type: old-chinese-criteria
  text: '1. The most general term for any form of impaired movement is jiǎn [[蹇]].


    2. Bǒ3 [[跛]] refers specifically to an impaired ability to walk or to limping.


    3. Qī [[踦]] refers specifically to hobbling along on one leg.


    4. Chuō [[踔]] refers to hopping along on malfunctioning legs.'
- type: huang-jingui
  text: 'HUANG JINGUI 2006


    HUMAN BODY 21.


    跛，癥狀名，腿長短不齊致行走時身體傾側。


    蹇，膝關節伸不能曲而導致行走時身體前卻搖動不定；一足蹇成跛，多用於動物。


    躄，人病痿而足不能行；當一足病痿則成跛狀。


    瘸，中古口語詞，足病而破。


    拐，近代口語詞，行走似跛。'
- type: modern-chinese-criteria
  text: '跛子


