type: concept
concept: ANALYSE
alt_labels:
- ANALYSIS
zh: 分析
definition: EXPLAIN something by SYSTEMATICALLY DISTINGUISHING its BASIC PARTS AND their FUNCTIONS.
criteria:
- type: old-chinese-criteria
  text: '[[辨]]／[[辯]]'
- type: modern-chinese-criteria
  text: '分析 is the current general word for analysis.


    辨析 focusses on making analytical distincions.


    離析 focusses on separating out the things that are to be analysed.


    剖析 focusses figuratively on the anatomy of what is to be analysed.


    剖解 focusses figuratively on the anatomy of what is to be unravelled.


    條分縷析 (prov) refers idiomatically to detailed analysis.


    析 (cl)


    剖 (cl)


    rough draft to BEGIN TO identify synonym group members for analysis, based on CL etc. 18.11.2003. CH ／'
- type: old-chinese-contrasts
  text: 'LEIBNIZ 6.4 P. 32: A n a l y s i s est totum in partes resolvere animo. A n a t o m i a est resolutio in partes corporales.'
