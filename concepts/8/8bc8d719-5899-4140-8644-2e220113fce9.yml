type: concept
concept: MOUTH ORGAN
zh: 多管樂器
och: 竽
definition: MUSICAL INSTRUMENT CONTAINING MANY TUBES, AND BLOWN into USING the MOUTH.
criteria:
- type: old-chinese-criteria
  text: '1. The most current word for an upright pipe organ is yú [[竽]], which refers to an organ with 36 bamboo pipes arranged tightly together on a gourd. See ill..


    2. Shēng [[笙]] refers to smaller variety of the upright yú [[竽]] with between 13 and 19 pipes.


    3. Xiāo [[簫]] refers to a system of 32 pipes arranged on one plane. A smaller variety had 16 pipes so arranged. It was played in the manner of the modern mouth organ. It is also called cēn cī [[參差]].'
- type: huang-jingui
  text: 'HUANG JINGUI 2006


    ART 8.


    笙，長四尺，木製或銅製的圓型斗座，管苗數目多是奇數，宮音管位置在旁側，整個笙的形象 “ 象鳳之身 ” 。


    竽，長四尺二寸，匏製的橢圓型斗座，管苗數目多於笙，且多是偶數，宮管位置居中。


    簧，本指施置於笙類樂器管苗內的可振動發聲的薄片，引申指笙類樂器。


    匏，笙類樂器的總稱。'
- type: modern-chinese-criteria
  text: '笙


    鳳笙


