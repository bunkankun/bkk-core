type: concept
concept: BIRDS
zh: 鳥類
definition: KINDS of BIRD.
criteria:
- type: huang-jingui
  text: 'HUANG JINGUI 2006


    ANIMALS 18.


    翡翠，可指藍翡翠、鸛嘴翡翠、白胸翡翠。


    翡，我國東部沿海的赤翡翠。


    鴗，本指普通翠鳥，引申指近似的幾種翠鳥，多用作屬語素。


    魚狗，早先指普通翠鳥，泛指本目各種打魚雀，是本組概括面最寬的名稱。


    ANIMALS 19.


    斑鳩，通稱；多指珠頸斑鳩。


    鳻鳩，大鳩；也因同音而用為斑鳩而多指珠頸斑鳩。


    鵓鳩，灰斑鳩；亦多指珠頸斑鳩。


    尸鳩，古代作尸祝用鳥，是斑鳩而非布穀。


    鵻，小斑鳩；又泛指斑鳩而實指珠頸斑鳩。'
