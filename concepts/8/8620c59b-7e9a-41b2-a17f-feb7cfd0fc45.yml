concept: SCHOOL
zh: 學校
definition: INSTITUTION OR BUILDING USED FOR TEACHING.
criteria:
- type: old-chinese-criteria
  text: HUANG
- type: huang-jingui
  text: 'HUANG JINGUI 2006


    EDUCATION 20.


    成均，周代專門學習 “ 樂 ” 之地，後泛稱官設的最高學府。


    明堂，天子宣明政教之處，教學是其重要功能。


    辟雍，天子行禮樂、宣德化之地。


    辟雍，行鄉飲、大射或祭祀之禮之地。


    泮宮，漢代諸候所設立的大學，與辟雍相對而言。


    學宮，古代學習禮樂之處，引申為學校。


    靈臺，帝王觀察天文星象、妖祥災異的建築，後引申為天子宣明政教之場所。'
