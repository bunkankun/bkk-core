zh: 船帆
definition: PART of SHIP PRODUCED USING CLOTH, which RECEIVES the FORCE of the WIND.
criteria:
- type: old-chinese-criteria
  text: 1. There is remarkable little talk of sails in pre-Buddhist China. The early history of sailing needs to be investigated.
- type: huang-jingui
  text: 'HUANG JINGUI 2006


    COMM 28.


    帆，掛在船桅上利用風力使船前進的布篷。


    篷，本指遮蔽風雨和陽光的器具，用篾席或帆布等製成；宋元時起，由於避諱 “ 翻 ” 的語音，將 “ 帆 ” 也稱為 “ 篷 ” 。'
- type: modern-chinese-criteria
  text: '帆


