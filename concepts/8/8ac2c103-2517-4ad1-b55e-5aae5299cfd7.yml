zh: 游泳
definition: FLOAT on the SURFACE of WATER, NOT USING TOOLS.
criteria:
- type: old-chinese-criteria
  text: '1. The current standard word for swimming, mostly for pleasure, is yóu [[游]]／[[遊]].


    2. Liú [[流]] is occasionally used to refer to swimming, but not as a recreational activity.


    3. Shuǐ [[水]] "water" is sometimes used to refer to moving in water.'
