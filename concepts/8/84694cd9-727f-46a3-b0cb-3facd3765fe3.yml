  text: '1. The current general term for a dwarf, typically employed as a clown, was the binome zhū rú [[侏儒]]. See CLOWN; See HUNCHBACK


    2. Rú [[儒]] alone is sometimes used to refer to a weakling or a dwarf without strength.'
