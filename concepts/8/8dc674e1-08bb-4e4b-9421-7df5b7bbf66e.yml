zh: 容易
och: 易／輕
definition: POSSIBLE AND IF TRIED OFTEN ACHIEVED LACKING:without EFFORT.
criteria:
- type: old-chinese-criteria
  text: '1. The current general word for easiness of actions is yì [[易]] (ant. nán [[難]] "difficult").


    2. Qīng [[輕]] "light" is sometimes used to effortlessness of every kind.


    3. Líng [[泠]] is a poetic word referring to graceful effortless ease of movement.'
