concept: SLEEVE
zh: 衣袖
definition: PART of GARMENT MOST NEAR to the HAND.
criteria:
- type: old-chinese-criteria
  text: '1. The general term for a sleeve is xiù [[袖]], and the word has a colloquial flavour.


    2. Mèi [[袂]] is a very formal and literary word for a sleeve.


    3. Qū [[袪]] refers specifically to the opening of the sleeve.'
