zh: 和平
definition: 'SITUATION characterised by LACK of WARFARE.


  [[FRIEDEN]]'
criteria:
- type: old-chinese-criteria
  text: '1. The standard word for universal peace is tài píng [[太平]], and this word became current from Han times onwards.


    2. Hé [[和]] is occasionally used to refer to peaceful conditions.


    3. Chéng [[成]] is a technical term meaning "to sue for peace" and is thus marginal to this group.'
- type: modern-chinese-criteria
  text: '和平


    清平


    相安無事


    西線無戰事


    rough draft to BEGIN TO identify synonym group members for analysis, based on CL etc. 18.11.2003. CH ／'
