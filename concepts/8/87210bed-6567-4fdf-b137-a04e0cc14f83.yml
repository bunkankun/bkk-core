concept: FOOTPRINT
zh: 足跡
definition: TRACE PRODUCED by a FOOT ON a SURFACE.
criteria:
- type: old-chinese-criteria
  text: '1. The standard word for a footprint or even more abstractly of a trace left is jī [[跡]], which should be written with rad. 162.


    2. Wǔ [[武]] refers to the footprint as a standard of length.


    3. Zōng [[蹤]] refers literally to footprints.'
