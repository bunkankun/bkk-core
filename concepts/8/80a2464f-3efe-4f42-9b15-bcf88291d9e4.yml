  text: 'HUANG JINGUI 2006


    WARFARE 3. 軍隊基層編制單位。


    伍，士兵五名為伍。


    什，步卒十人為什。兵車單位，以一百二十五乘為伍，或以一百二十乘為伍。


    卒，以一百人或二百人為卒。此制行於戰國以前。


    WARFARE 4. 部曲，行於秦漢至三國期間，中級的軍隊編制單位。


    大將軍下轄五部，上千人一部。


    部下分數曲。


    校，部的別稱；亦指軍營。


    WARFARE 5. 騎兵的編隊單位。


    騎，一人一馬。長，五騎。吏，十騎。屯，三十騎。輩，六十騎。率，百騎。'
