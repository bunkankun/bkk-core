type: concept
concept: SILK PADDING
zh: 絲填
definition: SILK USED FOR CAUSING CLOTH to BECOME THICK.
criteria:
- type: old-chinese-criteria
  text: '1. The general current word for silk padding that can be used to make warm clothes is mián [[綿]].


    2. Xù [[絮]] refers to the silk padding put in place.


    3. Kuàng [[纊]] refers to silk padding made of new silk.


    4. Yùn [[縕]] refers to simple padding made of old silk or even of hemp.'
