concept: WIDOW
zh: 寡婦
definition: WIFE BEREAVED of her HUSBAND OR WOMAN LACKING a HUSBAND.
criteria:
- type: huang-jingui
  text: 'HUANG JINGUI 2006


    HUMAN AFFAIRS 29. UNMARRIED LADY


    寡，老而無夫的婦人或有夫獨守的婦人。


    孀，喪夫之婦，方言詞。


    嫠，喪夫之婦。


    怨女，超過婚齡而無夫的女性。


    巫兒，留家不嫁的長女。'
