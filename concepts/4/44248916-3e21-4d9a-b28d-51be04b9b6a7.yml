concept: FUNERAL GIFT
zh: 治喪禮物
definition: GIFT GIVEN to the DEAD WHEN these are being BURIED.
criteria:
- type: huang-jingui
  text: 'HUANG JINGUI 2006


    HUMAN AFFAIRS 57.


    賻，送喪家治喪用的錢財、布帛和車馬，主要指錢財。


    賵，送與死者的車馬，用以陪葬。後泛指助喪之物。


    “ 襚 ” ，贈予死者的衣被。'
