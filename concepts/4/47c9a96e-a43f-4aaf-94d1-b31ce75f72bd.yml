concept: ELBOW
zh: 肘
definition: JOINT IN the MIDDLE of the ARM of a HUMAN.
criteria:
- type: old-chinese-criteria
  text: 1. The standard word for the elbow is zhǒu [[肘]], and there are no common near-synonyms.
- type: modern-chinese-criteria
  text: '肘


    肘子


    <div>rough draft to BEGIN TO identify synonym group members for analysis, based on CL etc. 18.11.2003. CH ／</div><div><br></div><div>GREEK KEYWORDS</div><div>άγείρω vb. | impf. ήγειρον, ep. άγειρον | aor. ήγειρα, ep.<br>άγειρα, ep.lpl.subj. άγείρομεν || mid.: ep.3pl. άγέρονται<br>(AR.), ep.inf. άγέρεσθαι (Od., unless aor.2 άγερέσθαι) | aor.l<br>ptcpl. (w.act.sens.) άγειράμενος (AR.) | ep.aor.2: 3pl.<br>άγέροντο (unless impf.), ptcpl. άγρόμενος | ep.3pl.plpf.<br>άγηγέρατο || pass.: aor. (w.mid.sens.) ήγέρθην, ep. άγέρθην,<br>3pl. ήγερθεν, ep. άγερθεν |<br>1 cause to assemble, gather together —people, armies,<br>animals, or sim. Hom. Hdt. S. E. Th. Pl. +; (also aor.l mid.) AR.<br>2 || mid. and aor.pass. (of people, gods, animals) gather<br>together, assemble Hom. Hes. hHom. Call. AR.<br>3 collect (usu. by requesting fr. others) —goods, gifts,<br>money, or sim. Od. Hdt. E. D. AR. Plu.; (of a beggar) —pieces of<br>bread Od.; (of a bird) —food (for its young) Theoc. || mid.<br>hold a collection Od.<br>4 (specif., of women, a begging priestess) collect gifts or<br>alms —w.dat./or deities Kfr. Hdt. PL; (of women engaging<br>in ritual play at a festival, a man masquerading as a priest)<br>take a collection (fr. bystanders) Plu. | cf. αγύρτης<br>5 (fig.) put together —a series of tales Δ.; (of a whirlwind)<br>gather up —a dust-storm S.(cj., see αίρω 9)<br>6 || aor.pass. (of a person’s spirit) be rallied —w.prep.phr.<br>in their chest or heart Hom.<br></div><br>'
