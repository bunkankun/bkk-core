type: concept
concept: SKIN
zh: 皮膚
och: 皮
definition: The COMPLEX BODY TISSUE which WRAPS the WHOLE BODY of HUMANS AND ANIMALS.
criteria:
- type: old-chinese-criteria
  text: '1. The general word is pí [[皮]] which refers to all aspects of the skin, typically skin of animals with its natural fur.


    2. The word fú [[膚]] refers primarily to human skin, and the surface as such, the surface including the tissue below is jī [[肌]] (and pí [[皮]] in its non-general specific use).


    3. Gé [[革]] refers to animal hide. See LEATHER'
- type: huang-jingui
  text: 'HUANG JINGUI 2006


    BODY 27.


    皮，戰國、秦漢之際始用於人的皮膚。


    膚，人皮膚專稱，但很少單用。革，與 “ 肌 ” 、 “ 膚 ” 等連用表皮膚。


    肌，只在幾個小範圍中指皮膚。


    胝，堅硬幹燥的厚皮，多生於手足。


    胼，同胝，多與 “ 胝 ” 連用。


    趼，生於腳底的硬皮。


    腄，表示腳底的硬皮，只存於字書。'
- type: modern-chinese-criteria
  text: '皮膚


    皮


    膚


    肉皮兒


    皮層


    rough draft to BEGIN TO identify synonym group members for analysis, based on CL etc. 18.11.2003. CH ／'
