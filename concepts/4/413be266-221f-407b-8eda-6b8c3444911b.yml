concept: TERMITE
zh: 蛀蟲
criteria:
- type: huang-jingui
  text: 'HUANG JINGUI 2006


    ANIMALS 22. 白蟻蛀物最烈，而長期未有專稱。


    蠹，蛀蟲的總稱，早期指稱白蟻。


    蠡，蛀蟲的泛稱，也指稱白蟻，要與他詞連用。


    螻，螻蛄，可泛稱蟻而指稱白蟻。


    蟻，蟻類總稱，常特指白蟻。


    螻蟻，也可稱白蟻。唐出現 “ 白蟻 ” 之稱，宋起成正稱。'
