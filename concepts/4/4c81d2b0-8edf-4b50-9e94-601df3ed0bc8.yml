type: concept
concept: MALE
zh: 男
och: 男
definition: GENDER of an ANIMAL or ANIMAL which HAS the ORGANS FOR ENGENDERING AND CAN NOT give BIRTH.
criteria:
- type: old-chinese-criteria
  text: '1. The current general term is nán [[男]] (opp. nǚ [[女]] "female) or, more administratively and technically nán zǐ [[男子]] (opp. nǚ zǐ [[女子]] "female").


    2. Mǔ [[牡]] refers to the male of birds and beasts in purely biological terms.


    3. Xióng [[雄]] denotes maleness, but often connotes virility, strength and domination as well.


    4. Zhàng fū [[丈夫]] (opp. fù rén [[婦人]] "woman") is a current, probably colloquial, word for an adult male.


    5. Fū [[夫]] is a dignified term for an adult male.'
- type: huang-jingui
  text: 'HUANG JINGUI 2006


    ANIMALS 2.


    雄，雄性動物通稱。


    牡，專稱雄性獸畜。


    特專稱雄性牛馬。羝，專稱雄羊。'
