zh: 刺
och: 刺
definition: CUT a HOLE THROUGH SOMETHING, USING A SHARP THING.
criteria:
- type: old-chinese-criteria
  text: '1. The current general word for piercing anything is cì [[刺]], which also typically refers to stabbing and piercing something, usually inorder to damage it.


    2. Guàn [[貫]] is to make a hole in the middle of something so as to be able to string it up.


    3. Chuān [[穿]] refers to piercing something so as to make a hole in it.


    4. Xiàn [[陷]] refers to piercing something so as to get to the inside of it.'
- type: modern-chinese-criteria
  text: '刺穿 is a current modern word for piercing something.


    戳穿 is a slightly more formal or literary word referring to piercing.


