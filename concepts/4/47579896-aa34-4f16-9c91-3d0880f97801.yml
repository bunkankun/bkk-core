  text: 'HUANG JINGUI 2006


    HUMAN AFFAIRS 39.


    等，等級的通稱。


    級，官位的品級。


    品，職官等級的通稱。


    階，官爵的等級，後特指 “ 品 ” 下的等級或散官的品級。


    班，位次；作動詞，安排等級。位，泛指尊卑等級、官位爵位；特指君王的職位。


    列，位次，泛指。


    次，位次，少獨用。'
