concept: LIKE
alt_labels:
- LIKE
zh: 寧取
definition: DESIRE INTENSELY so as to TEND to CHOOSE.
criteria:
- type: old-chinese-criteria
  text: '1. The general words expressing preference is ài [[愛]], but the notion is often hard to distinguish from a preferential desire, and for the semantically closely related hào [[好]] see DESIRE.


    2. Nìng [[寧]] refers to subjective general preference.


    3. Bù rú [[不如]] refers to objective preferability "one should prefer to, one should rather". See also SHOULD.'
