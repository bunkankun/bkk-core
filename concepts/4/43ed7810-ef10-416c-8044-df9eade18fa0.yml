    rough draft to BEGIN TO identify synonym group members for analysis, based on CL etc. 18.11.2003. CH ／'
- type: old-chinese-contrasts
  text: 'Signs form an important part of animal communication and animal culture. See, for example WALKER 1983. Artifacts produced for symbolisation seem to be a privilege of the human mammal. An indispensible classic on this matter remains MORRIS 1946.


    EBERHARD is predominantly concerned with natural symbols as well as the iconography in Chinese culture.'
