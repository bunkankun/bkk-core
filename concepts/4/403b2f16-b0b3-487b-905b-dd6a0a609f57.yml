definition: ARTEFACT PRODUCED FOR USE USING a DEFINED METHOD.
criteria:
- type: old-chinese-criteria
  text: 1. The general word for a tool for use of any kind is qì [[器]], but the primary meaning of the word remains "container, vessel". (For complex mechanical tools see CONTRAPTION.)
