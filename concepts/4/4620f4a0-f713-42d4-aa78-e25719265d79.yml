zh: 雕刻
och: 刻
definition: CUT into METAL, WOOD, OR JADE so as to PRODUCE WRITING OR a BEAUTIFUL PATTERN.
criteria:
- type: old-chinese-criteria
  text: '1. Kè [[刻]] tends to be primarily to engrave in wood or ivory.


    2. Diāo [[彫]] refers to any form of engraving on or in any material, including jade and stone.


    3. Lòu [[鏤]] refers to engraving in metal only.'
- type: modern-chinese-criteria
  text: '刻 is the current word for engraving.


    雕刻 refers to engraving any pattern.


    銘刻 refers to engraving an inscription.


    雕


    琢


    契


    rough draft to BEGIN TO identify synonym group members for analysis, based on CL etc. 18.11.2003. CH ／'
