zh: 感謝的
och: 德／得
definition: SOCIAL-EMOTION MAKING ONE WANT TO THANK SOMEONE BECAUSE S/HE BENEFITED ONE.
criteria:
- type: old-chinese-criteria
  text: '1. Surprisingly, there is only one general word for gratitude as a psychological attitude, and that is the relatively rare dé [[德]], a highly problematic word which much more often seems to mean "spiritual power" or "virtue" among many other things.


    NB: Gǎn [[感]] "be grateful" is post-Han (JIN, LU JI) and still relatively rare.'
- type: modern-chinese-criteria
  text: '感恩 is the most current modern word for gratitude.


    銜恩 (lit) refers to a polite formal feeling of gratitude.


    感戴 focusses on the sincerity of the feeling of gratitude.


    感激 refers to a feeling of being grateful or indebted.


    激感


    感恩戴德


    感恩圖報


    結草銜環


