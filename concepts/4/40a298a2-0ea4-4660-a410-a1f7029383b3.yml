type: concept
concept: DON'T
alt_labels:
- SHOULD NOT
- MUST NOT
zh: 別
definition: COMMAND that one SHOULD NOT to ACT in a DEFINED way.
criteria:
- type: old-chinese-criteria
  text: '1. The most common prohibitive particle is wù [[勿]], which usually precedes transitive verbs with omitted objects.


    2. Wú [[毋]] is a prohibitive particle which normally requires that any transitive verb it precedes must retain its object.


    3. Wú [[無]] appears often used for wú [[毋]], but there is a clear tendency for the word to indicate a generalised "one should not" rather than a "don''t" hic et nunc.'
- type: modern-chinese-criteria
  text: '別


    不要


    rough draft to BEGIN TO identify synonym group members for analysis, based on CL etc. 18.11.2003. CH ／ LU JIANMING'
