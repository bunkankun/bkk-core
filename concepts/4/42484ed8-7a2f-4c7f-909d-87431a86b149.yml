concept: DEFERENTIAL
definition: SHOWINGLY>DEMONSTRATIVELY HUMBLE
criteria:
- type: modern-chinese-criteria
  text: '謙虛


    謙遜


    虛心


    自輕自賤


    自慚形穢


    恭順


    下氣


    奴相


    下氣怡聲


    低聲下氣


    低三下四


    低首下心


    奉命唯謹


    唯唯喏喏


    唯唯否否


    卑躬屈膝


    做小伏低


    搖尾乞憐


    奴顏媚骨


    奴顏婢膝'
