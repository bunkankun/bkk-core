zh: 養
definition: FEED AND PROTECT ENDURINGLY so as to CAUSE TO GROW.
criteria:
- type: old-chinese-criteria
  text: '1. The current general word for rearing and/or breeding is yù [[育]], which can refer to animals as well as occasionally to humans, and the word belongs to a dignified stylistic layer.


    2. Xù [[畜]] refers primarily to the breeding of livestock, but is also used for humans under one''s control and below one''s status.


    3. Yǎng [[養]] refers primarily to the caring for and nourishing of one''s parents, children or other humans one feels caring sympathy for and is only occasionally used for non-humans, although it does apply to plants like mulberry trees that need much care.'
- type: huang-jingui
  text: 'HUANG JINGUI 2006


    ANIMALS 40.


    養，飼養的通稱。


    豢，養豬或用穀物飼養，必須帶賓語。


    畜，長時間地喂養，可以不帶賓語。飼，側重在具體的喂養活動。


    芻，用草料喂養，對象是牛羊之類。'
- type: modern-chinese-criteria
  text: '畜牧


    牧畜


    飼養


