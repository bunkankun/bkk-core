zh: 石頭
definition: COMMON INTENSELY HARD SUBSTANCE in LANDSCAPE.
criteria:
- type: old-chinese-criteria
  text: '1. The general word for a stone is shí [[石]].


    2. Pán [[磐]] refers to a boulder.


    3. Lì [[礫]] refers to a pebble.'
- type: huang-jingui
  text: 'HUANG JINGUI 2006


    GEOGRAPHY 26.


    石，構成地殼的礦物硬塊，為石頭的總稱。


    磐，紆回層迭的巨大山石。


    礫，小石、碎石。


    磧，淺水中的石塊，即大小的鵝卵石。


    沙，細小的石粒。


    GEOGRAPHY 28.


    [ 石＋而＋大 ] ，滑石，顏色多種，多作佩飾。


    武夫，一種石英，紅質白紋，色彩朦朧，但很潤澤，作建築裝飾材料。


    [ 王＋民 ] ，一種大理石，色澤溫潤、體積方整而大，質地或軟或硬，白色為主，用作工藝品、建築裝飾材料。磩，輝綠岩，或為金青色、或為青紫色，可用來製作硯臺。


    ARCHITECTURE 23. STONE BASE OF PILLAR


    礎，墊在柱腳的墊石。


    [ 石＋舄 ] 磌，指明礎。


    榰，暗礎。質（鑕、櫍、礩），墊在礎上圓形墊物，引申（ “ 礩 ” ）指石質明礎。


    磉，支承柱礎的獨立基礎。


    磉上墊礎，礎上墊礩。


    ARCHITECTURE 24. STONE BASE 基，牆的地基，整幢建築的地上、地下基礎總稱。


    址，夯土地基喻稱。


    台，露出地面的地基。


    堂，臺基上加高的地基，殿堂的四方形的夯土臺基。


    壇，喻稱高臺式堂基。'
- type: modern-chinese-criteria
  text: '石


    石頭


    河卵石 refers to a small round stone or pebble.


    鵝卵石 refers to a largish round stone or cobble.


    矸石


    矸子


    石頭子兒


    礫


    礫石


