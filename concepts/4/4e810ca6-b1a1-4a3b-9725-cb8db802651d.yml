type: concept
concept: EXIST
zh: 存在
och: 有／存
definition: BE-IN the UNIVERSE of SPACE AND TIME.
criteria:
- type: old-chinese-criteria
  text: '1. The standard word for existence is yǒu [[有]] and this word is also used inchoatively.


    2. Cún [[存]] focusses continued existence as opposed to disappearance or annihilation. See PERSIST.


    3. Zài [[在]] focusses on the presence in a certain place. See BE IN.'
- type: modern-chinese-criteria
  text: '存在


    在


    有


    是


    存


    留存


    陰魂不散


    巋然獨存


    碩果僅存


    魯殿靈光


    靈光獨存


    rough draft to BEGIN TO identify synonym group members for analysis, based on CL etc. 18.11.2003. CH ／'
- type: old-chinese-contrasts
  text: 'LEIBNIZ 6.4 P. 25: Ipsum e s s e videtur per se concipi. Ponamusenim concipi per alia, ut a et b, videtur


    de his ipsum quoque esse posse concipi; quod absurdum est. Existentia ergo est notio 20


    incomposita, sive irresolubilis.'
