definition: COVER the SURFACE of something USING a LIQUID.
criteria:
- type: huang-jingui
  text: 'HUANG JINGUI 2006


    SACRIFICE 4.


    釁，把牲血塗在新成的建築或器物上以祭的總稱。


    刲，取羊耳下血以釁。


    [ 气＋刀 ] ，取獸類頸血以釁。


    衈，取禽類（雞）血以釁，後可用為泛指，即以血行釁禮。


    考，建築物落成設食祭神而不釁血，後又有泛指用法，即也包括釁血在內。


    解土，建築物落成時祭謝土神。'
