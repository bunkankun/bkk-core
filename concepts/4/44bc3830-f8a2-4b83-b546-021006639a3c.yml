- type: old-chinese-contrasts
  text: Nèi 內 thus refers to the inner versus the outer ( 內臟 not 中臟 ), but note that we do have nèi xīn 內心 "the heart which is inside the body, the inner heart" as well as zhōng xīn 中心 "what is inside the heart, the core of one's heart, one's innermost heart" cf. also 中道 "mid-way". Wài yè 內業 is concerned with what is in one's three-dimenional body, not what is in the yè 業. Zhōng yè 中夜 is the middle of the yè 夜, not the yè 夜 which is in the middle of something.
