zh: 豐饒的
och: 肥／饒
definition: ABLE, as SOIL OR TERRITORY, to CAUSE PLANTS to GROW ABUNDANTLY.
criteria:
- type: old-chinese-criteria
  text: '1. The standard word for fertility of land is féi [[肥]] (ant. jí [[瘠]] "infertile"), and this refers to potentially fertile areas as well as to land already under cultivation.


    2. Ráo [[饒]] (ant. huāng [[荒]] "infertile") refers to the productive state of fields that are being cultivated.


    3. Wò [[沃]] (ant. què [[埆]] "infertile") is an archaising elevated word.'
