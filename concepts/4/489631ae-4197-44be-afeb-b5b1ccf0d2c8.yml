concept: THING
zh: 東西
definition: CONCRETE OBJECT.
criteria:
- type: old-chinese-criteria
  text: '1. The current standard word for any physical or non-physical object or creature is wù [[物]].


    2. Shì [[事]] refers to a things as a subject matter, or as an event.


    3. Shí [[實]] is a philosophical concept referring to any object or reality of any kind.'
- type: modern-chinese-criteria
  text: '事物


    物


    東西


