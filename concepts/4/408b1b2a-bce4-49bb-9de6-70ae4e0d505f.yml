concept: GOVERN INSTEAD
zh: 代替治理
definition: GOVERN>administer an OFFICE REPLACING SOMEONE OTHER.
criteria:
- type: huang-jingui
  text: 'HUANG JINGUI 2006


    GOVERNMENT/LAW 18.


    攝，已有其任，任職者不在，暫時代理行使職權。


    假，職位空缺，在正式任命之前行使權力之稱。


    守，秦漢制度，正式任命之前的試用之稱。


    署，暫時代管。'
