type: concept
concept: MEAT
zh: 肉
definition: FLESH of DEAD ANIMALS USED as FOOD.
criteria:
- type: old-chinese-criteria
  text: '1. The current general word for meat as something edible is ròu [[肉]].


    2. Xīng [[腥]] refers to raw meat.


    3. Niú [[牛]] is sometimes used to refer to beef.


    4. Yáng [[羊]] is sometimes used to refer to mutton.'
- type: huang-jingui
  text: 'HUANG JINGUI 2006


    FOOD 39.


    腊，整體乾縮的大塊、段乾肉，其法也可用於魚類、瓜果等。


    脩，上古、秦漢切成條狀，調味搗堅的乾肉，作菜餚。


    脯，切成薄片、加鹽製成的乾肉，作酒餚。漢以後，主要稱 “ 脯 ” ，脯賅脩。除了豬肉，其他家禽、魚類、果類均可作脯。


    FOOD 40.


    臠，大塊肉。


    胾，小塊肉。 “[U+4411]” ，小片肉。


    膾，細薄片肉。


    軒，大片肉。


    FOOD 41.


    胙，祭肉通稱。脤，古代帝王祭祀社稷時的生肉。膰，祭祀時烤熟之肉。膴，祭祀用的去骨大片乾; 幹肉。


    胖，祭祀所用切成薄片的生肉。'
- type: modern-chinese-criteria
  text: '肉


