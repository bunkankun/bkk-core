type: concept
concept: DIALECT
zh: 方言
criteria:
- type: old-chinese-contrasts
  text: 'UlLRICH UNGER DRAFT: Daß das Chinesische schon im Altertum verschiedene Dialekte aufwies, ist sicher. Ganz vereinzelt finden sich in den Texten selbst Hinweise darauf. Meng tsï spricht von einem Ts''i- und einem Ch''u-Dialekt; das Tso-chuan nennt das Ch''u-Wort für "Tiger": 於菟 *uo-tuo. Völlig offen ist indes im Einzelfall die Frage, ob es sich bei den unterschiedlichen Idiomen bloß um Dialekte derselben Sprache, also des "Chinesischen", handele, oder nicht doch um Fremdsprachen. In Yüeh jedenfalls wurde eine nicht-chinesische Sprache gesprochen. Dolmetscher sind bezeugt. B. Karlgren hat anhand einzelner Formwörter einen Lu-Dialekt (also Shan-tung) und einen Tso-Dialekt (Sprache des Tso-chuan, nicht lokalisiert) unterschieden. Reiches Material zur Dialektologie der Han-Zeit bietet das Dialektwörterbuch Fang-yen, in welchem, locker nach Sachgebieten geordnet, Dialektausdrücke verschiedener Gegenden benannt werden. Zum Teil werden dazu auch die allgemein üblichen äquivalente gegeben. Es handelt sich hierbei allerdings nur eben um einzelne Wörter; weitergehende Unterschiede, etwa der Grammatik, sind nicht registriert. Auch die phonologischen Unterschiede der einzelnen Idiome verbergen sich hinter den Zeichen. Von diesen sind nicht wenige überhaupt nur hier, nicht in Texten, bezeugt - es handelt sich hierbei also vielleicht um Zeichen, die speziell für Dialekt-Wörter erfunden wurden.'
