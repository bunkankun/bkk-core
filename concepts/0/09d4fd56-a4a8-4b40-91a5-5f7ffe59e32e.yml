uuid: 09d4fd56-a4a8-4b40-91a5-5f7ffe59e32e
type: concept
concept: HUNT
zh: 打獵
och: 田/畋
definition: TRY to KILL WILD BEASTS OR BIRDS IN the COUNTRYSIDE OR IN a BIG PARK.
criteria:
- type: old-chinese-criteria
  text: '1. Tián [[田]] refers to an officially organised hunt, often in an official hunting ground reserved for such activities.


    2. Liè [[獵]] refers to professional hunting, and sometimes also to general non-official hunting for pleasure.


    3. Shòu [[狩]] is defined as a winter hunt, but in ZUO and CQ hunts by this name do occur regularly in spring also.'
- type: huang-jingui
  text: 'HUANG JINGUI 2006


    ANIMALS 37.


    田，原始的燒荒圍獵，後也稱輔以火攻的大圍獵。


    狩，上古綜合性圍獵的通稱。


    獵，小規模獵獸；秦以後， “ 獵 ” 成為打獵通稱。'
- type: modern-chinese-criteria
  text: '打獵


