zh: 津
och: 津
definition: SHALLOW WAY ACROSS a RIVER.
criteria:
- type: old-chinese-criteria
  text: '1. The standard general word for a ford is jīn [[津]].


    NB: For dù [[渡]] "ford a river" see CROSS OVER.'
- type: huang-jingui
  text: 'HUANG JINGUI 2006


    COMM 4.


    津，渡口通稱。


    渡，漢代以後口語中渡口通稱。


    浦，大江河的渡口，包括濱江之地與浦中水域。


    港，通江海的人工河渠，宋代起可泛稱港口，即可停泊的江湖海灣，但未必是貿易港。


    市舶，唐代起歷代設置的外貿機構，其所在之地即為貿易港，但並無 “ 港 ” 名。'
- type: modern-chinese-criteria
