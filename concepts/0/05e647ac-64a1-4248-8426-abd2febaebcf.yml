concept: YAWN
zh: 打呵欠
definition: BREATHE out INTENSELY AND INVOLUNTARILY, OFTEN:typically BECAUSE one is TIRED.
criteria:
- type: huang-jingui
  text: HUANG JINGUI 2006
- type: modern-chinese-criteria
  text: '打呵欠 is the current modern word for yawning.


    打哈欠 is a variant of the above.


    欠伸 focusses on the stretching of the body which typically accompanies yawning.


    rough draft to BEGIN TO identify synonym group members for analysis, based on CL etc. 18.11.2003. CH ／'
