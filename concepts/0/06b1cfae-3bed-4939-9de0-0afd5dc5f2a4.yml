zh: 池塘
definition: SMALL LAKE PRODUCED by HUMANS.
criteria:
- type: old-chinese-criteria
  text: '1. The most common word for an artificial lake of any kind is chí [[池]], and this word typically refers to a meandering lake, sometimes close in shape to a moat, particularly round elevated terraces and the like, around gardens and orchards, but also as part of palaces.


    2. Zhǎo [[沼]] is an elevated word referring to elaborate artificial lakes in or near palaces and the like, although the word can also come to refer more generally to natural lakes and marshlands.'
- type: huang-jingui
  text: 'HUANG JINGUI 2006


    GEOGRAPHY 17.


    池，蓄水池，通稱，有娛樂、水產養殖等多種用途。


    瀦，利用低窪地構築堤壩、用來灌溉的蓄水池，南方用語。


    陂，利用窪地、坡谷障圍而成的大水池，主要用於灌田。


    塘，人工築堤而成的方形水池。


    湖，大於陂的人工水庫，用於灌溉，南方用語。'
- type: modern-chinese-criteria
