definition: LACK AWARENESS.
criteria:
- type: huang-jingui
  text: 'HUANG JINGUI 2006


    HUMAN BODY 7. 頭暈。


    眩，重在視覺，視物在旋轉搖動。


    暈，重在體覺，有頭腦發昏、要跌倒或失去知覺的感覺。


    員員，頭暈旋轉疼痛之貌，疊音形容詞。'
