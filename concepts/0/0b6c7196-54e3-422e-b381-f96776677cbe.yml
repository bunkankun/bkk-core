  text: '1. Kuà [[跨]] refers to the thigh and the calf (not normally also including the foot).


    2. Gǔ [[股]] refers to the thigh.


    2. Jìng [[脛]] refers to shin.


    4. Féi [[腓]] refers to the calf.'
