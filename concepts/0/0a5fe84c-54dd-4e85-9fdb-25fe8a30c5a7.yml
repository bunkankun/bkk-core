definition: SUBSTANCE USED by CREATURES.
criteria:
- type: old-chinese-criteria
  text: '1. The general term for food is shí [[食]] and this includes food as well as drink and can refer generally to one''s livelihood, also to staple foods as opposed to delicacies involving meat, such as kuài [[膾]] "minced meat, raw".


    2. Fàn [[飯]] which refers to basic foodstuff, usually rice and cereals.


    3. Shū [[疏]], sūn [[飧]], cū [[粗]] refer to crude foodstuffs, grain-based or vegetable based.


    4. Liáng [[糧]] refers to grain-based ordinary plain food.


    5. Hūn [[葷]] refers to non-vegetarian food.


    NB: This group needs to be elaborated.'
- type: huang-jingui
  text: 'HUANG JINGUI 2006


    FOOD 1


    食，飯食總稱。


    飯，漢以後可作口語中的飯食通稱。


    膳，供應的佳美飯食。


    饌，豐盛的飯食。


    FOOD 33. 佐食食物。


    餚，牛羊豬肉，主菜。


    核，梅、李、桃為主的乾果。


    羞，多滋味美餚，有奇珍異獸、四時水鮮、果脯餌餅等。


    飲，各種酒和漿液。


    FOOD 38. 菹，腌製的鹹菜、酸菜、糟菜。


    齏，切細腌漬物；也可腌肉。


    醢，醬製法制的醬肉；通稱。


    臡，醬肉中帶骨者。


    醓，醬肉中多汁者。'
