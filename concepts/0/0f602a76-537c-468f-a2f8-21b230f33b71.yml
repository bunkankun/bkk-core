concept: PUPIL
zh: 眼珠
och: 眸
definition: PART of the EYE THROUGH which LIGHT ENTERS THE EYE.
criteria:
- type: old-chinese-criteria
  text: '1. The current general word for the pupil of the eye is móu [[眸]].


    2. Tóng [[瞳]] is a later colloquial word for the pupil of the eye.


    3. Jīng [[睛]] refers to the pupils of the eyes as shining objects which attract attention.'
