type: concept
concept: HAIR
zh: 頭髮
och: 髮
definition: BODY-TISSUE which GROWS on SKIN, VISIBLY on the TOP of the HEAD of HUMANS, and OTHER PLACES.
criteria:
- type: old-chinese-criteria
  text: '1. The current general word for hair of any kind is fǎ [[髮]].


    2. Máo [[毛]] is also occasionally used to refer to the hair of old persons, but the word refers more generally to any fur or hair.


    3. Háo [[毫]] refers to long, fine hair on animals.


    4.. Bá [[胈]] is a rare word referring to body hair on man.


    5. Bìn [[鬢]] refers specifically to hair on the temples, or "sideburns". See TEMPLES'
- type: huang-jingui
  text: 'HUANG JINGUI 2006


    BODY 31.


    髮，人頭髮的通稱。


    毛，主要指動物的毛；指人的頭髮，主要用於白髮、禿髮。


    鬢，臉旁靠近耳朵的頭髮。


    鬊，人梳髮時落下的亂髮，兼指頭上的亂髮。


    髾，髻後下垂的頭髮梢。'
- type: modern-chinese-criteria
  text: '髮


    頭髮


    髫


    黑髮


    烏髮


    rough draft to BEGIN TO identify synonym group members for analysis, based on CL etc. 18.11.2003. CH ／'
