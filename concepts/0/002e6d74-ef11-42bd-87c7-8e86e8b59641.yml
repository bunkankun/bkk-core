definition: The PLACE where a RIVER OR BROOK BEGINS.
criteria:
- type: old-chinese-criteria
  text: '1. The current general term for a concrete water source feeding any river or stream is quán [[泉]], and the current general term for a source feeding a lake of any kind is yuān [[淵]].


    2. Yuán [[源]] / [[原]] refers to an original source, and this word is rich in metaphysical or abstract connotation. See BEGIN'
