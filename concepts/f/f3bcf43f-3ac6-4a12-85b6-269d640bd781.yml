- type: huang-jingui
  text: 'HUANG JINGUI 2006


    FOOD 42.


    酒，曾指黃酒；作總稱。


    醲，甜酒。


    鬯，黑黍合鬱金香草釀的祭祀香酒。


    醲，濃酒。


    酎，三釀醇酒。


    醨，薄酒。


    醪，帶糟滓之酒。


    清酌，或作 “ 清酒 ” ，濾去糟滓之酒。


    白酒，即 “ 燒酒 ” ，元代始有。'
