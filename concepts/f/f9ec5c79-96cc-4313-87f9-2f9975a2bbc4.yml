zh: 牆壁
definition: SLIM, AND TYPICALLY HIGH VERTICAL PART of a BUILDING, TYPICALLY SURROUNDING a ROOM, OR USED FOR SHOWING a BOUNDARY OR PROTECTING a PLACE INSIDE.
criteria:
- type: huang-jingui
  text: 'HUANG JINGUI 2006


    ARCHITECTURE 13.


    牆，最早是木骨泥牆，後多用夯土或土坯製成土牆，明代始有磚牆。


    垣，環繞居舍的矮牆。


    牆，獨立外牆的總稱。


    壁，建築物的內牆。


    墉，宮室的北牆。堵，一段牆。'
