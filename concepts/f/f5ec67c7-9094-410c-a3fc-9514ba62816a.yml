type: concept
concept: LEATHER
zh: 皮革
definition: SKIN, LACKING FUR, of ANIMALS OFTEN USED to PRODUCE ARTEFACTS.
criteria:
- type: old-chinese-criteria
  text: '1. The general word for leather or hide with fur removed is gé [[革]].


    2. Wéi [[韋]] refers to softened leather.


    3. Kuò [[鞹]] refers very specifically to the the leather of animals after all fur has been removed.'
