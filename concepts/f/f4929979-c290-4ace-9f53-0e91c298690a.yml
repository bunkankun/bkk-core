zh: 特徵
definition: ABSTRACT OBJECT a THING is SAID to BE OR to HAVE.
criteria:
- type: old-chinese-criteria
  text: '1. There is no common word for a characteristic, feature, or property of something, but dé [[德]] and xiàng [[象]] are words that are used to refer to determining aspects of things. This is one of those terms have neutral descriptive uses versus abstract idealised uses. The list of such concepts is long: [[王]]"king/true king =[[王者]]", [[君子]]"gentleman/true gentleman" [[道]]"behaviour/ideal behaviour"，[[禮]] "custom/ideal ritual"，[[德]]“feature/ideal feature,virtue". See NATURE 2. Jiān bái [[堅白]] is an abstract philosophical term which refers to incommensurate features coexisting in a given object.'
- type: modern-chinese-criteria
  text: '特徵


    特點


    特性


    特色


    風味


    rough draft to BEGIN TO identify synonym group members for analysis, based on CL etc. 18.11.2003. CH ／'
