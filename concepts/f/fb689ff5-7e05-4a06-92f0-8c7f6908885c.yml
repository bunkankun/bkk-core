concept: RELATIVE CLAUSE MARKER
definition: GRAMMAR []. PARTICLE marking what is construed as a postposed modifier of a nominal expression.
criteria:
- type: old-chinese-criteria
  text: The N that Vs NOTE [[而]] AFTER NOUNS IN OBJECT POSITION. Unmarked postposed relative clauses become more and more common from Warring States times onwards. As they are unmarked by any characters we can register, they are not easily linked into this system and are treated (as a matter of convenience) as a rhetorical device.
