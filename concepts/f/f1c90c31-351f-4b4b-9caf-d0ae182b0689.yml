concept: TOAST
alt_labels:
- DRINK (TO) THE HEALTH OF
- DRINK TO
- SALUTE
- HONOR
- PAY TRIBUTE TO
zh: 祝酒
definition: DRINK TOGETHER with OTHERS AND SAY that one CONGRATULATES someone OR CELEBRATES SOMETHING.
criteria:
- type: old-chinese-criteria
  text: '1. The host offering a first toast to his guest is xiàn [[獻]] (xiàn jiǔ [[獻酒]] ) "offer a toast to the guest".


    2. The guest toasting back at a feast is zuò [[醋]] / [[酢]] "offer a toast back to the host".


    3. The host responding to the guest''s toast is chóu [[酬]] "toast back to the guest".'
- type: huang-jingui
  text: 'HUANG JINGUI 2006


    FOOD 5.


    獻，主人向客人敬酒。


    酢，客人敬謝主人之酒。


    酬，主人再謝賓敬酒。'
- type: modern-chinese-criteria
  text: '祝酒


