zh: 群眾
definition: LARGE GROUP of PEOPLE IN ONE PLACE.
criteria:
- type: modern-chinese-criteria
  text: '群眾 is the general modern word for the masses.


    廣大群眾 is a politicised propaganda term for the masses.


    大眾


    公眾


    民眾


    萬眾


    千夫 (lit) is an old-fashioned way of referring to the masses.


    眾生


    萬姓


    人民群眾


    人民大眾


    rough draft to BEGIN TO identify synonym group members for analysis, based on CL etc. 18.11.2003. CH ／'
