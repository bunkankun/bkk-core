concept: COMMONER
zh: 老百姓
definition: HUMAN of less than NOBLE status.
criteria:
- type: old-chinese-criteria
  text: '1. Pǐ fū [[匹夫]] (ant. jūn zǐ [[君子]] "gentleman; freeman") and the rarer xì rén [[細人]] is a purely sociological term referring to a person without public office.


    2. Xiǎo rén [[小人]] (ant. jūn zǐ [[君子]] ) is a term of moral or personal appraisal and refers to a person of minor worth or of no moral merit.'
