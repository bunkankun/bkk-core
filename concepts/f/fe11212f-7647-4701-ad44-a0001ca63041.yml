zh: 旅行
definition: DISPLACE ONESELF, TYPICALLY a BIG DISTANCE, AND IN a VEHICLE OR RIDING AN ANIMAL.
criteria:
- type: old-chinese-criteria
  text: '1. The standard word for travelling for any purpose is xíng [[行]].


    2. Yóu [[遊]]／[[游]] refers specifically to travelling for pleasure.


    3. Zhēng [[征]] is an elevated term sometimes referring to a major travelling expedition.'
