definition: INTENSE IN-RELATION-TO ALL.
criteria:
- type: old-chinese-criteria
  text: '1. The general word for something having the highest degree in a set of comparables is zuì [[最]].


    2. Zhì [[至]] refers to something being of the highest degree in any set of comparables. See PERFECT.


    3. Jìn [[盡]] refers to something being consummately possessed of a quality.'
- type: modern-chinese-criteria
  text: '了不得 refers to something being extreme in a positive sense, i.e. extraordinary.


    不得了 refers generally to something being extreme.


    驚人


    驚心


    可驚


    震驚


    觸目驚心


    驚心動魄


    聳人聽聞


    危言聳聽


