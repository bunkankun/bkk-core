  guangyun: 秋方説文曰鳥在巢上也日在西方而鳥西故因以爲東西之西篆文作㢴象形亦州名本漢車師國之地至貞觀討平以其地爲西州亦姓又漢複姓十一氏左傳秦師西乞術宋大夫西鉏吾西郷錯出丗本又黄帝娶西陵氏爲妃名纍祖史記魏文侯鄴令西門豹周末分爲東西二周武公庶子西周爲氏晉有北海西郭陽何承天以爲西朝名士慕容廆以北平西方䖍爲股肱何氏姓苑有西野氏西宫氏王符濳夫論姓氏志曰如有東門西郭南宫北郭皆是因居也先稽切十六
