- concept_label: 怒 nú 康熙字典：【顏師古·糾謬正俗曰】怒有二音，詩小雅君子如怒，大雅逢天僤怒，讀爲上聲。邶風逢彼之怒，小雅畏此譴怒，讀爲去聲。今山東河北人但知怒有去聲，不知有上聲，失其眞矣，蓋字有動靜音，人多不講，皆此類也。
