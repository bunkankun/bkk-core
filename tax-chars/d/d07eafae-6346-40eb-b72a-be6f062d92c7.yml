  fanqie: 是征切
  tone: 平
  guangyun: 畢也就也平也善也亦州名古西戎地州南八十里有仇池山晉改爲仇池郡後爲南秦州梁廢帝改爲成州又姓出上谷東郡二望本自周文王子成伯之後又漢複姓十五氏莊子有務成子廣成子顔成子游伯成子髙韓子有容成子列子有考成子國語晉卻犨食采苦成後因以爲氏丗本曰宋有大夫老成方盆成括仕於齊晉有英成僖子漢有廣漢太守古成雲古音枯髙祖功臣有陽成延後漢有密縣上成公白日升天晉戊己校尉燉煌車成將古成氏之後史記有邢成氏是征切十
