type: semantic-feature
code: nonreferential
description: non-referential. This category includes a wide variety of usages of nouns which in subject or in object position do not serve to identify any definite item or set of items in the world.
notes: 'Many of these, like 王者 , have no referential uses, others, like the pronoun 之 , have striking common lexicalised non-referential meanings, but are even more common in referential meanings.


  It is clear that the general category nonref needs to be subcategorised because it is too comprehensive as it stands.'
