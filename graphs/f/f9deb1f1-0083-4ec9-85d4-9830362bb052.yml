gloss: 春方也説文曰動也从日在木中亦東風菜廣州也記云陸地生莖赤和肉作羮味如酪香似蘭吴都賦云草則東風扶留又姓舜七友有東不訾又漢複姓十三氏左傳魯卿東門襄仲後因氏焉齊有大夫東郭偃又有東宫得臣晉有東關嬖五神仙傳有廣陵人東陵聖母適杜氏齊景公時有隱居東陵者乃以爲氏丗本宋大夫東郷爲賈執英賢傳云今髙密有東郷姓宋有貟外郎東陽無疑撰齊諧記七卷昔有東閭子甞富貴後乞於道云吾爲相六年未薦一士夏禹之後東樓公封于𣏌後以爲氏莊子東野稷漢有平原東方朔曹瞞傳有南陽太守東里昆何氏姓苑有東萊氏德紅切十七
