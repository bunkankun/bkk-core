code: nab.tt
description: ditransitive abstract noun.
notes: This refers to words like "sum" in "the sum of X and Y" or "difference" in "the difference between X and Y". One notes on the occasion of the second example that the obligatory two subjects of a vi2 like "differ from one another" do create an nab.tt in the nominalised form. (For the double subject verbs see the SYNTACTIC CATEGORY vi2.)
