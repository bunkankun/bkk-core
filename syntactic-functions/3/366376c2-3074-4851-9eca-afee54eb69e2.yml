type: syntactic-function
code: vt+prep+N.adV
description: transitive verb followed by its prepositional nominal object, this whole phrase preceding and modifying a V
notes: The relation between the vt and the verbal expression it precedes remains controversial. The function of 曰 in such contexts reminds one of the function of quotation marks rather than of a full negatable speech verb. In any case, 曰 will have to be treated as a "defective verb" in any grammar of Classical Chinese because it is not normally negatable, and - though transitive - is never followed by the object particle 之 .
