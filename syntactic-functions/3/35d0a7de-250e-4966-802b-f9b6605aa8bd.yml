description: question pronoun in construction with a preceding verbal expression
notes: 'In the long run one may well wish to specify what kinds of verbal expression in fact occur in front of the question pronouns. We should then have to further subdivide the category. Such subdivision will always remain possible, but in cases like this it seems ominously desirable.


  There is also a very serious question of why exactly we call these kinds of words pronouns! 待考'
