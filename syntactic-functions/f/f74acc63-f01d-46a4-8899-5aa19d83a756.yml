uuid: f74acc63-f01d-46a4-8899-5aa19d83a756
type: syntactic-function
code: NPab.post-N
description: abstract complex nominal expression modified by a preceding nominal expression. (See also NPpost-N)
notes: In general, NPs are not yet subcategorised when they enter more complex constructions, because the criteria of abstractness of nominal expressions are so hard to apply in these syntactic contexts. One would be reduced to purely semantic intuitions in applying such a subcategorisation across the board.
