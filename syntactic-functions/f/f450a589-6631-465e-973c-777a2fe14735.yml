code: npro{OBJ}+Vt.postN{TOP}
description: object pronoun in construction with and preceding a transitive verbal, that phrase being in construction with a preceding nominal topic which is coreferential with the initial pronoun
notes: The cases of a pronoun resuming a noun that immediately precedes it deserves special attention. Compare also 實 which is analysed as npro+V[PRED].postN[SUBJ].
