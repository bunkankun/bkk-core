type: syntactic-function
code: vtoNPab{S}
description: transitive verb followed by a nominalised sentential object
notes: 'We take the sentence "S" to be defined as a predicative (verbal or nominal) expression with an explicit or implicit subject. Nominalisation of this kind of sentence is categorised as NPab[S], i.e. an abstract noun phrase which is a nominalisation of a sentence. Nominal sentences are - we note in passing - not easily nominalised in classical Chinese, so that "Socrates''s being a man" is not a logical construction that goes naturally into classical Chinese, and certainly not without the addition of a (nominalised) copula like 為 . 待考


  Nominalisation of sentences is standardly by qi2 其 replacing the subject or by the addition of 之 between subject and predicate. Unmarked nominalisation is often hard to be sure of and to diagnose with conviction.


  Evidently, this vt+NPab[S] may be viewed as a sub-class of ordinary vt+N, where N happens to be the nominalisation of a sentence labelled as NPab[S].'
