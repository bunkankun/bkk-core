type: syntactic-function
code: npro.adN
description: adnominal pronoun, a pronoun which modifies and precedes a nominal expression
notes: 'Under this category it is registered which npro are found to function, under what circumstances, in adnominal function. Note that the number of npro.adN is significantly smaller than the number of plain npro: this illustrates that not all pronouns can function adnominally. And, manifestly, many of the diagnostic criteria applicable to npro cannot be brought to bear on npro.adN. However npro.adN do tend to function as a substitute for a contextually determinate noun.'
