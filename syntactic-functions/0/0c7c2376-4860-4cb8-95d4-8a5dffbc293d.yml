code: padNPab{S}.adS
description: particle preceding and modifying a nominalised sentence, that whole construction preceding and modifying another sentence
notes: 凡 frequently comes in front of un-nominalised sentences. The existence of explicitly nominalised cases might open up the possibility of regarded the presentential use of 凡 as simply a case of unmarked nominalisation. This would be plausible if the marked cases were predominant. But they are not.
