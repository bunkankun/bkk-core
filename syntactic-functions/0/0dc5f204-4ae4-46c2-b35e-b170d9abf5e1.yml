uuid: 0dc5f204-4ae4-46c2-b35e-b170d9abf5e1
type: syntactic-function
code: nnadN
description: binomial noun preceding and modifying a nominal expression.
notes: One notes that it is by no means easy to decide when an nn which modifies another nominal expression deserves to be assigned to this category. Note that 王 is taken as nadN only when it has the general meaning of "royal", and not - for example - when it is possessive and mean's "the king's".
