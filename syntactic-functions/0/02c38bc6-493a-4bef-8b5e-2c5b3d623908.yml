uuid: 02c38bc6-493a-4bef-8b5e-2c5b3d623908
type: syntactic-function
code: NPadS
description: a complex nominal preceding and modifying a sentence.
notes: The notion of "modification" is here taken to include that of "being the time or place topic of". In "Yesterday, it was raining" we take "yesterday" to modify "it was raining" by indicating when it was raining. The words in this group are supposed to be lexically specialised on their adsentential funtion. Thus in "This idiot, he was overtaking me on the left" the expression "this idiot" is not taken to be lexicalised on the topicalised/exposed function and would therefore not qualify for our category.
