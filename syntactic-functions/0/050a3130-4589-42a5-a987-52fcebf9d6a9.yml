type: syntactic-function
code: nad.vadN
description: noun modifying a phrase consisting of a verb modifying a nominal expression.
notes: This tentative category is set up to register the cases where nominal modification is of nominals that are themselves already modified. Cases of this sort are so freely used in Latin and English, that they do not warrant registering, but in classical Chinese the cases are so few that they seem to warrant detailed attention of the existing cases in order to see what the conditions are that licence this double modification.
