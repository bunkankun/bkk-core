type: syntactic-function
code: vt(+V{PASS})
description: transitive verb with an omitted contextually determinate passive-verbal object
notes: It is not yet clear how many of the other vt+V[PASS] can have omitted objects. This needs to be investigated. It would be perfectly possible to classify these verbs simply as vt(+V), obviously, and the only reason we do not choose this simple solution is that we might wish to study exactly the cases of passivised rather than non-passivised contextually determinate omitted verbal objects.
