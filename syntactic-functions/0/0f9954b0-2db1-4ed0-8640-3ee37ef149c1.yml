type: syntactic-function
code: vvi
description: 'intransitive binome where the constituent syllables are not taken to have an independent meaning in TLS.


  An indispensable handbook on these important words in YE MENG 1993. On the problems these words raise KENNEDY "Butterfly" remains crucial.'
notes: These words often have rhyme, alliteration or at least assonance and form an important part of the Chinese vocabulary of lively or intensitive description. Also, these words are notorious for the variety of graphs they allow for each binome, sometimes dozens. It remains to be investigated whether apart from vvadN there also are many cases of vvt+N or even vvtt+N1.+N2 and so on. This requires systematically focussed detailed research that has not so far been done.
