type: syntactic-function
code: vttoN.-vtoNab{S}
description: ditransitive verb with a nominal object, this phrase preceding and being modified by a (co)verb with its nominalised sentence object
notes: The ditransitive verb has only one object and the second object is introduced by a coverbal phrase. It is not a trivial task to bring this semantico-syntactic fact out elegantly in our categorial system, but it remains an important observation that coverbal expressions before or after a verb may on the one side specify an object of that verb, and may on the other hand have completely independent functions that have nothing to do with the valency of the verb.
