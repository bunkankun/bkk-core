uuid: df5f0761-67ef-44ba-af2b-726eae9d016c
type: syntactic-function
code: vt0+V.adS
description: subjectless transitive verb with a verbal object, this prase preding and modifying a sentence (e.g. we4i 為 as in 為悅其言，因任其身 "Because they feel pleased with someone's use of words they go on to employ the person for that reason." )
notes: 'There is no subject for 為 whereas the subject is merely omitted and understood in the case of 悅 .


  This is another case where the category V in the object really refers to a minor SENTENCE. Thus perhaps this category should be reclassified as vt0+S1.adS2. One might even consider the possibility of taking the V to be really an unmarked nominalisation. Thus this category deserves further study.'
