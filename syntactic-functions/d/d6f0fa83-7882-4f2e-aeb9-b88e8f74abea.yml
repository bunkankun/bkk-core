code: vtoN1.adN2
description: transitive verb with its nominal object N1, this phrase preceding and modifying another nominal expression N
notes: A transitive verb with its object modifying a noun is a construction that comes close to an unmarked relative clause. The important observation is that while this construction is possible in classical Chinese it is certainly not highly developed in pre-Buddhist times.
