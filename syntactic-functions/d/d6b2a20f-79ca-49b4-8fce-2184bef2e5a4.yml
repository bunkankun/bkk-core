type: syntactic-function
code: vi-V{SUFF}
description: verb followed and modified by a verbal suffix
notes: There is a large set of words that fit into this category. One is in doubt whether this category should not really be "vi-V". By calling it "v-V" for the time being we (perhaps lamely) suggest that the word really enters into a one-word combination with the suffix. See the monograph by M. Kuenstler (Les suffixes...). This group still has to be implemented.
