uuid: 65d93b56-a5a4-48f1-999e-bca54da80015
type: syntactic-function
code: vt[0]+V[0]
description: subjectless transitive verb with a verbal object of which the subject is lexically predictable and omitted (e.g. bi4 必 "it is imperative to V)
notes: The subjectlessness of these vt can be controversial. For example if a generic subject like "one" is always unexpressed, or expressed by zero, does this count as an example of subjectlessness? If it does, why do we not count as subjectless the many cases where ordinary verbs have generic subjects of this sort? I am not sure that one will be able to sort this out very satisfactorily.
