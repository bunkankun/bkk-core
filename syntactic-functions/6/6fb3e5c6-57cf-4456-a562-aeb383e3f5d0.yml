type: syntactic-function
code: vtt(oN{PIVOT}.)+N{PRED}
description: ditransitive verb with contextually determinate omitted pivotal object, preceding and in construction with a predicative nominal expression
notes: Whether the N here really should be taken as a PIVOT is controversial, and in the end probably wrong. But by taking it in this way, we are able to subclassify the constructions possible in a convenient way.
