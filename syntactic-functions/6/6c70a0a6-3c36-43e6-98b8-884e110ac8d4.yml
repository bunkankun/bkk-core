uuid: 6c70a0a6-3c36-43e6-98b8-884e110ac8d4
type: syntactic-function
code: VPt[0]+N
description: transitive verb phrase with contextually determinate obligatorily omitted subject
notes: This category raises a host of problems. The subject who does the comparing can definitely never be explicit. 諸 stands for something like 之於 and would appear to make this into a VPt0+prep+N, although one suspects a more appropriate way of analysing the idiom could be to take 譬 as vtt0+N1.+prep+N2 and to refuse to treat this as a compound at all. But for lexicographic purposes we do want to record this compound as an important idiom one has to learn.
