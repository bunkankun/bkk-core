type: syntactic-function
code: VPt[oN]
description: transitive complex verbal expression with a lexically determined or predictable omitted object.
notes: For example in the English "he drinks" we have a verb of which the object is understood lexically to be "alcohol". In "he is eating" the object that is lexically understood is "some kind of food". We must try identify the Chinese VPs that work like this and try to distinguish them carefully from intransitive verbs.
