uuid: a2117a93-c37c-432c-9a52-8d15aa8e8cbe
type: syntactic-function
code: p+N1.post-N2
description: particle preceding a nominal (expressing a place or a time), that phrase being in construction with a preceding second nominal
notes: N1 has to refer to a location in concrete or abstract space or in time in this construction. Interestingly, our categorial system lacks an abstract concept to cover these two dimensions.
