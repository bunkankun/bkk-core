code: PP
description: a combination of more than one particle
notes: This is a lame and tame preliminary collection of forms. A great deal of work needs to be done on complex particles. In general, grammatical particles are the last elements that are to be entered into the system. The idea is to start out from non-empty words, rather than empty words. Good dictionaries of complex particles exist. However, none of these concentrate on structural analysis.
