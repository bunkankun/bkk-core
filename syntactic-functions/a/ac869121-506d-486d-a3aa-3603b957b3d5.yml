uuid: ac869121-506d-486d-a3aa-3603b957b3d5
type: syntactic-function
code: vtoNab{ACT}.-V
description: transitive verb followed by a an abstract action-noun, this whole phrase preceding and being modified by a verbal expression
notes: One might feel that this should be registered simply as vt+N.-V, but one is curious to know how many cases there are where this nominal object is in fact an action nominalisation. Thus this category demonstrates that in our context syntactic categories have no "metaphysical" status as somehow "real" distinct syntactic functions. They are simply convenient labels to make distinct syntactic phenomena systematically retrievable.
