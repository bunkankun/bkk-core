type: syntactic-function
code: npro.postVt
description: verbal, which is a contraction of a transitive verb which follows a transitive verbal as its object
notes: 'This category is in a sense "unnatural": in it we record the occurrence of pronouns in object position. And we do this simply in order to chart the different behaviour of different pronouns in this respect. In principle, one could mark all nouns that occur in object versus subject positions, but in general nouns are indifferent to these two functions.'
