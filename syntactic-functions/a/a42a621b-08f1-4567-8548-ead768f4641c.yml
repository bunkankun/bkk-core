description: transitive verb preceded by another transitive verb with an omitted contextually determinate nominal object
notes: The object of this transitive verb is introduced by another transitive verb, a current phenomenon. Compare vtt+N1.postvt(+N2) 以告 x, where the direct object is also introduced by a subordinate preceding transitive verb.
