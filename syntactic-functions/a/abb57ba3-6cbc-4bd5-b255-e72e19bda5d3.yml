code: vt(oN1{PIVOT}).+Vt+N2
description: transitive verb preceding and in construction with a contextually determinate omitted pivot noun, this whole phrase preceding and being in construction with a verb with its nominal object
notes: This is a curious marginal category which ultimately has to be explaned morphologically, I suspect. Thus 命曰 will simply become a VPt meaning "call (something) X". The etmology of this kind of construction is at issue in the present tentative categorial analysis.
