code: vpostadVtoN
description: verb modifying a preceding transitive verb with its nominal object
notes: These adverbs (which one might also conveniently subsume simply under vtpostadV, of which categoy it is a subtype), are all amenable to an analysis where the co-called postposed adverb is taken as a verb with a nominalised verb phrase or sentence as its subject.
