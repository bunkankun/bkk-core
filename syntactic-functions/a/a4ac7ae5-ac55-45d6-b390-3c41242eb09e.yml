code: vi2
description: intransitive verb with two subjects
notes: In many cases the distinction with a transitive verb is not clear. For example, in X 與 Y 盟 "X and Y made a contract" there often is no way of making the distinction with "X made a contract with Y". However, since this vt-interpretation is not always possible, we maintain this category.
