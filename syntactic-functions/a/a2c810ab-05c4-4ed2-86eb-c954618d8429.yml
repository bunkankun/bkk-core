type: syntactic-function
code: vttoN1.+N2
description: ditransitive verb followed by its direct object, and this followed by an indirect nominal object
notes: '1. We need to separate out the cases where the indirect object comes last and subsume them under vtt+N1.oN2, in accordance with our principles on the distinction between "o" and "+".


  2. Double object constructions are often notoriously difficult to distinguish reliably from single object constructions with a nominal complement. Time complements are obviously not construed as indirect objects, but place nouns can raise problems with movement verbs.'
