type: syntactic-function
code: NPpr
description: 'complex proper name, including names of persons, places and even periods of time


  CRITERIA


  1. cannot be counted, except in what traditional rhetoric calls the Vossian style. ( 十堯 does not mean "ten copies of Ya2o", but "ten people of the general kind defined by Ya2o as a typical example".)


  2. cannot be quantified with words for "all", "some", or "many"


  3. take non-restrictive adjectival modification'
notes: There are borderline cases where one is not certain whether an NP deserves to be called NPpr. In "even ten Yaos cannot govern such a state", Yao is not really a proper name, or is it? Perhaps we should simply treat the words like "Yao" in this sentence as a plain count noun. That is the logically attractive solution - which flies in the face of etymology and "Sprachgefuehl".
