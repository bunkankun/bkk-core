code: nadV{PASS}.adN
description: noun modifying a passive verbal expression, that whole phrase modifying a noun.
notes: One might conceivably call this a straightforward nadV[PASS] and make a separate note that nadV[PASS] can be used adnominally. But the present approach integrates this into the syntactic classification of the nouns capable of entering this complex construction.
