uuid: c90c2301-7d28-4681-a168-fa798aa91a6f
type: syntactic-function
code: npro{OBJ}+Vt
description: a preposed object pronoun preceding and in construction with a transitive verb
notes: The intrusion of the semantic feature [OBJ] into this formula is messy, and designed to distinguish this from the case of subject pronouns in front of Vt. Note that there are no subject pronouns specialised on a position in front of transitive rather than intransitive verbs. The function of this [OBJ] is primarily mnemonic and may have to be removed for reasons of systematicity, so that this category will simply become "npro+Vt - ref=obj". This will certainly be neater.
