type: syntactic-function
code: vttoN1+.vtoN2
description: ditransitive verb with its nominal object preceding and in construction with a (co)verb with its object N2, (which at the same time is the direct object of the vtt)
notes: Since vt+N2 is in construction with what precedes, it functions as a coverb. At earlier stages of the grammatical description I have marked these out as "covt". I now think this is systematically redundant, coverbs being effectively transitive verbs in construction with preceding or following main verbs.
