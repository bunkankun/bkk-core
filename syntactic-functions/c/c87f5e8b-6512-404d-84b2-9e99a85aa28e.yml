uuid: c87f5e8b-6512-404d-84b2-9e99a85aa28e
type: syntactic-function
code: vt+N
description: transitive verb followed by a nominal expression, this nominal not being a straightforward object pronominalisable by 之 (as in the the more ordinary vtoN).
notes: The criteria of objecthood are often unclear, but it seems clearly desirable to distinguish between verbs that require a direct object on the one hand and verbs that typically have nominal complements of other types. Some of what are now classified as vtoN will have to be reclassified as vt+N upon closer analysis. But this still needs to be examined.
