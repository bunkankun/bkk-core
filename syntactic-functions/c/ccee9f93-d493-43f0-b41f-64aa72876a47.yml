type: syntactic-function
code: vtoS
description: transitive verb with a (not overtly nominalised) sentential object
notes: 'It is often not easy to determine whether these sentences functioning as objects should or should not be regarded as cases of unmarked nominalisation.


  Moreover, there are persistent problems in distinguishing the cases where the transitive verb is followed by a V with a contextually determinate subject, which should be vt+S from straight vt+V. The reasons for this are of a profound logical nature.'
