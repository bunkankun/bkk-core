code: vttoN1.postN2
description: ditransitive verb with one preposed object; a ditransitive verb followed by its nominal object, and this phrase preceded by and in construction with another object
notes: The number of vtt that can be used in this way is surely not inconsiderable, but it is not unlimited. The purpose of this category is to enable us to register those verbs which are found in this characteristic ditransitive construction without a proposition and with a preposed object.
