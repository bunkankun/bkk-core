type: syntactic-function
code: padV.post-S
description: a particle which precedes and modifies a verbal expression, this whole phrase following after and being in construction with a preceding sentence
notes: The recurrent problem is how to determine exactly when and why a V may count as a minor sentence. If one had the courage to declare a verbal sentence to be really a VS, i.e. a kind of V then many problems would be solved both in this category and in many others. So far, I have not had the courage to implement this analysis, although I have been thinking about it for years.
