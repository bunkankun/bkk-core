type: syntactic-function
code: VPtoN
description: transitive commpound verbal expression
notes: It is not at all clear when these VPt are construed as two verbs as in "I despise and detest racists", i.e. as a zeugma series vt(+N).+vt+N, and when they really constitute one complex transitive complex verb VPt+N. The question is to what extent this distinction is actually operative in and practically relevant to classical Chinese grammar. In order to investigate this question we do need a rich collection of cases to consider. This category supplies such a list.
