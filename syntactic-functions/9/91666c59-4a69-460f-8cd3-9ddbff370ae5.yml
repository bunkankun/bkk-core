type: syntactic-function
code: nadV
description: 'noun which precedes and modifies a main verb, traditionally: denominal adverb'
notes: 'The denominal nature of these nadV is problematic in all those cases where both nominal and verbal uses of the character in question are well attested and equally common. For many cases one is tempted to introduce a category n/vadN.


  The distinction between nadV and nadS is by no means always clear, even in context, wherever S is a verbal sentence and thus syntactically speaking and strictly speaking a VP.


  See also NPadV, NPad.Vt+N, nad.Vt+N, and n(0)[PRED].adV'
