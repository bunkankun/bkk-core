uuid: 9f3b4bd3-8193-4708-b291-24842436b1d5
type: syntactic-function
code: vt{NEG}+:Vtt(+N.)+V
description: negative verb with a pivotal ditransitive verbal construction in the object, i.e. transitive negative verb preceding and in construction with it transitive-verb-object with contextually determinate omitted object, this latter phrase being followed by a verb
notes: 'It is not so easy to regard this as a plain case of vt[NEG]+Vt(+N): there is the problem of the scope which one is tempted to take to extend across the whole of the verb phrase. This matter of scope remains open to discussion, but for such a discussion to be fruitful the relevant examples have to be assembled first. Making this assembly possible is the purpose of the present syntactic category.'
