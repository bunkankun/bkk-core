uuid: 9f1cae57-3d6f-41bd-8773-b08b64713094
type: syntactic-function
code: PP+V{PRED}(.postN{SUBJ})
description: complex particle followed by and in construction with a verbal predicate, this whole predicate characteristically having a contextually determinate omitted subject.
notes: The point of this category is to register the characteristic idiomatically almost obligatory absence of the subject. This kind of case must be carefully distinguished from the case where the V in question is subjectless, i.e. v0 in our current system. In fact, v0 cannot occur in the position V in this formula.
