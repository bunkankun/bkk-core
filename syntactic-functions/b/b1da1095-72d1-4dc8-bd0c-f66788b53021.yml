uuid: b1da1095-72d1-4dc8-bd0c-f66788b53021
type: syntactic-function
code: vttoN1:postvtoN2
description: ditransitive verb with its nominal object, preceded and modified by (co)verbal transitive verb with its object N2 (which typically is the indirect object of the vtt)
notes: Technically, I suppose, one might declare these to be syntactically "vt" and not "vtt", although semantically they often clearly are the latter. It seems semantically wrong to disregard the ditransitive nature of the logical predicate involved. The point deserves further systematic discussion.
