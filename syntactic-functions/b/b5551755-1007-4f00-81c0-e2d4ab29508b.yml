uuid: b5551755-1007-4f00-81c0-e2d4ab29508b
type: syntactic-function
code: npro+V(.postN{TOP})
description: pronoun preceding and in construction with a predicate, with an omitted topic understood as preceding the whole construction
notes: There is a pervasive problem whether one is entitled to assume a very general omitted topic when a sentence begins with one of these pronouns. It would have to be clear from the context which word is to be supplied for such "deletion" or omission to become a plausible hyptothesis. An interesting contrast is with the constructions beginning with subjectless 無 "there were none who".
