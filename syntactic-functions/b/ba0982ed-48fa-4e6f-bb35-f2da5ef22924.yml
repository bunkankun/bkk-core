code: vvadV
description: verbal binome consisting of two bound morphemes preceding and modifying a verbal
notes: 'Unanalysable deverbal adverbial binomes seem to be rare. All the more important to keep track of those that do exist.


  There seem to be no vvv, constructions consisting of three bound morphemes in pre-Buddhist Chinese. Or are there such thngs. See Kennedy, "Butterfly".'
