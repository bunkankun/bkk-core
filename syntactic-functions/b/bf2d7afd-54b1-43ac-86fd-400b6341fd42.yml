description: a noun idiomatically in construction with a preceding proper name which modifies it
notes: I have long hesitated whether in 平王 the head is 王 which is qualified by way of assigning a name to it, by 平 . A standard way of reading this, however, is to take it as a case of apposition. However one decides to take these words, they do seem to belong to one category which will need a coherent and homogeneous treatment.
