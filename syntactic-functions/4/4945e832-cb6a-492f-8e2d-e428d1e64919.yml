code: vt{PASS}post-N{PLACE}.adN
description: transitive verb (with passive meaning) modified by place noun that precedes it, this whole phrase in turn modifying a noun that follows.
notes: '(It is pleasing to see how the formula, here as often, comes to be much more transparent and easy than its English paraphrase.)


  It appears that the predicative use of a construction like 屈產 is uncommon or unidiomatic, to say the least, and therefore I take this word to be subcategorised not only for the post-nominal but also for the adnominal position.'
