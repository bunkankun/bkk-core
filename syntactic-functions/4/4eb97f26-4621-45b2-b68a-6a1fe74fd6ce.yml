type: syntactic-function
code: vtt+prep+N.oS
description: ditransitive verb followed by an object introduced with a preposition, and this whole phrase preceding and being in construction with a sentence, which is the second object of the ditransitive verb
notes: '1. In these cases the sentence at the end is NOT introduced with a verb of saying like 曰 .


  2. One might want to analyse this as vt+prep+N.+S, and I am more and more inclined this way, until I reflect on the logic of the situation as compared to that of yue1 曰 which is taken as vtoS.'
