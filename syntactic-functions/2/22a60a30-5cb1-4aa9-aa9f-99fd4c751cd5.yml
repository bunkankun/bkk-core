type: syntactic-function
code: nad.VtoN
description: adnominal adverb preceding and modifying a transitive verb with an explicit nominal object
notes: Note that the reference of the initial n here often is to the object (as in the English "nourish your guest like your own child") but can in principle also refer to the subject ("experience things like a child").
