description: 'a verb (or: deverbal particle) preceding and modifying a sentence, that whole phrase being in construction with a preceding sentence'
notes: See the category padS1.postS2 which is closely related to this one. Deverbals do emerge in our system as "v", their grammaticalisation is indicated by their syntactic embedding, these "v" being either "ad" or "post" something else.
