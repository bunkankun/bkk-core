code: vtoS.adV
description: transitive verb with a sentential object, this whole phrase preceding and modifying a verbal expression
notes: One might be tempted to take the S to be a case of unmarked sentence nominalisation. Many cases of this phenomenon need to be compared before one can make an informed decision on this possibility. And even if one decides that this is ultimately how one wishes to take these cases, it will be interesting to have such cases as a significant sub-category of vt+N.adV.
