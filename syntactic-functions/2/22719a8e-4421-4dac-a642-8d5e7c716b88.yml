type: syntactic-function
code: npro0(.adN)
description: non-referential pronoun modifying an omitted nominal head of the construction.
notes: 'This is a so-called "exocentric" use of an impersonal pronoun.


  The "0" after pronouns refers to non-referential pronouns in the sense that the pronouns in questions do not invite one to identify any item, set, or person.'
