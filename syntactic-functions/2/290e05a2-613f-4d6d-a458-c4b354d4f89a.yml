uuid: 290e05a2-613f-4d6d-a458-c4b354d4f89a
type: syntactic-function
code: vtt+N1{PIVOT}.+N2{PRED}
description: ditransitive (causative) verb followed by pivotal object N1 (who is caused to vtt) the object N2
notes: This is an extraordinary syntactic frame, and time must show whether it is unique. The special syntactic case arises from the fact that the causativeness in the verb leads to a special assignment of roles to the two object nouns. I suppose one might also impose a meaning like "impose on N1's shoulders the object N2, in which case we should simply have a plain vtt+N1.+N2.
