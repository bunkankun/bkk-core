type: syntactic-function
code: vadV
description: 'deverbal word preceding and modifying a verbal expression, traditionally: a deverbal adverb in preverbal position'
notes: 'The distinction between the categories vadV, nadV, and padV is problematic whenever it is unclear from which function it is most natural to derive the adverbial use in question.


  The distinction with the presentential vadS must remain uncertain whenever it is unclear whether what follows is simply a verbal expression or must be taken as a verbal sentence with an implicit understood subject.'
