notes: 'Nominal suffixation in classical Chinese is relatively rare, the only productive suffix being 子 . And in a case like 豎子 the problem whether 子 is or is not a suffix remains undecidable. Both views can be supported by arguments, and very importantly: the question which of these analyses is correct is alien to Chinese commentatorial thinking.'
