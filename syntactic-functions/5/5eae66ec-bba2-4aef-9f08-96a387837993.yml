code: npro{SUBJ}+V{PRED}
description: pronoun preceding and in construction with a verbal expression
notes: 'Perhaps this should be renamed npro+V[PRED]. These are pronouns specialised on pre-verbal position. Whether 靡 deserves a place in this category is highly questionable.


  Compare the neatly distinct npro.adV which assembles specifically cases where the pronouns function as adverbs.'
