type: syntactic-function
code: VPt+V[0]{PASS}
description: transiitive complex verbal followed by its passive verbal object
notes: There is a constant doubt towhat extent the VPt in this group are word-like collocations. And our classification of a construction as VP does not imply any judgment concerning the wordhood of that construction. However, there is a claim of an idiomatic link between the elements of the VP.
