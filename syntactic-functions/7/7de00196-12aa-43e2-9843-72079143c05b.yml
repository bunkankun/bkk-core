code: vtt(oN.)+V[0]
description: ditransitive verb with contextually determinate omitted pivotal object, preceding and in construction with a verbal expression
notes: One must be suspicious of the label "vtt" here. The case is, after all, very different from such vtt as "give" in English. Perhaps one should assign sentential objects to pivotal constructions, but that is refuted by the substitutability of the subject in the object sentence by 之 . 待考
