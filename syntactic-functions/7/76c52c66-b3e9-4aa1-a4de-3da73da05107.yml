type: syntactic-function
code: npost-N{PLACE}.postVt
description: noun modified by a preceding place noun, this constuction being the object of a transitive verb.
notes: 'It appears useful to consider to what extent these special nouns do come to function as objects. This category will provide a place to make such cases retrievable. For example it makes good sense to ask whether 宋人 currently serves as an object or not.


  Thus this category illustrates the way in which some our grammatical categories will result from subjective research interest, cognitive interest rather than purely "objective" analytic need.'
