type: syntactic-function
code: VPt+V[0]
description: complex transitive verbal with a verbal object the omitted subject of which is lexically determinate, i.e. predictable from the VPt.
notes: 'The expressions subsumed under this category involve many widely different construction types. It will be interesting to see the range of construction types that allow transitivity with a verbal object. The construction types need to be elaborated systematically for all NPs as well as VPs according to a consistent and systematic pattern.


  For the resultative VPt+V the question arises whether the verbal object only goes with the second verb indicating the result, or whether the construction is as suggested by the present analysis. Without evidence from prosody this will be difficult to decide.'
