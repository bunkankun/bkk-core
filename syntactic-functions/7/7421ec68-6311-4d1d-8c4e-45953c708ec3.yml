description: a combination of two particles preceding and modifying a sentence, and this phrase being in construction with a preceding sentence
notes: Combinations of particles may contain clearly deverbal and denominal "grammaticalised" elements, as in the case of 然後 . A closer analysis might try to distinguish the complex particles involving grammaticalised elements from those complex particles that do not.
