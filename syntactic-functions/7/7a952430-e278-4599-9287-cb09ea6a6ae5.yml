code: npro=N
description: pronoun followed by and in apposition with a nominal expression
notes: 'Note that npro++Npr, where the apposition is with a proper name is a special case.


  Apposition, marked as "++" is as between "I" and "George W. Bush" in the phrase "I, George W. Bush".'
