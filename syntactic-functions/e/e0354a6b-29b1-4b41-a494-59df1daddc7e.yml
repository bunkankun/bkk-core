type: syntactic-function
code: vttoN1.+prep+N2
description: ditransitive verb (i.e. verb with two objects) with the second, the indirect object N2 introduced with a preposition (i.e. a postposed transitive coverb)
notes: This category must be carefully distinguished from that of vt followed by a localising prepositional phrase. At times, this distinction can be troublesome, but in general it seems worth trying to make it. The question is whether the link with the prepositional phrase is to be regarded as lexicalised, and such decisions on lexicalisation are bound to be subjective at times.
