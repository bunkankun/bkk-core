type: syntactic-function
code: v{=vt0+npro}adV
description: 'deverbal adverb [construction type: monosyllabic compound consisting of a subjectless verb with a pronominalised object]'
notes: 'This is a peculiar case where the preposition reconstructed in 焉 does not seem to have any candidate for a subject. This is unusual. We only note it in passing without attributing any particular importance to it. The question, however, whether 焉 should be designated as verbal is amusing: the word does have a referential object, here as in many other cases, and one would have thought that this is a sufficient condition for assigning the category "v". I have hesitated a long time over this case.'
