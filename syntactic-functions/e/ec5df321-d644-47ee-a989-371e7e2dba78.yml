description: Complex personal pronoun followed by an apposition N1, the construction modifying a N2
notes: This records a special case of syntactic complexity, but one would not want to say that 汝等 is in any sense lexically subcategorised for this function. The reason why one hesitates to delete this category is that by means of which we capture an interesting syntactic constellation which is indeed rare in pre-Buddhist literature, as far as one can see.
