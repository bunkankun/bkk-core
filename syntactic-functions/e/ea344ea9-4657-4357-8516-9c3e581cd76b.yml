description: deverbal construction preceding and modifying a topic nominal, this whole phrase being in construction with and preceding a sentence
notes: Technically, one might say that this is not a construction at all, the 其 with the topic nominal it governs functioning as the object of 若 . Our system has a very systematic general problem with idioms that do not constitute constituents.
