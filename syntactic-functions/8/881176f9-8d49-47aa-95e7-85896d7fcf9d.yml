code: NPab.t
description: (often deverbal) abstract complex noun which is transitive (e.g. the arrestation OF SOMEONE)
notes: The fact that deverbal abstract nouns often retain their transitivity in limited ways needs to be studied in much greater detail than has been done so far. The establishment of this syntactic category is a first step towards this.
