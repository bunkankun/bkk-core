type: syntactic-function
code: vadV.postadN
description: verb preceding and modifying a verbal expression, this whole phrase modifying a preceding noun
notes: This usage of an adverb in what looks very much like a postposed relative clause to inadvertent Indo-European observers is of course striking, but perhaps in the end this cannot be taken to be a lexicalised syntactic-frame-feature of the adverb itself. None the less, one would like to know how many such adverbs may be found in our sources.
