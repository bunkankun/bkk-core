type: syntactic-function
code: vt(oN.)+V
description: transitive verb followed by a contextually determinate omitted object, this construction followed by a second object in the form of a verb phrase
notes: The difficulty remains that when there is no overt object one is often in doubt whether one should take an object to be understood or not, as in 笑曰 "said with a smile" versus "smiled (at him) and said".
