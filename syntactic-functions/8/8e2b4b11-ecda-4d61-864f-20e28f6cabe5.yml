type: syntactic-function
code: NPab.adN
description: 'abstract complex nominal (construction type: conjunction of synonymous nominals) preceding and modifying a head noun'
notes: 'If we decide to fully implement this, a large number of NPadN will have to be moved into this category. However, the application of criteria of abstractness are going to pose severe problems if this is to be done.


  The standard criteria we may have for the application of syntactic categories are often only marginally applicable when these syntactic categories are embedded into larger structures. Thus even in the case of 聖人 it is not at all evident whether 聖 should be labeled "v" or "n", i.e. whether the construction type is "vadN" or "nadN", or indeed "n/vadN", or "n/vadN".'
