uuid: 1d8bc18c-7afd-4b3e-946c-d021e15bd6d7
type: syntactic-function
code: vt(+N.)adV
description: transitive verb with omitted contextually determinate object preceding and modifying a main verb
notes: One might always explain this as a simple coordination of two verbs, and "etymologically" that is no doubt what we have. The question is whether there is not here a structural frame rather like the case of a slightly different frame for 往 "go along (to do something)", where there are so many relevant examples that one feels certain that a syntactic category vt(+N.)-V is warranted.
