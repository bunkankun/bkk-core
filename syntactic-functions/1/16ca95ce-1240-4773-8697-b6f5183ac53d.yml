type: syntactic-function
code: vadS
description: a deverbal word which precedes and modifies a sentence, a preposed sentence-adverb in traditional parlance.
notes: 'These are notoriously difficult to distinguish from vadV, in particular when the subject is omitted. In these latter cases I think one should treat them as the more common vadV.


  A further complication arises from the fact that many apparent vadS are in fact anteposed adverbs rather than real logical sentential adverbs.


  NB: Sentential adverbs linking sentences, i.e. sentence connectives become vadS1.adS2 and the like.'
