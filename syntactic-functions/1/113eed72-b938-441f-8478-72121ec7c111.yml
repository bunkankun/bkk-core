code: vtoN1.adVtoN2
description: transitive verb with its nominal object N1, preceding and modifying another transitive verb with its nominal object N2
notes: 'The way we construe this puzzling but not uncommon construction can be paraphrased in English as follows: "naming the object N1 to call it an N2". Note incidentally that 曰 is not generally used as a vtt with two explicit objects.'
