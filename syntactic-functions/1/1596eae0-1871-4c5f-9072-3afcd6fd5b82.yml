code: vt.postVt(oN)
description: transitive verb in construction with a preceding (co)verb with an omitted contextually determinate object (which is the object of the vt)
notes: There must be many more verbs that are used this way, one would have thought, and these need to be systematically recorded. But as far as we can see the phenomenon is much more with vtt like 告 "report" than with vt.
