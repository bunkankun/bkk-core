type: syntactic-function
code: nadV.postN{SUBJ}
description: noun preceding and modifying a verbal expression, this phrase being in construction with a preceding nominal subject.
notes: The position of the denominal adverb after the subject is not very common, and needs to be carefully recorded. The general rule seems to be that the preposed subject in such cases typically serves as the subject of a whole series of sentences.
