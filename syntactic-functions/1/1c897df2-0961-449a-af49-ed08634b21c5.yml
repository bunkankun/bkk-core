code: vi-V{SUFF}.adV
description: deverbal suffixed adverb
notes: It is often difficult to distinguish on any objective basis between conjoined verbs and a deverbal adverb modifiying a main verb. Examples of this are many. They have not yet been systematised. See Kuenster's monograph.
