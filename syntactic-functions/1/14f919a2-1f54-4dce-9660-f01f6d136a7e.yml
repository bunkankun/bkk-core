code: vt{COP}+N1.vt{COP}+N2
description: transitive verb which is a copula with nominal object N1, that phrase being in construction with the same transitive verb (copula) with the object N2
notes: the construction is emphatic and establishes a relation between N1 and N2, usually the relation of identity
