definition: 'Jiǎ 賈 (CHEN PAN 1969, 457-458)Clan: Jī 姬 (according to the Zuǒzhuàn zhēngyì quoting Shì běn, and to the Du''s commentary to the ZUO). Rank: Bó 伯 (according to the ZUO, Huan 9). Founded: Uncertain. According to the Xìng yuàn, Tōng zhì shì zú kǎo lyè, and to the Lù shǐ Guó míng jì, the first ruler of Jiǎ was Gōng Míng 公明, the son of Tángshū Yú 唐叔虞 (the founder of the state of Jìn 晉 ), who received his fief from the Zhōu king Kāng 周康王. Destroyed: The state is mentioned for 703 B.C. (Huan 9) in the ZUO. Thereafter, in an unknown period, it was conquered by Jìn 晉. Location: In the modern Xiāngfén 襄汾 district, southwestern Shānxī (according to the Xù Hàn Jùn guó zhì). History: A small and unimportant state mentioned only one time in the ZUO.'
