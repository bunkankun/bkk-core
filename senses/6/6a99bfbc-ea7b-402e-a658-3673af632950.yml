definition: 'BUDDH: monks'' robe; skr. kaṣāya (Chinese monks used to use monks'' robes of different colors (often indicating different schools), ranging grey, brown, to black until ca. the tenth cent.; afterwards the color of the robes got gradually standardized; the monks'' robe was a powerful symbol for the Buddhist clergy and becoming a monk was often described in terms of changing garment; there is an abundancy of writings concerning the outfit for monks throughout Buddhist history in China)'
