definition: 'BUDDH: The Zhāoqìng 招慶 monastery is situated in today''s Quánzhōu 泉州 city, Fújiàn 福建 province. The name of the monastery today is Kāiyuán 開元 monastery. Quánzhōu 泉州 was one of the important cities in the kingdoms of Mín 閩 and Yuè 越. Wáng Yánbīn 王延彬, the son of Wáng Shěnguī 王審邽, was enfeofed there and invited scholars and monks who fled from the unrests raging in Northern China. Wáng Yánbīn 王延彬 was a devote follower of Buddhism and officially converted to Buddhism under the guidance of a disciple of Xuěfēng Yìcún 雪峰義存, Zhāoqìng Huìlíng 招慶惠稜 (854-932). Zhāoqìng Huìlíng 招慶惠稜 resided at the Zhāoqìng monastery but later on moved to Chángqìng 長慶. Consequently Wáng Yánbīn 王延彬 built another monastery for Wéndēng, the Fúxiān Zhaōqìng 福先招慶 monastery. Both monasteries were destroyed shortly afterwards.'
