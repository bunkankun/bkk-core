definition: 'BUDDH: this is a key concept in Mahhāyāna Buddhism: Enduring the thought that not only the self does not exist but that also all dharmas do not exist. "Acceptance of the statement that all things are as they are, not being subject to birth and death, which prevails only in the phenomenal world created by your wrong discrimination" (SUZUKI 1991: 411); "the acceptance of (the principle of uborn) dharmas" (KARASHIMA 1998: 124); SANSKRIT anutpattika﹣dharma﹣kṣānti; LOTUS(B): fǎren3 法忍; wú cóng shēng rěn 無從生忍; wú suǒ cóng shēng fǎ rěn 無所從生法忍; wú suǒ cóng shēng bù qí fǎ rěn 無所從生不起法忍'
