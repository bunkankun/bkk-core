definition: 'BUDDH: The Ninth Indian Patriarch in the Chan/Zen tradition (in ZTJ transliterated 伏馱密多; other transliterations include 伏馱蜜多, Fótuómìduōluó 佛陀蜜多羅, Fótuómì 佛陀蜜; also referred to as Juéqīn 覺親) (he was a person from 提伽國 and his family name was Písheluó 毘舍羅; his teacher was Fótuónántí 佛陀難提; his was known for his wisdom and for his abilities to teach and convert people, including the ''heretical'' teachers at the court of the king); skr. Buddhamitra'
