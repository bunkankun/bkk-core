definition: 'Chŭ Wén Wáng 楚文王 (r. 689 – 675) was the son of King Wu of Chu 楚武王 and it was under his reign that the capital of Chu was moved to Ying 郢. He is also known his use of the 板築法 method of fortification. He managed to greatly expand the territory controlled by the state of Chu. In 684 he invaded the state of Cai 蔡 and captured the Duke of Qi who recommended to him Xi Gui 息妫 as the most beautiful woman in the world. King Wen promptly attacked the state of Xi, captured Xi Gui, married her. He did have to sons by her. King Wen was the third king to whom >Mr He 和氏 presented his famous jade, and he was the one who accepted the offer. On the occasion he is said to have issued a law: “盗所隐器，与盗同罪。”. SY 14.16 reports on King Wen’s campaign against Deng 鄧 in 678, in which he employed two of his sons. In 675 he died having contracted an illness. He had suffered a series of disappointing military campaigns and died outside his country. His loyal aide, Yu Quan 鬻拳, committed loyal suicide to follow his master into his grave. HNZ 9 reports that King Wen liked to sport fancy hats 獬冠. SY 1.34 reports a conversation on his sickbed. [ZUO Zhuang 6, 10, Xi 7; SY 15.3] Father of >Chǔ Chéng wáng 楚成王'
