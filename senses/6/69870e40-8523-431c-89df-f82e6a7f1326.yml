definition: 'BUDDH: Zen Master Huàiràng (Huairang), a successor of the Sixth Patriarch, according to ZTJ a resident of Nányuè (in the south of Húnán 湖南, also referred to as Mt. Héng 衡山); his family name was Dù 杜 and his place of birth was in Jīnzhōu 金州 (today''s Shǎnxī 陝西, Ānkāng 安康 district); for the mermorial inscription see Héngzhōu Bōrě-sì Guānyīn Dàshī bēimíng 衡州般若寺觀音大師碑名 by Zhāng Zhèngfǔ 張正甫 (QTW, fasc. 619)'
