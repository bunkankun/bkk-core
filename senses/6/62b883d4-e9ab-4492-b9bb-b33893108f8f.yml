definition: 'CHEMLA 2003: neither horizontal nor vertical straight line or plane. The word is also used to refer to the hypotenuse. JZ 4.24, Liu Hui''s comm: 大弦則中立方之長邪，邪即丸徑也 "The larger hypotenuse being then the longer diagonal of the inscribed cube, the diagonal is hence the diameter of the sphere."'
