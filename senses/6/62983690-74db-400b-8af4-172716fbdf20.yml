definition: 'BUDDH: non-sentients expound the dharma (this phrase became very popular in Zen texts from the 10th century onwards and became the subject of many discussions; for the first time it was elaborated on in ZTJ (952 A.D.); the phrase is usually connected to the teaching of Huìzhōng 慧忠, but also became an important topic in the teachings of Dòngshān 洞山)'
