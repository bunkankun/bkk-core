definition: 'CHEMLA 2003: the line which constitutes the side of a rectilinear surface or of a rectilinear solid. JZ 4.22 開平冪者方百之面十開立冪者方千之面十 "When one extracts the root of a surface quantified extension then the side of a square quantified at 100 is ten; when one extracts the root of a three-dimensional quantified extension then the side of a cube quantified at 1000 is ten." Another example: JZ 4.22 立方適等，求其一面也。"When the sides of a parallellipipede are exactly equal, look for one of its sides".'
