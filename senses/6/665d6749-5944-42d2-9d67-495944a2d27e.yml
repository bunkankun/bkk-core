definition: Gōngzĭ Jiǔ 公子糾 (d. 685) was was a brother and rival of >Duke Huan of Qi 齊桓公. >Guan Zhong 管仲 (d. 643) served originally as an advisor to Prince Jiu. In 685 Duke Huan defeated Prince Jiu, who fled to the state of Lu where he was killed by the ruler of Lu. (LY14.16 and14.17 describe this as Prince Jiu being murdered by his brother Duke Huan. The story is told in some detail in GUAN 18 and GUAN 20. [ZUO Zhuang 8; LSCQ 15.6]
