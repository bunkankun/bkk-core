definition: Chŭ Dào Wáng 楚悼王 (r. 401 - 381), whose personal name was Yi 疑, ascended the throne with great popular support after the tragic death of his father King Sheng of Chu 楚聲王 (r. 407-401) in 401. In 391 he suffered a devastating defeat at the hands of the three successor states of the state of Jin 晉, Han, Wei 魏, and Zhao 趙. He managed to employ the famous military specialist >Wu Qi 吳起 (440-381) as his prime minister, introduced legal reforms to strengthen his political control, [SJ 79.2423, 65.2167] and continued to wage war both towards the northern and the southern neighbours, thus expanding the territory of his state. Father of >Chǔ Sù wáng 楚肅王
