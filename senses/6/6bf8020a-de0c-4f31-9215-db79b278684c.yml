definition: 'protrusions on the door frame through which to pass the guān 關 "bolt" in order to block to gate; or: hole in the bolt and protrusion in the door which fits in with a hole in the bolt, through which the jiàn 鍵 is passed to stabilise the bolt; perhaps both. In any case, bì 閉 does refer to a hole.'
