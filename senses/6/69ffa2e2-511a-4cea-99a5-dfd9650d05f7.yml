definition: 'CHEMLA 2003: fail to make an exact fit> leave a rest after the application of a computation.There is also a more general use of the idea of 不盡 in a theoretically crucial other kind of "incompleteness theorem" in Liu Hui''s preface (p. 178): 蒼等為術猶未足以博盡群數也 "the mathematical procedures by Zhang Cang and the others are still not sufficient to completely exhaust all numeric methods." Note that what is claimed to be incomplete here is is not the classic "as such", but the version of it that has come down to us from Zhang Cang and the others. JZ 4.16: 若開之不盡者，為不可開，當以面命之。 "In case that, when extracting a number one does not exhaust it (i.e. there is a remainder), the number is one that cannot be extracted from, one must use miàn "side of, root" to name it (i.e. in the form x 之面 ''the root of X'')"'
