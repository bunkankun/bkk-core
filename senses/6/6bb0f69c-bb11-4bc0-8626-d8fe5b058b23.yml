definition: 'Gāo Xì 高傒 (early 7th cent.) is recorded as a famous aristocrat in Qi and a contemporary of Duke Huan of Qi 齊桓公 whom he served as a minister. His activities are recorded between the years 685 and 660. When in 685 >Bao Shuya 鮑叔牙 recommends >Guan Zhong 管仲 (d. 643) over and above Gaoxi as a prime minister [Zuo Zhuang 9] this demonstrates Bao Shuya’s emphasis on political potential over family pedigree. In 672 Gao Xi represents the state of Qi in the covenant with Lu 魯 mentioned in CQ Zhuang 22, and similarly as late as 660 [CQ Min 2 and GULIANG Min 2] where Gao Xi is referred to as Gaozi 高子, a nomenclature which may suggest his aristocratic status. There is no record of Gao Xi’s death in the literature. Canonical Names: Jìng Zhòng 敬仲 or Jìng Zǐ 敬子 Unger no. 278'
