definition: 'Chŭ Líng Wáng 楚靈王 (r. 540 - 529), second son of King Gong of Chu 楚共王, also referred to, before his accession to the throne, as Prince Wei of Chu 楚王子圍, became King Ling when he strangled the ruling king, his brother, to succeed him. [SJ 31.1459. 35.1567] He became a much-feared military leader and an important organiser of diplomatic alliances. In 538 he lead a meeting of feudal lords and launched a major attack on the state of Wu in the couse of which he managed to kill the the powerful >Qing Feng 慶封, thus asserting his political ascendancy. [ZUO Zhao 4. LSCQ 22.1] In 530 he killed Duke Ling of Cai 蔡靈公 destroyed the state of Cai. His military aggressiveness made him many enemies. In 529 his younger brother >Qi Ji 棄疾, the later King Ping of Chu 楚平王 (r. 528-516) killed the heir apparent Zi Lu子祿 and suggested another younger brother Bi 比 as the successor. King Ling fled into the mountains and later committed suicide in the home of a supporter. (ZUO Zhao 13). The dramatic story of King Ling’s life is told chronologically, and with rich narrative gusto in SJ 40.1703 -1708. [Fang Zhaohui 2002: 657-676] Father of >Chǔ Píng wáng 楚平王'
