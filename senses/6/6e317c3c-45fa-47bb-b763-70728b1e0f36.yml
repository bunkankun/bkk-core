definition: 'BUDDH: the three ''bodies'' of the Buddha, skr. trayaḥ kāyāḥ (consisting of the 法身 (dharma-kāya), the 報身 (saṃbhoga-kāya; sometimes referred to as ''enjoyment-body'', ''wisdom-body'' or ''retribution-body''), and the 應身 (nirmāṇa-kāya; sometimes translated with ''merit-body'' or ''transformation-body''); there are countless terms, theories, and interpretations related to 三身'
