definition: Duke Ling of Chen Chén Líng Gōng 陳靈公 (r. 613 – 599) is on historical record as having entered a contract with the regional lords in 608 [ZUO Xuan 1.8]. Otherwise, he became most famous for rumours of a lurid affair with a lady >Xia Ji 夏姬, wife of a dignitary in Chen 陳. He and his friends >Yi Xingfu 儀行父 and >Gongsun Ning 公孫寧 were all said to have been found sporting parts of the lady’s garments in court. Duke Ling executed many of those who remonstrated against his excesses. In 599, lady Xia Ji’s son Cheng Shu 徵舒 is said to have killed Duke Ling when he was teased for his resemblance to the Duke. The whole episode is dramatised in SJ 36.1579. [ZUO Xuan 9.6; HNZ 18.6a; SY 1.4; XINXU 1.19, ed. Shi Guangying 2001 p. 148, ed. Li Huanian p. 34]
