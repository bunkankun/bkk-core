definition: Cáoxī 曹溪 originally refers to a river situated in the southeast of today's Qǔjiāng 曲江 district, Guǎngdōng procince. In 502 A.D. the Indian monk Zhìyào 智藥 constructed a monastery at the mouth of the river and called in Bǎolín 寶林 monastery. Around 677 the monk Huìnéng 惠能 and retrospective 'Sixth Patriarch' settled at the monastery. The place of his teaching activities was usually referred to as Mt. Cáoxī 曹溪, Mt. Cáo 曹 or Mt. Dòng 洞.
