definition: Chŭ Wŭ Wáng 楚武王 (r. 740 – 690) came to the throne as a Marquis of Chu 楚侯 by murdering his elder brother Fen Mao 蚡冒 in 740. He was the son of Xiao Ao 霄敖 (763-758). In 704 he convened a large gathering of eleven minor southern states, and he punished the only two other states who had refused to accept the invitation. Upon this occasion he declared himself King of Chu, thus challenging the monopoly of the Zhou of the title of king. As King of Chu he conducted a long series military campaigns building up the territory and power of his state, his important advisers and generals being Qu Xia 屈瑕 and Mo Ao 莫敖. He died, suddenly having been taken seriously ill on the battlefield, sitting under a tree. His story is dramatised in SJ 40. [ZUO Huan 6, Zhuang 4, Zhuang 18] 张正明 ．楚史 ：湖北教育出版社 ，1995 ：79 ．Father of >Chǔ Wén wáng 楚文王
