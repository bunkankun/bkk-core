definition: 'BUDDH: skr. jambu-dvīpa; pali jambu-dīpa; 閻浮 transliterates jambu which originally refers to a kind of tree (Eugenia jambolana) and 提 refers to dvīpa, ''continent''; in Buddhist cosmology this refers to the southern continent among the four continents surrounding Mt. Sumeru. Only this continent was thought of being in possession of a ''Diamond-seat'' (jīngāng zuò 金剛座) which is the place where all Bodhisattvas gain enlightenment.'
