definition: Gōngsūn Yăn 公孫衍 (4th century), also commonly referred to as Xīshŏu 犀首, “Rhinohead,” was a contemporary of >Zhang Yi 張儀 (d. 309 or 312), with whom he conflict in Wei 魏 in 322. (SJ 70.2302-2303) He was an important political figure and diplomatic activist under the reign of >King Huì of Wèi 魏惠王 (r. 370 - 335) and later under >King Huiwen of Qin 秦惠文王 (r. 337 -311). He persuaded Qí 齊 and Wèi 魏 to launch a major attack on Zhào 趙. In so doing he acted in the interest of Qín 秦. He ended his life in Wèi. He is mentioned in Mencius 3B2 and LSCQ 21.1, and he is a prominent figure throughout ZGC [passim]. Unger no. 396
