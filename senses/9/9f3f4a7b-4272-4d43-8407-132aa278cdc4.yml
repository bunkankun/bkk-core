definition: 'BUDDH: This is one of the five truth-bodies of Buddha as formulated by the Huáyán school (however the term already appears occasionally in sutra literature). The''Merit-body'' is the body which is produced by his countless virtuous acts (see wǔshēn 五身 in the SOURCES)'
