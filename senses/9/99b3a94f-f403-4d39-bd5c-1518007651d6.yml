definition: 'CHEMLA 2003: fill in (so as to complete a regular shape), complementJZ 9.15, Liu Hui''s comm: 令顛倒相補 "one inverts a piece so that they come to complement each other (so as, in this case, to make a regular rectangular shape)"JZ 9.5 令出入相補 "make the parts first go out, then go in so as to complement each other (and make a regular shape)". [Note that the Yang Hui edition of 1261 has 今 for 令 here.]'
