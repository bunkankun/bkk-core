definition: vice DC 7.缺點；錯誤。《孔子家語·在厄》：" 孔子 聖賢，其所刺譏，皆中諸侯之病。" 三國 魏 曹植 《與楊德祖書》："世人之著述，不能無病。僕常好人譏彈其文，有不善者，應時改定。" 宋 司馬光 《訓儉示康》："眾人皆以奢靡為榮，吾心獨以儉素為美；人皆嗤吾固陋，吾不以為病。" 清 俞樾 《春在堂隨筆》卷五："著書之家，千慮一失，往往有之，不足為先生病。"
