definition: Gāo Yáo 皋陶 (legendary). A tribal chief employed as a talented minister of punishments under >Emperor Shun 舜. His worth was already recognised by >Emperor Yao but the story goes that he also continued to serve under Emperor Yu 禹. He is celebrated throughout many early texts as the ancestor of all legal administrators in China. He is said to have called upon the aid of a mythical animal called xie zhi 獬豸 to help him in his legal decision-making. A chapter of SHU bears his name. Gao Yao is frequently referred to throughout ancient literature.[SHU 4; SHANGBO.RONGCHENGSHI. 李學勤 《皋陶事迹辯誤》 《皋陶與六安》第2輯 黃山書社 1997年]
