definition: (BUDDH:) water-pouring ceremony (this term is of pre-Buddhist origin and denotes a ceremony on the occasion of a king's ascending of the throne, or as ceremony for conforming somebody as crown prince; in the AVATAMSAKA it is mentioned that a Bodhisattva of the 9th stage, on the occasion of entering the tenth stage of his development, undergoes a ceremnoy where Buddhas sprinkle his forehead with 'prajñā water' (智水), confirming that he entered the stage of a 'Dharma-king' (法王); as such in some sutras the tenth stage of a Bodhisattva is also referred to as 灌頂地; the ceremony also plays an important role in esoteric Buddhism, 密教); skr. abhiṣecana, abhiṣeka
