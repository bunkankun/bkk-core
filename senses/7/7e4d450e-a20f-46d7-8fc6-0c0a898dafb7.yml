definition: be rude to; be impolite to; be unduly familiar with 宋 沈括 《夢溪筆談‧人事一》：" 趙閱道 為 成都 轉運使，出行部內，唯攜一琴一鶴，坐則看鶴鼓琴。嘗過 青城山 ，遇雪，舍於逆旅。逆旅之人，不知其使者也，或慢狎之，公穨然鼓琴不問。"
