definition: 'STANDARD NAME: Duke Zhuāng of Lǔ (reigned 693 - 662)ALTERNATIVE NAMES: Tóng 同.PARENTS: Son of >Lǔ Huán gōng 魯桓公.WIVES: Married to Mèng Rèn 孟任, and Āi Jiāng 哀姜 of Qi2 齊 who was notorious for entertaining an incestuous relationship with her brother.CHILDREN: Father of >Lǔ Mǐn gōng 魯閔湣公 and >Lǔ Xī gōng 魯僖公.'
