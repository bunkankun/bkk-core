definition: was the most important follower of King Wǔ of Zhōu 周武王 and was enfeoffed with what became the state of Qí 齊 in modern Shāndōng Province. See Sarah Allan 1972-3, Monumenta Serica for a survey of ancient accounts of this fascinating personality.
