definition: war chariot; carriage with four horses; 魯國堯:一车四马为一乘。当时战争的形式主要是车战，一辆兵车由四匹马拉，车上有三名武装战士，后有若干步兵。古代常以兵车的多少衡量诸侯国或卿大夫封邑的大小。
