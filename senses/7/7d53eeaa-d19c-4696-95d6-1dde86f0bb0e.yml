definition: 'Xiāo 蕭 (CHEN PAN 1969, 508-511)Clan: Zǐ 子 (according to the Yīn shìjiā chapter of the Shǐ jì, to the Hàn zhì, and to the Shì běn).Rank: Dependent state of Sòng 宋. Founded: The founder of the state was the Sòng noble Xiāoshū Dàxīn 蕭叔大心, who received his fief from the ruler of Sòng. According to some later sources (Xīn Táng shū and Guǎng yùn), Xiāoshū Dàxīn 蕭叔大心 was identical with Lè Dàxīn 樂大心 (the descendent of the Duke Dài of Sòng 宋戴公; 799-766 B.C.), and received his fief as a reward for his suppression of Nángōng Wàn 南宮萬 rebellion in 582 B.C. However, there are problems with this statement, because Lè Dàxīn appears in the ZUO in the entries for 535 B.C. (Zhao 7) and 501 B.C. (Ding 9). On the other hand, it cannot be excluded that there were two (or more) persons of this name. Destroyed: In 597 B.C. (Xuan 12) by Chǔ 楚. Later, the area became the part of Sòng.Location: According to the Hàn zhì, the state of Xiāo was located in the modern Xiāo 蕭 district, Anhui province.'
