definition: King Mu of Chu 楚穆王 (r. 625 - 614) ,whose personal name was Shāng Chén 商臣, was the eldest son of Chu Cheng Wang 楚成王 (r. 671 - 626). He became King of Chu by forcing his father to commit suicide in 625, thus preventing the appointment of >Prince Zhí of Chŭ 楚公子職 who was Shāng Chén's 商臣 younger brother by a different mother. In 618 he launched a successful campaign against the states of Zheng 鄭and Chen 陳, and in the same year he found it necessary to kill two rebellious dignitaries in Chu, >Zi Xi 子西 and Zi Jia 子家. SJ 40.1699 provides a breathlessly brief chronological survey of the military events in his reign. ZUO does not mention him anywhere. He was succeeded by his son Lü 侶 who became King Zhuang of Chu 楚莊王 (r. 613-591). Father of >Chǔ Zhuāngwáng 楚莊王
