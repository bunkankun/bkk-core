definition: 'summon the contextually determinate person to ask about the subject matter N2 [[NB: this presents an exquisite problem of syntactic analysis because 召 alone really serves as an vt(oN), but this can only come out in the analysis of the construction of this word. In principle, I fear under the present TLS synstem one would have to deny that this is a genuine case of the resultative combination 召問. The construction is 召，問其故 etc.]]'
