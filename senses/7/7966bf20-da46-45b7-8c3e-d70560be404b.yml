definition: 'BUDDH: the ''Third Indian Patriarch'' of the Chan/Zen School; skr. Śāṇa-vāsin, pali Sāṇa-vāsī; other transcriptions include: Shēnàpósī 奢那婆斯, Shěnàbōsī 舍那波私, Shěnàhéxiū 舍那和修, Shěnàpósī 舍那婆斯, etc. translations of the name include: 胎衣, 自然衣, 麻衣 (he was a disciple of Ananda; according to legend he remained in the womb of his mother for six years; after he had become a discpiple of Ananda he demonstrated his excellent abilities to remember the teachings of the Buddha; he was also known for converting dragons and all kinds of supernatural powers which he used for converting people)'
