definition: 'OBI 3: be treated as an honoured guest by, be hosted by 賓于. The host as well as the honoured guest are typically dead ancestors whose rank is symbolised by the relative position of objects representing the different ancestors in the ritual procedure of "hosting". Through the "hosting" relation, the ritual practice confirms the status of the ancestors involved in the Shāng pantheon. While 賓于 always describes a relationship between dead ancestors, the active verb bīn 賓 "host, entertain, treat as honoured guest" always has a living agent (usually the king) entertaining a dead ancestor.'
