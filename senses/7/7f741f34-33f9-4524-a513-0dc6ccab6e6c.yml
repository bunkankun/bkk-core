definition: Chŭ Chéng Wáng 楚成王 (r. 671- 626), a younger son of King Wen of Chu 楚文王 (689-685), murdered his elder brother King Duao of Chu 楚王堵敖 (676-672) in order gain the throne but began his career with a long series of popular and generous measures to gain the support of his people. was attacked by >Duke Huan of Qi 齊桓公 in 656. Duke Huan accused him of having failed to pay his tribute to the royal house of Zhou 周. In the years that follow King Cheng launched a long series of attacks against minor states. In 639 he even went so far as to capture King Xiang of Song 宋襄王 (650-637) who had ambitions to succed Duke Huan of Qi as the hegemon, but he set him free after having humiliated him. In 637 he laid on a lavish reception for the Chong Er 重耳, the future >Duke Wen of Jin 晉文公. In 633 King Cheng joined an alliance to attack Qi as well as Song and ends up establishing himself as the leading personality among the Warring States. In the 46th year of his reign he tried to disinherit his crown prince but was in turn attacked by the latter and was forced to strangle himself in 626. Thus his son continued the tradition of his father by committing regicide in order to ascend the throne. King Cheng’s career may be followed in detail in ZUO. [ZUO passim; LSCQ 19.3 and 24.3]
