definition: wicked and misguided men (SHU) 左傳‧文公十八年》："昔 帝鴻氏 有不才子，掩義隱賊，好行凶德，醜類惡物，頑嚚不友，是與比周。" 陸德明 釋文："心不則德義之經為頑，口不道忠信之言為嚚。" 前蜀 貫休 《古意》詩之七："一種為頑嚚，得作翻經石。"
