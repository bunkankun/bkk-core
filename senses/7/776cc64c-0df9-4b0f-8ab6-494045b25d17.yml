definition: 'CHEMLA 2003: position of numbers represented by counting rods on the calculating surface. JZ 8.3: 各從其位 "each in accordance with its place on the calculating surface". JZ 1.16, comm. Li Chunfeng: 列位無常 "for the allocation of (numbers of) positions on the calculating surface there is no invariant pattern". Thus " position" in this technical sense may on be defined along varying parameters: on the one hand the position may be concrete, on the calculating surface, versus abstract in the system of decimals. On the other hand, whenever a mathematical procedure is defined in relation to any pattern of numbers inscribed on the calculating surface, any position in that pattern may be referred to as a wèi 位. In fact, the technical "decimal" meaning of 位 derives from the more general "placement" meaning of 位. It turns out that 等 is the sub-class of vertical fields or columns. This enables us to distinguish between 位 "abstract place" and 等 "vertical row, column in the abstract", and 行 "concrete column of numbers". Being a kind of 位, the 等 can be referred to as a 位 and often is in later texts.By extension, 位 may be used as a general term (by Li Chunfeng) to refer to the number that occupies the given position rather than to the position itelf, in which case the word is used as a non-contrastive variable.'
