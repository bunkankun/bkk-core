definition: 'Zhāng 鄣 (also written as 章 ) (CHEN PAN 1969, 556-559)Ruling clan: According to the Xìng zuǎn, Tōng zhì Shìzú lyè, and Lù shǐ Hòu jǐ, rulers of Zhāng belonged to the Jiāng 姜 clan. Shì běn and Shuǐ jīng zhù say that they were from Rèn 任 clan. According to the Xìng kǎo, the rulers of the Zhāng originally had the Rèn surname, and later, in the beginning of the Zhōu period, the successors of Tài gōng 太公 with the Jiāng surname were established there. Rank: Unknown.Founded: According to the Xìng kǎo, the state existed already in the Shāng period. In the beginning of the Western Zhōu, it was given as a fief to the descendants of Tài gōng.Destroyed: 664 B.C. by Qí (according to the CQ, Zhuang 30).Location: In the modern Dōng píng 東平 district in the Shandong province (according to the Du''s commentary and Dì míng kǎo lyè). According to the Duan''s commentary, the state was located in modern Jiangsu province, in the northern part of Gànyú 贛榆 district. History: A small petty state, mentioned only one time in the CQ (Zhuang 30).'
