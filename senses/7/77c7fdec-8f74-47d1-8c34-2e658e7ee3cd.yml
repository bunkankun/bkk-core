definition: 'BUDDH: the eight kinds of Buddhist deities and dragons/demon spirits (who are the protectors of the Buddha-dharma): tiān 天 (skr. deva), lóng 龍 (nāga), yèchā 夜叉 (yakṣa), āxiūluó 阿修羅 (asura), Jiālóuluó 迦樓羅 (garuḍa), gantapo 乾闥婆 (gandharva), 緊那羅 (kiṃnara), Móhouluójiā 摩 羅迦 (mahoraga)'
