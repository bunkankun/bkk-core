definition: 'HYDCD 7.1056 has picture: mortar with stone club, later mechanised device combining these two into one contraption for the process of chōng 舂. This requires skill avoiding to squash the grain by not pounding too hard, and pounding hard enough to remove the husk. The device was moved with one''s feet in Platform Sutra times: 蹋碓'
