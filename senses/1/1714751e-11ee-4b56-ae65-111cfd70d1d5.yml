definition: 'BUDDH: the six sense-faculties or sense-organs (this is the standard term; a rarer alternative term is liùqíng 六情; the six sense-faculties consist of yǎngēn 眼根 ''eye-organ'', ěrgēn 耳根 ''ear-organ'', bígēn 鼻根 ''nose-organ'', shégēn 舌根 ''taste-organ'', shēn''gēn 身根 ''touch-organ'' and yìgēn 意根 ''think-organ''; gēn does not only refer to the physical organ of perception but also to the capality of performing its funtion; the process of perception consists of the liùgēn, interacting with the respective liùjìng 六境 ''six sense objects'' and liùshí 六識 ''six consciousnesses''; see also shíbā jiè 十八界) SANSKRIT ṣaḍ indriyāṇi'
