definition: Diăn Jié 顛頡 of Jin accompanied Duke Wen of Jin during 19 years of exile [ZUO Xi 23]. He was appointed a dignitary 大夫 upon the accession of Duke Wen to the throne. When prevented by Duke Wen from entering a palace full of possible war booty, he set fire to that palace in anger and was killed for this by his Duke and benefactor. [ZUO Xi 28] HF 34.29 and 34.44. Unger no. 742
