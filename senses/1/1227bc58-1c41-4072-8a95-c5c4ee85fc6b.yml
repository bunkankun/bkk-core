definition: 'Zhěn 軫 (CHEN PAN 1969, 467-468)Clan: Unknown. According to the Xìng xī, the rulers of Zhěn were of Yǎn 偃 surname.Rank: Unknown.Founded: Unknown. Destroyed: Mentioned in the ZUO in the entry for 701 B.C. (Huan 11). Later, it was destroyed by Chǔ 楚.Location: According to the Dì míng kǎolyè, the state of Zhěn was located in the modern Yīngchéng 應城 district, Hubei province.'
