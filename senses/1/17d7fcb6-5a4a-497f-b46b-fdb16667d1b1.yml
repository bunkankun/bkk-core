definition: horn on the head > horns (in Chán/Zen Buddhist texts 'growing horns on one's head' is often as metaphor for dualistic thinking and attachment (i.e. something articificial). Often in connection with the verb shuōzhe 說著 indicating that verbal explanations do not suffice to express enllightenment)
