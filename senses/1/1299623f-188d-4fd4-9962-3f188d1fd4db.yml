definition: Gōngzĭ Shíwŏ 公子食我 (4th century) was a prince in the state of Han 韓, mentioned with >Zhang Qian 張譴 and >Gongcheng Wuzheng 公乘無正 in HF 22.21. In LSCQ 18.1 he is presented in conversation with Marquis Zhao of Han 韓昭侯 (r. 358 – 333).
