definition: Dŏng Èyú 董閼于 (d. 496) from Jin, also known as Dong Anyu 董安于 or Dongzi 董子, served under prime minister >Zhào Jiănzĭ 趙簡子 (fl. 517-475) whom he warned against a serious plot by by the Fan 范 and Zhonghang 中行 clans in Jin against the powerful influence of the Zhao 趙 clan. (ZUO Ding 14, ed Wang Shouqian p. 496 gives a lively narrative of the ensuing intrigues against Dong at the end of which Dong declares that his own death would contribute to a solution of the situation, and he kills himself.). Dong remained a much quoted example of utterly selfless loyalty of a minister to his lord. [See HF 30.18, etc.] Unger no. 773
