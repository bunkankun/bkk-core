definition: local not state-controlled popular village leadership, Threefold Elders LIJIzhu:。三老五更各一人也，皆年老更事致仕者也。 天子以父兄養之，示天下之孝悌也。名以三五者，取 象三辰五星，天所因以照明天下者。
