definition: five types of obligatory behaviour/tasks 指古代統治者修身的五件事，謂貌恭、言從、視明、聽聰、思睿。《書‧洪範》："五事：一曰貌，二曰言，三曰視，四曰聽，五曰思。貌曰恭，言曰從，視曰明，聽曰聰，思曰睿。"
