definition: 'CHEMLA 2003JZ 4.24, Liu Hui comm: 并句股冪 "if you make the sum of squares of the base and the height (of the right-angled triangle)...". Syntactically, this could conceivably come to mean "the square of the sum of the base and the height", but phrases of this structure are never construed that way and the meaning probably has to be expressed as 句股并冪, since we have JZ 9.12 股弦并冪 as we have also, with chà 差 "difference": 句股差冪. This is a new kind of example of how technical usage is restrictive with respect to grammatical potential, a point already noticed and described for Mohist logic by A.C. Graham.'
