definition: those of an extraneous doctrine > heretic, follower of a wrong or inferior teaching (can apply to scholars/masters/monks within or without the Buddhist tradition)外道：佛教以外的其他各种哲学思想。主要指佛教产生后的六种学说，即："善恶无果论"，"苦乐无因论"，否定轮回的"断灭论”，宿命哲学的"常见论"和"宿因论"以及"诡辩论"。
