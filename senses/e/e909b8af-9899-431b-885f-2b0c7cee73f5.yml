definition: 'BUDDH: Real Mark; Real Characteristic (referring to the true nature of dharmas; often used syn. to zhēnrú 真如 ''Suchness'' and related terms such as 本性 ''original nature'', zhēnxiàng 真相 ''True Mark'', fǎxìng 法性 ''Dharma-nature'', shíjì 實際, wúwéi 無為, wúxiàng 無相, etc.) (according to scriptures such as NIRVANA and DAZHIDULUN the different features of things (such as ice being cold and water being wet) are fundamentally an illusion, and in their true nature is the same (píngděng 平等); however, from the standpoint of the deluded mind, the true equal nature of things cannot be perceived; in the DAZHIDULUN shíxiàng is also equated with kōng 空 ''Emptiness'', and is regarded as beyong the capacities of thought or verbal expression; the term shíxiàng also plays an important role in the teaching of the Tiāntái School); SANSKRIT dharmatā, bhūta-tathatā'
