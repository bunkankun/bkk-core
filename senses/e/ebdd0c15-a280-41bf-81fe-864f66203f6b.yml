definition: 'BUDDH: defilement (see also qīgòu 七垢, the seven kinds of defilements: desire, false views, doubt, pride, arrogance, torpor, and stinginess; there is also a set of three defilements 三垢 (or sāndú 三毒 ) which refers to desire, hate, and ignorance; see also the sānhuò 三惑 of the Tiāntaí School); skr. mala SOOTHILL 299: " Dust, impurity, dregs; moral impurity; mental impurity. Whatever misleads or deludes the mind; illusion; defilement; the six forms are vexation, malevolence, hatred, flattery, wild talk, pride; the seven are desire, false views, doubt, presumption, arrogance, inertia, and meanness."'
