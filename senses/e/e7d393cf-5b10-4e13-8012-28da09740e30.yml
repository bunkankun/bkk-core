definition: 'BUDDH: the Fifth [Indian] Patriarch in the Chan/Zen tradition; skr. Dhītika (other transliterations include Tízhījiā 提知加, Dìdǐjiā 地底迦) (he was a person from 摩突羅國/摩迦陀國; he received the dharma from Yōubōjūdūo and became fully ordained at the age of 20; according to the traditional sources he was very skilled in teaching and in possession of supernatural powers; after his death his remains were distrubuted among 7 stupas. According to other sources he was born in 阿里亞迦亞 (skr. Ārya-java), and was teaching in Jiāmólǚbōguó 迦摩縷波國 (skr. Kāma-rūpa) and Mólàpóguó 摩臘婆國 (skr.Mālava), and died in Ujjayani)'
