definition: 'Liǎo 蓼 (also written as Liáo 飂 / 飉 ) (CHEN PAN 1969, 484-486)Clan: Unknown. According to the tradition recorded in the Lù shǐ Guó míng jì, Lù shǐ Hòu jì, and in the Qián fū lún, the rulers of Liǎo were descendents of the mythical Zhù Róng 祝融, and had Jǐ 己 surname. However, this is maybe legendary tradition, as Lùshǐ Hòu jì states that this Liǎo was destroyed by the Xià 夏 dynasty. Rank: Unknown.Founded: Unknown. Destroyed: Mentioned in the ZUO in the record for 701 B.C. Later (in an unknown period), it was conquered by Chǔ 楚.Location: In the modern Tánghé 唐河 district, Henan province.'
