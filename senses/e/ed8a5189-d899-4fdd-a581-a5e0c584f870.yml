definition: 'CHEMLA 2003: move along on the calculating boardBù 步 refers to a specific movement leftwards of a number on the calculating surface, and this concept was later referred to as jìn 進. The mathematical antonym is 折, which later came to be more transparently designated by the word 退. JZ 4.16: 借一算，步之，超一等 "One ''borrows'' one counting rod and moves it leftwards (in Chinese terms: forward!), in each movement of this kind jumping across one column." [NB: this 等 comes from the Song edition, and in Daizhen edition the text is wèi 位. If Dai''s reading is to be relied on, then this will mean that the meaning of wèi 位 "decimal position" is attested already in the Nine Chapters.]'
