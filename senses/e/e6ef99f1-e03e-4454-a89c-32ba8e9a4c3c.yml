definition: 'BUDDH: skr. icchantika; this refers to somebody who has cut off all wholesome roots and never will reach liberation (in some Mahāyāna and Chán Buddhist texts the term icchantika undergoes a reinterpretation, and the notion of the ''two kinds of icchantika'' (LANKAVATARA, T.16/670: 487b20: 一闡提有二種), the second kind of icchantika referring to Bodhisattvas who - through their compassion - decide to remain in the world, also based on the knowledge that there is no difference between samsara and nirvana) (also transliterated with 闡提, 一顛迦, 阿闡底迦'
