definition: Huáng Xiē 黃歇 one of the four famous rhetoricians 四君, served as Chu ambassador to King Zhao of Qin 秦昭王 working towards a treaty between Qin and Chu. In 262 he is enfeoffed as Chunshen jun 春申君, which is the name by which he is mostly referred to. 黃歇Einer der →sî kün 四君 "vier Herren" der Chan-kuoh-Zeit. Berühmt ob seiner Redegewandtheit. Geht im Dienst des →K'ing-siang wang (298-263) von Ch'u nach Ts'in, wo er sich in einem längeren Schreiben bei Chao wang um ein Bündnis mit Ch'u bemüht. Er kehrt nach Ch'u zurück, geht aber bald darauf zusammen mit dem Kronprinzen als Geisel nach Ts'in, wo er mehrere Jahre verweilt. Als K'ing-siang wang erkrankt und Chao wang sich einer Heimkehr des Kronprinzen abgeneigt zeigt, ermöglicht H. diesem die Flucht. Er selbst bleibt zurück. Durch Fürsprache des Ying hou kann schließlich auch er heimkehren. Als der König kurz darauf stirbt, wird H., 262, im 1. Jahre des →K'ao-lieh wang (262-238) von Ch'u, zum Kanzler (siang) ernannt und als Ch'un-shen kün 春申君 belehnt (LKP). 257 kommt er dem bedrängten Chao zu Hilfe (LKP). Da die zwölf →hien, die er bei seiner Belehnung nördlich des Huai erhalten hatte, zu exponiert liegen, bittet er i.J. 248 selbst um ein anderes Lehen und erhält ein solches in Wu 吳 (LKP). H. hatte eine jüngere Schwester des Li Yüan zur Frau. Als sie schwanger wird und in das übliche Schwangeren-Haus übergesiedelt ist, überläßt H. sie dem K'ao-lieh wang, der kinderlos geblieben war. Dieser läßt sie zu sich kommen und wohnt ihr bei. Der Knabe, den sie gebiert, wird als königlicher Kronprinz aufgestellt, die Mutter zur königlichen Gemahlin erhoben. Nach dem Tode des Königs kommt der Sohn als Yu wang (237-228) auf den Thron. Li Yüan reißt die Regierungsgewalt an sich. Den H. läßt er i.J. 238 hinterhältig ermorden (LKP). - Biographie Shî-ki 78.19.4.78Der Familienname Huang ist der Name des alten, zum Ying-Clan gehörenden, Staates, der von Ch'u ausgelöscht worden war. H. ist also vermutlich ein Nachkomme des Fürstenhauses von Huang. Die Zugehörigkeit zum Ying-Clan mag es gewesen sein, die ihn für die Mission nach Ts'in als geeignet erscheinen läßt.27.4.78August Pfizmaier, Zur Geschichte des Entsatzes von Han-tan, Wien 1859 See Unger Prosopography no. 232
