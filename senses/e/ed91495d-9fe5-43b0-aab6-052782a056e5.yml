definition: 'BUDDH: SANSKRIT sahā (lit. endurance, patience); referring to 娑婆世界 (SANSKRIT sahā-lokadhātu), the universe/realm where Śākyamuni Buddha conducts his teaching activities (it is referred to as ''Patience/Endurance'' since people in this universe dwell in afflictions and are attached to the ten evils, unwilling to be liberated from them)'
