definition: 'BUDDH: non-abiding nirvāṇa (in Mahāyāna Buddhism describing the state of a Bodhisattva who, one the one hand, does not reside in the cycle of life and death because of his wisdom; on the other hand he also does not abide in nirvāṇa 涅槃 on account of his compassion); SANSKRIT apratiṣṭhita-nirvāṇa'
