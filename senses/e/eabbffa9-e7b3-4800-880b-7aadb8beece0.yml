definition: 'disyllabic copula used for forming alternative (disjunctive) questions: 為復..., (為復)... ''is it A or is it B'' (復 is semantically very weak and is often regarded as structure word for forming a disyllabic copula, compare 為當 which functions identical to 為復; there are several current patterns: 為復 X 為復 Y; 為 X 為復 Y; X 為復 Y; 為當 X 為复 Y)'
