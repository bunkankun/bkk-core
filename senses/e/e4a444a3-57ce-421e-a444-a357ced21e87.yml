definition: Gōngsūn Níng 公孫寧 (fl. until 598), also known as Kŏng Nìng 孔寧, was a senior officer in the state of Chen 陳. He is said to have misled Duke Ling of Chen 陳靈公 (r. 613-599) into pursuing confused policies in the government of his state. But he is also mentioned as a successful general. CQ Xuan 11 records that the state of Lu 魯 returned him to his native Chen. [ZUO Wen 17, Xuan 11, Cheng 2]
