definition: Gōngsūn Hóng 公孫弘 [fl. ca. 300] from Wei 魏 is said to be a man from Qi 齊 in the commentary to ZGC Qi 4.2. He is quoted extensively in conversation with >Lord Mengchang 孟嘗君 (d. 279) also in LSCQ 12.5. He must not be confused with the famous Han dynasty politician of the same name. [LSCQ 12.3; ZGC Qi 4.1] HF 23
