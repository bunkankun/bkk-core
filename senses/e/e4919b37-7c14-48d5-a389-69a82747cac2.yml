definition: 'fabricated penis > dildo Note the ellaborate description of dildos below. It must have been a big industry at that time in India (some made of copper, lead, tin, ivory, wax, etc.)! 佛言：從今日後，不聽作胡膠形，胡膠形者，若胡膠作，若銅，鉛，錫，白鑞，若牙，若蠟蜜，如是比，作身生，以歇欲心者，偷蘭遮，是名胡膠形。 (T.22/1425: 545c14)'
