definition: 'BUDDH: Zen monk Yisujue (675-713) ''Awakened Within One Night Stay'', he derives his name from the story that he only stayed at in the monastery of the Sixth Patriarch for one night and gained enlightenment; he was a resident of Wēn province and his canonical name was Xuánjué (Xuanjue) 玄覺 (Mysterious Awakening), his courtesy name (zì 字) was Dàomíng (Daoming) 道明. His secular family name is Dài 戴 and he originally came for Yǒngjiā 永嘉 district of Wēn province (situated in today''s Zhèjiāng 浙江 prvince.'
