definition: 'children''s language: father and mother (BUDDH. translations) FOBEN XINGJI JING, T.3/190: 863b8-9: 爾時彼處跋陀羅女，於女伴邊，出力挻身，即便得脫。走向自家，白己父母，作如是言： “ 波波摩摩，願莫將我與於除人。何以故？我今不用人作夫主，我心中欲修行梵行。 ”'
