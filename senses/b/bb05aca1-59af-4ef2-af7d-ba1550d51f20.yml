definition: 'BUDDH: assembly which gathers like a cloud > the non-permanent assembly of listeners of the Buddhist teaching; as contrasted to the resident disciples of the Buddha who continuously listen to his teachings (chángsuízhòng 常隨眾), members of the non-permanent assembly do not live together with there teaching (usually leading a regular secular life) and only gather if there is an opportunity to listen to the dharma'
