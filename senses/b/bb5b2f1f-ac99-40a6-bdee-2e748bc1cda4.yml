definition: 'BUDDH: Dhyāna master Sēngchóu 僧稠 (480-560), a meditation master which influenced the devopment of the early Chán/Zen School in the end of the seventh and the beginning to the eighth centuries; there are 3 treatises attributed to him which were found on the Dūnhuáng manuscript Pelliot 3559, however the manuscripts rather date of ca. 700 and were produced in the context of the Northern School; for a thorough study of the life and teaching of this monk see ANDERL 1995'
