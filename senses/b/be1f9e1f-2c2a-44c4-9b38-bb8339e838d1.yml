definition: 'CHEMLA 2003: apply effectively to something else (by way of generalisation)JZ 9.3, Liu Hui 掇 comm: 將以施于諸率。故先具此術以見其源也 "(The canon) is designed to effectively apply this method to all lyu-triangles (or lyu-procedures). Therefore it first provides this procedure in order then to bring out into the open the source (from which all these lyu spring)."'
