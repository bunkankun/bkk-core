definition: Prince Zhí 公子職 (7th century) was the second eldest son of King Cheng of Chu 楚成王 (r. 671 - 626). Prince Zhí of Chŭ 楚公子職 was crown prince >Shāng Chén's 商臣 younger brother by a different mother. When King Chéng threatened to demote his son and designated successor Shāng Chén 商臣 in favour of Prince Zhi, Shang Chen managed to forced his own father to commit suicide and established he himself as King Mù of Chŭ 楚穆王 (r. 625 - 614). [ZUO Huan 16.5; LNZ 5]
