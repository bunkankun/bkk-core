definition: 'Dùn 頓 (CHEN PAN 1969, 640-641)Clan: Jī 姬 (according to the Hàn shū Dì lǐ zhì). Xìng yuán states that the rulers of Dùn were of Yǎn 偃 surname, but the source of this statement is unknown.Rank: Zǐ 子 (common in the CQ and ZUO). According to the Xìng jiě, the rulers of Dùn originally possessed hóu 侯 rank, but the source of this statement is unknown.Founded: Unknown. Destroyed: In 496 B.C. (Ding 14) by Chǔ 楚. Location: In the modern Xiàngchéng 項城 district, southern Henan province.'
