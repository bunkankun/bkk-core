definition: 'CHEMLA 2003: have a common divisor (first occurs in Liu Hui''s commentary to JZ)Background: Number theory was developed in ancient Greece, and little elaborated in ancient China. An example being that you have no concept of a prime number in ancient Chinese sources, whereas the Greek concept of a prime number played a significant part in Euclid''s book 7. Chóng dié is important because it does constitute one of the rare examples of number theory concepts in ancient China.The concept of chóng dié is approached through a geometrical representation of a number. Thus the number six can be represented as a series******or as piled-up (dié) diads:* ** ** *The number four will be* ** *Now the use of repeated elements in this representation is called chóng dié, and this method constitutes a visual approach to the concept of one concept of a common divisor number theory. Chóng dié occurs when two numbers are considered in relation with each other, and if both are reiterations with the same base layer, then simplification takes the form of dividing by the number of shared elements in one horizontal row.JZ 1.6, Liu Hui''s comm: 其所以相減者皆等數之重疊 "The reason why they are subtracted from each other is that they all are reiterated "pilings-up" of the equal number (i.e. the common divisor)"JZ 1.18, Liu Hui''s comm: 分重疊則約也 "if the parts are reiteration "pilings up", then one simplifies (scil. by dividing by the number of shared elements in one horizontal row)."'
