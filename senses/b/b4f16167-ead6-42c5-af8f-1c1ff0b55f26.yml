definition: 'CHEMLA 2003: double, reiteratedJZ 6.10, Liu Hui''s comm: 是謂重今有也 "This refers to reiterated of supposing." JZ 6.11, Liu Hui''s comm: 此亦重今有之義 "This has has also the structural pattern of a reiterated of supposing.Cf. also JZ 6.28, Liu Hui''s comm, where the reiteration is more than twice.For 重今有 we have three structural analyses:1. transitive verb: repeat the supposing. "This refers to repeating the supposing." [However, 重 is not current as a verb elsewhere in JZ.]2. adnominal verb>adjective: repeated supposing. "This refers to repeated supposing." [This seems to work in all instances we have seen so far.]3. adverb: suppose repeatedly. "This refers to supposing repeatedly." [However, in 重今有之義 this is most uncomfortable.]We need to insist on a clear answer why we attribute one and not the other of the structures to the phrase in any given context. Is the Chinese underdetermined, structurally?'
