definition: Gāo Hè 高赫 (fourth cent.) served with distinction in the household of >Zhào Xiāngzĭ 趙襄子 (r. 370 - 335), along with >Zhāng Mèngtán 張孟談. The story of his participation in the siege of Jinyang 晉陽 in 453 is commonly referred to in the literature.[LSCQ 36.7; HNZ 13.22bff, 18.13bff; SY 6.2]
