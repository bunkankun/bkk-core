definition: "with the seven treasures of Buddhism. DCD: 1.佛教語。七種珍寶。佛經中說法不一，如：法華經以金、銀、琉璃、硨磲、碼�\x88、真珠、玫瑰為七寶；無量壽經以金、銀、琉璃、珊瑚、琥珀、硨磲、瑪瑙為七寶；大阿彌陀經以黃金、白銀、水晶、琉璃、珊瑚、琥珀、硨磲為七寶；恆水經以白銀、黃金、珊瑚、白珠、硨磲、明月珠、摩尼珠為七寶。"
