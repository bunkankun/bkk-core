definition: 'BUDDH: the three kinds of confusions/delusions SOOTHILL 65: " 三惑 A Tiantai classification of the three delusions, also styled 三煩惱; 三漏; 三垢; 三結; trials or temptations, leakages, uncleannesses, and bonds. The first of the following three is common to all disciples, the two last to bodhisattvas. They arise from (a) 見, 思, 惑 things seen and thought, i.e. illusions from imperfect perception, with temptation to love, hate, etc.; to be rid of these false views and temptations is the discipline and nirvāā of ascetic or Hīnayāna Buddhists. Mahāyāna proceeds further in and by its bodhisattva aims, which produce their own difficulties, i.e. (b) 塵沙惑 illusion and temptation through the immense variety of duties in saving men; and (c) 無明惑 illusions and temptations that arise from failure philosophically to understand things in their reality."'
