definition: exist > that's how it is > sentence final particle giving emphasis to a statement (frequently used in vernacular texts of the late Tang and Song periods); in the pattern with negated VP (the negator is usually 未) the emphasis is on the fact that an action should have been performed or was expected to be performed, but was in fact not
