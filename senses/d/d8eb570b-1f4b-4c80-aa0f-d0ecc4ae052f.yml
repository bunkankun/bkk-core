definition: 'BUDDH: the Six Paths, referrring to the six forms of existence or destinations of transmigration; skr. ṣaḍ gatayaḥ, pali cha gatiyo also: liùqù 六趣 (the destinations of these transmigrations do not only include human life but also other forms of existence in the Six Destinations, such as the realms of the Gods (deva; tiānshàng 天上), as human being (manuṣya; rénjiān 人間). demon or demigod (asura; āxiūluó 阿修羅), animal (tiryagyoni; chùshēng 畜生), hungry ghost (preta, èguǐ 餓鬼), or hell-dweller (naraka, dìyù 地獄; the destiny of a person is dependent on his deeds (karma, yè 業) in his previous lives; originally there was only the notion of five paths, pa%nca gatayaḥ, wǔdào 五道, not including demigods; the lowest three paths are sometimes referred to as sān èdào 三惡道 ''the three evil destinations, trayo durgatayaḥ; the destination of heavenly being or human being is, by contrast, referred to as shàndào 善道 ''good destinations'', sugati) See DDB:http://www.buddhism-dict.net/cgi-bin/xpr-ddb.pl?51.xml+id(''b516d-9053'')'
