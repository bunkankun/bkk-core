definition: 'BUDDH: causes > causes / opportunity of teaching > ''case'' (in Chán Buddhism sometimes referring to a specific method of instruction which consists of taking up a ''case'' of old (which can consist of a question which was posed by a master, or can refer to a short dialogue between a master and his student, or the account of a teaching situation) and testing a Chán student with it); the term is closely related to 公案 (kooan) of the Song period)'
