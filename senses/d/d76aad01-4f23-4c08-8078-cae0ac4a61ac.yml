definition: 'BUDDH: Bodhisattva-precepts This refers to the precepts to be observed by bodhisattvas; the term is syn. to dà-shèng jiè 大乘戒 (''Mahāyāna-precepts''), consisting of ten major rules and fourty-eight minor rules based on the ''Sūtra of Brahma''s Net'' (Fànwǎng jīng 梵網經, T.24/1484: 997a-1010a; the text is probably apocryphal and composed in China. It became extremely influential for East Asian Buddhism from the fifth century onwards; on the text see GRONER 1990). In addition there are the threefold pure precepts (sānjù jìngjiè 三聚淨戒 ); see MULLER. For an authorative study of these precepts see GROOT 1893.'
