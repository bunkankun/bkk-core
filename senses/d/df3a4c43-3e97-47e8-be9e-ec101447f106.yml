definition: 'BUDDH: The Qiānfú 千福 monastery in Cháng''ān was built in the fourth year of the xián-hēng 咸亨 era (673 A.D.) for crown prince Zhānghuái 章懷. The Western Chán compound was built especially for Huìzhōng (see YANAGIDA 1990: 388, fn. 232).'
