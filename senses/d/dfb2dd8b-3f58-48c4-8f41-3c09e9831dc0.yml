definition: sleep on See DC 衽金革 《禮記‧中庸》："衽金革，死而不厭，北方之強也。" 孔穎達 疏："衽，臥席也；金革，謂軍戎器械也……以甲鎧為席，寢宿於中。" 明 陸采 《懷香記‧受詔安邊》："念衰齡出鎮西陲，衽金革身罹驚恐。"一說，猶言披堅執銳。 清 王夫之 《四書稗疏‧中庸‧衽金革》："衽金革，言以金革為襟。蓋謂甲爾，披堅則執銳，執銳則致死，戰士之服也。"
