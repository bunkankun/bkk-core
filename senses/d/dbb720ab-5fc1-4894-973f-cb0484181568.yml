definition: 'BUDDH: an appellation (canonical name) of Preceptor Shěngdēng 省人＋登 or Wéndēng 文人＋登 (?-972), a Zen master in the lineage of Xuěfēng Yìcún (Xuefeng Yicun) 雪峰義存 (822-908), and the teacher of the compilers of ZTJ. At the time of the composition of ZTJ he was the abbot of the Zhāoqìng 招慶 monastery. He After having studied the vinaya, he engaged in Zen studies and eventually became a successor of Bǎofú Cóngzhǎn 寶福從展 (867-928)'
