definition: 'CHEMLA 2003: from Sanguo times to the the Song: mobile mathematical model, typically on grid paper; from Song onwards: mathematical diagram Visual illustration in terms of diagrams on paper, forming part of the mathematical discourse began only in Song times. Before this, the term tú 圖 occurred in commentaries only, and moreover it appears that the reference was not to fixed illustrations as a whole, but to mobile grid-paper objects that could be moved about and placed on top of each other or next to each other. The earliest Song printed diagrams often represent these mobile grid-paper constellations, but from this time onwards, the name tú 圖 was no longer applied to the mobile objects, but to fixed illustrations included in and referred to by the mathematical discourse. The first diagram in which points/intersections of lines receive names is dated 1248 ( 李治／李冶，測圓海鏡 ) Illustrations representing the counting surface survive from 1247 onwards, and these are in two styles: in the north, they were embedded into the text as outgrown characters, while in the south they were inserted as separate non-textual tú 圖 on the page.If one disregards the word tú 圖 and considers the use of diagrams as such, it is notable that the opening passage in ZHOUBI apparently refers to mobile shapes used to expound mathematical problems. On the other hand, in JZ itself there is no explicit or implicit reference to any diagrams or models of any kind.'
