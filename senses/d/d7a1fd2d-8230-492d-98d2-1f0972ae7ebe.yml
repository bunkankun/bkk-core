definition: 'name of a state Qín was a semi-barbarian powerful western state, formally enfeoffed as one of the feudal lord states in the eighth century B.C., came to annex all the other states and created the first united Chinese empire in 221 B.C.. For the history of the capitals see Qū 1991: 159-208.'
