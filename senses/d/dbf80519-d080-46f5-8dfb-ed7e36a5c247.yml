definition: 'CHEMLA 2003: transform. CF. JIUZHANG 7.6: 兩不足者兩設皆不足于正數其所以變化猶兩盈 "The cases where we have two deficits are those for which both suppositions are smaller than the exact quantity. That by which they are transformed is the same as for the case of the two excesses." The concept 其所以變化"that by which they are transformed" is effectively the abstract notion of a mathematical operation/procedure. Shù 術 refers to concrete definite and specifiable procedures, whereas 其所以變化 provides a revealing paraphrase which refers quite generally to the kinds of operations that a concrete shù 術 will specify. In other words, operations are conceived of as transformations. And, more generally, Chinese mathematics is markedly less concerned with invariant properties of what are construed as constant abstract entitites, than with rule-governed mathematical transformations needed to account for specific mathematically relevant constellations. Note that 變化 is not used nominally in JZ.'
