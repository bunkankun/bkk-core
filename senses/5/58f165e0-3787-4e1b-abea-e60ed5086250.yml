definition: 'Fàn Lí 范蠡 (5th century) from Chu is mentioned in HF 22.12 as a person in the service of >Tian Chang 田常. But he served first under >King Goujian of Yue 越王勾踐 (r. 496-465), where he had gone together with his friend >Wen Zhong 文種, and he rose to the rank of a generalissimo after the important victory over the state of Wu 吳 in 473. Later, after a bitter defeat of Goujian at the hands of Wu, Fan Li spent three years as a hostage in Wu. When Yue had destroyed Wu, Fan Li fled by ship to the state of Qi 齊, where he took on the new name Chīyí Zĭpí 鴟夷子皮 under which he is mentioned in HF. In the rich state of Qi he accumulated legendary fortunes. According to GY Yueyu 2 he held a political theory of Yin and Yang turning into each other upon reaching an extreme degree. A work in two scrolls, bearing his name, is attributed to him in YIWENZHI. Fan Li died in Tao 陶, where he had acquired yet another name, Tai Zhugong 陶朱公. Under this name he is commonly referred to as a Croisus of ancient China. His remarkable story is told in SJ 129 and also, together with that of his friend Wen Zhong 文種, many episodes of his life are presented in exquisite narrative detail in SJ 41.1741-47. [LSCQ 14.5] Unger no. 140 Personal Name: Shào Bó 少伯'
