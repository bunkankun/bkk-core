definition: Dà Chéngniú 大成牛 (4th century)is taken to be referred to in ZGC 26.2 as a prime minister in Zhào, albeit under the name Great Cheng Wu 大成午. He became prime minister under Marquis Cheng of Zhao 趙成侯 (r. 374 – 349) and was a contemporary of the legalist >Shen Buhai 申不害 (c. 400 – ca. 332).
