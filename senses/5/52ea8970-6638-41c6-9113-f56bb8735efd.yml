definition: 'BUDDH: support staff of a monk; SANSKRIT khakkhara (One of the 18 essential items of a monk. Used as support staff and for scaring away wild animals, snakes, etc. when the monk is on a journey. It is also used for making sounds (usually equipped with small metal rings on top) in order to be heard when the monk is on his begging tour. The three parts of the staff consist of xi 錫, mùruì 木枘, and duì 錞. The staff which is made of led has on top a large ring attached to it. From this ring hang several smaller rings. When shaken, those rings produce a typical sound. There are numerous references to the shape, functions, and meaning of support staffs in sūtra literature. In China the support staff was introduced quite early. One of the earliest and most famous references appears in XUGAOSENGZHUAN in the biography of the monk Sēngchóu 僧稠 who used the staff to separated to fighting tigers with it (afterwards the monks'' staff was occasionally referred to as 解虎丈 ''staff which seperates the tigers''. SInce it is used during all longer journeys of monks it is also referred to as 飛杖 ''flying staff''. If a monk settels down at a place the staff is consequently referred to as 留杖 ''dwelling staff'' or 掛杖 ''suspended staff''.)'
