definition: 'CHEMLA 2003: vertical row (on the calculating surface); horizontal row (on the calculating surface); rectangular shape formed by a vertical or horizontal row.JZ 8.7, Liu Hui''s comm: 雖四五行，不異也。 "No matter whether it is a case of four or five vertical rows (i.e. no matter how many rows there are), it (the method) remains the same."JZ 4.22: 復借一算，置下行 "one borrows one more counting rod and places it in the lower row".'
