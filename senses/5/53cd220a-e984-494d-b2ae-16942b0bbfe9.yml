definition: 'BUDDH: Water Wheel; this refers to the second of three circular regions, all worlds in the unvierse rest on (the lower region is referred to as Fēnglún 風輪 and the upper as Jīnlún 金輪; on top of these three-layered circular plates, mountains, oceans, etc. are situated; Mt. Sumeru is situated in the center of these circular plates and is as such the center of the world; see also 須彌山)'
