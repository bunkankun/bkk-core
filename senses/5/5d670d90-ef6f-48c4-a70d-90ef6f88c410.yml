definition: Bì Xī 佛肸 was a domestic officer of the Fàn 范 clan in Jìn, who had been put in charge of the town of Zhōngmóu 中牟 (loc. near Xīngtái and Hándān, Héběi Provence), in Spring and Autumn times. This Zhōngmóu was in Jìn territory.
