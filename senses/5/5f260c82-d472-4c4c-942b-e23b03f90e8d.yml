definition: 'CHEMLA 2003: to practice divison by way of compensation for having multiplied elsewhere earlier in the computation procedure. Note that this terminology refers not simply to a practice as such, but to the motivation for a practice.JIUZHANG 4.16: 開其母，報除。 "One extracts the root of the corresponding denominator, and divides in return.'
