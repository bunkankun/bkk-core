definition: 'CHEMLA 2003: Already Liu Hui''s preface to JZ refers to JZ as a 經 in the notoriously ill-understood phrase 經術 which, in Liu Hui''s preface to JZ must refer to "the procedures in the Classic (i.e. in the JZ)". Thus whereas the JZ itself does not declare itself to be a 經, the earliest commentary does. If, as many modern Chinese translators suggest, 經 had to be taken to refer to the Confucian classics in Liu Hui''s commentary, this would mark an uncharacteristically diffuse departure from the mathematical topic of his great commentary.'
