definition: 'BUDDH: Běnjìng (Benjing) for Mt. Sīkōng 司空, his family name was Zhāng 張, originally coming for Jiàngzhōu 絳州. He lived from 667-761. According to SONGGAOSENGZHUAN he came from Dōngpíng 東平. Jiàng provice is situated in today''s Shānxī, in the southwest of Xīnjiàng 新絳 province'
