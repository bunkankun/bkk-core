definition: Gōngzhòng Péng 公仲朋 (late 4th cent.), also known as Han Peng 韓朋, as Gongzhong 公仲 and Gongzhong Chi 公仲侈 [SJ 71.2312. See also SJ ed. Han Zhaoqi p. 3613, note 5] was a favourite of King Xuanhui of Han 韓宣惠王 (r. 332 – 312). He came to serve as the prime minister of Han 韓. [SJ 71 passim; ZGC passim]
