definition: (BUDDH:) The third caste in Ancient India is also referred to as fèishě 吠舍, or píshě(luó) 毘舍(羅); skr. Vaiśya; other terms include jūshì 居士, shāngjià 商賈, tiánjiā 田家, gōngshī 工師. The class refers to peasants, craftsmen, and merchants (see 種姓)
