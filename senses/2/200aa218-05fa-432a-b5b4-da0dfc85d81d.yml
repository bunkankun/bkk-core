definition: 'BUDDH: the five major offences; the five cardinal sins (which entail an endless existence in hell; defined as killing the father, killing the mother, killing of a sage (arhat), destroying the harmony of the sangha, shedding the blood of a Buddha; 無間 refers to the fact that these acts entail uninterrupted suffering in hell; In the LANKA and especially texts of the early Chán Schools, the cardinal sins are reinterpreted in terms of mental activities; see also wǔnì 五逆)'
