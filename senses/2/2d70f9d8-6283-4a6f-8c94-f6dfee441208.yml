definition: 夏安居：佛教名詞。在古印度雨季的三個月（約5—8月）裏，禁止僧尼外出，說外出易傷草木小蟲，應在寺内坐禪修學，接受供養。這段時期稱作“安居期”，南亞稱爲“雨安居”，中國稱爲“夏安居”，或簡稱“夏坐”、“坐夏”。開始階段叫做“結夏”，結束階段叫做“安居竟”、“解夏” [Annotation by Sun Xixin]
