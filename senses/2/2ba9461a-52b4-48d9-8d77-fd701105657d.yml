definition: 'BUDDH: the four born ones > the four type of beings existing the Three Realms, san1jiè 三界 and Six Destinies, liùdào 六道 (these creatures are divided ino those being born from an egg (obivprous, luǎnshēng 卵生), born from the womb of mammals (viviparous, tāishēng 胎生), born from moisture (shīshēng 濕生), usually referring to insects the eggs of which are not easily detectable; born through transformation (huàshēng 化生), referring to gods and residents of hell, both of them being born based on their karma)'
