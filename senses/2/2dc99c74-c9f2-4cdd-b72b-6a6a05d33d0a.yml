definition: 'BUDDH: skr. Kātyāyana, one of the ten major disciples of the Buddha; skr. Mahākātyāyana; pali Mahākaccāyana, Mahākaccāna (the complete name is 摩訶迦旃延, other transliterations include 摩訶迦多衍那, 摩訶迦底耶夜那, 大迦旃延, 摩訶迦氈延; he was born in the West-Indian state Avanti (阿槃提國); he was supposed to have been very versed in debating with followers of heretic teachings and after Buddha''s death he was asked to collect the commentaries to the sūtras; he is frequently mentioned in the FOBEN XINGJI JING)'
