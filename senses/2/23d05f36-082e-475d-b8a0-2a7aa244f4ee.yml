definition: 'CHEMLA 2003: width In JZ 廣 does not always refer to the smaller side of the rectangle, but regularly refers to the dimension in the east-west direction. By the time of the commentator Li Chunfeng, this has changed, and 廣 has come to refer to the smaller dimension irrespective of its directionality.'
