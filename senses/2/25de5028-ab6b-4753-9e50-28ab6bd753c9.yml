definition: Duàn Guī 段規 (fl. 453) was a ministerial adviser in Han 韓 to Han Kangzi 韓康子 and was instrumental in the murder of the Earl of Zhi 智伯 in 453. In ZGC Zhao 1 Duan Gui advises the ruler of the state of Han against acceding to demands for land by the Earl of Bo. According to GY Jinyu 9 and SY 5.27 Duan Gui is instrumental in the murder of the Earl.
