definition: '''other'': this is an idiomatic usage of tā in medieval texts, marking the object as something not desired by the speaker, something which is contrary to his intention; this usage is very particular and seems to mark something the speaker wants to distance himself/herself from; often put in contrast to the "desired" object; this usage of tā deserves a more detailed analysis'
