definition: 'BUDDH: pure dharma-eye (This is an alternative expression for zhèng-ǎ yǎnzāng 正法眼藏 which is a specific Chán/Zen term referring to the mind which is transmitted from Buddha to Buddha, master to master, independent of any scriptual teachings; it refers to the ''eye'' of wisdom which can discern the ultimate truth and is as such synonymous with ultimate wisdom; this expression did not appear before Song times (although the phrase fǎyǎn jìng 法眼淨 is of early origin and appears in sūtra literature; see FOGUANG: 3388b-c) in Chán works such as LIANDENG, often in combination with nièpán miàoxīn 涅槃妙心; the two phrases are occasionally contracted into zhèngfǎ miàoxīn 正法妙心 ''the wonderful mind of the right dharma'' (see FOGUANG: 1993c-1994a). ZTJ is either the earliest source for this term or the passage was probably interpolated during the early Song)'
