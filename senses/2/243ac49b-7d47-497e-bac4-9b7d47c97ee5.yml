definition: Cháng Yújiăo 長魚矯 (died 573) was a sycophantic confidant of >Duke Li of Jin 晉厲公 (r. 580 – 573). According to LSCQ 20.7 Duke Li ordered him to kill a number of political enemies and to expose their bodies to public view in the court. [GY Jin 6; GY Chu 2.18] Chang Yujiao was himself murdered along with his master in 573. [ZUO Cheng 17, SHANGBO 姑成家父]
