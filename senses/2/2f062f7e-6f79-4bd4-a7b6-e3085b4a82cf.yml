definition: 'BUDDH: the Five Aggregates (also written wǔyùn 五蘊 and wǔzhòng 五眾; referring to the five components which constitute a sentient being: sè 色 ''form'', shòu 受 ''sensation'', xiǎng 想 ''conception/thinking'', xíng 行 ''mind tendencies and functions'', shí 識 ''consciouness''; the lit. meaning of skandha is ''cluster'') SANSKRIT pañca skandha'
