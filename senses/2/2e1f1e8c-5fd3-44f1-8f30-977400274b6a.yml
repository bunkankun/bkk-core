definition: 'BUDDH: King Udayana (said to have ruled over Kauśāmbī 憍賞彌國 at the time of the Buddha) (According to sūtra literature the wife of the king was an ardent believer in the teaching of the Buddha. However, her husband was not yet following the Buddha''s teaching and he was struck by misfortune and illness. This was at the time when the Buddha had ascended to a heaven in order to preach to his mother there. His ministers thereupon used the 栴檀 wood (sandal-wood) from a mountain called Niútóu 牛頭 and fabricated a small Buddha-statue five 尺. Thereupon the king recovered from his illness. It is said that this event initiated the construction of small Buddha-statues in India, a habit which was eventually transmitted to China.)'
