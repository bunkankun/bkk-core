definition: 'Standard Name: Gōng Zǐ Cè 公子側 Personal Name: Zǐ Fǎn 子反 Canonical Name: Sī Mǎ 司馬 Unger no. 411Zǐ Fǎn 子反 (died 575 B.C.) was a senior minister with the title sīmǎ 司馬 in Chǔ, also known as Gōngzǐ Cè 公子側. He committed suicide, according to ZUO, because he had drunk too much during battle.'
