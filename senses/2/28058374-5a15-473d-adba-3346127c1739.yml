definition: 'BUDDH: the Three Poisons (see also 煩惱, the three basic poisons are craving/desire/passion (rāga. tān 貪 or tānyù 貪欲), anger/hate/ill-will (chēn 嗔), and ignorance (moha, chī 痴 or yúchī 愚痴); the Three Poisons are also referred to as sānhǔo 三火 Three Fires, sāngòu 三垢 Three Impurities, sāngēn 三根 Three Roots, sānzhū 三株 Three Trunks, sān bùshàn gēn 三不善根)'
