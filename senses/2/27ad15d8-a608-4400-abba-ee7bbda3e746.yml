definition: 'BUDDH: twofold wisdom (there are several explanations of these kinds of knowledge/wisdom: (1) 盡智 (which resolves all afflictions 煩惱) and 無生智 (俱舍論); (2) 根本智(wisdom which penetrates delusions and does not engage in any false discriminations or differenations) and 後得智 (wisdom applied in the phenomenal world where all things are recognized as depending on each other, preventing the arising of the notion of a personal self); DASHENG QIXINLUN, 成唯識論; (3) 權智 (wisdom of expedient means) and 實智 (wisdom of the fundamental prinicple, ultimate truth (大乘義章 19, 法華玄義 3); (4) 如理智 (wisdom of the ultimate truth) and 如量智 (wisdom pertaining to the secular world) (佛性論 3); (5) 一切智 and 一切種智; (6) 觀察智 and 取相智'
