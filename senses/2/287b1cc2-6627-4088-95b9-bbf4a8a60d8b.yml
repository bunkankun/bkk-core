definition: 'you listen to me! Listen to what I have to say! (Mostly the subject of imperatives is omitted, so that here as elsewhere with verbs in the imperative one might be tempted to write the syntactic category as: vt[0][oN] . But there are apparent exceptions. In these exceptions it is typically possible to take the apparent subject as a separate vocative, along the lines of: Good friends! [You] must...)'
