definition: 'Gěng 耿 (CHEN PAN 1969, 560-562)Ruling clan: Jī 姬 (according to the Jìn shìjiā jí jiě and to the Du''s commentary), or Yíng 嬴 (according to the Lù shǐ Guó míng jì, Dūchéng jì, and Jùn guó zhì).Rank: Unknown.Founded: Unknown.Destroyed: 661 B.C. by Jìn 晉 (ZUO Min 1).Location: In the south-eastern part of the modern Héjīn 河津 district, Shānxī province.History: A small state destroyed by Jìn. Thereafter, the area became a fief of the Zhào 趙 lineage.'
