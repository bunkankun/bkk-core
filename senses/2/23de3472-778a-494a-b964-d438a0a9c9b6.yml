definition: 'Èr 貳 (CHEN PAN 1969, 465-466)Clan: Unknown. According to the Xìng xī, the rulers of Èr were of Jī 姬 surname. On the contrary, Lù shǐ Hòu jǐ suggests that they belonged to the Yǎn 偃 clan. Rank: Unknown.Founded: Unknown. Destroyed: Unknown. The state is mentioned in the ZUO for the year 701 B.C. (Huan 11). Later, it was destroyed by Chǔ 楚.Location: In the modern Guǎngshuǐ 廣水, Hubei province.'
