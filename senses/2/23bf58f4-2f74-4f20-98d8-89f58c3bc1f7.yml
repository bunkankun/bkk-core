definition: 'BUDDH: Diamond Seat; skr. vajrāsana (the seat under the bodhi tree where Buddha reached enlightenment. According to Buddhist cosmology this seat already appeared during the beginnin of the 賢 kalpa, and is situated in the center of all world-systems. At this place all Buddhas are supposed to enter the Diamond samādhi 金剛三昧'
