definition: Gōngsūn Xĭ 公孫喜 (fl. 293) from Wei 魏 (not to be confused with his namesake, son of Duke Mu of Zheng 鄭穆公, also referred to as Zi Han 子罕) was a brother of >Gongsun Hong 公孫弘 and served as a general in that state. He was captured by the formidable Qin general >Bai Qi 白起 in 293. [SJ 72.2325, 73.2331 et passim]
