definition: 'CHEMLA 2003: join up with> add to form of addition in which one basic number is given, and added to it (joining it, cóng 從 ) are other numbers: 從定法 "joins>is added to the already determined divisor". The operation of addition, as construed by the term cóng 從 is thus not symmetrical, there being one main number to which others are added and hence disappear from the calculating surface. [Note that what is conventionally called a "calculating board" has never been excavated from any period whatever, as Jean-Claude Martzloff has rightly emphasised.'
