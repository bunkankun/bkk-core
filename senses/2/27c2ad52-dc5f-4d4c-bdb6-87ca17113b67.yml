definition: 'CHEMLA 2003: a half (of an identified kind of items) (This must be carefully distinguished from the notion of a half of an amount 二分之一.) In this meaning, 半 is almost enclitic, and always follows after designations of units or numbers, rather than after designations of concrete items. Moreover, the measure is never repeated after 半. Reference to the fraction as such is always in terms of 二分之一. JIUZHANG 1.9 又有二分之一 "Again, suppose we have one half (of something)" JIUZHANG 4.1 and 4.2 has counterexamples that are only apparent, because they involve resumption of post-nominal 半.Note incidentally that the fraction 2/3 is expressed in JIUZHANG as 太半 as well as 三分之二, there being no clear distinction in meaning between these two. Shào bàn 少半 as well as 三分之一 are used - indifferently - to refer to the fraction 1/3. Possibly, the choice among these alternatives might be a basis for dating various parts of the text in which these terms occur.'
