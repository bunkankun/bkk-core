definition: 'Yīngshì 英氏 (also called Yīng 英, Yāng 央 ) (CHEN PAN 1969, 622-625)Ruling clan: Yǎn 偃 ( 匽 ) or Yíng 嬴 (according to the Shǐ jì, Xià běnjǐ chapter). Rank: Unknown.Founded: According to the Shǐ jì (Xià běn jǐ), the state was founded by the descendants of the mythical Gāo Yáo 皋陶 during the reign of the equally mythical emperor Yǔ 禹. Destroyed: The state was attacked by Qí 齊 and Xú 徐 in 644 B.C. (Xi 16). Later, it was destroyed by Chǔ 楚 (according to the Shǐ jì, Chǔ shìjiā). Location: In the modern Liù''ān 六安 district, Anhui province (according to the Huì zuǎn).'
