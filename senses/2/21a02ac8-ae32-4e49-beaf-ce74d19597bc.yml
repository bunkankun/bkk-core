definition: 'CHEMLA 2003: superordinate general, abstract (as in 都術 "dominant, i.e. general procedure (not limited to specific kind of mathematical case)"JZ 8.1, Liu Hui''s comm. (possibly even Li Chunfeng) 此都術也。以空言難曉。 "This is a universal/general procedure, and it is hard to understand on the basis of general discourse (without a concrete paradigm)."In JZ 2.0 the main text begins 今有, and the commentary explains 此都術也。 "This is a main procedure (in the art of calculation)."'
