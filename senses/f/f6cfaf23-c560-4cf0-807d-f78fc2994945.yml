definition: 'BUDDH: the realm of the demon-king; the sphere of evil spirits > the realm of delusion (mó 魔 (skr. māra; mó is an abbreviation of móluó 魔羅; EMC: /ma-la/) refers to the demon king who is a symbol for delusion (fánnǎo 煩惱) and all obstacles which inhibit progress on the way to enlightenment. He is often described as the demon-king of the sixth heaven of the world of desire (yùjiè 欲界). The original meaning of māra is ''to kill''. Originally the word was transcribed using mó 摩; EMC: /ma/ or má 麻, but around the time of emperor Wǔ 武 of Liáng 梁 the character mó 魔 was invented in order to transcribe this sanskrit word)'
