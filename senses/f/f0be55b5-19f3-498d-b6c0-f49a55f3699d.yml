definition: 'BUDDH: the mind whose self-nature is pure > the innately pure mind; skr. visuddhi cittaprakrti (this concept of mind arose within the Mahāyāna school and was probably formulated around the 3rd century A.D., described in scriptures such as the Śrīmālā sūtra. At an early stage this mind was already associated with the concept of rúláizāng 如來藏 (skr. tathāgata-garbha; ''womb of the tathāgata''). According to this doctrine all beings have an embryonic Buddha inside themselves which eventually will cause them to gain enlightenment. this is for example described in the Bǎoxìng lùn 寶性論 (Ratnagotravibhāga)'
