definition: 'CHEMLA 2003: there are different types of parts/fractionsThis refers to two mathematical situations: firstly, the case where several parts>fractions have different denominators and thus constitute different types of "parts", or alternatively where two parts>fractions are added to a given integer. (When the parts>fractions have the same denominator, the expression for this situation is 有分.) This first situation is never explicit in JZ, but it is referred to by Li Chunfeng (comm on Zhang Qiujian suanjing ed. Qian Baocong 1963, p. 334. Cf also Xia hou yang suanjing, ed. Guo Shuchun and Liu Dun, Liaoning Jiaoyu Chubanshe, vol. 2, p. 1 where reference is made to 分不均 "...when the fractions have no common denominator..."). Secondly, it refers to a situation when (in linguistic parlance, one fraction is embedded in further fractions, or when the partitioning is (in mathematical terms) recursive, as in 1 divided by three, further divided by 5. (1/3)/5. The commentaries on JZ make it clear that notions of this sort are intended in the JZ.'
