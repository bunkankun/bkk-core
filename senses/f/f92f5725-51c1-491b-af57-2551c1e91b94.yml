definition: Cáo Jī 曹羈 (fl. 670) was a military dignitary from the state of Cao 曹 mentioned in CQ Zhuang 24. Having remonstrated unsuccessfully with his ruler three times, when his state of Cao was being attacked by a barbarian tribe, Cai Ji went into exile in the state of Chen 陳. This episode is commented upon in GONGYANG Zhuang 24.
