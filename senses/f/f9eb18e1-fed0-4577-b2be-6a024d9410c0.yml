definition: 'Suì 遂 (also written as 隧 ) (CHEN PAN 1969, 512-515)Clan: According to the ZUO (Zhao 3, 8), rulers of Suì were supposed to be descendents of the mythical Emperor Shùn 舜, and should thus have been of Guī 媯 surname. According to the Lù shǐ Hòu jì, there were two states of Suì: one with the surname Guī and another belonging to the Jī 姬 clan. Rank: Unknown.Founded: According to the tradition recorded in the ZUO (Zhao 3, 8) the rulers of Suì were descendents of Shùn, and they were given their surname by the Zhōu kings. Du''s commentary states that the fief in Suì was given to the descendants of Shùn by the Shāng 商 kings. Destroyed: According to the CQ, Suì was conquered by Qí 齊 in 681 B.C. (Zhuang 13). The different story is given in the Shǐ jì (Qí shìjiā and Cìkè zhuàn), which says that in that year, Lǔ gave the city of Suì to Qí. With regard to the latter statement, some traditional Chinese scholars suggested that the state of Suì was already prior to 681 B.C. conquered by Lǔ 魯.Location: According to the Hàn zhì, Suì was located in the modern Níngyáng 寧陽 district, Shandong province.'
