definition: 'read: ǎn zān "I" (宋 周密 《癸辛雜識別集‧物外平章》引無名氏《散經名物外平章》：“姓名標在青史，卻干俺咱甚事？” 金 董解元 《西廂記諸宮調》卷五：“誰知後來遇群賊，子母無計皆受死，難閃避。恁時節，是俺咱可憐見你那裏！”)'
