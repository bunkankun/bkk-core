definition: 'CHEMLA 2003: the gnomon (a stick of a determinate length used among other things in traditional time measurement in China (and also in Greece!)) It is remarkable that the Greek word gnoomoon, like the Chinese biǎo 表 refers both to the instrument and the remaining shape when one square is inserted into another. For example, a 八尺之表 is NOT a stick that is eight chǐ long, but in fact a longer stick of which the top is eight chǐ above the ground. In a phrase like JZ 1.32 出圓之表 "the (expanded) remaining shape which goes beyond the circle", biǎo 表 comes close to a nominal use of 外 "outside shape". In Liu Hui''s preface we have 立兩表于洛陽之城 "set up two gnomons on the city wall of Luoyang".'
