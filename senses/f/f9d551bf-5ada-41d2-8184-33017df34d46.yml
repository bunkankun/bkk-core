definition: he/she/it (this third person pronoun is probably of Southern origin and is still current in the modern 吳 dialect (the pronoun is quite frequent in ZTJ and also appears a few times in BIANWEN; during the Song and Yuan periods it still was occasionally used but mainly survived in local dialects; the origin of the function as third person pronoun is not quite clear and WANG LI thinks that it originated during the 4th and 5th centuries)
