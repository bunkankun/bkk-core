definition: '"Chinese (typically written) language" (often icludes speech: 會說中文 )This word is already attested in 搜神記, where it refers to the written language. In Modern Standard Chinese this is a very common way of referring to Chinese as opposed to foreign languages, and as a subject in school curricula.'
