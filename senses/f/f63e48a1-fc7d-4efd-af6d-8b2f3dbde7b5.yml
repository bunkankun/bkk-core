definition: 'CHEMLA 2003: circumference of a circle. By extension the term may refer to the circumferences of an annulus/ring or circular tube or a segment of sphere. LIU HUI 1.32 故以半周乘半徑而為圓冪 "Therefore with the half of the circumference one multiplies half of the diameter and thus arrives at the area of the circle." (There are plenty of earlier examples.)JIUZHANG 1.33 今有宛田，下周三十步，徑十六步。 "Suppose there is an yuan4 (i.e. segment-of-the-sphere) "field" pattern, its lower circumference is 30 paces, and its diameter is 16 paces."JZ 1.32, Li Chunfeng''s comm: 是二六相乘，除周自乘之數 "Thus the product of two and six divides the quantity of the square of the circumference."JIUZHANG 1.37 今有環田，中周九十二步，外周一百二十二步，徑五步。 "Suppose there is a "field" pattern in the shape of a ring, and its inner circumference is 92 paces, its outer circumference is 122 paces, and its diameter is five paces." (NB: The outer circumference is at the outside of the ring, and the inner circumference is at the inside of the ring.)'
