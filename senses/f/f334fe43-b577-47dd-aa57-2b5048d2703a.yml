definition: 'OBI 3: one of the series of five rituals in Shāng times, sometimes offered in the evening and then called the róng xì 肜夕. When unspecified the sacrifice is offered in the daytime, and sometimes this daytime ritual is then specifically recorded as róng rì 肜日.'
