definition: 'BUDDH: skr. Ikṣvāku, pali Okkāka; alternative names are Yìmómí 懿摩彌, Yìshīmó 懿師摩, Shēngmó 聲摩, and Yīmó 伊摩; he is also referred to as King Shànshēng 善生 (''Good Birth''; skr. Sūjata) and King Rìzhǒng 日種 (''Sun Clan''; skr. Sūryavaṃśa); he is described in Buddhist sutras as ancestor of the Śākya clan'
