definition: (BUDDH:) King(Prince) skr. Aśmakā, Aśvakā; pali Assakā (he was the son of King Bimbisāra 頻婆娑羅王); the prince is known of having come under the influence of Devadatta, the cousin and rival of Buddha, who caused him to kill his father and ascend the throne himself
