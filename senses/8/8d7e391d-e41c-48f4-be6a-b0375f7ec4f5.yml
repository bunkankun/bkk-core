definition: verbal suffix (probably used for disyllabication); sometimes categorized as 'structure word' (結構詞) without any meaning, or as suffix/complement/ auxiliary similar to 著); e.g. 記當, 問當 (BIANWEN); in Tang texts 當 can also be added to copula 為, however, the resulting 為當 is restricted in its function to marking alternative questions
