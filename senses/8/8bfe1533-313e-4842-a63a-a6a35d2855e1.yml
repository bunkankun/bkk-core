definition: 'Dān 聃 (also written as Rǎn 冉, Nán 南, Dān 耽 ) (CHEN PAN 1969, 647-650)Clan: Jī 姬.Rank: Unknown.Founded: According to the Xìng jiě, the first ruler of Dān was Jì Zài 季載, the son of the Zhōu king Wén 周文王. Destroyed: Unknown. According to the traditional Chinese historiography, Dān was conquered either by Chǔ 楚 or Zhèng 鄭 (the latter opinion seems to be more probable; see Location). Location: Unknown. According to some opinions, the former capital of Dān was Nàchù 那處, which is mentioned in the ZUO (Zhuang 18; 676 B.C.) as belonging to Chǔ; if so, the former state of Dān must have been located somewhere in the neighborhood of Chǔ. In the ZUO, Xi 2 (658 B.C.), there is mentioned Zhèng 鄭 aristocrat Dān bó 聃伯, what would point to the fact that Dān was conquered by Zhèng and that it was located somewhere in the area of the latter state; Dì lǐ kǎo shí locates it into the area of modern Kāifēng 開封. This opinion seems more probable than the location of Dān to the neighborhood of Chǔ. Guǎng yùn mentions that the first fief of Dān was in the area of the western Zhōu royal capital, close to the modern Xī''ān 西安. This opinion sounds quite reasonable.'
