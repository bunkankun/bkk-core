definition: 'Keightley Sources 1978: 119 note 124: OBI: a notation indicating that the divination was used but whose precise meaning is not fully understood. The phrase is currently used in divination about hunting and campaigning. See Hu Houxuan "On the distinction between 茲用and 茲御" 1939. 茲用was never used when the King was recorded as diviner.'
