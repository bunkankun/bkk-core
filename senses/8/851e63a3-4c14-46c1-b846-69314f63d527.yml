definition: immigrant people, non-native Han people; common people. Can be used synonymously with 民, to denote the mass of ignorant agricultural labourers, and, in a wider use, the governed generally. There is no evidence of use to denote masses of people uprooted from their home because of natural disaster or war, 氓 were in other words not "流氓." [JP]
