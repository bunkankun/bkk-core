definition: 'BUDDH: skr. Śuddhodana, pali Suddhodana (this is the phonetic transcription of King Jìngfàn 淨飯王 (also referred to as King Báijìng 白淨 or King Zhēnjìng 真淨 ''True Tranquility''); other phonetic transcriptions include Shǒutútuónà 首圖馱那, Yuètóután 閱頭檀, Yuètóután 悅頭檀) (this refers to the king of Kapilavastu, the father of Śākyamuni; his was the eldest son of Siṃhahanu)'
