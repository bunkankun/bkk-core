definition: 'BUDDH: mentally depending on and grasping after external objects > mental attachment; the arising of consciousness through the contact with external (sense) objects; the mental function of cognizing objects (sometimes defined as the root of delusion; through the attachment to external objects, the world is divided into sets of oppositions (good vs. bad etc.); through this discriminative thinking emotions such as love and hate are generated; see e.g. VIMALAKIRTI); skr ālambana 攀緣心'
