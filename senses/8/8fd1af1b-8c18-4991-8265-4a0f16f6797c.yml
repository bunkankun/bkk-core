definition: 'CHEMLA 2003: take one half of; occasionally with preposed object resumed by 之 in 半之. Thus X 半之 comes to mean "take half of X". Note that 半, whether as adjective or as transitive verb, never has a scope that extends across multiplication chéng 乘.JIUZHANG 1.6 可半者半之 "(the numerators and the denominators) that can be halved, one halves" JIUZHANG 1.21: 半廣以乘正從 "One reduces by half the width and with (the result of this operation) you multiply this with the height (lit: "straight vertical")." Note that 半廣 might conceivably be construed as a adjective-noun construction here, although this would lead to considerable analytic contortions in the interpretation of the text.'
