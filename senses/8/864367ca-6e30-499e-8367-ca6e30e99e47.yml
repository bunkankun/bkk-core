definition: Guān Lóngpáng 關龍逢 (legendary; Xia). A minister to King Jie 桀王, the (legendary) wicked last emperor of the Xia dynasty, who remonstrated against the emperor's excesses and was executed for his recalcitrance is commonly mentioned throughout ancient literature. [ZHUANG 4] [LSCQ 2.5; XUN 21.259, 28.345; HSWZ 1.26, 4.2, 7.6]
