definition: 'locative coverb: in, at, on (this is a special usage of 向 in vernacular texts of the Tang and Song periods; there are only few examples dating from the Six Dynasties period but this function became quite common during the Tang; during the Ming locative xiàng gradually became obsolete) In Song texts typically appearing in the construction 向 N 中 "in N"'
