definition: 'BUDDH: abstract region, sphere; context; circumstances (> external mental stimulus > external stimulus); also: realm of the mind > objects of perception; skr. viṣaya (see 六境 ) (the term has a very wide range of meanings; see DDBhttp://www.buddhism-dict.net/cgi-bin/xpr-ddb.pl?58.xml+id(''b5883'')It became a central term in the 臨濟錄, see Anderl 2007: Informal Notes on the Term "jing" 境 in the Linji lu 臨濟錄. In: Wenxue yu zongjiao - Sun Changwu jiaoshou qishi huadan jinian wenji 文學與宗教 - 孫昌武教授七十華誕紀念文集 [Literature and Religion - Festschrift on the Occasion of Prof. Sun Changwu''s 70th Birthday]. Beijing: Zongjiao wenhua chubanshe 宗教文化出板社 2007. ISBN 9787801239020. pp. 391-423'
