definition: 'BUDDH: Tripiṭaka master (sānzàng refers to the ''three baskets'' (jīng 經, lùn 論, lv4 律) of the Buddhist canon; a Tripiṭaka master is somebody versed in the interpretation of scriptures; in the Chán context occasionally also used deroatively for a priest specialized in Buddhist scriptures or for a follower of the ''Small Vehicle'')'
