definition: 'BUDDH: hungry ghost (the fifth form of existence within the liùdào 六道 Six Destinations); SANSKRIT preta; PALI peta The original meaning of preta is ''deceased'' and the word can also refer to the spirit of dead. Since the dead cannot supply themselves with food they are dependent on the offerings made by the living. In order to escape the wreth of the hugry ghosts, the living and descendents have to perform oblatory services'
