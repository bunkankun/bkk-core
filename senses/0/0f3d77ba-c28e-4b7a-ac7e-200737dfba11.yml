definition: 'the Eight immortals DCD: 漢鍾離 、 張果老 、 呂洞賓 、 李鐵拐 、 韓湘子 、 曹國舅 、 藍采和 、 何仙姑 。八仙故事已見於 唐 、 宋 、 元 人記載， 元 雜劇中亦有他們的形象，但姓名尚不固定。'
