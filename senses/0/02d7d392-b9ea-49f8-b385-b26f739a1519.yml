definition: 'Luó 羅 (CHEN PAN 1969, 487-490)Clan: Probably Xióng 熊 (according to the Shì běn, Du''s commentary, and to the Tōng zhì). According to the Xìng xī, the rulers of Luó belonged to the Yún 妘 clan. Rank: Unknown. According to the Shuǐ jīng zhù and Xìng xī, the rulers of Luó were of hóu 侯 rank. According to the Hàn zhì and Tōng diǎn, they had zǐ 子 rank.Founded: Unknown. According to the Shì běn, the rulers of Luó were of the Chǔ 楚 clan Xióng 熊. Destroyed: After 699 B.C. (Huan 13), Luó does not appear in the CQ and ZUO. In 635 B.C. (Xi 25), the area already belonged to Chǔ 楚.Location: According to the Du''s commentary to the ZUO, to the Shuǐ jīng Jiāng shuǐ zhù, and to the Tōng zhì Shìzú kǎolyè, Luó was located in the modern Yíchéng 宜城 district in the northern part of Hubei. According to the same sources, it later shifted to Zhījiāng 枝江. After its defeat by Chǔ, King Wén of Chǔ 楚文王 (689-677 B.C.) is said to shift it to the area of the modern Luó district in the neighborhood of Chángshā 長沙, Hunan province (what is stated in the Hàn zhì and Shuǐ jīng zhù). However, I found this statement late and rather problematic, because it is by no means certain that in that early period Chǔ had a control over this remote area. But probably by the end of the Warring states period, Luó was located in the area of Chángshā, as is mentioned in the Tōng zhì. History: Luó was a small and unimportant state, which is remarkable only for its victory over the invading Chǔ army in 699 B.C. (Huan 13).'
