definition: Chūnshēn Jūn 春申君 (7th – 6th century) was a younger brother of >King Zhuang of Chu 楚莊王 (r. 613-591). We know nothing about him, though he cannot have been the famous Chunshen Jun 春申君 whose name was Huáng Xiē 黃歇 and who died in 238.
