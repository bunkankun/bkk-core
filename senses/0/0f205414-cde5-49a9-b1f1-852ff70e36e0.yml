definition: 'BUDDH: Wind Wheel; this refers to the lowest of three circular regions all worlds in the unvierse rest on (the upper regions are referred to as Shuǐlún 水輪 and Jīnlún 金輪; on top of these three-layered circular plates, mountains, oceans, etc. are situated; Mt. Sumeru is situated in the center of these circular plates and is as such the center of the world; see also 須彌山)'
