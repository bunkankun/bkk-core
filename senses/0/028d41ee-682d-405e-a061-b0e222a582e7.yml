definition: 'BUDDH: Buddhist heaven, heavenly region; skr. deva-loka (compare the pali terms devanagara, sagga, saggapatha) (this refers to the hightest Buddhist realm one can be reborn in (compare liùdào 六道 Six Destinies); there are several classifications of heavens in Buddhist sutras, most frequently there is reference to 17 (or sometimes 16 or 18) heavens in the realm of form ( 色界 ); these are also referred to as 四禪天 (Dhyāna Heavens) with subdivisions; the first 禪天 comprises of 梵眾天, 梵輔天, 大梵天, the second: 少廣天, 無量光天, 極光淨天, 邊淨天; the third: 少淨天, 無量淨天, 遍淨天; the fourth: 無雲天, 福生天, 廣國天, 無煩天, 無熱天, 善現天, 善見天, and 色究竟天. The heavens are often localized as being situated on the upper part of Mt. Sumeru (except Yama''s heaven which is supposed to be above Mt. Sumeru). The gods of the heavens are described as residing in heavenly palaces (tiāngōng 天宮 or tiāngtǎng 天堂 ). The heavens of the Formless Realm ( 無色界 ) comprise of 空無邊處天, 無邊處天, 無所有處天, and 非想非非想處天. For alternative classification of heavens see for example NIRVANA(B))'
