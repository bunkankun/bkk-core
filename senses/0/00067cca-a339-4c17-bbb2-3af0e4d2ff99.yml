definition: 'Bì Fāng 畢方 (legendary, Anne Birrell, The Classic of Mountains and Seas translated the name: Endsquarebird.) was a personified one-legged tree sprite abstaining from the five kinds of grain, occasionally credited with human face.. HF has >Shi Kuang 師曠 listing this Bi Fang as being in the entourage of the >Yellow Emperor. [Anne Birrell Chinese Mythology. For a useful survey of the folklore concerning Bi Fang 中國神話人物辭典 p. 230]'
