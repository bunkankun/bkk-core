definition: 'BUDDH: to rub one''s forehead is a symbol for the transmission of the dharma and the prediction of future Buddhahood. Compare LOTUS: 釋迦牟尼佛從法座起，現大神力，以右手摩無量菩薩摩訶薩頂。(''the Buddha rose from his dharma-seat, displayed great supernatural powers and with his right hand rubbed the forehead of countless great Bodhisattvas'').'
