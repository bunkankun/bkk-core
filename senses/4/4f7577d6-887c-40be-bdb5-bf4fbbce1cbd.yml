definition: 'Standard Name: Duke Zhuāng of Zhèng (Reigned 743-701)Personal Name: Wù Shēng 寤生 Unger no. 116 writes: Rufname Wu-sheng 寤生. Sohn des Wu kung 武公 und der Wu Kiang 武姜. Der Name Wu-sheng bedeutet "Verkehrt geboren", was sich, wie ausdruecklich berichtet, auf die Umstaende der Geburt bezieht. Weil er seiner Mutter dadurch Schmerzen bereitet hatte, ha 含 e sie ihn und zog ihren juengeren Sohn Tuan 段 vor. - Reg. 743-701 (43 Jahre). - Ch. belehnt i.J. 743 seinen juengeren Bruder Tuan in King 京. Dieser beginnt dort militaerisch zu ruesten. Zusammen mit seiner Mutter Wu Kiang plant er einen ueberfall auf Cheng. Ch. greift ihn in King an. Tuan flieht erst nach Yen 鄢 und dann nach Kung 共, wo er von Ch. besiegt wird. Ch. verbannt nun seine Mutter nach Ch''eng Ying 城潁. Er schwoert, er wolle sie erst bei den Gelben Quellen (in der Unterwelt) wiedersehen. Spaeter bereut er diesen Schwur. Ying K''ao shuh 潁考叔 raet ihm, einen Tunnel mit zwei Eingaengen graben zu lassen. Das geschieht, und indem Mutter und Sohn den Tunnel je von einer Seite betreten, findet die Begegnung und Aussoehnung statt. I.J. 720 unternimmt Ch. einen Raubzug auf Chou-Territorium, um Korn zu erbeuten. Damit ist das Verhaeltnis zwischen Cheng und der Krone ein fuer allemal vergiftet. Als Ch. 717 zum ersten Mal Audienzbesuch bei >Huan wang von Chou macht, verweigert dieser ihm die Hoeflichkeit. Da Ch. hiernach nicht mehr zur Audienz kommt, greift Huan wang ihn i.J. 707 an, wird aber geschlagen und erleidet selbst eine Verletzung an der Schulter.'
