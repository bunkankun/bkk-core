definition: 'BUDDH: Blind Dragon (King); skr. Mucilinda (the phonetic transliterations include Mùzhīlíntuólóngwáng 目支鄰陀龍王 and Mòzhēnlíntuó 目真鄰陀; this mythical dragon-king was supposed to reside in the state of Magadha in a lake near the Diamond-seat (金剛座). When Buddha reached enlightenment he is said to have been the first to pay reverence. He is already mentioned in the Han translation of the Fǎjìng jīng 法境經)'
