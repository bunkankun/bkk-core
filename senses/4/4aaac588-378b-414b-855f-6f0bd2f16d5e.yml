definition: 'Cuī Zhù 崔杼 (d. 546) (according to the Jingdianshiwen entry to ZUO Xuan 10 the name should be read Cui Zhu) was a dignitary in Qi, descendent of Duke Ding of Qi 齊丁公. His feof was the city of Cui 崔, hence the name. He won favour with Duke Hui of Qi 齊惠公 (r. 608-599), but after the latter’s death he fled together with a group of other proteges of Duke Hui to the state Wey 衛. Under Duke Ling of Qi 齊靈公 (r. 581-554) he became a dignitary in the state of Qi again and joined a military campaign against Zheng and Qin. Even under Duke Ling’s successor >Duke Zhuang of Qi 齊莊公 (r. 553-548) Cui Zhu continued to gain military merits. On a condolence visit representing his new ruler, Duke Zhuang, he fell in love with the beautiful Tang Jiang 棠姜 and married her. Duke Zhuang fell for the beauty, too and took her in as his own wife. Understandably enraged, Cui Zhu murdered Duke Zhuang and established Duke Jing of Qi 齊景公 (r. 547 - 490) on the throne, taking for himself the position of the prime minister. ZUO Xiang 25 reports: “The grand historian wrote in his records: "Cui Zhu assassinated his ruler." Cui Zhu had him killed. The historian''s younger brother succeeded to the post and wrote the same thing. He too was killed, as was another brother.When a fourth brother came forward to write, Cui Zhu finally desisted.” … Two years after this, in 546, >Qing Feng 慶封, siding with the side of the deceased Duke Zhuang, exterminated Cui Zhu’s whole clan and forced Cui Zhu himself to commit suicide. [ZUO Xiang 25 and 27 have detailed elaborated narratives on Cui Zhu.] [Fang Zhaohui 2002: 487-499] Unger no. 838'
