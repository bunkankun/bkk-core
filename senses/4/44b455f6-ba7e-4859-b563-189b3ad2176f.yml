definition: 'BUDDH: be endowed with sensation > be a sentient being (as opposed to 無情 be inanimate) (this term for sattva was introduced by Xuánzàng 玄奘 (600-664), although the older term zhòngshēng 眾生 remained more popular; originally both terms were a translation of the same Sanskrit word but eventually yǒuqíng came to be used paricularily for creatures with mental activities, whereas zhòngshēng can be used more generally for ''living being'', including plant life; the term yǒuqíng is also less neutral, since it gives also emphasis to the notion of qíng 情, i.e. that living beings (particularily human beings) are characterized by deluded mental activities); SANSKRIT sattva'
