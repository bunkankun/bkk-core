definition: 'BUDDH: Shítóu (Shitou) (700-791); Shítóu Xīqiān 石頭西遷; a famous master of the early Chan/Zen School; he was a resident of Nányuè 南嶽 (Mt. Sōng 嵩山); he originally came from Gāoyào 高要 in Duānzhoū 端州. His posthumous name was Wújì 無際 (Without Limit) (his biographic entry in contained in fasc. 4 of ZTJ)'
