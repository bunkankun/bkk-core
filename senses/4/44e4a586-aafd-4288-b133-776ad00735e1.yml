definition: intensifying copula preceding certain pronouns, since the intensifying function is often neutralized, 是 is sometimes also regarded as prefix (however, the copula function of 是 is in most cases evident); this function appeared during the Tang(e.g. 是誰，是你，是我，是他，是底，是物)
