definition: 'BUDDH: the One Mind encompasses the thousand practices (important phrase which is originally based on the Dàzhìdùlùn 大智度論, Mahāprajñāpārimitā śāstra, T.25/1509: 670b24"l''esprit unique est devenu le substrat permanent qui englobe tout" (MAGNIN 1979: 21); the phrase is also know from the biographic entry on Zhiyi of the Tiantai School (XUGAOSENGZHUAN, T.50/2060: 564)'
