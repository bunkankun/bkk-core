definition: 'military taxation: Ricci: Terme désignant un système d’impôts sur les terres de l’État de 魯 Lu (époque 春秋 Chun Qiu) : chaque 丘 qiū était composé de 128 familles, qui devaient fournir un char, quatre cavaliers, trois soldats cuirassés et 72 fantassins.'
