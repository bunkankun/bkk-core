definition: 'CHEMLA 2003: devoid of concrete reference to specific cases.JZ 8.1, Liu Hui''s comm (possibly even Li Chunfeng) 此都術也。以空言難曉。 "This is a universal/general procedure, and it is hard to understand on the basis of general discourse (without a concrete paradigm)." 故特繫之禾以決之。 "Therefore it makes a point of linking the procedure concretely to millet in order to sort out things."JZ 8.18, Liu Hui''s comm: 綱羅、道精，豈傳之空言 "As for the main strands in this, and the subtleties of the method, how could this be transmitted through abstract/non-exemplifying discourse?" 記其施用之例，著策之數，每舉一隅焉。 "By recording an example of its use in practice, by noting down the numbers in counting rods (cè) (in each position on the calculating surface), in each case we bring up one corner of matters (and leave the remaining three implicit, to be understood by the reader)."'
