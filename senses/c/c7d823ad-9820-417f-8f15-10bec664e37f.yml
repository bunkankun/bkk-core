definition: 'CHEMLA 2003: add a contextually determinate number to JIUZHANG 9.19, and 9.13 Liu Hui commentary: 并句率七 "summing to it the lǜ (quod vide) of the base of the right-angled triangle yields seven". JZ 7.19, Liu Hui comm: 假令本錢三萬，并利為三萬九千。除初返歸留餘加利為三萬二千五百除二返歸留餘又加利為二萬五千三百五十 "Suppose the money one starts out with was 30 000, summing it with the interest makes 39 000. Removing what is returned the first time he goes back what remains, when one adds it to the interest, makes 32 500. Removing what is returned the second time he goes back, what remains, when one adds it to the interest, makes 25 350."'
