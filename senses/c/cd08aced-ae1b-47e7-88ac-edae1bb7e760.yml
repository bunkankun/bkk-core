definition: Duke Huan of Cai 蔡桓公 (r. 714-695), posthumous polite designation for Marquis Huan of Cai 蔡桓侯. He is recorded to have joined an attack against the state of Zheng in CQ Huan 16 (696), and his death is recorded in CQ Huan 17.
