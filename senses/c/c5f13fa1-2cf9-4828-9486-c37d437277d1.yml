definition: 'STANDARD NAME: Duke Yǐn of Lǔ (reigned 722 - 712)ALTERNATIVE NAMES: Xīgù 息故, Xī 息 PARENTS: Son of >Lǔ Huì gōng 魯惠公 and his wife Shēngzǐ 聲子 from Sòng WIVES: ?CHILDREN: -6. 722 ascended the throne, as Yǔn 允, his brother from a different mother selected by Huì gōng as a successor, was too young. Records in the CHUNQIU start with this year. 712 killed by his brother Yǔn 允.'
