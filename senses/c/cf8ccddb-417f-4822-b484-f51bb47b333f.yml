definition: 'BUDDH: storehouse/embryo/matrix of the Tathāgata; SANSKRIT tathāgatagarbha (tathāgatagarhba theories are of paramount importance for the development of East Asian Buddhism; in the context of Chinese Buddhism the term often refers to the existence of an ''embryonic Buddha'' in each sentient being which anticipates its enlightenment, the term is closeley related to the concepts of ''pure nature'' and ''Buddha-nature'' (佛性)'
