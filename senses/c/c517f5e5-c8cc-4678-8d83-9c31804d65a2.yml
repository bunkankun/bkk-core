definition: 'BUDDH: This monk lived from 634 to 712 and studied with the famous Vinaya-master Dàoxuán 道玄 (who is also the author of the XUGAOSENGZHUAN). At the same time he was a practicioner of the Tiāntái teaching (SGSZ, fasc. 5; YANAGIDA 1990: 396, fn. 269)'
