definition: 'BUDDH: the permanently following assembly > this refers to the disciples of Buddha or a Buddhist teacher who permanently are in the presence of their teacher (i.e. the direct disciples of the Buddha, as opposed to lay disciples who on gather on certain occasions in order to listen to the dharma; compare 雲集眾)'
