definition: 'STANDARD NAME: King Wǔ Dīng of Shāng (reigned ? - 1189) ALTERNATIVE NAMES: Zǔ Dīng 祖丁, Gāo Zǔ 高祖 PARENTS: Son of >Shāng wáng Xiǎo Yǐ 商王小乙 WIVES: Bǐ Xīn 妣辛, Bǐ Wù 妣戊, Bǐ Guǐ 妣癸 CHILDREN: Father of >Shāng wáng Zǔ Jǐ 商王祖己, >Shāng wáng Zu Gēng 商王祖庚, >Shāng wáng Zǔ Jiǎ 商王祖甲 the twenty-first in the list of Shāng kings as reconstructed on the basis of the Period V ritual cycles'
