definition: 'BUDDH: see Zhāoqìngsì 招慶寺;there is also the Nánchāng 南昌 monastery of Hóng province 洪州, situated in today''s Nánchāng city in Jiāngxī 江西 province. This monastery is also referred to as Kāiyuán 開元 monastery.There is also a monastery of the same name in Wēn 溫 province.'
