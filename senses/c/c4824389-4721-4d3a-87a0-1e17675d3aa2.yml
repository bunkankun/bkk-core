definition: 'BUDDH: His canonical name was Bǎochè 寶徹 and he was a dharma-heir of Mǎzǔ 馬祖. There is a short biographic entry in ZTJ 4.079,12; WU: 331; FO: 750 (see also JINGDECHUANDENGLU, fasc. 7). He resided on Mt. Mágǔ 麻谷in Púzhōu 蒲州, Shānxī 山西 province.'
