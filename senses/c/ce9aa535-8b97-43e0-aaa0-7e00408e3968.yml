definition: swear blood oath (of allegiance etc.); make a covenant; ②邾（zōu）：《国语·郑语》、《晏子春秋·内篇上三》、《孟子》并作“邹”。国名，曹姓，在今山东邹城一带，后为楚所灭。仪父（fǔ）：邾国国君的字，名克。盟：盟法，先凿地为坎（即穴、洞），以牛、羊或马为牺牲，杀于其上，割牲左耳，盛在盘中，取其血，盛在敦中。读盟约告神，然后参加盟会者一一微饮血，古人谓之“歃血”。歃血毕，把盟约正本放于牲上掩埋，副本则参与盟会者各持归藏。
