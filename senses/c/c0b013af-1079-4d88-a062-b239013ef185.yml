definition: 'BUDDH: Metal Wheel; this refers to the uppermost of three circular regions, a world rests on (the lower regions are referred to as Fēnglún 風輪 and Shuǐlún 水輪; on top of these three-layered circular plates, mountains, oceans, etc. are situated; Mt. Sumeru is situated in the center of these circular plates and is as such the center of the world; see also 須彌山)'
