definition: 'Xiàng 項 (CHEN PAN 1969, 626-628)Ruling clan: Unknown. According to the Tōng zhì Shìzú lyè, Xìng zuǎn, and Guǎng yùn, the rulers of Xiàng belonged to the Zhōu 周 royal clan Jī 姬. Rank: Unknown. Shǐ jì Xiàng Yǔ běnjǐ zhēngyì (quoting Kuò dì zhì), Huán yǔ jì, and Lù shǐ Guó míng jǐ suggest that the rulers of Xiàng were of zǐ 子 rank. Founded: Unknown. Destroyed: According to the CQ (Xi 17), the state was conquered by Qí 齊 in 643 B.C. ZUO dates the annihilation of Xiàng into the same year, but states that it was occupied by the state of Lǔ 魯. Later the area belonged to Chǔ 楚. Location: In the modern Xiàngchéng 項城 district, Henan province (according to the Huì zuǎn).'
