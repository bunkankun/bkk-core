definition: Gōngzĭ Jié 公子結 (late 6th century), also known as Zĭqī 子期 was an elder brother of King Zhao of Chu 楚昭王 (r. 515 - 489). He served as minister of war under King Píng of Chŭ 楚平王 (r. 528-516). He is mentioned for an attack on Chen 陳 which he led as a general as late as in 485. [ZUO Ai 10; GONGYANG Ai 10]. [ZUO Zhuang 19, Ding 14, Ai 6; SJ 40]
