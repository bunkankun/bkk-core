definition: 'BUDDH: Mt. Right Awakening (mentioned in the DàTáng xīyù jì 大唐西域記, fasc. 8: “波羅笈菩提山(pragbodhi)，於唐稱‘前正覺山’，如來佛為正覺，乃先登山[...]。”(in Buddhist translations the names seems to appear only once in T.20/1169, however, the proper name is quite common in Chinese historiographic Buddhist texts and in some Chan/Zen texts)'
