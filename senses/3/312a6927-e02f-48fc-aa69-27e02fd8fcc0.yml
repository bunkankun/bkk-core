definition: Gōngshū Cuó 公叔痤 (d. 361) was prime minister in Wei 魏. When he was ill and was being asked to recommend a successor he recommended >Gongsun Yang 公孫鞅, thus launching one of the most important political careers in ancient China best known as the Lord of Shang 商君. [LSCQ 11.5; ZGC Wei 1; Zhang Jue 2000, p. 57, note 23]
