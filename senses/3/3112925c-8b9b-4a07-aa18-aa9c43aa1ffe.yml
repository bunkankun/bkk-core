definition: 'Guō 郭 (CHEN PAN 1969, 525-534)Clan: Unknown.Rank: Unknown. In the CQ, Zhuang 24 (670 B.C.), the ruler of Guō is referred to as gōng 公. In the inscription on the Guō bó guǐ 郭伯簋, the ruler of Guō is referred to as bó 伯. Founded: Unknown. The ruler of Guō (Guō bó) is mentioned in the bronze inscriptions dating from the early and middle period of the Western Zhōu; therefore, the state was already in existence by those times. Destroyed: Unknown. The ruler of Guō (Guō gōng) is mentioned only one time in the CQ (for Zhuang 24; 670 B.C.) in a very unclear context (the larger part of the sentence is obviously missing). According to the Du''s commentary, it is a mistake; GONGYANG has suggested that the record refers to the ruler who prior to the date lost his state. Xīn xù (Zá shì chapter) records the story how Lord Huán of Qí 齊桓公 (685-643 B.C.) during a hunt passed the ruins of the Guō capital and asked about the reasons of its downfall. If we should give any credit to this story, by that time Guō already was not in existence. Location: Unknown. According to the later sources, mainly Zá shì chapter of the Xīn xù, the ruins of the capital of Guō were located somewhere in the neighborhood of Qí 齊. The Western Zhōu bronze inscriptions which mention the ruler of Guō (if it is identical with Guō mentioned in the CQ and later sources) also suggest its association with the eastern states.'
