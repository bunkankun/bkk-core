definition: Fù Yuè 傅說 (11th cent.) is said to have been a corvee slave during the reign of >King Wuding 商王武丁(c. 1238-1179). [SY 11.10] His humble origins are commonly referred to in the literature. He was appointed prime minister to King Wuding as a result of the King having a dream about him. [MENG 6B15; XUN 5.47; HSWZ 7.6; SY 17.18; SJ 2].
