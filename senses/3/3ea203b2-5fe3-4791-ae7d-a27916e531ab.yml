definition: 'BUDDH: Buddhist heaven; skr. trāyastriṃśa, pali tāvatṃsa (In Buddhist cosmology this heaven is the second heaven among the six heavens of the realm of desire ( 欲界 ); at this place the god 係帝釋 is residing. It is situated at the top of Mt. Sumeru and in the four directions there are eight heavenly cities each.; the city where the above god resides is called 善見城 or 喜見城. All in all there are 33 places in this heaven, called 三十三天. These places are mentioned and described in 正法念處經, fasc. 25. The description of this heaven is quite popular in Indian sūtra literature since the mother of Buddha was said to have been reborn there after her death, and Buddha ascended to this heaven in order to preach the dharma for his mother for 3 months. ( 雜阿含經, fasc. 19, 23, 45; 中阿含經, fasc. 1; 長阿含經, fasc. 3; 增一阿含經, fasc. 28, 33, 37; 正法念處經 fasc. 26-35; 大智度論 fasc. 9, 56.)'
