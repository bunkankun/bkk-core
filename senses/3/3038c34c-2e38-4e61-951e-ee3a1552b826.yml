definition: 'mustard seed In BUDDH. scriptures 芥子 symbolizes the ultimate smallest in contrast to Mt. Sumeru which symbolizes the ultimate largest in the universe. The term often expresses that characteristics/forms are illusionary and that all things contain each other; ''mustard seed'' and ''Mt. Sumeru'' containing each other is a reocurring theme in Recorded Sayings literature. (see for example VIMALKIRTI, T.14/475: 546b28-29: " 唯願度者乃見須彌入芥子中。是名住不思議解脫法門。 "; BAIJUYI; see also LIANG XIAOHONG 1994: 79).'
