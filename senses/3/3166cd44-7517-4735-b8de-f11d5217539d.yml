definition: 'Xūjù 須句 (written also as Xūqū 須胊 ) (CHEN PAN 1969, 636-637)Clan: Fēng 風.Rank: Zǐ 子.Founded: According to the tradition, the rulers of Xūjù were descendants of the mythical emperor Tài Hào 太皞.Destroyed: The state was conquered in 639 B.C. (Xi 21) by Zhū 邾. In the following year, it was reestablished by Lǔ 魯. Later, it was again destroyed by Zhū, and in 620 B.C. (Wen 7), the area eventually came under the control of Lǔ. Location: According to the Du''s commentary, to the Xù Shāndōng kǎogǔ lù, and to the Shuǐ jīng zhù, Xūjù was located in the modern Dōngpíng 東平 district, Shandong province.'
