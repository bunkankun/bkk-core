definition: 'Zhài 祭 (Sometimes written as Cài 蔡. Not to be confused with another, and more powerful, state of Cài) (CHEN PAN 1969, 294-301)Clan: Jī 姬.Rank: Bó 伯 (common in the CQ and ZUO).Founded: In the early Western Zhōu period by one of the sons of Duke of Zhōu 周公 (according to the ZUO, Xi 24). Destroyed: Unknown. Location: According to the Dì míng kǎolyè, Zhài was located in the modern Zhèngzhōu 鄭州 area of central Henan.'
