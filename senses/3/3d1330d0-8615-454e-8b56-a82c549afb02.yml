definition: (the person) without anything particular to do, who does not engage in any artificial activity; in the Chan BUDDH context referring to the enlightened person who does not engage deliberately in any activity but rather perfectly responds to and mirrors his environment at any given moment; it is a key term in the teaching of the 臨濟錄
