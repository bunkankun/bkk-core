definition: Chū Lĭjí 樗里疾 (died 300) was a younger brother of >King Hui of Qin 秦惠王 (r. 337 – 311). After a number of successful campaigns he was enfeoffed as Lord of Yan 嚴君 in 309. He ended up organising a series of aborted military campaigns on behalf of the state of Jin 晉 and figures frequently in the narratives of ZGC. [ZGC passim] HF 34.20. Unger no. 106
