definition: 'Chŭ Zhuāng Wáng 楚莊王 (r. 613 -591), son of King Mu of Chu 楚穆王, was celebrated as one of the Five Hegemons of the Warring States period. [BHT 2 no 15] To begin with he had to contend with two brothers for the throne, Prince Xie 公子燮 and Zi Yi 子儀. [ZUOWen 14] In 611 Chu suffered a great famine which allowed surrounding states to make inroads into Chu territory. With time King Zhuang became an extremely powerful military leader who became famous for no less than fourteen large-scale successful military campaigns against surrounding states. Although he was never formally acknowledged as a leader of the feudal lords in his life-time, his military successes were many and astounding. It is often pointed out that he used the very capable >Sunshu Ao 孫叔敖 (late 7th – early 6th centuries) as his prime minister, [HNZ 9.10b, 16.20b, 18.28a] who was said to have established a legal system for his southern state, and to have carried out a comprehensive re-organisation of the armed forces. The states of Lu, Song, Chen, and Zheng all came to pledge allegiance to Chu. HNZ is much preoccupied with this king and reports conversations of him on various matters of governance and warfare. We are informed even on his semi-barbarian habits of dressing. [HNZ 11.9a, 14.3b] Even the loss of his pet monkey is described in detail, since he had a whole forest cut down to retrieve the beast. [HNZ 16.8b] In 490 King Zhuang fell ill while engaged on a military campaign, not without passing on his throne to one of a set of ceremonially reluctant princes. [ZUO Wen 14 mentions his accession to the throne, and ZUO Xuan 18 gives an account of his death and this important early source is much less talkative about Duke Zhuang than later sources like HNZ. HSWZ 2.1 portrays him at war, HSWZ 2.4 at audience, HSWZ 3.8 his death with dramatic care, adding Confucius’s comment that Duke Zhuang deserved to become a hegemon. [Fang Zhaohui 2002: 226-242] PARENTS: Son of >ChǔMù wáng 楚穆王 WIVES:?CHILDREN: Father of >Chǔ Gòngwáng 楚共王'
