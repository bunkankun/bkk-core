definition: 'The Principles of MathematicsJZ, Liu Hui''s comm: 1.9: 乘以散之 Multiply (e.g. numerators and denominators) in order to disaggregate (e.g. so as to reveal relevant units) things; 約以聚之 Simplify/divide in order to assemble them 齊同以通之 Align (e.g. so as to preserve the value of the fraction) and equalise (e.g. so as to create a common denominator) to make them homogeneous 此其算之綱紀乎 These, presumably, must be the principles of mathematics.Li Chunfeng Sui Shu, 律曆志上 resumes this crucial passage and links it explicitly to ALL the mathematical procedures introduced in JZ ：夫所謂率者，有九流焉。一曰方田，以禦田疇界域。。。皆乘以散之，除以聚之，齊同以通之，今有以貫之，則算數之方，盡於斯矣。 Note that basic addition and subtraction is not problematised/discussed explicitly in JZ or anywhere else in early mathematical literature: these operations were apparently taken to deserve no attention.'
