definition: Chén Xū 陳需 (4th century), also known as Tián Xū 田需, served for a time as a prime minister to >King Huì of Wèi 魏惠王 (r. 370 – 335) and is described in intrigues and conversations with that king in ZGC under the name Tian Xu 田需. He is not mentioned anywhere in ZUO. [ZGC Qi 4 and Wei 2.7, 2.12, 2.13； HF 31.30；SJ 44.1851]
