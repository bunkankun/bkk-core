definition: 'essence; inner substantial reality DC: 性質；本質。《論語·衛靈公》："君子義以為質，禮以行之。"《史記·樂書》："中正無邪，禮之質也；莊敬恭順，禮之制也。" 張守節 正義："質，本也。" 王西彥 《古屋》第五部二："要緊的不是名詞，而是實質。"'
