definition: 'BUDDH: "The five improper ways of gain or livelihood for a monk, i. e. (1) changing his appearance, e. g. theatrically; (2) advertising his own powers and virtue; (3) fortuning by physiognomy, etc.; (4) hectoring and bullying; (5) praising the generosity of another to induce the hearer to bestow presents." (SOOTHILL: 128)'
