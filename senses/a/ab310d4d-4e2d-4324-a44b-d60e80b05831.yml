definition: 'BUDDH: Protecting the Light Bodhisattva, this was the appellation of Śākyamuni Buddha at the time when he resided in Tuṣita Heaven and prepared himself of being reincarnated as a Buddha; Hùmíng - wishing to destroy the delusions of sentient beings and letting them attain wisdom - is said to have problaimed the 一百八法明門 to the gods prior to his descendance to earth'
