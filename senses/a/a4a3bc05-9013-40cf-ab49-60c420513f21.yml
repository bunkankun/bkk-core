definition: 'CHEMLA 2003: denominator of a fraction, e.g. the number two in the fraction 1/2. [Note that in Song times, and possibly before, another meaning of 母 became current: a "factor" of a number in the sense that the numbers 2 and 3 are factors of six.JIUZHANG 4.16: 開其母，報除。 "One extracts the root of the corresponding denominator, and divides in return.'
