definition: 'the Seven Classics DCD: 七經名目，歷來說法不一。 東漢 《一字石經》作《易》、《詩》、《書》、《儀禮》、《春秋》、《公羊》、《論語》；《後漢書‧張純傳》 唐 李賢 注作《詩》、《書》、《禮》、《樂》、《易》、《春秋》、《論語》； 宋 劉敞 《七經小傳》作《書》、《詩》、《周禮》、《儀禮》、《禮記》、《公羊》、《論語》； 清 康熙 《御纂七經》作《易》、《書》、《詩》、《春秋》、《周禮》、《儀禮》、《禮記》。'
