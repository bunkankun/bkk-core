definition: one 4.代詞。泛指任何人。《朱子語類》卷七二："你欲以此術制他，不知他之術更高你在。"徐遲《大場的一夜》："譬如肚子餓了，而你沒有水，那麼只好有乾糧也不吃，幹着挨餓。"
