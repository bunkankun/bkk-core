definition: 'neighbours, people living in the vicinity (Note that lín-shè 鄰舍 are not necessarily neighbours in the strict sense, but lín-rén 鄰人 were originally persons belonging to the same lín 鄰 which was a census unit during the Tang. A lín consisted of four families (a bǎo 保 of five families); see WU MAOPING 2001: 440.'
